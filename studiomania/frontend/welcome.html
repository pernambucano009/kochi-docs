<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سمسمكيت · محتوى كل يوم، بلا فريق</title>
<meta name="description" content="سمسمكيت يعرف علامتك ولهجتك، ويكتب الفكرة والسكريبت، ويصنع الفيديو وينشره في موعده. ابدأ بـ 300 نقطة مجانًا بدون بطاقة.">
<meta property="og:title" content="سمسمكيت · محتوى كل يوم، بلا فريق">
<meta property="og:description" content="عقل يعرف علامتك، وقوالب تصنع الفيديو بلهجتك، والأوتوبايلوت ينشره في موعده.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://simsimkit.com/">
<meta property="og:image" content="https://simsimkit.com/site/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="سمسمكيت: محتوى كل يوم، بلا فريق">
<meta property="og:locale" content="ar_SA">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="سمسمكيت · محتوى كل يوم، بلا فريق">
<meta name="twitter:description" content="عقل يعرف علامتك، وقوالب تصنع الفيديو بلهجتك، والأوتوبايلوت ينشره في موعده.">
<meta name="twitter:image" content="https://simsimkit.com/site/og.jpg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Alexandria:wght@300;400;500;600&family=Readex+Pro:wght@400;500&display=swap">
<script>
  // 📱 الجوال ليه نسخة بتتسكرول (/m)، والكمبيوتر والتابلت الشاشات اللي بتتبدّل في النص
  if (innerWidth < 1100) location.replace("/m" + location.hash);   // التابلت كمان (التصميم ده معمول لشاشة عريضة)
  try {
    const t = localStorage.getItem("studiomania.theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.nhTheme = t;
    document.documentElement.style.background = t === "dark" ? "#0C0C0E" : "#FFFFFF";
  } catch { }
</script>
<style>
/* 🌐 صفحة الهبوط: نفس التصميم الأول بالظبط (مسرح 1440×810، القائمة على الشمال، الجيلي فيش في النص، وكل زرار بيظهّر شاشته في النص) */

body{margin:0}
/* نفس تحويل اللايت والدارك اللي في البرنامج (home2.css): موجة نور مايلة بتمسح الشاشة في 1.1 ثانية */
:root.nh-wipe::view-transition-old(root){animation:none}
:root.nh-wipe::view-transition-new(root){animation:nh-wipe 1.1s cubic-bezier(.5,0,.3,1) both;mix-blend-mode:normal;-webkit-mask-image:linear-gradient(112deg,transparent 0 44%,rgba(0,0,0,.35) 50%,#000 56% 100%);mask-image:linear-gradient(112deg,transparent 0 44%,rgba(0,0,0,.35) 50%,#000 56% 100%);-webkit-mask-size:310% 100%;mask-size:310% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
@keyframes nh-wipe{from{-webkit-mask-position:0% 0;mask-position:0% 0}to{-webkit-mask-position:100% 0;mask-position:100% 0}}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
input{font:inherit}
.lp-nav button{transition:color .3s,letter-spacing .5s cubic-bezier(.65,0,.35,1),transform .32s cubic-bezier(.2,.8,.2,1)}.lp-nav button:hover{color:#E5613E}
.lp-nav .lat:hover{letter-spacing:.36em}
@keyframes lpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.lp-jf{animation:lpFloat 7s ease-in-out infinite}

/* نفس «البروز» اللي في البرنامج (fx.js): بيطلع لفوق ويكبر 1.06 */
.lp-btn{position:relative;transition:transform .32s cubic-bezier(.2,.8,.2,1),color .3s,background .3s}
.lp-btn:hover,.lp-btn:focus-visible{transform:translateY(-3px) scale(1.06);z-index:2}
.lp-btn:active{transform:scale(.98);transition-duration:.12s}
/* الكروت: نفس بروز مربعات الرئيسية بهدوء */
.lp-card{position:relative;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.lp-card:hover{transform:translateY(-3px) scale(1.03);z-index:2}
.lp-gb-l:hover{background:#181718 !important;color:#FFFFFF !important}.lp-gb-d:hover{background:#F1F1F3 !important;color:#0C0C0E !important}
.lp-link{transition:color .3s}.lp-link:hover{color:#E5613E}
/* كارت الفيديو في أول شاشة */
.lp-vid{transition:transform .32s cubic-bezier(.2,.8,.2,1),border-color .3s}
.lp-vid:hover{transform:translateY(-3px) scale(1.02);border-color:#E5613E !important}
.lp-foot a{transition:color .3s}.lp-foot a:hover{color:#E5613E}

/* نفس «الثعبان» اللي بيلف حوالين الزراير والمربعات في البرنامج (home2.css) */
.nh-snake{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;opacity:0;transition:opacity .5s ease;z-index:3}
.nh-snake rect{fill:none;stroke:currentColor;stroke-linecap:round;vector-effect:non-scaling-stroke}
.nh-snake .s1{stroke-width:1.4;stroke-dasharray:36 964;animation:nhS1 3.2s linear infinite;filter:drop-shadow(0 0 3px currentColor)}
.nh-snake .s2{stroke-width:1.2;stroke-dasharray:130 870;opacity:.38;animation:nhS2 3.2s linear infinite}
.nh-snake .s3{stroke-width:1;stroke-dasharray:300 700;opacity:.13;animation:nhS3 3.2s linear infinite}
.lp-btn:hover>.nh-snake,.lp-btn:focus-visible>.nh-snake,.lp-card:hover>.nh-snake{opacity:1}
@keyframes nhS1{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
@keyframes nhS2{from{stroke-dashoffset:94}to{stroke-dashoffset:-906}}
@keyframes nhS3{from{stroke-dashoffset:264}to{stroke-dashoffset:-736}}

/* الزرار البرتقالي المنوّر */
.sk-go{position:relative;isolation:isolate;overflow:hidden;border:0;cursor:pointer;color:#FFFFFF;background:linear-gradient(180deg,#F48A62 0%,#E5613E 55%,#D44E2C 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 24px rgba(240,117,79,.32);animation:skGlow 3.2s ease-in-out infinite}
.sk-go::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 66%) no-repeat;background-size:220% 100%;background-position:130% 0;transition:background-position .75s ease}
.sk-go:hover{filter:brightness(1.06);color:#FFFFFF}.sk-go:hover::after{background-position:-30% 0}
.sk-go .nh-snake rect{stroke:#FFFFFF}
@keyframes skGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 18px rgba(240,117,79,.26)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 0 0 1px rgba(229,97,62,.4),0 10px 26px -6px rgba(229,97,62,.75),0 0 32px rgba(240,117,79,.45)}}

/* الجيلي فيش بينوّر لما تدوس «ابدأ مجانًا» */
@keyframes lpLit{0%{filter:brightness(1);transform:scale(1)}30%{filter:brightness(1.45) saturate(1.3);transform:scale(1.035)}100%{filter:brightness(1);transform:scale(1)}}
.lp-lit{animation:lpLit 1.6s cubic-bezier(.3,0,.2,1) both}
@keyframes lpSpread{0%{opacity:0;transform:scale(.25)}25%{opacity:1}100%{opacity:0;transform:scale(2.6)}}
.lp-spread{animation:lpSpread 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes lpIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lp-in{animation:lpIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes lpPop{0%{opacity:0;transform:translateY(18px) scale(.97);filter:blur(8px)}70%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
.lp-pop{animation:lpPop 1.25s cubic-bezier(.22,1,.36,1) both}
/* لوحة التسجيل بتظهر بهدوء: الرئيسية بتختفي الأول بنعومة، وبعدين اللوحة، وجواها العنوان ثم الجملة ثم الباقي واحد ورا التاني */
@keyframes lpOut{to{opacity:0;transform:translateY(-10px) scale(.985);filter:blur(6px)}}
.lp-out{animation:lpOut .55s cubic-bezier(.4,0,.2,1) both !important;pointer-events:none}
@keyframes lpRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lp-pop>*{animation:lpRise .9s cubic-bezier(.22,1,.36,1) both}
.lp-pop>:nth-child(1){animation-delay:.18s}.lp-pop>:nth-child(2){animation-delay:.28s}.lp-pop>:nth-child(n+3){animation-delay:.4s}

.lp-field{width:100%;height:46px;box-sizing:border-box;border-radius:14px;padding:0 16px;outline:none;transition:box-shadow .25s,border-color .25s}
.lp-field:focus{border-color:#E5613E !important;box-shadow:0 0 0 4px rgba(229,97,62,.14)}
@media (prefers-reduced-motion: reduce){.lp-jf,.sk-go,.nh-snake rect,.lp-lit,.lp-spread,.lp-in,.lp-pop,.lp-pop>*,.lp-out{animation:none}.lp-btn,.lp-card,.lp-vid,.lp-navb{transform:none !important}}

html,body{height:100%;overflow:hidden}
body{transition:background-color 1.6s ease;-webkit-font-smoothing:antialiased}
#lp-stage{position:absolute;top:0;left:0;width:1440px;height:810px;transform-origin:0 0}
#lp-sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#lp-sky-in{position:absolute;top:0;left:0;width:1440px;height:810px;transform-origin:0 0}
/* زرار قفل لوحة التسجيل */
.lp-x{position:absolute;z-index:2;top:16px;inset-inline-end:16px;width:36px;height:36px;border-radius:18px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;color:inherit;opacity:.6;transition:opacity .2s,background-color .2s,transform .2s}
.lp-pop>.lp-x{animation:none}
.lp-x:hover,.lp-x:focus-visible{opacity:1;background:rgba(229,97,62,.12);transform:rotate(90deg)}
</style>
</head>
<body>
<!-- 🌟 النور والوهج برّه المسرح: بيملوا الشاشة كلها (حتى الجناب في الشاشات العريضة)، والمسرح شفاف فوقهم -->
<div id="lp-sky" aria-hidden="true"><div id="lp-sky-in"><div id="lp-glow"></div><div id="lp-spread"></div></div></div>
<div id="lp-stage"></div>
<template id="lp-tpl">
<div style="{{rootStyle}}">
  <div style="{{jellyWrap}}">
    <div class="lp-jf" style="position: absolute; inset: 0">
      <div class="{{litClass}}" style="position: absolute; inset: 0">
        <img src="/site/jf-light.webp" alt="Glass jellyfish" style="{{imgLight}}">
        <img src="/site/jf-light-lit.webp" alt="" style="{{imgLightLit}}">
        <img src="/site/jf-dark.webp" alt="" style="{{imgDark}}">
        <img src="/site/jf-dark-lit.webp" alt="" style="{{imgDarkLit}}">
      </div>
    </div>
  </div>

  <header dir="rtl" style="position: absolute; top: 22px; left: 48px; right: 48px; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 16px; z-index: 5; font: 14px/1.5 {{barFont}}">
    <div style="display: flex; align-items: center; gap: 22px; min-width: 0">
      <button type="button" data-on-click="{{goHome}}" aria-label="SimsimKit" style="display: flex; align-items: center; direction: ltr; border: 0; background: transparent; cursor: pointer; padding: 0; color: inherit; font: 500 15px Jost, Futura, sans-serif; letter-spacing: .32em">
        <img src="{{markSrc}}" alt="" style="height: 1.75em; width: auto; margin-right: .55em; flex: none">SIMSIMKIT</button>
      <button type="button" class="{{gobackCls}}" data-on-click="{{goBack}}" aria-hidden="{{isHome}}" tabindex="{{backTab}}" style="{{gobackStyle}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{gobackInner}}"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span style="{{gobackInner}}">{{t.back}}</span></button>
      <nav aria-label="{{t.crumbsAria}}" style="{{crumbsStyle}}">
        <button type="button" class="lp-crumb" data-on-click="{{goHome}}" style="{{crumbStyle}}">{{t.home}}</button>
        <i style="{{crumbSep}}">‹</i>
        <b style="{{crumbOn}}">{{crumbName}}</b>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" class="lp-btn" data-on-click="{{toggleLang}}" aria-label="{{t.langAria}}" style="{{chipLang}}">
        <svg class="nh-snake" viewBox="0 0 76 44" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="74" height="42" rx="21" pathLength="1000"/><rect class="s2" x="1" y="1" width="74" height="42" rx="21" pathLength="1000"/><rect class="s1" x="1" y="1" width="74" height="42" rx="21" pathLength="1000"/></svg>{{t.langBtn}}</button>
      <button type="button" class="lp-btn" data-on-click="{{goLogin}}" style="{{chipSignin}}">
        <svg class="nh-snake" viewBox="0 0 132 44" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="130" height="42" rx="21" pathLength="1000"/><rect class="s2" x="1" y="1" width="130" height="42" rx="21" pathLength="1000"/><rect class="s1" x="1" y="1" width="130" height="42" rx="21" pathLength="1000"/></svg>{{t.signin}}</button>
      <button type="button" data-on-click="{{toggleTheme}}" aria-pressed="{{dark}}" aria-label="{{t.themeAria}}" style="{{themeBtn}}">
        <span style="{{trackStyle}}"><span style="{{knobStyle}}"></span></span><span style="direction: ltr">{{themeLabel}}</span></button>
    </div>
  </header>

  <nav class="lp-nav" aria-label="Main">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <button type="button" class="{{n.cls}}" data-on-click="{{n.go}}" aria-current="{{n.current}}" style="{{n.style}}">
        <svg class="nh-snake" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="198" height="58" rx="14" pathLength="1000"/><rect class="s2" x="1" y="1" width="198" height="58" rx="14" pathLength="1000"/><rect class="s1" x="1" y="1" width="198" height="58" rx="14" pathLength="1000"/></svg>{{n.label}}<span style="{{n.lineStyle}}"></span></button>
    </sc-for>
  </nav>

  <!-- ===== الرئيسية: العنوان والجملة والزرار ومكان الفيديو ===== -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <section data-k="home" class="{{homeCls}}" dir="{{dir}}" style="{{heroStyle}}">
      <h1 style="{{heroTitle}}">{{t.heroTitle}}</h1>
      <p style="{{heroLead}}">{{t.heroLead}}</p>
      <div style="display: flex; align-items: center; gap: 18px; margin-top: 24px; flex-wrap: wrap">
        <button type="button" class="sk-go lp-btn" data-on-click="{{startFree}}" style="{{ctaStyle}}">
          <svg class="nh-snake" viewBox="0 0 230 54" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="228" height="52" rx="26" pathLength="1000"/><rect class="s2" x="1" y="1" width="228" height="52" rx="26" pathLength="1000"/><rect class="s1" x="1" y="1" width="228" height="52" rx="26" pathLength="1000"/></svg>{{t.start}}</button>
        <button type="button" class="lp-btn lp-link" data-on-click="{{goDemo}}" style="{{demoBtn}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M10 8.5v7l5.5-3.5z"/></svg>{{t.demo}}</button>
      </div>
      <p style="{{heroNote}}">{{t.heroNote}}</p>
      <button type="button" class="lp-vid" data-on-click="{{goDemo}}" aria-label="{{t.demoTitle}}" style="{{vidCard}}">
        <span style="{{vidPlay}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="#E5613E" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg></span>
        <span style="{{vidCap}}">{{t.vidCap}}</span>
      </button>
    </section>
  </sc-if>

  <!-- ===== العرض: مكان فيديو الديمو ===== -->
  <sc-if value="{{isDemo}}" hint-placeholder-val="{{ false }}">
    <section data-k="demo" class="lp-in" dir="{{dir}}" style="{{panelStyle}}">
      <div style="display: flex; gap: 40px; align-items: center">
        <video src="/gallery/t-launch.mp4#t=4" controls playsinline preload="metadata" style="{{demoVid}}"></video>
        <div style="flex: 1; min-width: 0">
          <h1 style="{{h1Style}}">{{t.demoTitle}}</h1>
          <p style="{{leadStyle}}">{{t.demoLead}}</p>
          <div style="display: flex; align-items: center; gap: 18px; margin-top: 22px; flex-wrap: wrap">
        <button type="button" class="sk-go lp-btn" data-on-click="{{startFree}}" style="{{ctaSmall}}">
          <svg class="nh-snake" viewBox="0 0 200 46" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="198" height="44" rx="22" pathLength="1000"/><rect class="s2" x="1" y="1" width="198" height="44" rx="22" pathLength="1000"/><rect class="s1" x="1" y="1" width="198" height="44" rx="22" pathLength="1000"/></svg>{{t.start}}</button>
          </div>
          <p style="{{heroNote}}">{{t.heroNote}}</p>
          <button type="button" class="lp-btn lp-link" data-on-click="{{goHome}}" style="{{demoBtn}}">{{t.backHome}}</button>
        </div>
      </div>
    </section>
  </sc-if>

  <!-- ===== كيف يعمل: ٣ خطوات ===== -->
  <sc-if value="{{isHow}}" hint-placeholder-val="{{ false }}">
    <section data-k="how" class="lp-in" dir="{{dir}}" style="{{panelStyle}}">
      <h1 style="{{h1Style}}">{{t.hTitle}}</h1>
      <p style="{{leadStyle}}">{{t.hLead}}</p>
      <div style="display: grid; grid-template-columns: repeat(3, 240px); gap: 20px; margin-top: 30px">
        <sc-for list="{{steps}}" as="c" hint-placeholder-count="3">
          <article class="lp-card" style="{{c.style}}">
            <svg class="nh-snake" viewBox="0 0 240 230" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="238" height="228" rx="22" pathLength="1000"/><rect class="s2" x="1" y="1" width="238" height="228" rx="22" pathLength="1000"/><rect class="s1" x="1" y="1" width="238" height="228" rx="22" pathLength="1000"/></svg>
            <span style="{{stepNum}}">{{c.n}}</span>
            <h2 style="{{c.titleStyle}}">{{c.title}}</h2>
            <p style="{{c.textStyle}}">{{c.text}}</p>
          </article>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 18px; margin-top: 26px; flex-wrap: wrap">
        <button type="button" class="sk-go lp-btn" data-on-click="{{startFree}}" style="{{ctaSmall}}">
          <svg class="nh-snake" viewBox="0 0 200 46" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="198" height="44" rx="22" pathLength="1000"/><rect class="s2" x="1" y="1" width="198" height="44" rx="22" pathLength="1000"/><rect class="s1" x="1" y="1" width="198" height="44" rx="22" pathLength="1000"/></svg>{{t.start}}</button>
        <span style="{{heroNoteInline}}">{{t.heroNote}}</span>
      </div>
    </section>
  </sc-if>

  <!-- ===== أمثلة لمجالك ===== -->
  <sc-if value="{{isExamples}}" hint-placeholder-val="{{ false }}">
    <section data-k="examples" class="lp-in" dir="{{dir}}" style="{{panelStyle}}">
      <h1 style="{{h1Style}}">{{t.exTitle}}</h1>
      <p style="{{leadStyle}}">{{t.exLead}}</p>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px">
        <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
          <button type="button" class="lp-btn" data-on-click="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.name}}</button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, 225px); gap: 20px; margin-top: 18px">
        <sc-for list="{{samples}}" as="x" hint-placeholder-count="3">
          <figure class="lp-card" style="{{x.style}}">
            <video src="{{x.src}}" poster="{{x.poster}}" muted loop playsinline autoplay preload="metadata" style="display:block;width:100%;height:330px;object-fit:cover;border-radius:18px 18px 0 0;background:center/cover no-repeat url({{x.poster}})"></video>
            <figcaption style="{{x.capStyle}}">{{x.name}}</figcaption>
          </figure>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <!-- ===== المميزات ===== -->
  <sc-if value="{{isFeatures}}" hint-placeholder-val="{{ false }}">
    <section data-k="features" class="lp-in" dir="{{dir}}" style="{{panelStyle}}">
      <h1 style="{{h1Style}}">{{t.fTitle}}</h1>
      <p style="{{leadStyle}}">{{t.fLead}}</p>
      <div style="display: grid; grid-template-columns: repeat(3, 240px); gap: 20px; margin-top: 30px">
        <sc-for list="{{feats}}" as="c" hint-placeholder-count="6">

<script>
// ⚙️ مشغّل صغير لقالب التصميم: {{…}} و<sc-for> و<sc-if> وdata-on-click. مع كل تغيير الشكل بيتبني من جديد ويتقارن بالموجود
// (العناصر نفسها بتفضل، فالانتقالات زي نور الجيلي فيش وتحويل الوضع بتشتغل، والمكتوب في الحقول مابيضيعش).
// كل شاشة ليها data-k، فلما الشاشة تتغير عنصرها بيتبدّل وأنيميشن الدخول بيشتغل.
const LPR = (() => {
  const RX = /\{\{([^}]+)\}\}/g;
  const val = (scope, expr) => { let v = scope; for (const k of expr.trim().split(".")) v = v == null ? undefined : v[k]; return v; };
  const interp = (str, scope) => { const m = str.match(/^\{\{([^}]+)\}\}$/); if (m) return val(scope, m[1]); return str.replace(RX, (_, e) => { const v = val(scope, e); return v == null ? "" : String(v); }); };
  const bare = (s) => s.replace(/[{}]/g, "").trim();
  function build(src, scope, parent) {
    for (const n of src.childNodes) {
      if (n.nodeType === 3 && /^\s*\n\s*$/.test(n.nodeValue)) continue;   // مسافات التنسيق بين السطور مالهاش لازمة
      if (n.nodeType === 3) { parent.appendChild(document.createTextNode(n.nodeValue.includes("{{") ? String(interp(n.nodeValue, scope) ?? "") : n.nodeValue)); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.localName;
      if (tag === "sc-for") { const as = n.getAttribute("as"); for (const it of val(scope, bare(n.getAttribute("list"))) || []) build(n, { ...scope, [as]: it }, parent); continue; }
      if (tag === "sc-if") { if (val(scope, bare(n.getAttribute("value")))) build(n, scope, parent); continue; }
      const el = n.cloneNode(false);
      for (const a of [...el.attributes]) {
        const nm = a.name;
        if (nm.startsWith("hint-")) { el.removeAttribute(nm); continue; }
        if (nm.startsWith("data-on-")) { const fn = val(scope, bare(a.value)); el.removeAttribute(nm); if (typeof fn === "function") (el.__on || (el.__on = {}))[nm.slice(8)] = fn; continue; }
        if (a.value.includes("{{")) {
          const v = interp(a.value, scope);
          if ((v === false || v == null) && !nm.startsWith("aria-")) el.removeAttribute(nm);
          else el.setAttribute(nm, v === true ? "true" : v === false ? "false" : String(v));
        }
      }
      build(n, scope, el);
      parent.appendChild(el);
    }
  }
  const same = (a, b) => a.nodeType === b.nodeType && (a.nodeType !== 1 || (a.localName === b.localName && a.getAttribute("data-k") === b.getAttribute("data-k")
    && (a.localName !== "input" || a.getAttribute("name") === b.getAttribute("name"))));
  const key = (n) => (n.nodeType === 1 ? n.getAttribute("data-k") : null);
  function morph(a, b) {
    for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    a.__on = b.__on;
    // العناصر اللي بتظهر وتختفي ليها data-k، فظهورها مابيزحزحش اللي بعدها (الجيلي فيش يفضل هو هو ونوره يتنقل بهدوء)
    const ac = [...a.childNodes], bc = [...b.childNodes];
    const nk = new Set(bc.map(key).filter(Boolean)), ok = new Set(ac.map(key).filter(Boolean));
    let j = 0;
    for (const y of bc) {
      while (j < ac.length && key(ac[j]) && !nk.has(key(ac[j]))) ac[j++].remove();
      const x = ac[j];
      if (!x) { a.appendChild(y); continue; }
      if (key(y) && !ok.has(key(y))) { a.insertBefore(y, x); continue; }
      j++;
      if (!same(x, y)) a.replaceChild(y, x);
      else if (x.nodeType === 1) morph(x, y);
      else if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue;
    }
    for (; j < ac.length; j++) ac[j].remove();
  }
  // الأحداث كلها من عنصر واحد فوق: بيدوّر على أقرب عنصر عليه الحدث ده
  function listen(root, types) {
    for (const t of types) root.addEventListener(t, (e) => {
      for (let el = e.target; el && el !== root.parentNode; el = el.parentNode) {
        const fn = el.__on && el.__on[t];
        if (fn) { fn(e, el); return; }
      }
    });
  }
  return { build, morph, listen };
})();

    opt(q('field'), fields, f0);
    opt(q('goal'), A.goals, (fields[0] || {}).goal);
    c.onchange = () => { q('dialect').value = dia(c.value); };
    q('field').onchange = () => { q('goal').value = (fields.find((f) => f.id === q('field').value) || {}).goal || 'sales'; };
  },
  async submit(form) {
    const s = this.state, ar = (s.lang || 'ar') === 'ar', g = (n) => ((form.elements[n] || {}).value || '').trim();
    const E = (a, e) => this.setState({ err: ar ? a : e, busy: false });
    if (s.busy) return;
    this.gWhy = null;
    const post = async (url, body) => {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || (ar ? 'حدث خطأ، حاول مرة أخرى' : 'Something went wrong, try again'));
      return d;
    };
    if (s.mode === 'register' && s.step === 1) {
      const reg = { name: g('name'), email: g('email'), password: (form.elements.password || {}).value || '' };
      if (!/^\S+@\S+\.\S+$/.test(reg.email)) return E('اكتب بريدًا إلكترونيًا صحيحًا', 'Enter a valid email');
      if (reg.password.length < 8) return E('كلمة المرور 8 أحرف على الأقل', 'Password must be at least 8 characters');
      return this.setState({ reg, step: 2, err: '' });
    }
    this.setState({ busy: true, err: '' });
    try {
      if (s.mode === 'register') {
        if (!g('gender')) { this.setState({ busy: false }); return E('اختر ذكر أو أنثى (لكي تخاطبك المساعدة بشكل صحيح)', 'Choose male or female (so the assistant addresses you correctly)'); }
        const d = await post('/api/auth/signup', { ...s.reg, country: g('country'), dialect: g('dialect'), field: g('field'), goal: g('goal'), coupon: g('coupon'), gender: g('gender') });
        sessionStorage.setItem('devlink', d.dev_link || ''); sessionStorage.setItem('mailfail', d.mail_failed ? '1' : '');
        location.replace('/verify');
      } else {
        const d = await post('/api/auth/login', { email: g('email'), password: (form.elements.password || {}).value || '' });
        location.replace(d.verify ? '/verify' : this.next);
      }
    } catch (e) { this.setState({ err: e.message, busy: false }); }
  }
});

(() => {
  const stage = document.getElementById('lp-stage'), C = new Component({});
  C.root = stage; C.tpl = document.getElementById('lp-tpl');
  LPR.listen(stage, ['click', 'submit']);
  // المسرح 1440×810 بيكبر ويصغر على قد الشاشة، ويفضل في النص
  const fit = () => {
    const k = Math.min(innerWidth / 1440, innerHeight / 810);
    stage.style.transform = 'translate(' + Math.round((innerWidth - 1440 * k) / 2) + 'px,' + Math.round((innerHeight - 810 * k) / 2) + 'px) scale(' + k + ')';
    document.getElementById('lp-sky-in').style.transform = stage.style.transform;
  };
  addEventListener('resize', fit); fit();
  addEventListener('popstate', () => {
    const h = location.hash.slice(1), scr = LP_SCREENS.includes(h) || h === 'demo' ? h : h === 'signup' || h === 'login' ? 'signup' : 'home';
    C.go(scr, scr === 'signup' ? { mode: h === 'login' ? 'login' : 'register', step: 1 } : null, true);
  });
  C.render();
  const j = (u) => fetch(u).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  Promise.all([j('/api/auth/state'), j('/api/pricing')]).then(([a, p]) => {
    C.auth = a; C.pricing = p; C.render();
  });
})();

</script>

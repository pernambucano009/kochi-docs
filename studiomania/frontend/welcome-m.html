<head>

<script>
  // 🖥️ الكمبيوتر والتابلت ليهم التصميم الأول (/welcome)
  if (innerWidth >= 1100) location.replace("/welcome" + location.hash);

<style>
  /* 🌐 صفحة الهبوط: صفحة واحدة بتتسكرول (الهيرو ← كيف يعمل ← أمثلة لمجالك ← المميزات ← الأسعار ← الأسئلة ← الفوتر)،
     بنفس هوية البرنامج (الجيلي فيش الزجاجي، الزرار البرتقالي، فاتح/غامق). الأسعار من نفس مصدر أسعار البرنامج (/api/pricing). */
  :root { --bg: #FAFAF8; --ink: #181718; --muted: #6B6B67; --accent: #E5613E; --card: #FFFFFF; --soft: #F3F2EF; --tint: #FFF6F2;
    --sh: 0 4px 18px rgba(24, 23, 24, .08); --track: #E3E2DE; --ar: "Alexandria", "Readex Pro", sans-serif; --lat: "Jost", "Futura", system-ui, sans-serif; color-scheme: light; }
  :root[data-nh-theme="dark"] { --bg: #0C0C0E; --ink: #F1F1F3; --muted: #A3A3AB; --accent: #F0754F; --card: #1C1C1F; --soft: #17171A; --tint: rgba(240, 117, 79, .12);
    --sh: 0 4px 18px rgba(0, 0, 0, .4); --track: #3D3C3D; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--ar); -webkit-font-smoothing: antialiased; transition: background .6s; }
  :root[lang="en"] body { font-family: var(--lat), var(--ar); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  img, video { max-width: 100%; }
  .wrap { width: min(1120px, calc(100% - 32px)); margin-inline: auto; }

  /* الشريط */
  .bar { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: color-mix(in srgb, var(--bg) 78%, transparent); }
  .bar .wrap { height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .logo { display: flex; align-items: center; gap: .55em; direction: ltr; font: 500 15px var(--lat); letter-spacing: .32em; }
  .logo img { height: 26px; width: auto; }
  .lm-d { display: none; } :root[data-nh-theme="dark"] .lm-l { display: none; } :root[data-nh-theme="dark"] .lm-d { display: inline; }
  .tools { display: flex; align-items: center; gap: 10px; }
  .chip { height: 42px; padding: 0 18px; border: 0; border-radius: 21px; background: var(--card); box-shadow: var(--sh); cursor: pointer; display: inline-flex; align-items: center; white-space: nowrap;
    font-size: 14px; transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
  .chip:hover { transform: translateY(-2px); }
  .chip.lang { font: 400 13px var(--lat); letter-spacing: .16em; padding: 0 16px; }
  .sw { display: flex; align-items: center; gap: 8px; border: 0; background: none; cursor: pointer; padding: 0 4px; font-size: 13px; }
  .sw .track { width: 42px; height: 24px; border-radius: 99px; background: var(--track); position: relative; }
  .sw .knob { position: absolute; top: 3px; inset-inline-start: 21px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); transition: inset-inline-start .45s cubic-bezier(.65, 0, .35, 1); }
  :root[data-nh-theme="dark"] .sw .knob { inset-inline-start: 3px; }
  .menu-b { display: none; width: 42px; padding: 0; justify-content: center; }

  /* القائمة: روابط للأقسام (على الشمال في الديسكتوب) */
  .side { position: fixed; inset-inline-end: max(16px, calc((100vw - 1320px) / 2)); top: 50%; translate: 0 -50%; z-index: 20; display: flex; flex-direction: column; gap: 4px; }
  .side a { padding: 8px 14px; border-radius: 12px; font-size: 14px; color: var(--muted); transition: color .3s, background .3s; }
  .side a:hover { color: var(--accent); }
  .side a.on { color: var(--ink); background: var(--card); box-shadow: var(--sh); }

  /* الهيرو: العنوان والجملة والزرار أول حاجة، والجيلي فيش خلفية */
  .hero { position: relative; padding: 56px 0 24px; overflow: hidden; }
  .hero .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 40px; align-items: center; }
  .hero h1 { margin: 0; font: 600 clamp(34px, 5vw, 58px)/1.25 var(--ar); }
  :root[lang="en"] .hero h1 { font-family: var(--lat); font-weight: 500; letter-spacing: -.01em; }
  .hero .lead { margin: 18px 0 0; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.85; color: var(--muted); max-width: 560px; }
  .ctas { display: flex; align-items: center; gap: 18px; margin-top: 28px; flex-wrap: wrap; }
  .go { position: relative; isolation: isolate; overflow: hidden; height: 54px; padding: 0 34px; border: 0; border-radius: 27px; cursor: pointer; color: #fff; font-size: 17px; font-weight: 500;
    background: linear-gradient(180deg, #F48A62 0%, #E5613E 55%, #D44E2C 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .38), 0 0 0 1px rgba(229, 97, 62, .28), 0 8px 22px -6px rgba(229, 97, 62, .65), 0 0 24px rgba(240, 117, 79, .32);
    transition: transform .32s cubic-bezier(.2, .8, .2, 1), filter .3s; }
  .go::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, .45) 48%, transparent 66%) no-repeat;
    background-size: 220% 100%; background-position: 130% 0; transition: background-position .75s ease; }
  .go:hover { transform: translateY(-3px) scale(1.04); filter: brightness(1.06); } .go:hover::after { background-position: -30% 0; }
  .go.sm { height: 46px; padding: 0 24px; font-size: 15px; }
  .ghost { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--ink); }
  .ghost:hover { color: var(--accent); }
  .note { margin: 12px 0 0; font-size: 13.5px; color: var(--muted); }
  .jf { position: relative; justify-self: center; width: min(420px, 90%); aspect-ratio: 560 / 778; pointer-events: none; }
  .jf img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity 1.2s ease; opacity: 0; }
  .jf-float { position: absolute; inset: 0; animation: float 7s ease-in-out infinite; }
  .jf .l { opacity: 1; } :root[data-nh-theme="dark"] .jf .l { opacity: 0; } :root[data-nh-theme="dark"] .jf .d { opacity: 1; }
  .lit .jf .l, .lit .jf .d { opacity: 0 !important; } .lit .jf .ll { opacity: 1; } :root[data-nh-theme="dark"] .lit .jf .ll { opacity: 0; } :root[data-nh-theme="dark"] .lit .jf .dl { opacity: 1; }
  .lit .jf-float { animation: float 7s ease-in-out infinite, litup 1.6s cubic-bezier(.3, 0, .2, 1) both; }
  .glow { position: absolute; z-index: 1; inset-inline-start: 6%; top: 10%; width: 520px; height: 520px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 1.2s;
    background: radial-gradient(circle, rgba(126, 178, 240, .35), transparent 65%); }
  .lit .glow { opacity: 1; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @keyframes litup { 0% { filter: brightness(1); } 30% { filter: brightness(1.45) saturate(1.3); } 100% { filter: brightness(1); } }

  /* الفيديو */
  .demo { margin-top: 8px; }
  .vid { position: relative; border-radius: 26px; overflow: hidden; background: var(--soft); box-shadow: var(--sh); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: center; gap: 28px; padding: 26px; }
  .vid video { width: 100%; max-height: 460px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 18px; background: #000; justify-self: center; max-width: 280px; }
  .vid h2 { margin: 0; }
  .vid p { color: var(--muted); }

  /* الأقسام */
  section.sec { padding: 72px 0 0; }
  .sec h2, .vid h2 { font: 600 clamp(24px, 3vw, 34px)/1.35 var(--ar); margin: 0 0 8px; }
  :root[lang="en"] .sec h2, :root[lang="en"] .vid h2 { font-family: var(--lat); font-weight: 500; }
  .sec .sub { margin: 0 0 26px; color: var(--muted); font-size: 16px; }
  .card { background: var(--card); box-shadow: var(--sh); border-radius: 22px; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .step { padding: 22px; }
  .step .n { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; background: var(--tint); color: var(--accent); font: 500 15px var(--lat); }
  .step h3, .feat h3 { margin: 14px 0 6px; font-size: 17px; font-weight: 600; }
  .step p, .feat p { margin: 0; color: var(--muted); font-size: 14.5px; }

  .fields { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .fields button { height: 38px; padding: 0 16px; border: 0; border-radius: 19px; cursor: pointer; background: var(--card); box-shadow: var(--sh); font-size: 14px; transition: background .3s, color .3s; }
  .fields button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .samples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .sample { overflow: hidden; padding: 0; }
  .sample video { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--soft); }
  .sample figcaption { padding: 12px 16px 14px; font-size: 14px; }
  .sample figcaption small { display: block; color: var(--muted); font-size: 12.5px; }
  .s-note { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

  .feats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .feat { padding: 22px; }
  .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--tint); }
  .ic svg { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

  .phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 26px; }
  .phead .sub { margin: 0; }
  .cyc { display: flex; gap: 4px; padding: 4px; border-radius: 24px; background: var(--card); box-shadow: var(--sh); }
  .cyc button { height: 38px; padding: 0 16px; border: 0; border-radius: 19px; background: none; cursor: pointer; font-size: 14px; }
  .cyc button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
  .plan { padding: 26px; display: flex; flex-direction: column; }
  .plan.pop { outline: 2px solid var(--accent); outline-offset: -2px; }
  .plan .top { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
  .plan h3 { margin: 0; font-size: 19px; font-weight: 600; }
  .badge { font-size: 12px; padding: 5px 11px; border-radius: 99px; background: var(--accent); color: #fff; }
  .price { margin: 18px 0 0; display: flex; align-items: baseline; gap: 6px; }
  .price b { font: 400 42px var(--lat); letter-spacing: -.01em; }
  .price span, .usd { color: var(--muted); font-size: 13.5px; }
  .usd { margin: 2px 0 0; font-family: var(--lat); }
  .plan ul { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 10px; flex: 1; align-content: start; }
  .plan li { display: flex; gap: 8px; font-size: 14.5px; }
  .plan li svg { flex: none; width: 16px; height: 16px; margin-top: 5px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .plan .btn { margin-top: 22px; height: 48px; border-radius: 24px; border: 0; cursor: pointer; font-size: 15px; font-weight: 500; background: var(--soft); width: 100%; }
  .plan .btn.go { padding: 0; color: #fff; background: linear-gradient(180deg, #F48A62 0%, #E5613E 55%, #D44E2C 100%); }
  .p-note { margin: 16px 0 0; text-align: center; color: var(--muted); font-size: 13.5px; }
  .p-note a { color: var(--accent); }

  .faq { display: grid; gap: 10px; max-width: 860px; }
  .q { overflow: hidden; }
  .q button { width: 100%; min-height: 58px; padding: 0 22px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: start; font-size: 15.5px; font-weight: 500; }
  .q button svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; transition: rotate .3s; }
  .q[open] { outline: 1.5px solid var(--accent); outline-offset: -1.5px; }
  .q[open] button svg { rotate: 45deg; }
  .q p { margin: 0; padding: 0 22px 18px; color: var(--muted); font-size: 14.5px; line-height: 1.9; }

  .final { margin: 80px 0 0; padding: 40px 28px; text-align: center; }
  .final h2 { margin: 0 0 8px; }
  .final .note { margin-top: 12px; }

  footer { margin-top: 72px; padding: 34px 0 40px; background: var(--soft); font-size: 13px; color: var(--muted); line-height: 1.9; }
  footer .wrap { display: grid; gap: 14px; }
  footer nav { display: flex; gap: 18px; flex-wrap: wrap; }
  footer a:hover { color: var(--accent); }
  footer .logo { color: var(--ink); font-size: 13px; }
  footer .logo img { height: 22px; }
  footer p { margin: 0; }

  .sheet { position: fixed; inset: 0; z-index: 40; background: rgba(15, 15, 20, .4); display: none; }
  .sheet.on { display: block; }
  .sheet nav { position: absolute; top: 12px; inset-inline: 12px; padding: 12px; border-radius: 22px; background: var(--card); box-shadow: var(--sh); display: grid; gap: 2px; }
  .sheet nav a { padding: 12px 14px; border-radius: 12px; font-size: 16px; } .sheet nav a:hover { background: var(--soft); }

  /* التابلت */
  @media (max-width: 1240px) { .side { display: none; } }
  @media (max-width: 960px) {
    .feats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .plans { grid-template-columns: minmax(0, 1fr); max-width: 520px; margin-inline: auto; }
    .vid { grid-template-columns: minmax(0, 1fr); }
  }
  /* الموبايل: نفس ترتيب لوحة الموبايل */
  @media (max-width: 760px) {
    .bar .wrap { height: 60px; }
    .bar .signin, .bar .sw .t { display: none; }
    .menu-b { display: inline-flex; }
    .hero { padding-top: 18px; }
    .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .ctas { margin-top: 20px; } .ctas .go { width: 100%; }
    .ctas .ghost { display: none; }
    .note { text-align: center; width: 100%; }
    .jf { width: 230px; margin-top: -4px; }
    .steps, .samples { grid-template-columns: minmax(0, 1fr); }
    .samples { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .sample figcaption { padding: 8px 10px 10px; font-size: 12.5px; } .sample figcaption small { display: none; }
    section.sec { padding-top: 48px; }
    .feats { gap: 10px; } .feat { padding: 16px; } .feat p { font-size: 13px; }
    .vid { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .jf-float, .lit .jf-float { animation: none; } .go, .chip { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="SimsimKit"><img class="lm-l" src="/logo-mark-light.png" alt=""><img class="lm-d" src="/logo-mark-dark.png" alt="">SIMSIMKIT</a>
    <div class="tools">
      <button class="chip lang" id="lang" type="button"></button>
      <a class="chip signin" href="/login" data-t="signin"></a>
      <button class="sw" id="sw" type="button"><span class="track"><span class="knob"></span></span><span class="t" id="swT"></span></button>
      <button class="chip menu-b" id="menu" type="button" data-ta="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</header>
<nav class="side" id="side" data-ta="navAria"></nav>
<div class="sheet" id="sheet"><nav id="sheetNav"></nav></div>

<main id="top">
  <section class="hero" id="hero">
    <div class="glow" aria-hidden="true"></div>
    <div class="wrap">
      <div>
        <h1 data-t="heroTitle"></h1>
        <p class="lead" data-t="heroLead"></p>
        <div class="ctas">
          <button class="go" type="button" data-start data-t="start"></button>
          <a class="ghost" href="#demo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M10 8.5v7l5.5-3.5z"/></svg><span data-t="demo"></span></a>
        </div>
        <p class="note" data-t="heroNote"></p>
      </div>
      <div class="jf" aria-hidden="true"><div class="jf-float">
        <img class="l" src="/site/jf-light.webp" alt="" width="560" height="778" fetchpriority="high">
        <img class="ll" src="/site/jf-light-lit.webp" alt="" width="560" height="778" loading="lazy">
        <img class="d" src="/site/jf-dark.webp" alt="" width="560" height="778" loading="lazy">
        <img class="dl" src="/site/jf-dark-lit.webp" alt="" width="560" height="778" loading="lazy">
      </div></div>
    </div>
  </section>

  <div class="wrap demo" id="demo">
    <div class="vid">
      <video src="/gallery/t-launch.mp4#t=4" muted loop playsinline preload="metadata" controls></video>
      <div>
        <h2 data-t="demoTitle"></h2>
        <p data-t="demoLead"></p>
        <button class="go sm" type="button" data-start data-t="start"></button>
      </div>
    </div>
  </div>

  <section class="sec" id="how"><div class="wrap">
    <h2 data-t="howTitle"></h2><p class="sub" data-t="howLead"></p>
    <div class="steps" id="steps"></div>
  </div></section>

  <section class="sec" id="examples"><div class="wrap">
    <h2 data-t="exTitle"></h2><p class="sub" data-t="exLead"></p>
    <div class="fields" id="fields" role="group"></div>
    <div class="samples" id="samples"></div>
    <p class="s-note" data-t="exNote"></p>
  </div></section>

  <section class="sec" id="features"><div class="wrap">
    <h2 data-t="fTitle"></h2><p class="sub" data-t="fLead"></p>
    <div class="feats" id="feats"></div>
  </div></section>

  <section class="sec" id="prices"><div class="wrap">
    <div class="phead">
      <div><h2 data-t="pTitle"></h2><p class="sub" data-t="pLead"></p></div>
      <div class="cyc" id="cyc"><button type="button" data-cyc="month" aria-pressed="true" data-t="monthly"></button><button type="button" data-cyc="year" aria-pressed="false" data-t="yearly"></button></div>
    </div>
    <div class="plans" id="plans"></div>
    <p class="p-note"><span data-t="pNote"></span> <a href="/pricing" data-t="pAll"></a></p>
  </div></section>

  <section class="sec" id="faq"><div class="wrap">
    <h2 data-t="qTitle"></h2>
    <div class="faq" id="faqList"></div>

      document.querySelectorAll("#side a").forEach((a) => a.classList.toggle("on", a.dataset.sec === e.target.id));
    }), { rootMargin: "-40% 0px -55% 0px" });
    T[S.lang].nav.forEach(([id]) => { const el = $(id); if (el) so.observe(el); });
  }

  // ✨ «ابدأ مجانًا»: الجيلي فيش ينوّر مع صوت هادي، والتسجيل يفتح بعدها (قرار صاحب المنتج). مع «تقليل الحركة» يفتح فورًا بلا صوت.
  let ac;
  function chime() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = ac || new AC();
      if (ac.state === "suspended") ac.resume();
      const t0 = ac.currentTime + .02, out = ac.createGain();
      out.gain.value = .22; out.connect(ac.destination);
      const noise = (sec) => { const len = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(1, len, ac.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1; const s = ac.createBufferSource(); s.buffer = b; return s; };
      const filt = (type, f, q) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; };
      const s1 = noise(.32), hp = filt("highpass", 1400), bp = filt("bandpass", 3600, .9), g1 = ac.createGain();
      g1.gain.setValueAtTime(0, t0);
      for (let k = 0; k < 36; k++) { const x = k / 36, env = Math.min(1, x / .25) * Math.pow(1 - x, 1.4); g1.gain.setValueAtTime(env * (.25 + Math.random() * .75) * .9, t0 + k * .0075); }
      g1.gain.setValueAtTime(0, t0 + .28);
      s1.connect(hp); hp.connect(bp); bp.connect(g1); g1.connect(out); s1.start(t0); s1.stop(t0 + .32);
      for (let i = 0; i < 20; i++) {
        const at = t0 + .2 + Math.pow(Math.random(), 1.6) * 1.2, len = .004 + Math.random() * .01, c = noise(len + .004), b2 = filt("bandpass", 1500 + Math.random() * 3500, .8 + Math.random() * 1.5), g = ac.createGain();
        g.gain.setValueAtTime(.15 + Math.random() * .3, at); g.gain.exponentialRampToValueAtTime(.001, at + len);
        c.connect(b2); b2.connect(g); g.connect(out); c.start(at); c.stop(at + len + .004);
      }
    } catch { /* الصوت إضافة */ }
  }
  let starting = false;
  function start() {
    const url = "/signup";
    if (reduce.matches) return location.assign(url);
    if (starting) return;
    starting = true;
    chime();
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("hero").classList.add("lit");
    setTimeout(() => location.assign(url), 1900);
  }

  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-start]")) { e.preventDefault(); return start(); }
    const f = t.closest("[data-field]");
    if (f) { S.field = +f.dataset.field; return renderFields(); }
    const c = t.closest("[data-cyc]");
    if (c) { S.cyc = c.dataset.cyc; return renderPlans(); }
    const q = t.closest(".q > button");
    if (q) { const box = q.parentElement, open = !box.hasAttribute("open"); box.toggleAttribute("open", open); q.setAttribute("aria-expanded", open); box.querySelector("p").hidden = !open; return; }
    if (t.closest("#menu")) return $("sheet").classList.add("on");
    if (t.closest("#sheet")) $("sheet").classList.remove("on");
    if (t.closest("#lang")) { S.lang = S.lang === "en" ? "ar" : "en"; try { localStorage.setItem("studiomania.site.lang", S.lang); } catch { } return render(); }
    if (t.closest("#sw")) {
      const next = root.dataset.nhTheme === "dark" ? "light" : "dark";
      const apply = () => { root.dataset.nhTheme = next; $("swT").textContent = T[S.lang][next]; };
      try { localStorage.setItem("studiomania.theme", next); } catch { }
      document.startViewTransition && !reduce.matches ? document.startViewTransition(apply) : apply();
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("sheet").classList.remove("on"); });
  document.querySelector("#demo video").addEventListener("play", (e) => { e.target.muted = false; }, { once: true });

  render();
  fetch("/api/pricing").then((r) => (r.ok ? r.json() : Promise.reject())).then((d) => { S.pricing = d; renderPlans(); })
    .catch(() => { S.pricingFailed = true; renderPlans(); });
})();
</script>
</body>

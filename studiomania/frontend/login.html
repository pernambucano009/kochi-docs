<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudioMania</title>
<script src="/i18n-en.js"></script>
<script src="/i18n.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2231%22 fill=%22%23111%22/%3E%3Cpath d=%22M24 19.5v25l20-12.5z%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2247%22 cy=%2217%22 r=%225%22 fill=%22%23E5613E%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&family=Unbounded:wght@300;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg-art" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="ring r1"></i><i class="ring r2"></i></div>
<div class="login-wrap">
  <form class="login glass" id="form">
    <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#111"/><path d="M24 19.5v25l20-12.5z" fill="#fff"/><circle cx="47" cy="17" r="4.5" fill="#E5613E"/></svg>
    <div class="wordmark"><b>Studio</b><span>Mania</span></div>
    <p class="muted" id="hint">اكتب الباسورد عشان تدخل</p>
    <label class="field">الباسورد <input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <label class="field" id="pw2Wrap" hidden>اكتبه تاني <input type="password" id="pw2" autocomplete="new-password"></label>
    <button class="btn primary wide" id="submit">دخول</button>
    <p class="err" id="err" hidden></p>
    <button type="button" class="lang-link" id="langToggle"></button>
  </form>
</div>
<script>
let setup = false;
document.getElementById("langToggle").textContent = I18N.lang === "en" ? "عربي" : "English";
document.getElementById("langToggle").onclick = () => I18N.setLang(I18N.lang === "en" ? "ar" : "en");
const $ = (id) => document.getElementById(id);
(async () => {
  const s = await (await fetch("/api/auth/state")).json();
  if (s.logged_in) return location.replace("/");
  setup = s.needs_setup;
  if (setup) {
    $("hint").textContent = "أول مرة: اعمل باسورد للبرنامج (8 حروف أو أرقام على الأقل). احفظه كويس.";
    $("pw2Wrap").hidden = false;
    $("pw").autocomplete = "new-password";
    $("submit").textContent = "اعمل الباسورد وادخل";
  }
})();
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").hidden = true;
  if (setup && $("pw").value !== $("pw2").value) {
    $("err").textContent = "الباسوردين مش زي بعض";
    $("err").hidden = false;
    return;
  }
  $("submit").disabled = true;
  const res = await fetch(setup ? "/api/auth/setup" : "/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: $("pw").value }),
  });
  $("submit").disabled = false;
  if (res.ok) return location.replace("/");
  const data = await res.json().catch(() => ({}));
  $("err").textContent = data.detail || "حصلت مشكلة";
  $("err").hidden = false;
});
</script>
</body>
</html>

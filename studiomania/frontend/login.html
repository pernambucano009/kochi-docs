<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimsimKit</title>
<script src="/i18n-en.js"></script>
<script src="/i18n.js"></script>
<script src="/pw-eye.js" defer></script>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png"><link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&family=Unbounded:wght@300;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg-art" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="ring r1"></i><i class="ring r2"></i></div>
<div class="login-wrap">
  <form class="login glass" id="form">
    <img class="logo-mark" src="/logo-mark-light.png" alt="" width="54" height="77">
    <div class="wordmark"><b>Simsim</b><span>Kit</span></div>
    <p class="muted" id="hint">اكتب كلمة المرور لكي تدخل</p>
    <label class="field">كلمة المرور <input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <label class="field" id="pw2Wrap" hidden>اكتبه مرة أخرى <input type="password" id="pw2" autocomplete="new-password"></label>
    <button class="btn primary wide" id="submit">دخول</button>
    <p class="err" id="err" hidden></p>
    <button type="button" class="lang-link" id="langToggle"></button>
  </form>
</div>
<script>
let setup = false;
document.getElementById("langToggle").textContent = I18N.lang === "en" ? "عربي" : "English";
document.getElementById("langToggle").onclick = () => I18N.setLang(I18N.lang === "en" ? "ar" : "en");
const $ = (id) => document.getElementById(id);
(async () => {
  const s = await (await fetch("/api/auth/state")).json();
  if (s.logged_in) return location.replace(new URLSearchParams(location.search).get("next") === "/kochi" ? "/kochi" : "/");
  setup = s.needs_setup;
  if (setup) {
    $("hint").textContent = "أول مرة: أنشئ كلمة مرور للبرنامج (8 حروف أو أرقام على الأقل). احفظه كويس.";
    $("pw2Wrap").hidden = false;
    $("pw").autocomplete = "new-password";
    $("submit").textContent = "أنشئ كلمة المرور وادخل";
  }
})();
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").hidden = true;
  if (setup && $("pw").value !== $("pw2").value) {
    $("err").textContent = "الباسوردين غير مثل بعض";
    $("err").hidden = false;
    return;
  }
  $("submit").disabled = true;
  const res = await fetch(setup ? "/api/auth/setup" : "/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: $("pw").value }),
  });
  $("submit").disabled = false;
  if (res.ok) return location.replace(new URLSearchParams(location.search).get("next") === "/kochi" ? "/kochi" : "/");
  const data = await res.json().catch(() => ({}));
  $("err").textContent = data.detail || "حصلت مشكلة";
  $("err").hidden = false;
});
</script>
</body>
</html>

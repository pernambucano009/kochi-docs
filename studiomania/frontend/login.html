<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudioMania</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff6b2c%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 font-weight=%22800%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="panel login" id="form">
    <div class="logo">S</div>
    <h1>StudioMania</h1>
    <p class="muted" id="hint">اكتب الباسورد عشان تدخل</p>
    <label class="field">الباسورد <input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <label class="field" id="pw2Wrap" hidden>اكتبه تاني <input type="password" id="pw2" autocomplete="new-password"></label>
    <button class="btn primary wide" id="submit">دخول</button>
    <p class="err" id="err" hidden></p>
  </form>
</div>
<script>
let setup = false;
const $ = (id) => document.getElementById(id);
(async () => {
  const s = await (await fetch("/api/auth/state")).json();
  if (s.logged_in) return location.replace("/");
  setup = s.needs_setup;
  if (setup) {
    $("hint").textContent = "أول مرة: اعمل باسورد للبرنامج (8 حروف أو أرقام على الأقل). احفظه كويس.";
    $("pw2Wrap").hidden = false;
    $("pw").autocomplete = "new-password";
    $("submit").textContent = "اعمل الباسورد وادخل";
  }
})();
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").hidden = true;
  if (setup && $("pw").value !== $("pw2").value) {
    $("err").textContent = "الباسوردين مش زي بعض";
    $("err").hidden = false;
    return;
  }
  $("submit").disabled = true;
  const res = await fetch(setup ? "/api/auth/setup" : "/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: $("pw").value }),
  });
  $("submit").disabled = false;
  if (res.ok) return location.replace("/");
  const data = await res.json().catch(() => ({}));
  $("err").textContent = data.detail || "حصلت مشكلة";
  $("err").hidden = false;
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SimsimKit · Fonts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&amp;family=Alexandria:wght@300;400;500&amp;family=Tajawal:wght@300;400;500&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500&amp;family=Readex+Pro:wght@300;400;500&amp;display=swap">
<style>
body{margin:0}
/* نفس تحويل اللايت والدارك اللي في البرنامج (home2.css): موجة نور مايلة بتمسح الشاشة في 1.1 ثانية */
:root.nh-wipe::view-transition-old(root){animation:none}
:root.nh-wipe::view-transition-new(root){animation:nh-wipe 1.1s cubic-bezier(.5,0,.3,1) both;mix-blend-mode:normal;-webkit-mask-image:linear-gradient(112deg,transparent 0 44%,rgba(0,0,0,.35) 50%,#000 56% 100%);mask-image:linear-gradient(112deg,transparent 0 44%,rgba(0,0,0,.35) 50%,#000 56% 100%);-webkit-mask-size:310% 100%;mask-size:310% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
@keyframes nh-wipe{from{-webkit-mask-position:0% 0;mask-position:0% 0}to{-webkit-mask-position:100% 0;mask-position:100% 0}}

a{color:inherit;text-decoration:none}a:hover{color:#E5613E}
/* نفس «الثعبان» اللي بيلف حوالين المربعات في البرنامج (home2.css) */
.fn-card{position:relative;transition:transform .3s cubic-bezier(.2,.8,.2,1)}.fn-card:hover{transform:translateY(-4px)}
.nh-snake{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;opacity:0;transition:opacity .5s ease}
.nh-snake rect{fill:none;stroke:currentColor;stroke-linecap:round}
.nh-snake .s1{stroke-width:1.4;stroke-dasharray:36 964;animation:nhS1 3.2s linear infinite;filter:drop-shadow(0 0 3px currentColor)}
.nh-snake .s2{stroke-width:1.2;stroke-dasharray:130 870;opacity:.38;animation:nhS2 3.2s linear infinite}
.nh-snake .s3{stroke-width:1;stroke-dasharray:300 700;opacity:.13;animation:nhS3 3.2s linear infinite}
.fn-card:hover .nh-snake{opacity:1}
@keyframes nhS1{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
@keyframes nhS2{from{stroke-dashoffset:94}to{stroke-dashoffset:-906}}
@keyframes nhS3{from{stroke-dashoffset:264}to{stroke-dashoffset:-736}}
.sk-go{position:relative;isolation:isolate;overflow:hidden;border:0;cursor:pointer;color:#FFFFFF;background:linear-gradient(180deg,#F48A62 0%,#E5613E 55%,#D44E2C 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 24px rgba(240,117,79,.32);animation:skGlow 3.2s ease-in-out infinite;transition:transform .2s ease,filter .2s ease}
.sk-go:hover{filter:brightness(1.06);transform:translateY(-2px);color:#FFFFFF}.sk-go:active{transform:scale(1.06)}
@keyframes skGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 18px rgba(240,117,79,.26)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 0 0 1px rgba(229,97,62,.4),0 10px 26px -6px rgba(229,97,62,.75),0 0 32px rgba(240,117,79,.45)}}
@media (prefers-reduced-motion: reduce){.sk-go,.nh-snake rect{animation:none}}
</style>
</helmet>
<div style="{{rootStyle}}">
  <header style="position: absolute; top: 34px; left: 64px; right: 64px; display: flex; align-items: center; justify-content: space-between">
    <div style="font-family: Jost, sans-serif">
      <p style="margin: 0; font-size: 13px; letter-spacing: .3em; color: #E5613E">TYPEFACE</p>
      <p style="margin: 6px 0 0; font-size: 40px; font-weight: 400; letter-spacing: .02em">Jost <span style="{{weightsStyle}}">Light 300 · Regular 400 · Medium 500</span></p>
    </div>
    <button type="button" onClick="{{toggleTheme}}" aria-pressed="{{dark}}" aria-label="Switch theme" style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; cursor: pointer; color: inherit; font: 400 11px Jost, sans-serif; letter-spacing: .2em; min-height: 44px; padding: 0">
      <span style="{{trackStyle}}"><span style="width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.2)"></span></span>{{themeLabel}}</button>
  </header>

  <p dir="rtl" style="{{introStyle}}">الخط الإنجليزي في كل البرنامج هيبقى Jost. اختار العربي اللي شبهه أكتر (دوس على الكارت):</p>

  <div style="position: absolute; top: 190px; left: 64px; right: 64px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px">
    <sc-for list="{{fonts}}" as="f" hint-placeholder-count="4">
      <button type="button" class="fn-card" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">
        <svg class="nh-snake" viewBox="0 0 312 520" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="310" height="518" rx="24" pathLength="1000"/><rect class="s2" x="1" y="1" width="310" height="518" rx="24" pathLength="1000"/><rect class="s1" x="1" y="1" width="310" height="518" rx="24" pathLength="1000"/></svg>
        <span style="{{f.tagStyle}}">{{f.tag}}</span>
        <span dir="rtl" style="{{f.nameStyle}}">{{f.name}}</span>
        <span dir="rtl" style="{{f.headStyle}}">محتوى كل يوم، من غير فريق</span>
        <span dir="rtl" style="{{f.bodyStyle}}">سمسمكيت بيعرف البراند بتاعك، وبيكتب الفكرة والسكريبت، وبيعمل الفيديو وينشره في ميعاده.</span>
        <span dir="rtl" style="{{f.mixStyle}}"><span style="font-family: Jost, sans-serif; letter-spacing: .2em">START FREE</span> · ابدأ مجانًا · 297 ر.س</span>
        <span class="sk-go" style="{{f.btnStyle}}">ابدأ مجانًا</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { dark: false, pick: 0 }; }
  renderVals() {
    const d = this.state.dark, pick = this.state.pick;
    const ink = d ? '#F1F1F3' : '#181718', muted = d ? '#A3A3AB' : '#6B6B67';
    const card = d ? '#1C1C1F' : '#FFFFFF', shadow = d ? '0 4px 18px rgba(0,0,0,.4)' : '0 4px 18px rgba(24,23,24,.08)';
    const list = [
      ['Alexandria', 'هندسي زي Jost بالظبط · أقرب واحد'],
      ['Tajawal', 'هندسي وخفيف · منتشر في السعودية'],
      ['IBM Plex Sans Arabic', 'نظيف ومقروء · اللي في هيدر اللاندينج'],
      ['Readex Pro', 'اللي في البرنامج دلوقتي']
    ];
    const fonts = list.map(([fam, note], i) => {
      const on = i === pick, ff = "'" + fam + "', sans-serif";
      return {
        name: fam, tag: note, on,
        pick: () => this.setState({ pick: i }),
        style: 'position:relative;height:520px;box-sizing:border-box;padding:26px 24px;border-radius:24px;border:0;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:16px;color:' + ink + ';background:' + card + ';box-shadow:' + shadow + (on ? ';outline:2px solid #E5613E;outline-offset:-2px' : ''),
        tagStyle: 'align-self:flex-end;font:400 11.5px ' + ff + ';padding:5px 10px;border-radius:99px;' + (on ? 'color:#FFFFFF;background:#E5613E' : 'color:' + muted + ';background:' + (d ? 'rgba(255,255,255,.07)' : '#F3F2EF')),
        nameStyle: 'font:500 13px Jost,sans-serif;letter-spacing:.12em;color:#E5613E;direction:ltr;text-align:right',
        headStyle: 'font:500 30px/1.45 ' + ff,
        bodyStyle: 'font:400 15px/1.85 ' + ff + ';color:' + muted,
        mixStyle: 'font:400 14px ' + ff + ';margin-top:auto',
        btnStyle: 'height:48px;border-radius:99px;display:flex;align-items:center;justify-content:center;font:500 15px ' + ff
      };
    });
    return {
      dark: d, fonts,
      themeLabel: d ? 'DARK' : 'LIGHT',
      weightsStyle: 'font-size:15px;letter-spacing:.14em;color:' + muted + ';margin-left:14px',
      introStyle: 'position:absolute;top:128px;right:64px;margin:0;font:400 16px \'Readex Pro\',sans-serif;color:' + muted,
      rootStyle: 'position:relative;width:1440px;height:810px;overflow:hidden;color:' + ink + ';background:' + (d ? '#0C0C0E' : '#FAFAF8'),
      trackStyle: 'width:48px;height:24px;border-radius:12px;display:flex;align-items:center;padding:3px;box-sizing:border-box;transition:background .4s;' + (d ? 'background:#E5613E;justify-content:flex-end;box-shadow:0 0 14px rgba(240,117,79,.5)' : 'background:#F3F2EF;justify-content:flex-start;box-shadow:inset 0 1px 3px rgba(24,23,24,.12)'),
      toggleTheme: () => {
        const flip = () => new Promise((done) => { this.setState({ dark: !d }); requestAnimationFrame(() => requestAnimationFrame(done)); });
        const root = document.documentElement;
        if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return flip();
        root.classList.add('nh-wipe');
        document.startViewTransition(flip).finished.finally(() => root.classList.remove('nh-wipe'));
      }
    };
  }
}
</script>
</body>
</html>

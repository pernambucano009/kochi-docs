<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>SimsimKit · Landing (Web)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&amp;family=Readex+Pro:wght@300;400;500&amp;family=IBM+Plex+Sans+Arabic:wght@400;500&amp;family=Alexandria:wght@300;400;500&amp;family=Tajawal:wght@400;500&amp;display=swap">
<style>
body{margin:0}
/* نفس تحويل اللايت والدارك اللي في البرنامج (home2.css): موجة نور مايلة بتمسح الشاشة في 1.1 ثانية */
:root.nh-wipe::view-transition-old(root){animation:none}
:root.nh-wipe::view-transition-new(root){animation:nh-wipe 1.1s cubic-bezier(.5,0,.3,1) both;mix-blend-mode:normal;-webkit-mask-image:linear-gradient(112deg,transparent 0 44%,rgba(0,0,0,.35) 50%,#000 56% 100%);mask-image:linear-gradient(112deg,transparent 0 44%,rgba(0,0,0,.35) 50%,#000 56% 100%);-webkit-mask-size:310% 100%;mask-size:310% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
@keyframes nh-wipe{from{-webkit-mask-position:0% 0;mask-position:0% 0}to{-webkit-mask-position:100% 0;mask-position:100% 0}}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
input{font:inherit}
.lp-nav button{transition:color .3s,letter-spacing .5s cubic-bezier(.65,0,.35,1)}.lp-nav button:hover{color:#E5613E}
.lp-nav .lat:hover{letter-spacing:.36em}
.lp-side{transition:color .3s,translate .3s cubic-bezier(.2,.8,.2,1)}.lp-side:hover{color:#E5613E;translate:-4px 0}
@keyframes lpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.lp-jf{animation:lpFloat 7s ease-in-out infinite}

/* نفس «البروز» اللي في البرنامج (fx.js): بيطلع لفوق ويكبر 1.06 */
.lp-btn{position:relative;transition:translate .32s cubic-bezier(.2,.8,.2,1),scale .32s cubic-bezier(.2,.8,.2,1),color .3s,background .3s}
.lp-btn:hover,.lp-btn:focus-visible{translate:0 -3px;scale:1.06;z-index:2}
.lp-btn:active{translate:0 0;scale:.98;transition-duration:.12s}
/* الكروت: نفس بروز مربعات الرئيسية بهدوء */
.lp-card{position:relative;transition:translate .32s cubic-bezier(.2,.8,.2,1),scale .32s cubic-bezier(.2,.8,.2,1)}
.lp-card:hover{translate:0 -3px;scale:1.03;z-index:2}
.lp-back{transition:color .3s}.lp-back:hover{color:#E5613E}
.lp-link{transition:color .3s}.lp-link:hover{color:#E5613E}

/* نفس «الثعبان» اللي بيلف حوالين الزراير والمربعات في البرنامج (home2.css) */
.nh-snake{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;opacity:0;transition:opacity .5s ease;z-index:3}
.nh-snake rect{fill:none;stroke:currentColor;stroke-linecap:round;vector-effect:non-scaling-stroke}
.nh-snake .s1{stroke-width:1.4;stroke-dasharray:36 964;animation:nhS1 3.2s linear infinite;filter:drop-shadow(0 0 3px currentColor)}
.nh-snake .s2{stroke-width:1.2;stroke-dasharray:130 870;opacity:.38;animation:nhS2 3.2s linear infinite}
.nh-snake .s3{stroke-width:1;stroke-dasharray:300 700;opacity:.13;animation:nhS3 3.2s linear infinite}
.lp-btn:hover>.nh-snake,.lp-btn:focus-visible>.nh-snake,.lp-card:hover>.nh-snake{opacity:1}
@keyframes nhS1{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
@keyframes nhS2{from{stroke-dashoffset:94}to{stroke-dashoffset:-906}}
@keyframes nhS3{from{stroke-dashoffset:264}to{stroke-dashoffset:-736}}

/* الزرار البرتقالي المنوّر */
.sk-go{position:relative;isolation:isolate;overflow:hidden;border:0;cursor:pointer;color:#FFFFFF;background:linear-gradient(180deg,#F48A62 0%,#E5613E 55%,#D44E2C 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 24px rgba(240,117,79,.32);animation:skGlow 3.2s ease-in-out infinite}
.sk-go::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 66%) no-repeat;background-size:220% 100%;background-position:130% 0;transition:background-position .75s ease}
.sk-go:hover{filter:brightness(1.06);color:#FFFFFF}.sk-go:hover::after{background-position:-30% 0}
.sk-go .nh-snake rect{stroke:#FFFFFF}
@keyframes skGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 18px rgba(240,117,79,.26)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 0 0 1px rgba(229,97,62,.4),0 10px 26px -6px rgba(229,97,62,.75),0 0 32px rgba(240,117,79,.45)}}

/* الجيلي فيش بينوّر لما تدوس «ابدأ مجانًا» */
@keyframes lpLit{0%{filter:brightness(1);scale:1}30%{filter:brightness(1.45) saturate(1.3);scale:1.035}100%{filter:brightness(1);scale:1}}
.lp-lit{animation:lpLit 1.6s cubic-bezier(.3,0,.2,1) both}
@keyframes lpSpread{0%{opacity:0;scale:.25}25%{opacity:1}100%{opacity:0;scale:2.6}}
.lp-spread{animation:lpSpread 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes lpIn{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
.lp-in{animation:lpIn .55s cubic-bezier(.2,.8,.2,1) both}

.lp-field{width:100%;height:46px;box-sizing:border-box;border-radius:14px;padding:0 16px;outline:none;transition:box-shadow .25s,border-color .25s}
.lp-field:focus{border-color:#E5613E !important;box-shadow:0 0 0 4px rgba(229,97,62,.14)}
@media (prefers-reduced-motion: reduce){.lp-jf,.sk-go,.nh-snake rect,.lp-lit,.lp-spread,.lp-in{animation:none}.lp-btn,.lp-card{translate:none !important;scale:none !important}}
</style>
</helmet>
<div style="{{rootStyle}}">
  <div style="{{litGlow}}"></div>
  <sc-if value="{{flash}}" hint-placeholder-val="{{ false }}">
    <div class="lp-spread" style="{{spreadStyle}}"></div>
  </sc-if>
  <div style="{{jellyWrap}}">
    <div class="lp-jf" style="position: absolute; inset: 0">
      <div class="{{litClass}}" style="position: absolute; inset: 0">
        <img src="/_blob/dc713995ae7a9f826ffae824497d342b" alt="Glass jellyfish" style="{{imgLight}}">
        <img src="/_blob/cf9d0f57a91a9675963d3b0ba8662984" alt="" style="{{imgLightLit}}">
        <img src="/_blob/de96970a1478b98d300f4874959fd6f3" alt="" style="{{imgDark}}">
        <img src="/_blob/fb9543ae04ee7f0b84bd2f31e14bf35e" alt="" style="{{imgDarkLit}}">
      </div>
    </div>
  </div>

  <header style="position: absolute; top: 22px; left: 48px; right: 48px; height: 52px; display: flex; align-items: center; justify-content: space-between; z-index: 5">
    <button type="button" onClick="{{goHome}}" aria-label="SimsimKit" style="display: flex; align-items: center; border: 0; background: transparent; cursor: pointer; padding: 0; min-height: 44px; font: 500 15px Jost, Futura, sans-serif; letter-spacing: .32em">
      <img src="{{markSrc}}" alt="" style="height: 26px; width: auto; margin-right: 8px">SIMSIMKIT</button>
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" class="lp-btn" onClick="{{goLogin}}" style="{{chipSignin}}">
        <svg class="nh-snake" viewBox="0 0 132 44" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="130" height="42" rx="21" pathLength="1000"/><rect class="s2" x="1" y="1" width="130" height="42" rx="21" pathLength="1000"/><rect class="s1" x="1" y="1" width="130" height="42" rx="21" pathLength="1000"/></svg>{{t.signin}}</button>
      <button type="button" class="lp-btn" onClick="{{toggleLang}}" aria-label="{{t.langAria}}" style="{{chipLang}}">
        <svg class="nh-snake" viewBox="0 0 76 44" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="74" height="42" rx="21" pathLength="1000"/><rect class="s2" x="1" y="1" width="74" height="42" rx="21" pathLength="1000"/><rect class="s1" x="1" y="1" width="74" height="42" rx="21" pathLength="1000"/></svg>{{t.langBtn}}</button>
      <button type="button" onClick="{{toggleTheme}}" aria-pressed="{{dark}}" aria-label="{{t.themeAria}}" style="{{themeBtn}}">
        <span style="{{trackStyle}}"><span style="width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.2)"></span></span>{{t.themeLabel}}</button>
    </div>
  </header>

  <nav class="lp-nav" aria-label="Main">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <button type="button" class="{{n.cls}}" onClick="{{n.go}}" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}<span style="{{n.lineStyle}}"></span></button>
    </sc-for>
  </nav>

  <!-- ===== الرئيسية ===== -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <a href="#demo" class="lp-side" dir="{{dir}}" style="{{sideDemo}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M10 8.5v7l5.5-3.5z"/></svg>{{t.demo}}</a>
    <a href="#talk" class="lp-side" dir="{{dir}}" style="{{sideTalk}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3.3 6.5L3.5 20l1.3-3.5A8 8 0 0 1 4 12z"/><path d="M8.5 10.5h7 M8.5 13.5h4.5"/></svg>{{t.talk}}</a>
    <button type="button" class="sk-go lp-btn" onClick="{{startFree}}" style="{{ctaStyle}}">
      <svg class="nh-snake" viewBox="0 0 230 54" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="228" height="52" rx="26" pathLength="1000"/><rect class="s2" x="1" y="1" width="228" height="52" rx="26" pathLength="1000"/><rect class="s1" x="1" y="1" width="228" height="52" rx="26" pathLength="1000"/></svg>{{t.start}}</button>
  </sc-if>

  <!-- ===== شريط الرجوع + المسار (زي البرنامج) ===== -->
  <sc-if value="{{isInner}}" hint-placeholder-val="{{ false }}">
    <div dir="{{dir}}" style="{{barStyle}}">
      <button type="button" class="lp-back" onClick="{{goBack}}" style="{{backStyle}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{backIcon}}"><path d="M5 12h14M13 6l6 6-6 6"/></svg>{{backLabel}}</button>
      <div style="display: flex; align-items: center; gap: 8px">
        <button type="button" class="lp-btn" onClick="{{goHome}}" style="{{crumbStyle}}">{{t.home}}</button>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="{{crumbSep}}"><path d="M15 6l-6 6 6 6"/></svg>
        <span style="{{crumbOn}}">{{screenName}}</span>
      </div>
    </div>
  </sc-if>

  <!-- ===== المميزات ===== -->
  <sc-if value="{{isFeatures}}" hint-placeholder-val="{{ false }}">
    <section class="lp-in" dir="{{dir}}" style="{{panelStyle}}">
      <h1 style="{{h1Style}}">{{t.fTitle}}</h1>
      <p style="{{leadStyle}}">{{t.fLead}}</p>
      <div style="display: grid; grid-template-columns: repeat(3, 240px); gap: 20px; margin-top: 30px">
        <sc-for list="{{feats}}" as="c" hint-placeholder-count="6">
          <article class="lp-card" style="{{c.style}}">
            <svg class="nh-snake" viewBox="0 0 240 180" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="238" height="178" rx="22" pathLength="1000"/><rect class="s2" x="1" y="1" width="238" height="178" rx="22" pathLength="1000"/><rect class="s1" x="1" y="1" width="238" height="178" rx="22" pathLength="1000"/></svg>
            <span style="{{iconWrap}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E5613E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"/></svg></span>
            <h2 style="{{c.titleStyle}}">{{c.title}}</h2>
            <p style="{{c.textStyle}}">{{c.text}}</p>
          </article>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <!-- ===== الأسعار ===== -->
  <sc-if value="{{isPrices}}" hint-placeholder-val="{{ false }}">
    <section class="lp-in" dir="{{dir}}" style="{{panelStyle}}">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px">
        <div>
          <h1 style="{{h1Style}}">{{t.pTitle}}</h1>
          <p style="{{leadStyle}}">{{t.pLead}}</p>
        </div>
        <div style="{{periodWrap}}">
          <button type="button" class="lp-btn" onClick="{{pickMonthly}}" aria-pressed="{{monthly}}" style="{{monthlyStyle}}">{{t.monthly}}</button>
          <button type="button" class="lp-btn" onClick="{{pickYearly}}" aria-pressed="{{yearly}}" style="{{yearlyStyle}}">{{t.yearly}}</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, 240px); gap: 20px; margin-top: 26px">
        <sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
          <article class="lp-card" style="{{p.style}}">
            <svg class="nh-snake" viewBox="0 0 240 410" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="238" height="408" rx="24" pathLength="1000"/><rect class="s2" x="1" y="1" width="238" height="408" rx="24" pathLength="1000"/><rect class="s1" x="1" y="1" width="238" height="408" rx="24" pathLength="1000"/></svg>
            <div style="display: flex; align-items: center; justify-content: space-between; min-height: 26px">
              <h2 style="{{p.nameStyle}}">{{p.name}}</h2>
              <sc-if value="{{p.popular}}" hint-placeholder-val="{{ false }}">
                <span style="{{p.badgeStyle}}">{{p.badge}}</span>
              </sc-if>
            </div>
            <p style="margin: 18px 0 0; display: flex; align-items: baseline; gap: 6px"><span style="font: 400 40px Jost, sans-serif; letter-spacing: -.01em">{{p.price}}</span><span style="{{p.unitStyle}}">{{p.unit}}</span></p>
            <p style="{{p.usdStyle}}">{{p.usd}}</p>
            <ul style="list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
              <sc-for list="{{p.feats}}" as="f" hint-placeholder-count="4">
                <li style="{{p.featStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E5613E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>{{f.t}}</li>
              </sc-for>
            </ul>
            <button type="button" class="{{p.btnClass}}" onClick="{{startFree}}" style="{{p.btnStyle}}">
              <svg class="nh-snake" viewBox="0 0 200 46" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="198" height="44" rx="22" pathLength="1000"/><rect class="s2" x="1" y="1" width="198" height="44" rx="22" pathLength="1000"/><rect class="s1" x="1" y="1" width="198" height="44" rx="22" pathLength="1000"/></svg>{{p.cta}}</button>
          </article>
        </sc-for>
      </div>
      <p style="{{noteStyle}}">{{t.pNote}}</p>
    </section>
  </sc-if>

  <!-- ===== الأسئلة ===== -->
  <sc-if value="{{isFaq}}" hint-placeholder-val="{{ false }}">
    <section class="lp-in" dir="{{dir}}" style="{{panelStyle}}">
      <h1 style="{{h1Style}}">{{t.qTitle}}</h1>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
        <sc-for list="{{qs}}" as="q" hint-placeholder-count="7">
          <div class="lp-card" style="{{q.style}}">
            <svg class="nh-snake" viewBox="0 0 760 52" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="758" height="50" rx="18" pathLength="1000"/><rect class="s2" x="1" y="1" width="758" height="50" rx="18" pathLength="1000"/><rect class="s1" x="1" y="1" width="758" height="50" rx="18" pathLength="1000"/></svg>
            <button type="button" onClick="{{q.toggle}}" aria-expanded="{{q.open}}" style="{{q.btnStyle}}">{{q.q}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="{{q.iconStyle}}"><path d="M12 5v14M5 12h14"/></svg></button>
            <sc-if value="{{q.open}}" hint-placeholder-val="{{ false }}">
              <p style="{{q.aStyle}}">{{q.a}}</p>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <!-- ===== التسجيل / الدخول ===== -->
  <sc-if value="{{isSignup}}" hint-placeholder-val="{{ false }}">
    <form class="lp-in" dir="{{dir}}" onSubmit="{{submit}}" style="{{formStyle}}">
      <h1 style="{{formTitle}}">{{t.sTitle}}</h1>
      <p style="{{formLead}}">{{t.sLead}}</p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px">
        <button type="button" class="lp-btn" style="{{socialStyle}}">
          <svg class="nh-snake" viewBox="0 0 176 48" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="174" height="46" rx="14" pathLength="1000"/><rect class="s2" x="1" y="1" width="174" height="46" rx="14" pathLength="1000"/><rect class="s1" x="1" y="1" width="174" height="46" rx="14" pathLength="1000"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.8h3.6c2.1-1.9 3.3-4.8 3.3-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7H2.1a11 11 0 0 0 0 10z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7l3.7 2.9C6.7 7.3 9.1 5.4 12 5.4z"/></svg>Google</button>
        <button type="button" class="lp-btn" style="{{socialStyle}}">
          <svg class="nh-snake" viewBox="0 0 176 48" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="174" height="46" rx="14" pathLength="1000"/><rect class="s2" x="1" y="1" width="174" height="46" rx="14" pathLength="1000"/><rect class="s1" x="1" y="1" width="174" height="46" rx="14" pathLength="1000"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7a4.6 4.6 0 0 0-3.6-1.9c-1.5-.2-3 .9-3.7.9-.8 0-2-.9-3.2-.9a4.8 4.8 0 0 0-4.1 2.5c-1.8 3-.5 7.5 1.3 10 .8 1.2 1.8 2.6 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4a10 10 0 0 0 1.4-2.8 4.3 4.3 0 0 1-2.7-4.2zM14 5.4a4.2 4.2 0 0 0 1-3.1 4.4 4.4 0 0 0-2.9 1.5 4 4 0 0 0-1 3c1.1.1 2.2-.6 2.9-1.4z"/></svg>Apple</button>
      </div>
      <div style="{{orStyle}}"><span style="{{orLine}}"></span>{{t.or}}<span style="{{orLine}}"></span></div>
      <sc-if value="{{isRegister}}" hint-placeholder-val="{{ true }}">
        <label style="{{labelStyle}}">{{t.name}}<input class="lp-field" type="text" name="name" autocomplete="name" style="{{fieldStyle}}"></label>
      </sc-if>
      <label style="{{labelStyle}}">{{t.email}}<input class="lp-field" type="email" name="email" autocomplete="email" dir="ltr" style="{{fieldStyle}}"></label>
      <label style="{{labelStyle}}">{{t.password}}
        <span style="position: relative; display: block">
          <input class="lp-field" type="{{pwType}}" name="password" autocomplete="{{pwAuto}}" dir="ltr" style="{{fieldStyle}}">
          <button type="button" onClick="{{togglePw}}" aria-label="{{t.showPw}}" aria-pressed="{{showPw}}" style="{{eyeStyle}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="{{eyeSlash}}"/></svg>
          </button>
        </span>
      </label>
      <button type="submit" class="sk-go lp-btn" style="{{submitStyle}}">
        <svg class="nh-snake" viewBox="0 0 364 50" preserveAspectRatio="none" aria-hidden="true"><rect class="s3" x="1" y="1" width="362" height="48" rx="24" pathLength="1000"/><rect class="s2" x="1" y="1" width="362" height="48" rx="24" pathLength="1000"/><rect class="s1" x="1" y="1" width="362" height="48" rx="24" pathLength="1000"/></svg>{{t.submit}}</button>
      <p style="{{switchStyle}}">{{t.switchQ}} <button type="button" class="lp-link" onClick="{{switchMode}}" style="{{switchBtn}}">{{t.switchA}}</button></p>
    </form>
  </sc-if>
</div>
</x-dc>

      spreadStyle: 'position:absolute;left:50%;top:38%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;pointer-events:none;background:' + (d ? 'radial-gradient(circle,rgba(255,232,170,.32) 0%,rgba(255,232,170,0) 62%)' : 'radial-gradient(circle,rgba(80,200,255,.30) 0%,rgba(80,200,255,0) 62%)'),
      jellyWrap: 'position:absolute;left:50%;top:84px;width:497px;height:690px;margin-left:-248px;pointer-events:none;' + (still || 'transition:opacity .7s ease;') + 'opacity:' + jellyOp,
      imgLight: 'position:absolute;inset:0;width:100%;height:100%;' + (still || 'transition:opacity 1.2s ease;') + 'opacity:' + (!d && !lit ? 1 : 0),
      imgLightLit: 'position:absolute;inset:0;width:100%;height:100%;' + (still || 'transition:opacity 1.2s ease;') + 'opacity:' + (!d && lit ? 1 : 0),
      imgDark: 'position:absolute;inset:0;width:100%;height:100%;' + (still || 'transition:opacity 1.2s ease;') + 'opacity:' + (d && !lit ? 1 : 0),
      imgDarkLit: 'position:absolute;inset:0;width:100%;height:100%;' + (still || 'transition:opacity 1.2s ease;') + 'opacity:' + (d && lit ? 1 : 0),
      chipSignin: chip + 'width:132px;font:400 ' + (ar ? 14 : 13) + 'px ' + F + ';letter-spacing:' + ls('.18em'),
      chipLang: chip + 'width:76px;font:400 ' + (ar ? 15 : 16) + 'px ' + (ar ? 'Jost,sans-serif' : arF) + ';letter-spacing:' + (ar ? '.2em' : '0'),
      themeBtn: 'display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:0;min-height:44px;min-width:110px;font:400 ' + (ar ? 13 : 11) + 'px ' + F + ';letter-spacing:' + ls('.2em'),
      trackStyle: 'width:48px;height:24px;border-radius:12px;display:flex;align-items:center;padding:3px;box-sizing:border-box;transition:background .4s;' + (d ? 'background:#E5613E;justify-content:flex-end;box-shadow:0 0 14px rgba(240,117,79,.5)' : 'background:#F3F2EF;justify-content:flex-start;box-shadow:inset 0 1px 3px rgba(24,23,24,.12)'),
      sideDemo: sideBase + 'top:218px',
      sideTalk: sideBase + 'top:648px',
      ctaStyle: 'position:absolute;bottom:26px;left:605px;width:230px;height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;font:500 ' + (ar ? 17 : 14) + 'px ' + F + ';letter-spacing:' + ls('.2em') + ';white-space:nowrap;z-index:4',
      barStyle: 'position:absolute;top:92px;left:340px;width:760px;display:flex;align-items:center;justify-content:space-between;z-index:4',
      backStyle: 'display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 2px;border:0;background:none;cursor:pointer;font:400 14px ' + F + ';color:' + (d ? '#A3A3AB' : '#6B6A66'),
      backIcon: ar ? '' : 'transform:scaleX(-1)',
      crumbStyle: 'height:32px;padding:0 14px;border-radius:12px;border:0;cursor:pointer;font:400 13px ' + F + ';color:' + muted + ';background:' + (d ? 'rgba(255,255,255,.08)' : 'rgba(20,20,22,.05)'),
      crumbSep: 'color:' + muted + (ar ? '' : ';transform:scaleX(-1)'),
      crumbOn: 'height:32px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;font:500 13px ' + F + ';color:' + ink + ';background:' + (d ? 'rgba(255,255,255,.14)' : 'rgba(20,20,22,.09)'),
      panelStyle: 'position:absolute;top:150px;left:340px;width:760px;z-index:3',
      h1Style: 'margin:0;font:400 ' + (ar ? 32 : 34) + 'px/1.3 ' + F + ';letter-spacing:' + ls('.01em'),
      leadStyle: 'margin:8px 0 0;font:400 15px/1.8 ' + F + ';color:' + muted,
      iconWrap: 'width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:' + (d ? 'rgba(229,97,62,.14)' : '#FFF6F2'),
      periodWrap: 'display:flex;gap:4px;padding:4px;border-radius:22px;flex:none;background:' + solid + ';box-shadow:' + shadow,
      monthlyStyle: seg(!y), yearlyStyle: seg(y),
      noteStyle: 'margin:16px 0 0;font:400 13px ' + F + ';color:' + muted + ';text-align:center',
      formStyle: 'position:absolute;top:142px;left:518px;width:420px;box-sizing:border-box;padding:28px;border-radius:28px;z-index:3;color:' + ink + ';background:' + card + ';backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:' + (d ? '0 18px 50px rgba(0,0,0,.5)' : '0 18px 50px rgba(24,23,24,.1)'),
      formTitle: 'margin:0;font:400 28px/1.3 ' + F + ';letter-spacing:' + ls('.01em'),
      formLead: 'margin:6px 0 0;font:400 14px/1.7 ' + F + ';color:' + muted,
      socialStyle: 'height:48px;border-radius:14px;border:1px solid ' + fieldBorder + ';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font:500 14px Jost,sans-serif;color:' + ink + ';background:' + solid,
      orStyle: 'display:flex;align-items:center;gap:12px;margin:18px 0 14px;font:400 12.5px ' + F + ';color:' + muted,
      orLine: 'flex:1;height:1px;background:' + fieldBorder,
      labelStyle: 'display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font:400 13px ' + F + ';color:' + muted,
      fieldStyle: 'border:1px solid ' + fieldBorder + ';color:' + ink + ';background:' + (d ? 'rgba(255,255,255,.05)' : '#F3F2EF') + ';font:400 15px ' + F,
      pwType: s.showPw ? 'text' : 'password', pwAuto: reg ? 'new-password' : 'current-password',
      eyeStyle: 'position:absolute;top:1px;right:1px;width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:' + muted,
      eyeSlash: s.showPw ? '' : 'M4 4l16 16',
      submitStyle: 'width:364px;height:50px;margin-top:8px;border-radius:25px;display:flex;align-items:center;justify-content:center;font:500 15px ' + F + ';letter-spacing:' + ls('.08em'),
      switchStyle: 'margin:14px 0 0;text-align:center;font:400 13px ' + F + ';color:' + muted,
      switchBtn: 'border:0;background:none;cursor:pointer;padding:0;min-height:32px;font:500 13px ' + F + ';color:#E5613E',

      goHome: () => this.go('home'),
      goBack: () => this.back(),
      goLogin: () => (this.state.screen === 'signup' ? this.setState({ mode: 'login' }) : this.go('signup', { mode: 'login' })),
      startFree: () => {
        if (this.state.lit) { this.go('signup', { mode: 'register' }); return; }
        this.chime();
        if (this.state.screen !== 'home') this.go('home');
        this.setState({ lit: true, flash: true });
        clearTimeout(this._t1); clearTimeout(this._t2);
        this._t1 = setTimeout(() => this.setState({ flash: false }), 1800);
        this._t2 = setTimeout(() => this.go('signup', { mode: 'register' }), 1900);
      },
      toggleLang: () => this.setState({ lang: ar ? 'en' : 'ar' }),
      togglePw: () => this.setState({ showPw: !this.state.showPw }),
      switchMode: () => this.setState({ mode: reg ? 'login' : 'register' }),
      submit: (e) => { e.preventDefault(); },
      pickMonthly: () => this.setState({ yearly: false }),
      pickYearly: () => this.setState({ yearly: true }),
      // نفس تحويل البرنامج بالظبط: لقطة للشكل الجديد بتتكشف بموجة مايلة
      toggleTheme: () => {
        const flip = () => new Promise((done) => { this.setState({ dark: !d, still: true }); requestAnimationFrame(() => requestAnimationFrame(done)); });
        const root = document.documentElement;
        const end = () => this.setState({ still: false });
        if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { flip().then(() => requestAnimationFrame(end)); return; }
        root.classList.add('nh-wipe');
        document.startViewTransition(flip).finished.finally(() => { root.classList.remove('nh-wipe'); end(); });
      }
    };
  }
}
</script>

<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&amp;family=Unbounded:wght@300;400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#F6B29E}
.sk-go{position:relative;isolation:isolate;overflow:hidden;border:0;cursor:pointer;color:#FFFFFF;background:linear-gradient(180deg,#F48A62 0%,#E5613E 55%,#D44E2C 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 24px rgba(240,117,79,.32);animation:skGlow 3.2s ease-in-out infinite;transition:transform .2s ease,filter .2s ease}
.sk-go::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 66%) no-repeat;background-size:220% 100%;background-position:130% 0;transition:background-position .75s ease}
.sk-go:hover{filter:brightness(1.06) saturate(1.05);transform:translateY(-1px)}.sk-go:hover::after{background-position:-30% 0}
.sk-go:active{transform:scale(1.06);filter:brightness(1.1)}
@keyframes skGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 18px rgba(240,117,79,.26)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(229,97,62,.4),0 10px 26px -6px rgba(229,97,62,.75),0 0 32px rgba(240,117,79,.45)}}
.sk-ib{transition:transform .25s cubic-bezier(.2,.8,.2,1);cursor:pointer}.sk-ib:hover{transform:translateY(-2px)}.sk-ib:active{transform:scale(1.08)}
.sk-tab{transition:transform .3s cubic-bezier(.2,.8,.2,1)}.sk-tab:active{transform:scale(1.12)}.sk-tab img{transition:transform .3s cubic-bezier(.2,.8,.2,1)}.sk-tab:hover img{transform:translateY(-3px)}
.lat{font-family:Unbounded,'Readex Pro',sans-serif;font-weight:300;letter-spacing:.03em;direction:ltr;unicode-bidi:isolate}
@media (prefers-reduced-motion: reduce){.sk-go{animation:none}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; font-family: 'Readex Pro', sans-serif; color: #FFFFFF">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8z M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></button>

    </span>
    <a href="Approvals.dc.html" class="sk-ib" aria-label="الموافقات" style="position: relative; width: 40px; height: 40px; border-radius: 20px; background: rgba(20,20,22,.35); display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z M10 19.5a2 2 0 0 0 4 0"/></svg>

    </a>
  </div>

  <div style="position: absolute; top: 116px; left: 14px; display: flex; flex-direction: column; gap: 12px">
    <button type="button" class="sk-ib" aria-label="قلب الكاميرا" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: rgba(20,20,22,.35); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6 M20 4v4h-4"/></svg></button>
    <button type="button" class="sk-ib" aria-label="الفلاش" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: rgba(20,20,22,.35); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg></button>
    <a href="Teleprompter.dc.html" class="sk-ib" aria-label="التيلي برومتر" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(229,97,62,.9); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 16px rgba(240,117,79,.55)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14 M5 10h14 M5 14h9 M5 18h6"/></svg></a>
    <button type="button" class="sk-ib" aria-label="المؤقت" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: rgba(20,20,22,.35); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7a7 7 0 1 1 0 14 7 7 0 0 1 0-14z M12 11v3l2 1.5 M10 3h4"/></svg></button>
  </div>

  <div style="position: absolute; bottom: 196px; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; font-size: 12.5px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button type="button" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
    </sc-for>
  </div>

  <div style="position: absolute; bottom: 104px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 46px">
    <button type="button" class="sk-ib" aria-label="ارفع من الاستوديو" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid #FFFFFF; padding: 0; overflow: hidden; background: #2A2A30">
      <img src="/_blob/34b5b7be5625ef0dee4c73058a8a0dce" alt="" style="width: 100%; height: 100%; object-fit: cover"></button>
    <button type="button" class="sk-go" onClick="{{toggle}}" aria-label="{{recAria}}" style="width: 78px; height: 78px; border-radius: 39px; display: flex; align-items: center; justify-content: center; padding: 0; outline: 4px solid rgba(255,255,255,.9); outline-offset: 4px">
      <span style="{{shutterInner}}"></span></button>
    <a href="Approvals.dc.html" class="sk-ib" aria-label="مشاريعي" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(20,20,22,.35); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></a>
  </div>
  <sc-if value="{{rec}}" hint-placeholder-val="{{ false }}">
    <span class="lat" style="position: absolute; bottom: 206px; left: 50%; transform: translateX(-50%); background: #E5613E; border-radius: 99px; padding: 5px 12px; font-size: 11px; box-shadow: 0 0 16px rgba(240,117,79,.6)">00:07</span>
  </sc-if>

  <nav style="position: absolute; bottom: 0; left: 0; right: 0; height: 84px; display: flex; align-items: flex-start; justify-content: space-around; padding: 8px 8px 0; background: linear-gradient(180deg, rgba(12,12,14,0), rgba(12,12,14,.55))">
    <a href="Approvals.dc.html" class="sk-tab" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; min-width: 56px; color: rgba(255,255,255,.85)">
      <img src="/_blob/62e4ef740db216923254afaba672ead7" alt="" style="width: 34px; height: 34px; object-fit: contain">الموافقات</a>
    <a href="Main.dc.html" class="sk-tab" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; min-width: 56px; color: rgba(255,255,255,.85)">
      <img src="/_blob/ab40ecc9b9cc90230b4891af3bd269d6" alt="" style="width: 34px; height: 34px; object-fit: contain">المشاريع</a>
    <a href="Main.dc.html" class="sk-tab" aria-label="الكاميرا" style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; min-width: 56px; color: #FFFFFF; padding-top: 10px">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #FFFFFF; box-shadow: 0 0 12px rgba(240,117,79,.7)"></span>الكاميرا</a>
    <a href="Ideas.dc.html" class="sk-tab" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; min-width: 56px; color: rgba(255,255,255,.85)">
      <img src="/_blob/59fdf06507196c287ea09899a4a057ef" alt="" style="width: 34px; height: 34px; object-fit: contain">الأفكار</a>
    <a href="Storage.dc.html" class="sk-tab" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; min-width: 56px; color: rgba(255,255,255,.85)">
      <img src="/_blob/1a327348ebea1b4e613f4c90d4a6adb5" alt="" style="width: 34px; height: 34px; object-fit: contain">المساحة</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'video', rec: false }; }
  renderVals() {
    const s = this.state;
    const base = 'border:0;background:transparent;cursor:pointer;font-family:Readex Pro,sans-serif;font-size:12.5px;padding:8px 2px;min-height:44px;';
    const modes = [['photo', 'صورة'], ['video', 'فيديو'], ['tp', 'تيلي برومتر']].map(([k, label]) => ({
      label,
      style: base + (s.mode === k ? 'color:#FFFFFF;font-weight:500;text-shadow:0 0 12px rgba(240,117,79,.9)' : 'color:rgba(255,255,255,.65);font-weight:400'),
      pick: () => this.setState({ mode: k })
    }));
    return {
      modes, rec: s.rec,
      recAria: s.rec ? 'إيقاف التسجيل' : 'ابدأ التسجيل',
      shutterInner: s.rec ? 'width:26px;height:26px;border-radius:7px;background:#FFFFFF' : 'width:0;height:0',
      toggle: () => this.setState({ rec: !s.rec })
    };
  }
}
</script>
</body>
</html>

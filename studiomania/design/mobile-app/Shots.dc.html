<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اللقطات (مراجعة كل لقطة)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&amp;family=Unbounded:wght@300;400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#F6B29E}
.sk-go{position:relative;isolation:isolate;overflow:hidden;border:0;cursor:pointer;color:#FFFFFF;background:linear-gradient(180deg,#F48A62 0%,#E5613E 55%,#D44E2C 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 24px rgba(240,117,79,.32);animation:skGlow 3.2s ease-in-out infinite;transition:transform .2s ease,filter .2s ease}
.sk-go::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 66%) no-repeat;background-size:220% 100%;background-position:130% 0;transition:background-position .75s ease}
.sk-go:hover{filter:brightness(1.06) saturate(1.05);transform:translateY(-1px)}.sk-go:hover::after{background-position:-30% 0}
.sk-go:active{transform:scale(1.06);filter:brightness(1.1)}
@keyframes skGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(229,97,62,.28),0 8px 22px -6px rgba(229,97,62,.65),0 0 18px rgba(240,117,79,.26)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(229,97,62,.4),0 10px 26px -6px rgba(229,97,62,.75),0 0 32px rgba(240,117,79,.45)}}
.sk-ib{transition:transform .25s cubic-bezier(.2,.8,.2,1);cursor:pointer}.sk-ib:hover{transform:translateY(-2px)}.sk-ib:active{transform:scale(1.08)}
.sk-soft{transition:transform .25s cubic-bezier(.2,.8,.2,1);cursor:pointer}.sk-soft:hover{transform:translateY(-1px)}.sk-soft:active{transform:scale(1.05)}
.lat{font-family:Unbounded,'Readex Pro',sans-serif;font-weight:300;letter-spacing:.03em;direction:ltr;unicode-bidi:isolate}
@media (prefers-reduced-motion: reduce){.sk-go{animation:none}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0C0E; font-family: 'Readex Pro', sans-serif; color: #F1F1F3; display: flex; flex-direction: column">
  <div style="padding: 54px 16px 0; display: flex; align-items: center; gap: 10px">
    <a href="Teleprompter.dc.html" class="sk-ib" aria-label="رجوع للكاميرا" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 14px; font-weight: 500">القهوة الصباحية</span>
      <span style="font-size: 11px; color: #8A8A92">{{doneLabel}}</span>
    </span>
  </div>

  <div style="padding: 14px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{shots}}" as="s" hint-placeholder-count="3">
      <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.cur}}" style="{{s.style}}">
        <span style="font-size: 11px">لقطة {{s.n}} · {{s.name}}</span>
        <span style="font-size: 10.5px; opacity: .85">{{s.stateText}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin: 14px 16px 0; height: 400px; border-radius: 26px; overflow: hidden; position: relative; background: #1B1B1F">
    <img src="/_blob/96af0a263604b4d0f85b1c0749eed822" alt="معاينة اللقطة" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%)"></div>
    <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
      <svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.4)"/><path d="M10 8v8l6-4z" fill="#FFFFFF"/></svg></span>
    <span class="lat" style="position: absolute; top: 12px; left: 12px; font-size: 10.5px; background: rgba(0,0,0,.45); border-radius: 99px; padding: 5px 10px">TAKE {{take}} · 00:{{secs}}</span>
    <p style="position: absolute; bottom: 14px; left: 16px; right: 16px; margin: 0; font-size: 14px; line-height: 1.6">«{{line}}»</p>
  </div>

  <div style="margin: 12px 16px 0; border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; background: {{checkBg}}; color: {{checkInk}}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{checkIcon}}"/></svg>
    <span>{{checkText}}</span>
  </div>

  <div style="margin-top: auto; padding: 0 16px 40px; display: flex; gap: 10px">
    <button type="button" class="sk-soft" onClick="{{redo}}" style="flex: 1; height: 52px; border: 1px solid rgba(255,255,255,.16); border-radius: 99px; background: rgba(255,255,255,.08); color: #F1F1F3; font: 400 13.5px 'Readex Pro', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6 M20 4v4h-4"/></svg>أعد اللقطة دي بس</button>
    <button type="button" class="sk-go" onClick="{{ok}}" style="flex: 1.3; height: 52px; border-radius: 99px; font: 500 13.5px 'Readex Pro', sans-serif">{{okLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cur: 1, done: [true, false, false], takes: [2, 1, 0], fixed: [false, false, false] }; }
  renderVals() {
    const S = this.state;
    const meta = [
      { name: 'الهوك', line: 'القهوة دي غيّرت صباحي في أسبوع واحد بس، وهقولك ليه.', secs: '04', miss: false },
      { name: 'المنتج', line: 'أول حاجة لازم تعرفها إن الحبوب نفسها بتفرق.', secs: '05', miss: true },
      { name: 'الدعوة', line: 'لو عايز تجرب، الرابط في البايو.', secs: '03', miss: false }
    ];
    const shots = meta.map((m, i) => {
      const cur = S.cur === i, done = S.done[i];
      return {
        n: i + 1, name: m.name, cur,
        stateText: done ? '✓ تمام' : S.takes[i] ? 'تحتاج مراجعة' : 'لسه',
        style: 'height:58px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:Readex Pro,sans-serif;color:#F1F1F3;transition:transform .25s;'
          + (cur ? 'border:2px solid #E5613E;background:rgba(229,97,62,.14);box-shadow:0 0 18px rgba(240,117,79,.35);transform:scale(1.04)' : done ? 'border:2px solid transparent;background:rgba(95,209,164,.14)' : 'border:2px solid transparent;background:rgba(255,255,255,.06)'),
        pick: () => this.setState({ cur: i })
      };
    });
    const m = meta[S.cur], miss = m.miss && !S.fixed[S.cur] && !S.done[S.cur];
    const doneN = S.done.filter(Boolean).length;
    return {
      shots, line: m.line, secs: m.secs, take: Math.max(1, S.takes[S.cur]),
      doneLabel: doneN === 3 ? 'كل اللقطات تمام · بتترفع للمشروع' : doneN + ' من 3 لقطات تمام',
      checkText: miss ? 'فاتتك كلمة «نفسها» — ممكن تعيد اللقطة دي بس' : S.done[S.cur] ? 'اللقطة دي اتقبلت واترفعت للمشروع' : 'قلت الجملة كاملة',
      checkBg: miss ? 'rgba(229,97,62,.14)' : 'rgba(95,209,164,.12)',
      checkInk: miss ? '#F6B29E' : '#5FD1A4',
      checkIcon: miss ? 'M12 8v5 M12 16h.01 M12 3 2 20h20z' : 'M5 12.5l4.5 4.5L19 7',
      okLabel: S.cur < 2 ? 'تمام، اللقطة اللي بعدها' : 'تمام، خلصت',
      ok: () => { const d = S.done.slice(); d[S.cur] = true; this.setState({ done: d, cur: Math.min(2, S.cur + 1) }); },
      redo: () => { const t = S.takes.slice(), d = S.done.slice(); const f = S.fixed.slice(); t[S.cur] = t[S.cur] + 1; d[S.cur] = false; f[S.cur] = true; this.setState({ takes: t, done: d, fixed: f }); }
    };
  }
}
</script>
</body>
</html>

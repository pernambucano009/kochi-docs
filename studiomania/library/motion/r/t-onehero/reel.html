<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// قالب «لقطة واحدة وكورة واحدة»: شرح من غير قطع: كورة هي البطل بتنزل في عالم واحد طويل والكاميرا ماشية وراها:
// بتقع في قمع (اختار)، بتعدّي من بوابة ألوان تتلوّن (خصّص)، بتتنطط على سوستة وتقع في علبة (اتغلّف)، والعلبة تمشي على السير (وصل). 1080×1920، 12 ثانية.
const G1 = "١ · العنوان", G2 = "٢ · الخطوات", G3 = "٣ · الختام", GS = "الشكل العام";
const PR = M.params({
  title: { label: "العنوان", kind: "text", role: "product", def: "رحلة طلبك", group: G1, max: 16, hint: "اسم الرحلة اللي الكورة هتمشيها." },
  s1: { label: "خطوة ١ (القمع)", kind: "text", def: "اختار", group: G2, max: 10, hint: "كلمة واحدة لكل خطوة، بتظهر عند كل محطة: الكورة بتقع في قمع." },
  s2: { label: "خطوة ٢ (بوابة الألوان)", kind: "text", def: "خصّص", group: G2, max: 10, hint: "الكورة بتعدّي من بوابة وتتلوّن بلون التمييز." },
  s3: { label: "خطوة ٣ (السوستة والعلبة)", kind: "text", def: "بنغلّفه", group: G2, max: 10 },
  s4: { label: "خطوة ٤ (السير)", kind: "text", def: "يوصلك", group: G2, max: 10 },
  brand: { label: "اسم البراند", kind: "text", role: "brand", def: "صندوق", group: G3, max: 16, hint: "بيتكتب على العلبة وفي الآخر." },
  accent: { label: "لون الكورة بعد التخصيص", kind: "color", role: "accent", def: "#ff4d6d", group: GS, hint: "لون البراند: الكورة بتاخده لما تعدّي من البوابة." },
  bg: { label: "لون الخلفية", kind: "color", def: "#fff4e0", group: GS, hint: "فاتح وهادي علشان الكورة والمحطات تبان." },
  fHead: { label: "خط العناوين", kind: "font", def: "lalezar", group: GS },
  fText: { label: "خط الخطوات", kind: "font", def: "plex", group: GS },
});
M.meta({
  story: "لقطة واحدة بلا قطع: كرة هي البطل تنزل في عالم طويل والكاميرا تتبعها: تسقط في قمع، وتعبر بوابة فتتلوّن، وتقفز على نابض وتسقط في علبة، والعلبة تسير على السير.",
  scenes: [{ name: G1, t0: 0, t1: 1, about: "العنوان والكورة بتقع" }, { name: G2, t0: 1, t1: 9, about: "٤ محطات" }, { name: G3, t0: 9, t1: 12, about: "العلبة والبراند" }],
  tips: ["مناسب لشرح خطوات الطلب أو الخدمة بشكل لطيف ومريح للعين.", "اجعل الخطوات أفعالًا قصيرة بالترتيب.", "لون الكرة بعد التخصيص هو لون العلامة."],
});
const W = 1080, H = 1920, DUR = 12;
// مسار الكورة (وقت، x، y، نوع: r = بتتدحرج، f = بتقع، u = طالعة)
const PATH = [[0, 1000, -100, "f"], [.6, 880, 560, "r"], [1.0, 600, 900, "f"], [1.4, 540, 1150, "r"], [1.7, 540, 1300, "f"], [2.0, 540, 1654, "r"], [2.6, 850, 1724, "f"], [2.9, 820, 1851, "r"],
  [3.9, 260, 1977, "f"], [4.2, 260, 2111, "r"], [5.0, 820, 2237, "f"], [5.6, 540, 2644, "u"], [6.3, 700, 2480, "f"], [6.9, 820, 3000, "r"], [7.2, 820, 3120, "r"]];
const pos = (t) => { if (t <= PATH[0][0]) return [PATH[0][1], PATH[0][2]]; for (let i = 0; i < PATH.length - 1; i++) { const [a, x1, y1, k] = PATH[i], [b, x2, y2] = PATH[i + 1]; if (t <= b) { const u = (t - a) / (b - a), ey = k === "f" ? u * u : k === "u" ? 1 - (1 - u) * (1 - u) : u; return [x1 + (x2 - x1) * u, y1 + (y2 - y1) * ey]; } } const l = PATH[PATH.length - 1]; return [l[1], l[2]]; };
const PAINT = 3.4, BOUNCE = 5.6;

M.reel({
  W, H, DUR, bg: PR.bg,
  async init(M) { await Promise.all([M.font("LZ", PR.fHead), M.font("PB", PR.fText)]); const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, C, M) {
    const { x } = C, { seg, clamp, cubicIO, springO, hash } = M, io = (k) => cubicIO(clamp(k)), A = PR.accent, INK = "#2b2238", BL = "#f4a259";
    const [bxw, byw] = pos(Math.min(t, 7.2));
    const camY = Math.max(0, Math.min(1940, byw - 760));
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = PR.bg; x.fillRect(0, 0, W, H);
    x.save(); x.translate(0, -camY);
    x.fillStyle = "rgba(43,34,56,.08)"; for (let i = 0; i < 300; i++) { const yy = hash(i) * 4000; if (yy < camY - 50 || yy > camY + H + 50) continue; x.beginPath(); x.arc(hash(i + 300) * W, yy, 6, 0, Math.PI * 2); x.fill(); }
    const label = (n, s2, ly, on) => { const k = springO(clamp(on), 12, .55); if (k <= 0) return; x.save(); x.translate(540, ly); x.scale(k, k); x.font = `${M.fit(s2, "LZ", 700, 110, 50)}px LZ`; x.textAlign = "center"; x.direction = "rtl"; const tw = x.measureText(s2).width;
      x.fillStyle = INK; x.fillText(s2, -40, 36); x.beginPath(); x.arc(tw / 2 + 30, 0, 46, 0, Math.PI * 2); x.fill(); x.fillStyle = "#fff"; x.font = "700 48px PB"; x.fillText(n, tw / 2 + 30, 16); x.restore(); };
    x.fillStyle = INK; x.font = `${M.fit(PR.title, "LZ", 700, 160, 60)}px LZ`; x.textAlign = "center"; x.direction = "rtl"; x.globalAlpha = io(seg(t, .1, .6)); x.fillText(PR.title, 450, 330); x.globalAlpha = 1;
    // ١) قمع
    x.fillStyle = "#7b6cf6"; x.beginPath(); x.moveTo(300, 900); x.lineTo(780, 900); x.lineTo(600, 1150); x.lineTo(600, 1260); x.lineTo(480, 1260); x.lineTo(480, 1150); x.closePath(); x.fill(); x.fillStyle = "#5a4bd6"; x.fillRect(300, 890, 480, 20);
    label("١", PR.s1, 780, (t - .9) / .5);
    // ٢) رامبات + بوابة ألوان
    x.strokeStyle = INK; x.lineWidth = 18; x.lineCap = "round"; [[230, 1716, 850, 1786], [850, 1913, 230, 2039], [230, 2173, 850, 2299]].forEach(([a, b2, c, d]) => { x.beginPath(); x.moveTo(a, b2 - 0); x.lineTo(c, d); x.stroke(); });
    x.fillStyle = "#3a2e4f"; x.fillRect(450, 1830, 24, 175); x.fillRect(610, 1820, 24, 170); ["#ff4d6d", "#ffd23f", "#3ec1d3", "#7b6cf6"].forEach((c2, i) => { x.fillStyle = c2; x.fillRect(474, 1830 + i * 18 + Math.sin(t * 6 + i) * 4, 136, 12); });
    label("٢", PR.s2, 1560, (t - 2.0) / .5);
    // ٣) سوستة
    const tramp = Math.max(0, 1 - Math.abs(t - BOUNCE) / .25); x.strokeStyle = INK; x.lineWidth = 10; x.beginPath(); for (let k = 0; k <= 8; k++) x.lineTo(470 + (k % 2) * 140, 2830 - k * 14 * (1 - .5 * tramp)); x.stroke(); x.fillStyle = INK; x.fillRect(420, 2700 + 56 * tramp, 240, 22); x.fillRect(440, 2830, 200, 18);
    label("٣", PR.s3, 2940, (t - 5.4) / .5);
    // السير والعلبة
    x.fillStyle = "#3a2e4f"; x.fillRect(60, 3240, 960, 30); for (let k = 0; k < 12; k++) { x.fillStyle = "#6b5a85"; x.beginPath(); x.arc(100 + k * 80, 3290, 22, 0, Math.PI * 2); x.fill(); x.strokeStyle = "#fff"; x.lineWidth = 4; x.beginPath(); const a = -t * 6; x.moveTo(100 + k * 80, 3290); x.lineTo(100 + k * 80 + Math.cos(a) * 18, 3290 + Math.sin(a) * 18); x.stroke(); }
    const conv = io(seg(t, 7.8, 10.2)), cbx = 820 - 560 * conv, lid = io(seg(t, 7.2, 7.6));
    x.fillStyle = BL; x.fillRect(cbx - 120, 3020, 240, 220); x.fillStyle = "#d9823a"; x.fillRect(cbx - 120, 3020, 240, 26);
    x.save(); x.translate(cbx - 120, 3020); x.rotate(-1.4 * (1 - lid)); x.fillStyle = "#e69545"; x.fillRect(0, -16, 140, 22); x.restore(); x.save(); x.translate(cbx + 120, 3020); x.rotate(1.4 * (1 - lid)); x.fillStyle = "#e69545"; x.fillRect(-140, -16, 140, 22); x.restore();
    if (lid > .9) { x.fillStyle = A; x.fillRect(cbx - 20, 3000, 40, 240); x.fillStyle = "#fff"; x.font = "700 40px PB"; x.textAlign = "center"; x.direction = "rtl"; x.fillText(PR.brand, cbx, 3160); }
    label("٤", PR.s4, 3440, (t - 8.0) / .5);
    // الكورة
    if (t < 7.25) { const painted = t > PAINT ? 1 : 0, sq = 1 + .25 * Math.max(0, 1 - Math.abs(t - BOUNCE) / .15);
      x.save(); x.translate(bxw, byw); x.rotate(t * 5); x.scale(sq, 1 / sq); const g = x.createRadialGradient(-20, -20, 6, 0, 0, 60); g.addColorStop(0, "#fff"); g.addColorStop(.25, painted ? A : "#9aa0a6"); g.addColorStop(1, painted ? "#a3123a" : "#5f6368"); x.fillStyle = g; x.beginPath(); x.arc(0, 0, 56, 0, Math.PI * 2); x.fill();
      if (painted) { x.strokeStyle = "#ffd23f"; x.lineWidth = 8; x.beginPath(); x.arc(0, 0, 40, .3, 2.2); x.stroke(); } x.restore();
      // أثر حركة
      for (let k = 1; k < 5; k++) { const [px, py] = pos(Math.max(0, t - k * .03)); x.fillStyle = `rgba(43,34,56,${.08 / k})`; x.beginPath(); x.arc(px, py, 56 - k * 6, 0, Math.PI * 2); x.fill(); } }
    x.restore();
    // الختام
    const ek = io(seg(t, 10.0, 10.6)); if (ek > 0) { x.fillStyle = `rgba(255,244,224,${ek * .9})`; x.fillRect(0, 0, W, 700); x.globalAlpha = ek; x.fillStyle = INK; x.font = `${M.fit(PR.brand, "LZ", 900, 220, 80)}px LZ`; x.textAlign = "center"; x.direction = "rtl"; x.fillText(PR.brand, 540, 460); x.fillStyle = A; x.beginPath(); x.roundRect(540 - 120, 510, 240, 16, 8); x.fill(); x.globalAlpha = 1; }
  },
  sound(A) {
    const N = A.midi;
    A.whoosh(0, .8, .05); A.tone(1.4, N(60), .2, "sine", .1); A.click(1.9, .2);
    [2.0, 2.9, 4.2, 5.0].forEach((s, i) => { A.click(s, .15); A.pluck(s, N(72 + i * 2), .06, .3); });
    A.tone(3.4, N(84), .3, "triangle", .06); A.nz(3.4, .3, "highpass", 4000, .05, 1);
    A.tone(5.6, N(55), .4, "sine", .15); A.tone(5.65, N(67), .3, "sine", .08); A.click(7.0, .2); A.hit(7.5, .3);
    for (let b = 0; b < 24; b++) { A.hat(b * .5 + .25, .025); if (b % 2 === 0) A.kick(b * .5, .2); }
    A.pad(7.6, [N(55), N(59), N(62), N(67)], 4.4, .03); A.pluck(10.0, N(79), .1, 1.6);
  },
});
</script>
</body></html>

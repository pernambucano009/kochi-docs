<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// قالب «آرت ديكو»: خطوط دهب على أسود لكّيه دافي، كل حاجة حوالين محور واحد بالطول: شمس بأشعة، قوس متدرّج (زقورة)، مراوح وشيفرون،
// المنتج في النص بحجم «إيرباش» وحافة دهب، لمعة دهب بتعدّي، والعنوان والبراند. 1080×1920، 12 ثانية.
const G1 = "١ · الزخرفة والجوهرة", G2 = "٢ · العنوان", G3 = "٣ · العلامة", GS = "الشكل العام";
const PR = M.params({
  title: { label: "العنوان", kind: "text", role: "product", def: "أناقة لا تنتهي", group: G2, max: 16, hint: "يُكتب بالذهبي فوق الشمس." },
  sub: { label: "تحت العنوان", kind: "text", def: "مجموعة الشتا الجديدة", group: G2, max: 28 },
  brand: { label: "اسم العلامة", kind: "text", role: "brand", def: "دار الذهب", group: G3, max: 16 },
  since: { label: "سطر صغير", kind: "text", def: "منذ ١٩٢٥", group: G3, max: 18, hint: "تحت العلامة بين شرطتين: سنة التأسيس أو جملة قصيرة." },
  accent: { label: "لون الجوهرة", kind: "color", role: "accent", def: "#8e1b3a", group: G1, hint: "لون الجوهرة في المنتصف: نبيذي أو زمردي أو ياقوتي." },
  fHead: { label: "خط العنوان والعلامة", kind: "font", def: "amiri", group: GS },
  fText: { label: "خط النص الصغير", kind: "font", def: "plex", group: GS },
});
M.meta({
  story: "آرت ديكو العشرينيات: خطوط ذهبية تُرسم على أسود لامع حول محور واحد: شمس بأشعة، وقوس متدرج، ومراوح وأشكال متعرجة، وجوهرة تلمع في المنتصف، ولمعة ذهبية تمر على العنوان والعلامة.",
  scenes: [{ name: G1, t0: 0, t1: 6, about: "الزخرفة الذهبية والجوهرة" }, { name: G2, t0: 6, t1: 8.6, about: "العنوان وما تحته" }, { name: G3, t0: 8.6, t1: 12, about: "العلامة والسطر الصغير" }],
  tips: ["مناسب للمجوهرات والعطور والفنادق والمنتجات الفاخرة.", "العنوان كلمتان أو ثلاث: الفخامة في البساطة.", "لون الجوهرة الغامق يبدو أغلى على الذهب."],
});
const W = 1080, H = 1920, DUR = 12, CX = 540;
const BG = "#140e0a";

M.reel({
  W, H, DUR, bg: BG,
  async init(M) {
    await Promise.all([M.font("AM", PR.fHead), M.font("PB", PR.fText)]);
    const c = M.canvas(W, H); const x = c.getContext("2d");
    return { x };
  },
  seek(t, C, M) {
    const { x } = C, { seg, smooth, cubic, expo, clamp } = M;
    // الدهب: تدرج معدني (غامق-فاتح-لامع-فاتح-غامق) بيتحرك عشان اللمعة تعدّي
    const sheen = ((t * .22) % 1.6) - .3;
    const gold = (x0, y0, x1, y1) => { const g = x.createLinearGradient(x0, y0, x1, y1); const st = [[0, "#6b4a1c"], [.25, "#c9a24a"], [.5, "#f7e3a1"], [.75, "#c9a24a"], [1, "#6b4a1c"]]; st.forEach(([o, c2]) => g.addColorStop(clamp(o * .6 + sheen * .8 - .1, 0, 1), c2)); return g; };
    const gline = (draw, w, k = 1) => { if (k <= 0) return; x.save(); x.globalAlpha = k; x.lineCap = "round"; x.lineJoin = "round"; x.beginPath(); draw(); x.strokeStyle = "rgba(0,0,0,.7)"; x.lineWidth = w + 2; x.stroke(); x.beginPath(); draw(); x.strokeStyle = gold(0, 0, W, H); x.lineWidth = w; x.stroke(); x.beginPath(); draw(); x.strokeStyle = "rgba(255,245,210,.35)"; x.lineWidth = Math.max(.6, w * .25); x.stroke(); x.restore(); };
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = BG; x.fillRect(0, 0, W, H);
    const bg = x.createRadialGradient(CX, 1000, 100, CX, 1000, 1100); bg.addColorStop(0, "#2a1c12"); bg.addColorStop(1, BG); x.fillStyle = bg; x.fillRect(0, 0, W, H);
    // دخلة كاميرا بطيئة على المحور
    const z = 1 + .05 * smooth(seg(t, 0, DUR)); x.translate(CX, 1000); x.scale(z, z); x.translate(-CX, -1000);
    // ١) شمس بأشعة من تحت (الأشعة بتطول من المركز)
    const rk = cubic(seg(t, .2, 1.8));
    for (let i = 0; i <= 24; i++) { const a = Math.PI + Math.PI * i / 24, len = 1300 * rk; gline(() => { x.moveTo(CX + Math.cos(a) * 180, 1180 + Math.sin(a) * 180); x.lineTo(CX + Math.cos(a) * (180 + len), 1180 + Math.sin(a) * (180 + len)); }, i % 2 ? 1.6 : 3.2, .55); }
    [180, 210].forEach((r, i) => gline(() => x.arc(CX, 1180, r, Math.PI, 0), i ? 2 : 5, rk));
    // ٢) قوس متدرّج (زقورة) بخطين متوازيين حوالين المحور
    const ak = cubic(seg(t, 1.2, 3.0));
    const zig = (s) => { const pts = [[-360, 1500], [-360, 820], [-300, 820], [-300, 700], [-230, 700], [-230, 600], [-150, 600]]; const P = [...pts, ...pts.slice().reverse().map(([a, b]) => [-a, b])]; x.moveTo(CX + P[0][0] * s, P[0][1]); let L = 0; const total = P.length - 1, lim = ak * total; for (let i = 1; i <= total; i++) { if (i > lim + 1) break; const f = Math.min(1, lim - i + 1); const [a0, b0] = P[i - 1], [a1, b1] = P[i]; x.lineTo(CX + (a0 + (a1 - a0) * f) * s, b0 + (b1 - b0) * f); } x.moveTo(CX - 150 * s, 600); };
    gline(() => zig(1), 5, ak > 0 ? 1 : 0); gline(() => zig(.9), 2, ak > 0 ? 1 : 0);
    gline(() => x.arc(CX, 600, 150, Math.PI, 0), 4, seg(t, 2.6, 3.0));
    // مروحة فوق القوس
    const fk = seg(t, 2.8, 3.6); for (let i = 0; i < 9; i++) { const a = Math.PI + Math.PI * (i + .5) / 9; gline(() => { x.moveTo(CX, 600); x.lineTo(CX + Math.cos(a) * 140 * fk, 600 + Math.sin(a) * 140 * fk); }, 2, fk); }
    // ٣) الجوهرة: شكل بأوجه، لون واحد مشبع بإيرباش + حافة دهب من الناحية المنوّرة
    const jk = expo(seg(t, 3.0, 4.4)), jy = 1080 - 40 * Math.sin(t * .9) * jk + (1 - jk) * 200;
    if (jk > 0) {
      x.save(); x.globalAlpha = jk; x.translate(CX, jy); const s = .9 + .1 * jk; x.scale(s, s);
      const facets = [[[0, -230], [-170, -90], [0, -60]], [[0, -230], [170, -90], [0, -60]], [[-170, -90], [0, 230], [0, -60]], [[170, -90], [0, 230], [0, -60]]];
      facets.forEach((f, i) => { x.beginPath(); f.forEach(([a, b]) => x.lineTo(a, b)); x.closePath(); const g = x.createLinearGradient(-170, -230, 170, 230); const lt = [1, .6, .8, .35][i]; g.addColorStop(0, `rgba(255,255,255,${.35 * lt})`); g.addColorStop(.4, PR.accent); g.addColorStop(1, "#200810"); x.fillStyle = g; x.fill(); });
      x.beginPath(); [[0, -230], [170, -90], [0, 230], [-170, -90]].forEach(([a, b]) => x.lineTo(a, b)); x.closePath(); x.strokeStyle = gold(-170, -230, 170, 230); x.lineWidth = 6; x.stroke();
      x.beginPath(); x.moveTo(-170, -90); x.lineTo(0, -60); x.lineTo(170, -90); x.moveTo(0, -60); x.lineTo(0, 230); x.moveTo(0, -230); x.lineTo(0, -60); x.strokeStyle = "rgba(247,227,161,.6)"; x.lineWidth = 2.5; x.stroke();
      x.restore();
      // نجوم بأربع أطراف بتلمع
      [[CX - 210, jy - 210, 0], [CX + 230, jy - 60, 1.3], [CX + 120, jy + 220, 2.6]].forEach(([sx, sy, ph]) => { const k2 = Math.max(0, Math.sin(t * 2.4 + ph)) * jk; if (k2 <= 0) return; x.save(); x.translate(sx, sy); x.scale(k2, k2); x.fillStyle = "#fff4cf"; x.beginPath(); x.moveTo(0, -40); x.quadraticCurveTo(4, -4, 40, 0); x.quadraticCurveTo(4, 4, 0, 40); x.quadraticCurveTo(-4, 4, -40, 0); x.quadraticCurveTo(-4, -4, 0, -40); x.fill(); x.restore(); });
    }
    // ٤) خطوط سرعة بالعرض + شيفرون تحت
    const sp = seg(t, 4.6, 5.6); for (let i = 0; i < 5; i++) { const y = 1380 + i * 22, w2 = 300 * sp; gline(() => { x.moveTo(CX - 380, y); x.lineTo(CX - 380 + w2, y); x.moveTo(CX + 380, y); x.lineTo(CX + 380 - w2, y); }, 2, sp); }
    const cvk = seg(t, 5.0, 6.0); for (let i = 0; i < 4; i++) gline(() => { const y = 1530 + i * 34; x.moveTo(CX - 120, y); x.lineTo(CX, y + 50); x.lineTo(CX + 120, y); }, 3, clamp(cvk * 4 - i));
    x.setTransform(1, 0, 0, 1, 0, 0);
    // ٥) العنوان بالدهب (تدرج معدني على الحروف) + السطر + البراند
    const tk = cubic(seg(t, 6.0, 7.2));
    if (tk > 0) {
      x.save(); x.font = `700 ${M.fit(PR.title, "AM", 900, 130, 60, "700")}px AM`; x.textAlign = "center"; x.direction = "rtl"; x.textBaseline = "middle";
      const tw = x.measureText(PR.title).width; x.beginPath(); x.rect(CX - tw / 2 - 20, 0, (tw + 40) * tk, H); x.clip();
      x.fillStyle = "rgba(0,0,0,.6)"; x.fillText(PR.title, CX + 3, 303); x.fillStyle = gold(CX - tw / 2, 230, CX + tw / 2, 380); x.fillText(PR.title, CX, 300); x.restore();
      gline(() => { x.moveTo(CX - 300 * tk, 395); x.lineTo(CX + 300 * tk, 395); }, 2);
    }
    const sk = smooth(seg(t, 7.2, 8.0)); if (sk > 0) { x.globalAlpha = sk; x.fillStyle = "#efe4c8"; x.font = `700 ${M.fit(PR.sub, "PB", 880, 44, 22, "700")}px PB`; x.textAlign = "center"; x.direction = "rtl"; x.fillText(PR.sub, CX, 455); x.globalAlpha = 1; }
    const bk = smooth(seg(t, 8.6, 9.6));
    if (bk > 0) { x.save(); x.globalAlpha = bk; x.font = `700 ${M.fit(PR.brand, "AM", 760, 78, 36, "700")}px AM`; x.textAlign = "center"; x.direction = "rtl"; x.fillStyle = gold(CX - 250, 1720, CX + 250, 1800); x.fillText(PR.brand, CX, 1790); x.fillStyle = "#c9a24a"; x.font = `700 ${M.fit(`— ${PR.since} —`, "PB", 700, 30, 18, "700")}px PB`; x.fillText(`— ${PR.since} —`, CX, 1850); x.restore(); }
    // إطار دهب مزدوج حوالين الكادر
    gline(() => x.rect(34, 34, W - 68, H - 68), 3, smooth(seg(t, 0, 1)));
    gline(() => x.rect(50, 50, W - 100, H - 100), 1.2, smooth(seg(t, .3, 1.3)));
    [[50, 50], [W - 50, 50], [50, H - 50], [W - 50, H - 50]].forEach(([a, b]) => gline(() => { x.moveTo(a - 20, b); x.lineTo(a, b - 20); x.lineTo(a + 20, b); x.lineTo(a, b + 20); x.closePath(); }, 2, seg(t, 1, 1.6)));
  },
  sound(A) {
    const N = A.midi;
    // جاز عشرينات فخم: باص كونترا ماشي + كوردات بيانو + رشة صنج + بوق مكتوم
    const B = 60 / 112, prog = [[45, [64, 67, 71, 74]], [50, [65, 69, 72, 76]], [43, [62, 65, 69, 71]], [48, [64, 67, 71, 76]]];
    for (let i = 0, t = 0; t < 12; i++, t += B) { const [r, ch] = prog[Math.floor(i / 4) % 4]; A.tone(t, N(r - 12 + [0, 7, 12, 7][i % 4]), B * .9, "triangle", .14); if (i % 2 === 1) ch.forEach((n) => A.tone(t, N(n), .25, "triangle", .03)); A.nz(t + B * .66, .08, "highpass", 7000, .05); }
    [[1.2, 76], [3.0, 79], [6.0, 83], [8.6, 84]].forEach(([t, n]) => { A.tone(t, N(n), 1.2, "sawtooth", .02, .08); A.tone(t, N(n - 12), 1.2, "sine", .03, .08); });
    A.nz(3.0, 1.6, "highpass", 8000, .06); A.pluck(8.6, N(88), .12, 2);
  },
});
</script>
</body></html>

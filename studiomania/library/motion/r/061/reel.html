<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #61 Self-intro, 10 s, 120 BPM — concept: "Everything I say is one token at a time."
// 0–2 a single token block blinks, then splits "hello" into sub-word chips · 2–4 chips stream into a sentence (kinetic type)
// 4–6 the token block morphs: chip → speech bubble → bulb → circle · 6–8 the circle becomes a 3D sphere of tokens turning
// 8–9.5 data: next-token probabilities, the winner lands on each beat · 9.5–10 end title, back to the single block.
// No frames, no corner labels, no timecodes. Palette: warm paper, ink, coral, sage. One typeface (Inter).
const B = .5, PAPER = "#f3efe8", INK = "#1b1a17", CORAL = "#e2674a", SAGE = "#7d9b84";
M.reel({
  W: 1920, H: 1080, DUR: 10, bg: PAPER,
  fonts: { I5: ["inter500.ttf", "500"], I8: ["inter800.ttf", "800"] },
  init(M) { const c = M.canvas(1920, 1080); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, expo, expoIn, expoIO, spring, clamp, hash } = M;
    const beat = Math.floor(t / B), bt = t - beat * B, pulse = 1 - spring(bt, 16);
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = PAPER; x.fillRect(0, 0, 1920, 1080);
    const z = 1 + .03 * (t / 10); x.translate(960, 540); x.scale(z, z); x.translate(-960, -540);
    const chip = (s, X, Y, col, txt = PAPER, px = 64, sc = 1) => { x.save(); x.translate(X, Y); x.scale(sc, sc); x.font = `800 ${px}px I8`; const w = x.measureText(s).width + px * .7, h = px * 1.45; x.fillStyle = col; x.beginPath(); x.roundRect(-w / 2, -h / 2, w, h, h * .28); x.fill(); x.fillStyle = txt; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(s, 0, 2); x.restore(); return w * sc; };
    // ---------- 0–2: one block, then "hello" splits into tokens
    if (t < 2.1) {
      if (t < .9) { x.fillStyle = INK; x.beginPath(); x.roundRect(930, 470, 60, 140, 10); x.fill(); }
      else {
        const k = expo(seg(t, 1, 1.4)), parts = ["hel", "lo"];
        parts.forEach((p, i) => chip(p, 960 + (i - .5) * 220 * k, 540, i ? CORAL : INK, PAPER, 96, .6 + .4 * k));
      }
    }
    // ---------- 2–4: tokens stream in, one per half-beat, into a sentence
    if (t >= 2 && t < 4.2) {
      const toks = [["I", INK], [" think", INK], [" in", INK], [" tiny", CORAL], [" pieces", INK], [",", INK], [" one", SAGE], [" at", INK], [" a", INK], [" time", CORAL], [".", INK]];
      x.font = "800 82px I8"; let X = 220, Y = 470;
      toks.forEach(([s, col], i) => {
        const k = expo(seg(t, 2 + i * .17, 2.25 + i * .17)); const w = x.measureText(s).width;
        if (X + w > 1700) { X = 220; Y += 140; }
        if (k > 0) { x.fillStyle = col; x.globalAlpha = k; x.textAlign = "left"; x.textBaseline = "middle"; x.fillText(s, X, Y + (1 - k) * 60); x.globalAlpha = 1; x.fillStyle = "rgba(27,26,23,.08)"; x.fillRect(X + 4, Y + 52, w - 8, 6); }
        X += w;
      });
    }
    // ---------- 4–6: morph — chip → bubble → bulb → circle (one 120-pt path)
    if (t >= 4 && t < 6.2) {
      const N = 120, cx = 960, cy = 520;
      const shp = [
        (u) => { const a = u * 6.283; const r = 1 / Math.pow(Math.pow(Math.abs(Math.cos(a)), 6) + Math.pow(Math.abs(Math.sin(a)), 6), 1 / 6); return [Math.cos(a) * r * 260, Math.sin(a) * r * 120]; },
        (u) => { const a = u * 6.283; let X = Math.cos(a) * 300, Y = Math.sin(a) * 200; if (u > .3 && u < .36) { Y += 120 * Math.sin((u - .3) / .06 * Math.PI); X -= 80; } return [X, Y]; },
        (u) => { const a = u * 6.283; let r = 200; let X = Math.cos(a) * r, Y = Math.sin(a) * r - 40; if (Y > 100) { X *= .55; Y = 100 + (Y - 100) * 1.8; } return [X, Y]; },
        (u) => { const a = u * 6.283; return [Math.cos(a) * 230, Math.sin(a) * 230]; },
      ];
      const k = clamp(Math.floor((t - 4) / .66), 0, 2), m = expoIO(seg(t, 4 + k * .66 + .15, 4 + k * .66 + .55));
      x.beginPath(); for (let i = 0; i <= N; i++) { const u = i / N, p = shp[k](u), q = shp[k + 1](u); const X = cx + lerp(p[0], q[0], m), Y = cy + lerp(p[1], q[1], m); i ? x.lineTo(X, Y) : x.moveTo(X, Y); } x.closePath();
      x.fillStyle = [INK, CORAL, SAGE][m > .5 ? Math.min(2, k + 1) : k]; x.fill();
      if (k === 0 && m < .3) { x.font = "800 90px I8"; x.fillStyle = PAPER; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("hello", cx, cy); }
    }
    // ---------- 6–8: the circle becomes a sphere of tokens turning in 3D
    if (t >= 6 && t < 8.2) {
      const words = ["why", "how", "draft", "code", "plan", "poem", "fix", "idea", "test", "map", "sum", "ask", "yes", "data", "song", "list"];
      const rot = (t - 6) * 1.1, into = expo(seg(t, 6, 6.4)), out = expoIO(seg(t, 7.7, 8.2));
      const pts = [];
      for (let i = 0; i < 48; i++) { const yy = 1 - (i + .5) / 48 * 2, r = Math.sqrt(1 - yy * yy), th = i * 2.399; const X0 = Math.cos(th) * r, Z0 = Math.sin(th) * r; const X = X0 * Math.cos(rot) + Z0 * Math.sin(rot), Z = -X0 * Math.sin(rot) + Z0 * Math.cos(rot); pts.push({ X, Y: yy, Z, w: words[i % words.length], i }); }
      pts.sort((a, b) => a.Z - b.Z).forEach((p) => { const R = 330 * into * (1 - out * .7), f = 1.4 / (2.2 - p.Z); const s = (.45 + .55 * (p.Z + 1) / 2) * f; x.globalAlpha = .25 + .75 * (p.Z + 1) / 2; chip(p.w, 960 + p.X * R * f * 1.3, 540 + p.Y * R * f * 1.3, p.i % 5 === 0 ? CORAL : p.i % 3 === 0 ? SAGE : INK, PAPER, 40, s); });
      x.globalAlpha = 1;
    }
    // ---------- 8–9.5: next-token probabilities; the winner is chosen on each beat
    if (t >= 8 && t < 9.6) {
      const rounds = [["help", .62, "think", .21, "write", .17], ["you", .71, "the", .18, "with", .11], ["!", .55, ".", .38, "?", .07]];
      const r = clamp(Math.floor((t - 8) / B), 0, 2), g = expo(seg(bt, 0, .3));
      x.font = "800 70px I8"; x.fillStyle = INK; x.textAlign = "left"; x.textBaseline = "middle";
      const said = ["I can", "I can help", "I can help you"][r]; x.fillText(said, 260, 300);
      const opts = rounds[r];
      for (let i = 0; i < 3; i++) { const w = opts[i * 2], p = opts[i * 2 + 1]; const Y = 480 + i * 150; x.fillStyle = "rgba(27,26,23,.08)"; x.fillRect(260, Y - 40, 1100, 80); x.fillStyle = i === 0 ? CORAL : i === 1 ? SAGE : "#b9b2a6"; x.fillRect(260, Y - 40, 1100 * p * g, 80); x.font = "800 52px I8"; x.fillStyle = INK; x.fillText(w, 1400, Y); x.font = "500 40px I5"; x.fillText(Math.round(p * 100 * g) + "%", 1620, Y); }
    }
    // ---------- 9.5–10: end title, then the single block of frame one
    if (t >= 9.5) {
      const a = expo(seg(t, 9.5, 9.7)), o = expoIn(seg(t, 9.78, 9.92));
      x.globalAlpha = a * (1 - o); x.font = "800 150px I8"; x.fillStyle = INK; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("Hi, I'm Claude.", 960, 540); x.globalAlpha = 1;
      if (t > 9.92) { x.fillStyle = INK; x.beginPath(); x.roundRect(930, 470, 60, 140, 10); x.fill(); }
    }
  },
  sound(A) {
    const m = A.midi;
    for (let k = 0; k < 20; k++) { const t0 = k * B; A.kick(t0, .75); A.hat(t0 + B / 2, .07); }
    for (const t0 of [2, 4, 6, 8, 9.5]) A.hit(t0, .35);
    A.tone(1, m(76), .2, "sine", .08); A.tone(1.1, m(81), .3, "sine", .08);
    for (let i = 0; i < 11; i++) A.click(2 + i * .17, .12);
    for (let k = 0; k < 3; k++) A.whoosh(4 + k * .66 + .1, .45, .1);
    for (let k = 0; k < 3; k++) A.pluck(8 + k * B, m(72 + k * 4), .12, .35);
    A.pad(9.5, [60, 64, 67, 72].map(m), .5, .05);
  },
});
</script></body></html>

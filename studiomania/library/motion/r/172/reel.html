<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #172 The cycle of life — 20 s, 120 BPM. Concept: "One dot, one life." The same red head-dot is the character all the way through;
// the body grows, works, loves, bends, and becomes a dot again. Cream, ink, terracotta, teal; one typeface (Outfit).
// 0–2 a dot drops and bounces into a baby · 2–4 kinetic type: PLAY / GROW / RUN, the child jumps on the words · 4–6 morph: child → teenager
// 6–8 2D→3D: a grid of isometric desks (the 9-to-5) rises around them · 8–10 UI: a calendar that flips weeks, a bar of hours
// 10–13 family: a partner arrives, then a small dot-head child · 13–16 old age: the back bends, a cane, the walk slows
// 16–18.5 strongest: every stage stands in a row and the line connects them · 18.5–20 the figure shrinks to the dot → "AGAIN." → frame one.
const B = .5, CREAM = "#f3eee4", INK = "#1a1a1a", TERRA = "#d9603b", TEAL = "#2a7f7a";
M.reel({
  W: 1920, H: 1080, DUR: 20, bg: CREAM,
  fonts: { OU: ["TY-Outfit-800.ttf", "800"], O4: ["outfit400.ttf", "400"] },
  init(M) { const c = M.canvas(1920, 1080); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, expo, expoIn, expoIO, spring, springO, clamp } = M;
    const beat = Math.floor(t / B), bt = t - beat * B, pulse = 1 - spring(bt, 16);
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = CREAM; x.fillRect(0, 0, 1920, 1080);
    const FLOOR = 820;
    x.strokeStyle = "rgba(26,26,26,.15)"; x.lineWidth = 3; x.beginPath(); x.moveTo(0, FLOOR); x.lineTo(1920, FLOOR); x.stroke();
    const T = (s, px, X, Y, col, f = "OU") => { x.font = `${f === "OU" ? 800 : 400} ${px}px ${f}`; x.fillStyle = col; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(s, X, Y); };
    // a person: age a (0 baby … 1 old), walk phase, bend; the head is always the red dot
    const person = (X, a, o = {}) => {
      const h = a < .25 ? lerp(120, 330, a / .25) : a < .8 ? 330 : lerp(330, 290, (a - .8) / .2);
      const headR = a < .25 ? lerp(34, 26, a / .25) : 26;
      const bend = o.bend || 0, walk = o.walk || 0, col = o.col || INK, lift = o.lift || 0;
      const hip = [X, FLOOR - h * .48 - lift], neck = [X + Math.sin(bend) * h * .32, hip[1] - Math.cos(bend) * h * .32];
      x.strokeStyle = col; x.lineCap = "round"; x.lineWidth = a < .25 ? 22 : 18;
      // legs
      for (const s of [-1, 1]) { const sw = Math.sin(walk * Math.PI * 2 + (s > 0 ? 0 : Math.PI)) * .45; const knee = [hip[0] + Math.sin(sw) * h * .22, hip[1] + Math.cos(sw) * h * .22]; const foot = [knee[0] + Math.sin(sw * .5) * h * .24, Math.min(FLOOR - lift, knee[1] + h * .24)]; x.beginPath(); x.moveTo(...hip); x.lineTo(...knee); x.lineTo(...foot); x.stroke(); }
      // body
      x.lineWidth = a < .25 ? 40 : 34; x.beginPath(); x.moveTo(...hip); x.lineTo(...neck); x.stroke();
      // arms
      x.lineWidth = a < .25 ? 18 : 14;
      for (const s of [-1, 1]) { const sw = o.arms !== undefined ? o.arms * s : Math.sin(walk * Math.PI * 2 + (s > 0 ? Math.PI : 0)) * .5; const hand = [neck[0] + Math.sin(sw + bend) * h * .3, neck[1] + 20 + Math.cos(sw) * h * .26]; x.beginPath(); x.moveTo(neck[0], neck[1] + 14); x.lineTo(...hand); x.stroke(); }
      if (o.cane) { x.lineWidth = 8; x.strokeStyle = TEAL; x.beginPath(); x.moveTo(neck[0] + h * .22, neck[1] + h * .28); x.lineTo(neck[0] + h * .3, FLOOR); x.stroke(); }
      if (o.phones) { x.strokeStyle = TEAL; x.lineWidth = 8; x.beginPath(); x.arc(neck[0], neck[1] - headR - 12, headR + 8, Math.PI, 0); x.stroke(); }
      x.fillStyle = TERRA; x.beginPath(); x.arc(neck[0], neck[1] - headR - 10, headR, 0, 7); x.fill();
    };
    // ---------- 0–2: the dot drops and bounces; on the 4th beat it has a body
    if (t < 2.05) {
      const s = t, g = 2600, y = s < .5 ? 120 + .5 * g * s * s : FLOOR - 40 - Math.abs(Math.sin((s - .5) * 4.2)) * 260 * Math.exp(-(s - .5) * 1.4);
      const born = expo(seg(t, 1.5, 1.9));
      if (born < .05) { x.fillStyle = TERRA; x.beginPath(); x.arc(960, Math.min(y, FLOOR - 40), 40, 0, 7); x.fill(); } else { x.globalAlpha = 1; person(960, 0, { arms: .9 * born }); }
    }
    // ---------- 2–4: PLAY / GROW / RUN — the child jumps from word to word
    if (t >= 2 && t < 4.1) {
      const words = ["PLAY", "GROW", "RUN!"], xs = [520, 960, 1400];
      words.forEach((w, i) => { const k = expo(seg(t, 2 + i * .6, 2.3 + i * .6)); if (k > 0) T(w, 180, xs[i], FLOOR - 120 + (1 - k) * 200, i === 2 ? TERRA : INK); });
      const hop = clamp((t - 2) / .6, 0, 2.99), i = Math.floor(hop), f = hop - i;
      const X = lerp(xs[i] - 200, xs[Math.min(2, i + 1)] - 200, f);
      person(X + 200, .12 + (t - 2) * .03, { lift: 250 + Math.sin(f * Math.PI) * 140 - 60, walk: t * 2 });
    }
    // ---------- 4–6: child → teenager, walking in place; the body morphs taller each beat, headphones appear
    if (t >= 4 && t < 6.1) {
      const a = lerp(.15, .3, expoIO(seg(t, 4.1, 5.6)));
      person(960, a, { walk: t * 1.6, phones: t > 5 });
      T(["10", "13", "16", "19"][clamp(beat - 8, 0, 3)], 140, 1500, 300, TEAL);
    }
    // ---------- 6–8: the 9-to-5 — isometric desks rise around the walker, a cubicle grid
    if (t >= 6 && t < 8.1) {
      const rise = (i) => expo(seg(t, 6 + i * .12, 6.5 + i * .12));
      for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) {
        const i = r * 6 + c, k = rise(i), X = 300 + c * 260 + r * 60, Y = 560 + r * 90, hgt = 70 * k;
        x.fillStyle = "#d6cfc2"; x.beginPath(); x.moveTo(X, Y); x.lineTo(X + 160, Y - 40); x.lineTo(X + 220, Y); x.lineTo(X + 60, Y + 40); x.fill();
        x.fillStyle = "#bdb4a5"; x.fillRect(X, Y, 60, hgt); x.fillStyle = "#a99f8f"; x.beginPath(); x.moveTo(X + 60, Y + 40); x.lineTo(X + 220, Y); x.lineTo(X + 220, Y + hgt); x.lineTo(X + 60, Y + 40 + hgt); x.fill();
        x.fillStyle = TEAL; x.fillRect(X + 90, Y - 50 - 30 * k, 50, 34 * k);
      }
      person(960, .5, { arms: .3, walk: 0 });
      T("9 TO 5", 150, 960, 200, INK);
    }
    // ---------- 8–10: calendar weeks flip on each beat; hours bar fills
    if (t >= 8 && t < 10.1) {
      const wk = Math.floor((t - 8) / B) + 1;
      for (let d = 0; d < 7; d++) { x.fillStyle = d < 5 ? INK : TERRA; x.fillRect(520 + d * 130, 330, 110, 110); T(["M", "T", "W", "T", "F", "S", "S"][d], 50, 575 + d * 130, 385, CREAM); }
      T(`WEEK ${wk * 312}`, 90, 960, 230, INK);
      x.fillStyle = "rgba(26,26,26,.1)"; x.fillRect(520, 500, 880, 30); x.fillStyle = TEAL; x.fillRect(520, 500, 880 * expo(seg(t, 8, 10)), 30);
      T("40 h a week", 40, 960, 570, INK, "O4");
      person(960, .55, { walk: t * 1.4 });
    }
    // ---------- 10–13: family — a partner walks in, then a small one appears between them
    if (t >= 10 && t < 13.1) {
      const pin = expoIO(seg(t, 10, 11)); person(lerp(2200, 1120, pin), .6, { walk: t * 1.5 * (1 - pin) });
      person(800, .6, { walk: 0, arms: .3 });
      const kid = spring(t - 11.6, 12); if (t > 11.6) { x.save(); x.translate(960, FLOOR); x.scale(kid, kid); x.translate(-960, -FLOOR); person(960, .05, { arms: .8 }); x.restore(); }
      T("FAMILY", 150, 960, 200, TERRA);
    }
    // ---------- 13–16: old age — the back bends beat by beat, a cane, the walk slows
    if (t >= 13 && t < 16.1) {
      const k = expoIO(seg(t, 13, 15)); person(960 + (t - 13) * 30, lerp(.7, 1, k), { bend: .45 * k, walk: t * lerp(1.4, .5, k), cane: k > .5 });
      T(["60", "70", "80", "90"][clamp(beat - 26, 0, 3)], 140, 1500, 300, TEAL);
    }
    // ---------- 16–18.5: strongest — every stage in a row, a line runs through all their heads on the beat
    if (t >= 16 && t < 18.6) {
      const ages = [0, .12, .3, .55, .6, .85, 1], n = ages.length;
      ages.forEach((a, i) => { const k = spring(t - 16 - i * .18, 16); if (k <= 0) return; x.save(); x.translate(260 + i * 233, FLOOR); x.scale(.75 * k, .75 * k); x.translate(-(260 + i * 233), -FLOOR); person(260 + i * 233, a, { bend: a > .8 ? .4 : 0, cane: a > .8, arms: .2 }); x.restore(); });
      const line = expo(seg(t, 17, 18)); x.strokeStyle = TERRA; x.lineWidth = 6; x.beginPath(); x.moveTo(260, 560); x.lineTo(260 + (n - 1) * 233 * line, 560); x.stroke();
    }
    // ---------- 18.5–20: the figure shrinks to the dot; AGAIN.; frame one
    if (t >= 18.5) {
      const k = expoIO(seg(t, 18.5, 19.1));
      if (k < 1) { x.save(); x.translate(960, FLOOR); x.scale(1 - k, 1 - k); x.translate(-960, -FLOOR); person(960, 1, { bend: .45, cane: true }); x.restore(); }
      const a = expo(seg(t, 19, 19.25)) * (1 - expoIn(seg(t, 19.6, 19.85))); x.globalAlpha = a; T("AGAIN.", 220, 960, 420, INK); x.globalAlpha = 1;
      if (t > 19.85) { x.fillStyle = TERRA; x.beginPath(); x.arc(960, 120, 40, 0, 7); x.fill(); }
    }
  },
  sound(A) {
    const m = A.midi;
    for (let k = 0; k < 40; k++) { A.kick(k * B, .55); A.hat(k * B + B / 2, .05); }
    for (const t0 of [2, 4, 6, 8, 10, 13, 16, 18.5]) A.hit(t0, .3);
    [0.5, .9, 1.2, 1.4].forEach((t0) => A.tone(t0, 500, .08, "sine", .1));   // bounces
    for (let i = 0; i < 3; i++) A.pluck(2 + i * .6, m(72 + i * 4), .1, .3);
    for (let i = 0; i < 18; i++) A.click(6 + i * .12, .06);   // desks
    for (let i = 0; i < 4; i++) A.tone(8 + i * B, 900, .05, "square", .04);   // calendar flips
    A.pad(10, [60, 64, 67, 71].map(m), 3, .035);
    A.pad(13, [57, 60, 64].map(m), 3, .03);
    for (let i = 0; i < 7; i++) A.pluck(16 + i * .18, m(60 + [0, 2, 4, 7, 9, 12, 14][i]), .1, .5);
    A.tone(19, m(48), 1, "sine", .1);
  },
});
</script></body></html>

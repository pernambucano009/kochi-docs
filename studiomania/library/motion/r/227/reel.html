<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #227 Token bucket rate limiter — 45 s, for developers. One diagram: TAP (refills 2 tokens/s) → BUCKET (holds 10) → GATE (each
// request spends 1 token) → SERVER. Requests with no token get 429. The run is simulated once (deterministic), every frame reads it.
// Storyboard: 0–5 hook: a flood of requests (some pass, some bounce) · 5–14 the tap: 2 tokens / second · 14–22 the bucket: it fills
// to 10 and the extra spills · 22–32 the gate: 1 request = 1 token; a burst of 8 passes at once · 32–40 a sustained flood empties
// it: 429 · 40–45 pull back, takeaway: bursts are capped by the bucket, the average by the tap.
const W = 1920, H = 1080;
const RATE = 2, CAP = 10;
const TAP = [760, 150], BK = { x: 760, top: 420, bot: 720, wt: 330, wb: 240 }, GATE = [1090, 880], SRV = [1660, 880];
const BG = "#0e1116", GOLD = "#f5b82e", BLUE = "#5aa9ff", RED = "#ff5470", GREEN = "#3ddc97", INK = "#e6edf3", DIM = "#8b949e";
// ---------- simulate
const ARR = [];
for (let i = 0; i < 24; i++) ARR.push(.6 + i * (3.8 / 24));             // hook: 6 req/s for ~4 s
for (let i = 0; i < 5; i++) ARR.push(22.6 + i);                          // steady: 1 req/s
for (let i = 0; i < 8; i++) ARR.push(28.0 + i * .05);                    // a burst of 8
for (let i = 0; i < 36; i++) ARR.push(32.5 + i / 6);                     // flood: 6 req/s for 6 s
ARR.sort((a, b) => a - b);
const EV = []; let n = CAP;
const REF = []; for (let tg = .5; tg <= 45; tg += 1 / RATE) REF.push(+tg.toFixed(3));
const all = [...REF.map((t) => [t, "ref"]), ...ARR.map((t) => [t, "req"])].sort((a, b) => a[0] - b[0] || (a[1] === "ref" ? -1 : 1));
const COUNT = []; const REQ = []; const DROP = [];
for (const [t, k] of all) {
  if (k === "ref") { if (n < CAP) { n++; DROP.push([t, "add", n]); } else DROP.push([t, "spill", n]); }
  else { if (n > 0) { REQ.push([t, "pass", n]); n--; } else REQ.push([t, "reject", 0]); }
  COUNT.push([t, n]);
}
const countAt = (t) => { let v = CAP; for (const [tt, nn] of COUNT) { if (tt <= t) v = nn; else break; } return v; };
const slot = (i) => { const row = Math.floor(i / 5), col = i % 5; return [BK.x - 100 + col * 50 + (row % 2 ? 0 : 0), BK.bot - 34 - row * 50]; };
M.reel({
  W, H, DUR: 45, bg: BG,
  fonts: { MO: ["TY-PlexMono-500.ttf", "500"], I8: ["inter800.ttf", "800"] },
  init(M) { const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, expo, expoIO, springO } = M;
    const K = [[0, 960, 540, 1], [5, 960, 540, 1], [6, 860, 300, 1.9], [13.4, 860, 300, 1.9], [14.4, 760, 560, 1.75], [21.4, 760, 560, 1.75], [22.4, 1060, 760, 1.45], [31.4, 1060, 760, 1.45], [32.4, 980, 640, 1.15], [39.4, 980, 640, 1.15], [40.6, 960, 540, 1]];
    let cam = K[K.length - 1].slice(1);
    for (let i = 0; i < K.length - 1; i++) if (t >= K[i][0] && t < K[i + 1][0]) { const k = expoIO(seg(t, K[i][0], K[i + 1][0])); cam = [1, 2, 3].map((j) => lerp(K[i][j], K[i + 1][j], k)); }
    const [cx, cy, z] = cam;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = BG; x.fillRect(0, 0, W, H);
    x.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z);
    const L = (s, X, Y, px, col = INK, t0 = 0, t1 = 999, al = "center") => { if (t < t0 || t > t1 + .25) return; const a = expo(seg(t, t0, t0 + .3)) * (1 - expo(seg(t, t1, t1 + .25))); x.globalAlpha = a; x.font = `500 ${px}px MO`; x.textAlign = al; x.textBaseline = "middle"; x.fillStyle = col; x.fillText(s, X, Y + (1 - a) * 10); x.globalAlpha = 1; };
    const token = (X, Y, r = 22, a = 1) => { x.globalAlpha = a; x.fillStyle = GOLD; x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill(); x.strokeStyle = "#b07d12"; x.lineWidth = 3; x.beginPath(); x.arc(X, Y, r * .62, 0, 7); x.stroke(); x.globalAlpha = 1; };
    // ---------- the pipe (requests travel left → right along it) and the server
    x.strokeStyle = "#2a313c"; x.lineWidth = 70; x.lineCap = "butt"; x.beginPath(); x.moveTo(-200, GATE[1]); x.lineTo(SRV[0] - 60, GATE[1]); x.stroke();
    x.fillStyle = "#1b2230"; x.beginPath(); x.roundRect(SRV[0] - 70, SRV[1] - 190, 220, 300, 18); x.fill();
    for (let i = 0; i < 5; i++) { x.fillStyle = "#2d384a"; x.fillRect(SRV[0] - 50, SRV[1] - 165 + i * 54, 180, 36); x.fillStyle = Math.floor(t * 5 + i) % 3 ? GREEN : "#1d6b4a"; x.fillRect(SRV[0] + 100, SRV[1] - 153 + i * 54, 12, 12); }
    L("SERVER", SRV[0] + 40, SRV[1] + 145, 34, DIM);
    // ---------- the tap
    x.fillStyle = "#3a4250"; x.fillRect(TAP[0] - 260, TAP[1] - 70, 260, 40); x.fillRect(TAP[0] - 30, TAP[1] - 70, 60, 90); x.fillRect(TAP[0] - 40, TAP[1] + 10, 80, 20);
    // ---------- the bucket
    const bx = BK.x;
    x.strokeStyle = INK; x.lineWidth = 8; x.lineJoin = "round"; x.beginPath(); x.moveTo(bx - BK.wt / 2, BK.top); x.lineTo(bx - BK.wb / 2, BK.bot); x.lineTo(bx + BK.wb / 2, BK.bot); x.lineTo(bx + BK.wt / 2, BK.top); x.stroke();
    // tokens at rest
    const nNow = countAt(t);
    // tokens currently flying out to the gate are drawn separately; the stack shows the count after they left
    for (let i = 0; i < nNow; i++) { const [sx, sy] = slot(i); token(sx, sy); }
    // falling refills (each lands exactly when it's counted) and spills
    DROP.forEach(([tg, kind, nn]) => {
      const s = t - (tg - .45); if (s < 0 || s > 1.4) return;
      const [sx, sy] = kind === "add" ? slot(nn - 1) : [bx + 60, BK.top - 20];
      if (s <= .45) { const k = (s / .45) ** 2; token(lerp(TAP[0], sx, k * .2 + (kind === "add" ? k * .8 : 0)), lerp(TAP[1] + 40, sy, k)); }
      else if (kind === "spill") { const u = s - .45; token(sx + u * 260, sy - 160 * u + 900 * u * u, 22, Math.max(0, 1 - u / .9)); }
    });
    L(`${nNow}/${CAP}`, bx, BK.bot + 50, 44, nNow ? GOLD : RED);
    // ---------- requests: arrive, spend a token, pass or bounce with 429
    const gx = GATE[0], gy = GATE[1];
    let gateFlash = 0, rej = 0;
    REQ.forEach(([ta, kind, nb]) => {
      const s = t - ta;
      if (s < -3 || s > 2.5) return;
      let X, Y = gy, col = BLUE, a = 1;
      if (s < 0) X = gx - 60 + s * 520;
      else if (kind === "pass") { if (s < .25) { X = gx - 60; const [sx, sy] = slot(nb - 1), k = expo(s / .25); token(lerp(sx, gx - 30, k), lerp(sy, gy - 50, k), 18); } else X = gx - 60 + (s - .25) * 900; col = s > .25 ? GREEN : BLUE; if (X > SRV[0] - 80) a = 0; }
      else { X = gx - 60 - s * 520; Y = gy - Math.sin(Math.min(1, s / .6) * Math.PI) * 60; col = RED; a = Math.max(0, 1 - s / 1.6); if (s < .3) gateFlash = 1; rej = 1; }
      if (a <= 0) return;
      x.globalAlpha = a; x.fillStyle = col; x.beginPath(); x.roundRect(X - 34, Y - 24, 68, 48, 6); x.fill(); x.strokeStyle = BG; x.lineWidth = 3; x.beginPath(); x.moveTo(X - 34, Y - 22); x.lineTo(X, Y + 4); x.lineTo(X + 34, Y - 22); x.stroke();
      if (kind === "reject" && s > 0 && s < 1.2) { x.font = "500 26px MO"; x.textAlign = "center"; x.fillStyle = RED; x.fillText("429", X, Y - 46); }
      x.globalAlpha = 1;
    });
    // the gate
    x.fillStyle = gateFlash ? RED : "#556070"; x.fillRect(gx - 8, gy - 70, 16, 140);
    // ---------- labels on the things they name
    L("REFILL: 2 TOKENS / SECOND", TAP[0] + 60, TAP[1] + 60, 30, GOLD, 7.0, 13.2, "left");
    L("CAPACITY: 10", bx, BK.top - 40, 34, INK, 15.5, 21.2);
    L("FULL? EXTRA TOKENS SPILL", bx, BK.top - 90, 28, DIM, 17.5, 21.2);
    L("1 REQUEST = 1 TOKEN", gx, gy - 130, 30, INK, 23.0, 27.6);
    L("BURST OF 8: ALL PASS", gx, gy - 130, 30, GREEN, 28.0, 31.2);
    L("NO TOKEN? 429", gx, gy - 130, 34, RED, 35.2, 39.2);
    // ---------- screen-space type: hook + takeaway
    x.setTransform(1, 0, 0, 1, 0, 0);
    const S = (s, Y, px, col, t0, t1) => { if (t < t0 || t > t1 + .25) return; const a = expo(seg(t, t0, t0 + .3)) * (1 - expo(seg(t, t1, t1 + .25))); x.globalAlpha = a; x.font = `800 ${px}px I8`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = col; x.fillText(s, W / 2, Y + (1 - a) * 16); x.globalAlpha = 1; };
    S("HOW DOES AN API SAY “SLOW DOWN”?", 90, 60, INK, .4, 4.8);
    S("BURSTS: BUCKET SIZE.", 70, 60, GOLD, 41, 45);
    S("AVERAGE: REFILL RATE.", 150, 60, INK, 41.4, 45);
  },
  sound(A) {
    const m = A.midi;
    // a soft pulse under each step; a hit as each idea lands
    [[0, 5], [5, 14], [14, 22], [22, 32], [32, 40], [40, 45]].forEach(([a, b], i) => { for (let t0 = a + .2; t0 < b - .2; t0 += .5) A.tone(t0, m([45, 43, 41, 43, 40, 48][i]), .35, "triangle", .06); });
    DROP.forEach(([tg, kind]) => (kind === "add" ? A.tone(tg, 1320, .06, "sine", .05) : A.tone(tg + .3, 700, .08, "sine", .025)));
    REQ.forEach(([ta, kind]) => { if (kind === "pass") { A.click(ta, .06); A.tone(ta + .25, 880, .05, "square", .025); } else { A.tone(ta, 180, .12, "square", .06); } });
    [7.0, 15.5, 23.0, 28.0, 35.2, 41].forEach((t0, i) => { A.hit(t0, .2); A.pluck(t0, m([72, 74, 76, 79, 71, 84][i]), .1, .4); });
    [6, 14.4, 22.4, 32.4, 40.6].forEach((t0) => A.whoosh(t0 - .4, .9, .12));
  },
});
</script></body></html>

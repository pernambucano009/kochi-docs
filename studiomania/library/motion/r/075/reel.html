<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #75 White Russian — 30 s, 100 BPM, 1080×1080. Vodka 50 ml, coffee liqueur 20 ml, cream 30 ml floated on top, ice, one slow stir, cocoa dust.
const BPM = 100, B = 60 / BPM, BAR = B * 4;
const STEPS = [
  { name: "Ice", amt: "3", unit: "cubes", t0: BAR * 1, t1: BAR * 2 },
  { name: "Vodka", amt: "50", unit: "ml", t0: BAR * 2, t1: BAR * 4, col: [236, 240, 236, .03], vol: 50 },
  { name: "Coffee liqueur", amt: "20", unit: "ml", t0: BAR * 4, t1: BAR * 6, col: [70, 36, 18, 1], vol: 20 },
  { name: "Cream, floated", amt: "30", unit: "ml", t0: BAR * 6, t1: BAR * 8, col: [250, 244, 232, .97], vol: 30, cream: true },
  { name: "One slow stir", amt: "1", unit: "turn", t0: BAR * 8, t1: BAR * 10 },
  { name: "Cocoa dust", amt: "1", unit: "pinch", t0: BAR * 10, t1: BAR * 11 },
];
M.reel({
  W: 1080, H: 1080, DUR: 30, bg: "#eee5da",
  fonts: { SE: "Instrument_Serif.ttf", I8: ["inter800.ttf", "800"], I5: ["inter500.ttf", "500"] },
  init(M) {
    const c = M.canvas(1080, 1080); const x = c.getContext("2d");
    const lab = M.el("div", "", "position:absolute;left:0;top:0;width:1080px;height:1080px;");
    const big = M.el("div", "", "position:absolute;left:640px;top:470px;width:420px;height:300px;overflow:hidden;", "", lab);
    const bigNum = M.el("div", "", "position:absolute;left:0;top:0;font:800 150px I8;letter-spacing:-.04em;color:#1b1512;line-height:1;white-space:pre;", "", big);
    const bigUnit = M.el("div", "", "position:absolute;left:0;top:0;font:500 30px I5;color:#1b1512;letter-spacing:.02em;", "", big);
    const bigName = M.el("div", "", "position:absolute;left:0;top:168px;font:400 64px SE;color:#1b1512;line-height:1;white-space:pre;", "", big);
    const list = STEPS.map((s) => M.el("div", "", `position:absolute;left:640px;top:0;font:500 24px I5;color:#1b1512;white-space:pre;`, `<b style="font:800 24px I8">${s.amt}</b> ${s.unit} &nbsp;<span style="font:400 30px SE">${s.name}</span>`, lab));
    const title = M.el("div", "", "position:absolute;left:72px;top:64px;font:400 96px SE;color:#1b1512;line-height:1;white-space:pre;", "White Russian", lab);
    const sub = M.el("div", "", "position:absolute;left:78px;top:196px;font:500 22px I5;letter-spacing:.14em;text-transform:uppercase;color:#6c5a4c;white-space:pre;", "Vodka · coffee · cream — on the rocks", lab);
    const meas = M.el("div", "", "position:absolute;left:0;top:0;font:800 22px I8;color:#1b1512;white-space:pre;", "", lab);
    return { x, big, bigNum, bigUnit, bigName, list, title, sub, meas };
  },
  seek(t, P, M) {
    const { clamp, seg, lerp, expo, expoIO, spring, springO } = M;
    const x = P.x;
    // ---- camera: eases in on the glass for the finish
    const cam = expoIO(seg(t, BAR * 11, BAR * 11 + 2.2));
    const CS = lerp(1, 1.22, cam), CX = 400, CY = 590;
    x.setTransform(1, 0, 0, 1, 0, 0);
    // backdrop: wall + table (soft light, no gradient banding)
    x.fillStyle = "#eee5da"; x.fillRect(0, 0, 1080, 1080);
    x.save();
    x.translate(CX, CY); x.scale(CS, CS); x.translate(-CX, -CY);
    const wall = x.createRadialGradient(420, 420, 60, 420, 470, 760); wall.addColorStop(0, "#f6efe7"); wall.addColorStop(1, "#e2d6c8");
    x.fillStyle = wall; x.fillRect(-200, -200, 1480, 960);
    const tab = x.createLinearGradient(0, 760, 0, 1200); tab.addColorStop(0, "#d8c8b6"); tab.addColorStop(1, "#c4b19c");
    x.fillStyle = tab; x.fillRect(-200, 760, 1480, 600);
    x.fillStyle = "rgba(255,255,255,.35)"; x.fillRect(-200, 758, 1480, 3);

    // ---- glass rises into place on the first beats
    const rise = spring(t - .15, 9);
    const gx = 400, gy = lerp(1180, 0, rise);   // offset
    const TOP = 400 + gy, BOT = 760 + gy, HW_T = 165, HW_B = 148, WALL = 12, BASE = 46;
    const inTop = TOP + 6, inBot = BOT - BASE;
    const hwAt = (y) => lerp(HW_T - WALL, HW_B - WALL, (y - inTop) / (inBot - inTop));

    // ---- volumes & colour
    let vol = 0, rgb = [0, 0, 0], a = 0;
    const liq = STEPS.filter((s) => s.vol);
    let creamV = 0;
    const mixK = seg(t, STEPS[4].t0 + .4, STEPS[4].t1 - .4);   // the stir folds the cream in
    liq.forEach((s) => {
      const k = M.sine(seg(t, s.t0 + .55, s.t1 - .25));
      let v = s.vol * k; if (v <= 0) return;
      if (s.cream) { creamV = v * (1 - mixK); vol += creamV; v *= mixK; if (v <= 0) return; }
      // colour is weighted by how strongly each spirit tints (gin barely does), opacity builds up
      const wA = a * vol, wB = s.col[3] * v;
      rgb = rgb.map((c, i) => (c * wA + s.col[i] * wB) / (wA + wB || 1));
      vol += v;
      a = Math.min(.94, (wA + wB) / vol * 1.9);
    });
    // ice adds displacement
    const iceIn = STEPS[0];
    const cubes = [0, 1, 2].map((i) => {
      const land = iceIn.t0 + i * B + .25;
      const fall = clamp((t - (land - .35)) / .35);
      const rest = inBot - 60 - i * 54;
      return { i, land, on: t > land - .35, y0: lerp(TOP - 420, rest, fall * fall), rest, x: gx + [-40, 42, -6][i], r: [-14, 11, 32][i] };
    });
    const iceVol = cubes.filter((cb) => t > cb.land).length * 7;
    const level = clamp((vol + (vol > 0 ? iceVol : 0)) / 160);
    const surfY = lerp(inBot, inTop, level);

    // surface wobble after each pour and while stirring
    let wob = 0;
    liq.forEach((s) => { const d = t - s.t1 + .25; if (d > 0) wob += Math.exp(-d * 3) * Math.sin(d * 18) * 4; });
    const stir = STEPS[4], stirOn = seg(t, stir.t0, stir.t0 + .4) * (1 - seg(t, stir.t1 - .3, stir.t1));
    const ph = (t - stir.t0) * Math.PI * 2 * .9;

    // shadow & caustic on the table
    x.fillStyle = "rgba(60,40,25,.18)";
    x.beginPath(); x.ellipse(gx + 30, BOT + 2, 190, 26, 0, 0, Math.PI * 2); x.fill();
    if (vol > 0) { x.fillStyle = `rgba(${rgb.map(Math.round).join(",")},${.28 * a * level / .6})`; x.beginPath(); x.ellipse(gx + 120, BOT + 10, 120, 18, 0, 0, Math.PI * 2); x.fill(); }

    // liquid
    if (vol > 0) {
      x.save();
      x.beginPath(); x.moveTo(gx - hwAt(surfY), surfY); x.lineTo(gx - hwAt(inBot), inBot); x.lineTo(gx + hwAt(inBot), inBot); x.lineTo(gx + hwAt(surfY), surfY); x.closePath(); x.clip();
      const lg = x.createLinearGradient(gx - 150, 0, gx + 150, 0);
      const C = (k, al) => `rgba(${rgb.map((v) => Math.round(v * k)).join(",")},${al})`;
      lg.addColorStop(0, C(.72, a)); lg.addColorStop(.45, C(1.05, a * .92)); lg.addColorStop(1, C(.8, a));
      x.fillStyle = lg; x.fillRect(gx - 200, surfY - 40, 400, inBot - surfY + 60);
      // the floated cream: a white layer on top, with soft tendrils sinking while stirred
      if (creamV > 0) {
        const ch = (inBot - inTop) * creamV / 160;
        x.fillStyle = "rgba(250,244,232,.97)"; x.fillRect(gx - 200, surfY - 40, 400, ch + 40);
        for (let k = 0; k < 7; k++) { const tx = gx - 120 + k * 40 + Math.sin(t * 2 + k) * 8, depth = (8 + (k % 3) * 14) * (1 + mixK * 5); x.beginPath(); x.ellipse(tx, surfY + ch, 14, depth, 0, 0, Math.PI); x.fill(); }
      }
      x.restore();
      // meniscus + swirl highlights
      x.fillStyle = `rgba(${rgb.map((v) => Math.round(Math.min(255, v * 1.25))).join(",")},${Math.min(1, a + .1)})`;
      x.beginPath(); x.ellipse(gx, surfY + wob * .3, hwAt(surfY), 16, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = "rgba(255,255,255,.55)"; x.lineWidth = 2;
      x.beginPath(); x.ellipse(gx, surfY + wob * .3, hwAt(surfY) - 2, 15, 0, Math.PI * 1.05, Math.PI * 1.95); x.stroke();
      if (stirOn > 0) {
        x.strokeStyle = `rgba(255,255,255,${.35 * stirOn})`; x.lineWidth = 3;
        for (let k = 0; k < 3; k++) { x.beginPath(); x.ellipse(gx, surfY, hwAt(surfY) * (.35 + k * .2), 9 + k * 2, 0, ph + k * 1.7, ph + k * 1.7 + 1.4); x.stroke(); }
      }
    }

    // ice cubes (translucent, float on the liquid)
    cubes.forEach((cb) => {
      if (!cb.on) return;
      const settle = t > cb.land ? Math.exp(-(t - cb.land) * 6) * Math.sin((t - cb.land) * 22) * 6 : 0;
      let y = cb.y0 + settle;
      if (vol > 0) y = Math.min(y, surfY - 26 + cb.i * 26 + (stirOn ? Math.sin(ph + cb.i * 2) * 6 : 0));
      const cx = cb.x + (stirOn ? Math.cos(ph + cb.i * 2.1) * 28 * stirOn : 0);
      x.save(); x.translate(cx, y); x.rotate((cb.r + (stirOn ? Math.sin(ph + cb.i) * 8 : 0)) * Math.PI / 180);
      const s = 92;
      x.fillStyle = "rgba(255,255,255,.34)"; x.strokeStyle = "rgba(255,255,255,.85)"; x.lineWidth = 2.5;
      x.beginPath(); x.roundRect(-s / 2, -s / 2, s, s, 14); x.fill(); x.stroke();
      x.fillStyle = "rgba(255,255,255,.5)"; x.beginPath(); x.roundRect(-s / 2 + 10, -s / 2 + 10, s * .38, 12, 6); x.fill();
      x.strokeStyle = "rgba(120,140,150,.25)"; x.beginPath(); x.moveTo(-s / 2 + 18, s / 2 - 16); x.lineTo(s / 2 - 22, -s / 2 + 26); x.stroke();
      x.restore();
    });

    // the glass: thick walls, heavy base, two vertical highlights
    x.save();
    x.lineJoin = "round";
    x.fillStyle = "rgba(255,255,255,.16)"; x.strokeStyle = "rgba(90,80,70,.55)"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(gx - HW_T, TOP); x.lineTo(gx - HW_B, BOT); x.lineTo(gx + HW_B, BOT); x.lineTo(gx + HW_T, TOP); x.stroke();
    x.beginPath(); x.ellipse(gx, TOP, HW_T, 20, 0, 0, Math.PI * 2); x.stroke();
    x.fillStyle = "rgba(255,255,255,.28)";
    x.beginPath(); x.moveTo(gx - HW_B + 4, inBot); x.lineTo(gx + HW_B - 4, inBot); x.lineTo(gx + HW_B, BOT); x.lineTo(gx - HW_B, BOT); x.closePath(); x.fill();
    x.strokeStyle = "rgba(90,80,70,.3)"; x.beginPath(); x.ellipse(gx, inBot, HW_B - 6, 14, 0, 0, Math.PI); x.stroke();
    const hl = (dx, w, al) => { x.fillStyle = `rgba(255,255,255,${al})`; x.beginPath(); x.moveTo(gx + dx * HW_T, TOP + 22); x.lineTo(gx + dx * HW_T + w, TOP + 22); x.lineTo(gx + dx * HW_B + w, BOT - 12); x.lineTo(gx + dx * HW_B, BOT - 12); x.fill(); };
    hl(-.86, 16, .55); hl(-.7, 5, .4); hl(.74, 9, .35);
    // finish: a single specular sweep across the glass
    const sw = seg(t, BAR * 11 + 1.2, BAR * 11 + 2.6);
    if (sw > 0 && sw < 1) { const sx = lerp(-1.2, 1.2, M.cubicIO(sw)); x.fillStyle = "rgba(255,255,255,.35)"; x.beginPath(); x.moveTo(gx + sx * HW_T - 10, TOP); x.lineTo(gx + sx * HW_T + 30, TOP); x.lineTo(gx + sx * HW_B + 10, BOT); x.lineTo(gx + sx * HW_B - 30, BOT); x.fill(); }
    x.restore();

    // jigger + pour stream for each liquid
    liq.forEach((s) => {
      const tilt = expo(seg(t, s.t0, s.t0 + .45)) * (1 - expoIO(seg(t, s.t1 - .45, s.t1 - .05)));
      const vis = t > s.t0 - .4 && t < s.t1 + .2;
      if (!vis) return;
      const enter = expo(seg(t, s.t0 - .4, s.t0)) * (1 - expo(seg(t, s.t1 - .1, s.t1 + .2)));
      const jx = gx + 95, jy = lerp(-160, 170, enter);
      const ang = tilt * 1.9;
      x.save(); x.translate(jx, jy); x.rotate(-ang);
      const met = x.createLinearGradient(-40, 0, 40, 0); met.addColorStop(0, "#8d8f93"); met.addColorStop(.35, "#f4f4f2"); met.addColorStop(.6, "#b9bbbe"); met.addColorStop(1, "#6d6f73");
      x.fillStyle = met;
      x.beginPath(); x.moveTo(-42, -70); x.lineTo(42, -70); x.lineTo(10, 0); x.lineTo(42, 60); x.lineTo(-42, 60); x.lineTo(-10, 0); x.closePath(); x.fill();
      x.fillStyle = `rgba(${s.col.slice(0, 3).join(",")},${Math.max(.5, s.col[3])})`;
      x.beginPath(); x.ellipse(0, -68, 40, 7, 0, 0, Math.PI * 2); x.fill();
      x.restore();
      // stream from the lip to the surface
      const pourA = s.t0 + .35, pourB = s.t1 - .35;
      if (t > pourA && t < pourB + .35) {
        const lipX = jx - Math.sin(ang) * 70 - 30, lipY = jy - Math.cos(ang) * 70 + 10;
        const head = clamp((t - pourA) / .25), tail = clamp((t - pourB) / .3);
        const y0 = lerp(lipY, surfY, tail * tail), y1 = lerp(lipY, surfY, head * head);
        const xs = lipX - 34;
        x.fillStyle = `rgba(${s.col.slice(0, 3).join(",")},${Math.max(.55, s.col[3])})`;
        x.beginPath();
        const w0 = 9, w1 = 6;
        x.moveTo(xs - w0, y0); x.quadraticCurveTo(xs - 6, (y0 + y1) / 2, xs - w1, y1); x.lineTo(xs + w1, y1); x.quadraticCurveTo(xs + 8, (y0 + y1) / 2, xs + w0, y0); x.fill();
        x.fillStyle = "rgba(255,255,255,.45)"; x.fillRect(xs - 2, y0, 2.5, Math.max(0, y1 - y0));
        // ripple rings at the impact point
        if (head >= 1 && tail < 1) for (let k = 0; k < 2; k++) { const ph2 = ((t * 2.2 + k * .5) % 1); x.strokeStyle = `rgba(255,255,255,${.5 * (1 - ph2)})`; x.lineWidth = 2; x.beginPath(); x.ellipse(xs, surfY, 14 + ph2 * 60, 4 + ph2 * 8, 0, 0, Math.PI * 2); x.stroke(); }
      }
    });

    // bar spoon while stirring
    if (stirOn > 0) {
      const sx = gx + Math.cos(ph) * 55 * stirOn, enter = expo(seg(t, stir.t0, stir.t0 + .5)) * (1 - expoIO(seg(t, stir.t1 - .5, stir.t1)));
      const y1 = lerp(-40, surfY + 60, enter);
      x.strokeStyle = "#a8aaad"; x.lineWidth = 7; x.beginPath(); x.moveTo(sx + 40, y1 - 560); x.lineTo(sx, y1); x.stroke();
      x.strokeStyle = "rgba(255,255,255,.8)"; x.lineWidth = 2; x.setLineDash([6, 8]); x.lineDashOffset = -ph * 20; x.beginPath(); x.moveTo(sx + 40, y1 - 560); x.lineTo(sx, y1); x.stroke(); x.setLineDash([]);
    }

    // cocoa dust: a pinch falls and settles on the surface
    const pe = STEPS[5];
    if (t > pe.t0) {
      for (let k = 0; k < 90; k++) { const h = M.hash(k), h2 = M.hash(k + 50); const fall = clamp((t - pe.t0 - h * .8) / .7); if (fall <= 0) continue; const px = gx + (h2 - .5) * 180 * (.3 + fall * .7), py = lerp(TOP - 300, surfY - 4 + (h - .5) * 18, fall * fall); x.fillStyle = `rgba(92,52,28,${.85})`; x.beginPath(); x.arc(px, py, 2.6, 0, 7); x.fill(); }
    }
    x.restore();

    // ---- labels: the current step big, done steps listed above
    const cur = STEPS.findIndex((s) => t >= s.t0 && t < s.t1);
    const fin = seg(t, BAR * 11, BAR * 11 + .8);
    if (cur >= 0) {
      const s = STEPS[cur];
      const inK = expo(seg(t, s.t0, s.t0 + .45)), outK = M.expoIn(seg(t, s.t1 - .3, s.t1));
      P.bigNum.textContent = s.amt; P.bigUnit.textContent = s.unit; P.bigName.textContent = s.name;
      const nw = M.measure(s.amt, "800 150px I8") * .97 + 6;
      M.X(P.bigNum, 0, (1 - inK) * 170 - outK * 170);
      M.X(P.bigUnit, nw + 14, 26 + (1 - inK) * 200 - outK * 200);
      M.X(P.bigName, 0, (1 - expo(seg(t, s.t0 + .1, s.t0 + .55))) * 120 - outK * 120);
      M.show(P.big, true);
    } else M.show(P.big, false);
    P.list.forEach((li, i) => {
      const s = STEPS[i], k = expo(seg(t, s.t1 - .2, s.t1 + .3));
      M.show(li, t > s.t1 - .2);
      M.X(li, 0, 300 + i * 46 + (1 - k) * 30);
      li.style.opacity = k * (1 - fin);
    });
    // live measure beside the glass (only while pouring)
    const pouring = liq.find((s) => t > s.t0 + .5 && t < s.t1);
    if (pouring && vol > 0) {
      M.show(P.meas, true); P.meas.textContent = Math.round(vol) + " ml";
      M.X(P.meas, 130, (surfY - CY) * CS + CY - 12);
    } else M.show(P.meas, false);
    // title: on at the start, back for the finish
    const tIn = expo(seg(t, .3, 1)) * (1 - M.expoIn(seg(t, BAR - .4, BAR)));
    const tFin = expo(seg(t, BAR * 11 + .6, BAR * 11 + 1.4));
    const tk = Math.max(tIn, tFin);
    P.title.style.opacity = tk; P.sub.style.opacity = tk;
    M.X(P.title, 0, (1 - tk) * 40); M.X(P.sub, 0, (1 - tk) * 30);
    P.sub.textContent = tFin > 0 ? "50 · 20 · 30 ml — cream floated, stirred once" : "Vodka · coffee · cream — on the rocks";
  },
  sound(A, M) {
    // light music: soft pulse, pad chords, a plucked line; foley on each step
    const chords = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
    for (let b = 0; b < 12.5; b++) { const ch = chords[b % 4]; A.pad(b * BAR, ch.map(A.midi), BAR + .2, .028); A.bass(b * BAR, A.midi(ch[0] - 12), .5, .18); A.bass(b * BAR + 2 * B, A.midi(ch[0] - 12), .4, .12); }
    for (let k = 0; k < 50; k++) { const t0 = k * B; A.kick(t0, .35); A.hat(t0 + B / 2, .05); if (k % 2 === 0) A.pluck(t0 + B * .5, A.midi([69, 72, 76, 74][(k / 2) % 4]), .07, .5); }
    // ice clinks
    [0, 1, 2].forEach((i) => { const t0 = BAR + i * B + .25; A.tone(t0, 2900 + i * 300, .25, "sine", .12); A.tone(t0, 4100 + i * 200, .18, "sine", .07); });
    // pours: filtered noise with a gurgle
    STEPS.filter((s) => s.vol).forEach((s) => { const a = s.t0 + .35, d = s.t1 - .35 - a; const b = A.ctx.createBufferSource(); b.buffer = A.noise; b.loop = true; const f = A.ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(1400, a); f.frequency.linearRampToValueAtTime(700, a + d); f.Q.value = 1.4; const g = A.ctx.createGain(); g.gain.setValueAtTime(.0001, a); g.gain.linearRampToValueAtTime(.16, a + .15); g.gain.setValueAtTime(.16, a + d - .1); g.gain.linearRampToValueAtTime(.0001, a + d + .2); b.connect(f).connect(g).connect(A.out); b.start(a); b.stop(a + d + .25); });
    // stir: soft clinks of ice on the beat
    for (let k = 0; k < 8; k++) A.tone(BAR * 8 + .4 + k * B, 3300 + (k % 3) * 250, .15, "sine", .06);
    A.whoosh(BAR * 10, .4, .12); A.click(BAR * 10 + .55, .1);
    A.tone(BAR * 11 + 1.3, 1760, 1.6, "sine", .06); A.tone(BAR * 11 + 1.3, 2637, 1.4, "sine", .04);
  },
});
</script></body></html>

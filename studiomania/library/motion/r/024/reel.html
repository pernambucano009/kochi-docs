<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #24 Four seasons train window — 30 s, Grand Budapest Hotel look: symmetric carriage, pastel, flat theatrical layers.
// Moments (7.5 s each): spring → (a dense wood passes) → summer → (a tunnel) → autumn → (snow + dusk) → winter.
// One thing changes at a time; the flower in the vase and the coffee carry the story.
const W = 1920, H = 1080;
const WX = 560, WY = 210, WW = 800, WH = 470;   // the window
const SEASONS = [
  { sky: ["#f7d6d9", "#f9e4e3"], far: "#b9c4d8", hill: "#a8cfa0", hill2: "#93c08e", tree: "#f2a7bd", trunk: "#8a5a4b", ground: "#c9e0b0", sun: "#fff2c4" },
  { sky: ["#bfe0f0", "#d8eef6"], far: "#9fb6cf", hill: "#e9d27a", hill2: "#d9bf5e", tree: "#6fa56a", trunk: "#7a5236", ground: "#f0de8c", sun: "#fff6d2" },
  { sky: ["#f6dcc0", "#f9e8d5"], far: "#c4aeb2", hill: "#d9925a", hill2: "#c8794a", tree: "#e07a3a", trunk: "#6b4130", ground: "#dfae74", sun: "#ffe3b8" },
  { sky: ["#8e9cc0", "#a9b5d2"], far: "#c9d1e3", hill: "#eef1f6", hill2: "#e1e6ef", tree: "#e9eef5", trunk: "#5b4a4a", ground: "#f4f6fa", sun: "#f3efe0" },
];
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",")})`; };
M.reel({
  W, H, DUR: 30, bg: "#f2c4c0",
  fonts: { PF: ["Playfair_Display_ital_wght_1_500.ttf", "500", "italic"] },
  init(M) { const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, smooth, hash, noise1 } = M;
    // season index as a continuous value; each change happens inside a transition window
    const sv = smooth(seg(t, 6.6, 8.4)) + smooth(seg(t, 14.6, 15.6)) + smooth(seg(t, 21.2, 23.6));
    const si = Math.min(2, Math.floor(sv)), sk = sv - si;
    const pal = (key) => mixc(SEASONS[si][key], SEASONS[Math.min(3, si + 1)][key], sk);
    const dusk = smooth(seg(t, 21.5, 25));   // winter evening: room lamps come on
    // ---- slow steady camera push, perfectly centred
    const z = 1 + .055 * (t / 30);
    x.setTransform(z, 0, 0, z, 960 * (1 - z), 540 * (1 - z));

    // ================= OUTSIDE (clipped to the window)
    x.save();
    x.beginPath(); x.roundRect(WX, WY, WW, WH, [70, 70, 8, 8]); x.clip();
    // sky in flat bands
    x.fillStyle = mixc(SEASONS[si].sky[0], SEASONS[Math.min(3, si + 1)].sky[0], sk); x.fillRect(WX, WY, WW, WH);
    x.fillStyle = mixc(SEASONS[si].sky[1], SEASONS[Math.min(3, si + 1)].sky[1], sk); x.fillRect(WX, WY + 230, WW, 200);
    // sun (moon-pale in winter dusk)
    x.fillStyle = pal("sun"); x.beginPath(); x.arc(WX + 560, WY + 120 + dusk * 60, 46, 0, 7); x.fill();
    const layer = (speed, baseY, amp, freq, col, seed) => {
      const off = t * speed;
      x.fillStyle = col; x.beginPath(); x.moveTo(WX, WY + WH);
      for (let px = 0; px <= WW + 20; px += 10) { const wx = (px + off) / freq; x.lineTo(WX + px, WY + baseY + noise1(wx + seed) * amp + noise1(wx * 2.3 + seed) * amp * .35); }
      x.lineTo(WX + WW, WY + WH); x.fill();
    };
    layer(18, 250, 60, 260, pal("far"), 3);
    layer(60, 320, 30, 200, pal("hill"), 11);
    layer(110, 360, 18, 160, pal("hill2"), 23);
    // lollipop trees, flat and round (spaced by hashed slots)
    const TS = 230, toff = t * TS, slot0 = Math.floor(toff / 140) - 1;
    for (let k = slot0; k < slot0 + 9; k++) {
      if (hash(k) < .25) continue;
      const tx = WX + k * 140 - toff + hash(k * 3) * 60, ty = WY + 370, r = 34 + hash(k * 7) * 26;
      x.fillStyle = pal("trunk"); x.fillRect(tx - 5, ty - 10, 10, 60);
      x.fillStyle = pal("tree"); x.beginPath(); x.arc(tx, ty - r - 4, r, 0, 7); x.fill();
      if (sv > 2.6) { x.fillStyle = "#ffffff"; x.beginPath(); x.arc(tx, ty - r - 4, r, Math.PI * 1.05, Math.PI * 1.95); x.fill(); }
    }
    x.fillStyle = pal("ground"); x.fillRect(WX, WY + 410, WW, 60);
    // transition 1: a dense wood rushes past the window (spring → summer)
    const wood = seg(t, 6.2, 8.8);
    if (wood > 0 && wood < 1) {
      const dens = Math.sin(wood * Math.PI);
      for (let k = 0; k < 26; k++) { const px = WX + ((k * 97 - t * 1400) % 1100 + 1100) % 1100 - 150; if (hash(k) > dens) continue; x.fillStyle = k % 2 ? "#3e6b4a" : "#4f7d55"; x.fillRect(px, WY, 60 + hash(k + 5) * 80, WH); }
    }
    // telegraph poles + sagging wires (nearest layer)
    const PS = 900, poff = t * PS;
    x.strokeStyle = "#5b4a4a"; x.lineWidth = 2;
    for (let k = Math.floor(poff / 520) - 1; k < Math.floor(poff / 520) + 3; k++) {
      const pxp = WX + k * 520 - poff;
      x.fillStyle = "#6b5550"; x.fillRect(pxp, WY + 90, 12, 400); x.fillRect(pxp - 30, WY + 110, 72, 8);
      x.beginPath(); x.moveTo(pxp + 6, WY + 112); x.quadraticCurveTo(pxp + 266, WY + 170, pxp + 526, WY + 112); x.stroke();
    }
    // weather in front: petals (spring), leaves (autumn), snow (winter)
    const weather = (count, col, size, fall, drift, op) => {
      if (op <= 0) return;
      x.fillStyle = col; x.globalAlpha = op;
      for (let i = 0; i < count; i++) {
        const sx = ((hash(i) * WW - t * drift * (0.6 + hash(i + 9))) % WW + WW) % WW, sy = ((hash(i * 2) * WH + t * fall * (0.6 + hash(i + 4))) % WH);
        x.beginPath(); x.ellipse(WX + sx, WY + sy, size * (0.7 + hash(i + 1) * .6), size * .55, t + i, 0, 7); x.fill();
      }
      x.globalAlpha = 1;
    };
    weather(26, "#f6b9c9", 7, 40, 260, clamp(1 - sv * 1.5));
    weather(30, "#d9692e", 9, 70, 420, clamp(1 - Math.abs(sv - 2) * 1.6) * (t > 15 ? 1 : 0));
    weather(90, "#ffffff", 4, 90, 300, smooth(seg(t, 21, 24)));
    // transition 2: the tunnel (summer → autumn)
    const tun = seg(t, 13.8, 16.4);
    if (tun > 0 && tun < 1) {
      const enter = clamp((t - 13.8) * 1.8), exit = clamp((t - 15.6) * 1.8);
      const l = WX + WW * (1 - enter), r = WX + WW * (1 - exit);
      x.fillStyle = "#2c2430"; x.fillRect(Math.min(l, WX + WW), WY, Math.max(0, r - l + (exit > 0 ? 0 : WW)), WH);
      if (enter >= 1 && exit <= 0) x.fillRect(WX, WY, WW, WH);
      // tunnel lamps flicking past
      for (let k = 0; k < 6; k++) { const lx = WX + ((k * 160 - t * 1600) % 960 + 960) % 960 - 80; x.fillStyle = "#f6d68a"; if (lx > l && lx < r + WW) x.fillRect(lx, WY + 60, 40, 12); }
    }
    // dusk tint over the landscape, as a flat layer
    if (dusk > 0) { x.fillStyle = `rgba(70,70,120,${.32 * dusk})`; x.fillRect(WX, WY, WW, WH); }
    // frost in the corners for winter
    if (sv > 2.7) { x.fillStyle = `rgba(255,255,255,${.6 * smooth(seg(sv, 2.7, 3))})`; [[WX, WY + WH], [WX + WW, WY + WH]].forEach(([cx, cy]) => { x.beginPath(); x.arc(cx, cy, 120, 0, 7); x.fill(); }); }
    x.restore();

    // ================= INSIDE: walls, trims, curtains (symmetric)
    const wall = mixc("#f2c4c0", "#f0b9a4", dusk);
    x.fillStyle = wall;
    x.beginPath(); x.rect(-100, -100, W + 200, H + 200); x.roundRect(WX, WY, WW, WH, [70, 70, 8, 8]); x.fill("evenodd");
    // window frame
    x.strokeStyle = "#c06b78"; x.lineWidth = 22; x.beginPath(); x.roundRect(WX - 11, WY - 11, WW + 22, WH + 22, [80, 80, 14, 14]); x.stroke();
    x.strokeStyle = "#e9d6a8"; x.lineWidth = 4; x.beginPath(); x.roundRect(WX - 26, WY - 26, WW + 52, WH + 52, [92, 92, 22, 22]); x.stroke();
    x.fillStyle = "#c06b78"; x.fillRect(WX + WW / 2 - 6, WY, 12, WH);   // mullion
    // ceiling band with a repeating ornament
    x.fillStyle = "#c06b78"; x.fillRect(-100, 0, W + 200, 96);
    x.fillStyle = "#e9d6a8"; for (let k = 0; k < 24; k++) { x.beginPath(); x.arc(k * 84 + 18, 70, 12, 0, Math.PI); x.fill(); }
    // brass luggage rack
    x.strokeStyle = "#d4a94f"; x.lineWidth = 6; x.beginPath(); x.moveTo(380, 150); x.lineTo(1540, 150); x.moveTo(380, 172); x.lineTo(1540, 172); x.stroke();
    // a hat box and a suitcase on the rack, mirrored colours
    x.fillStyle = "#7fb2b0"; x.fillRect(470, 92, 160, 56); x.fillStyle = "#e9d6a8"; x.fillRect(470, 112, 160, 8);
    x.fillStyle = "#7fb2b0"; x.fillRect(1290, 92, 160, 56); x.fillStyle = "#e9d6a8"; x.fillRect(1290, 112, 160, 8);
    // curtains, tied back
    for (const s of [-1, 1]) {
      const cx = 960 + s * (WW / 2 + 60);
      // a drape gathered at a tie-back; drawn once and mirrored, so the frame stays symmetric
      x.save(); x.translate(cx, 0); x.scale(-s, 1);
      x.fillStyle = "#8e2a3a";
      x.beginPath(); x.moveTo(-60, WY - 40); x.lineTo(80, WY - 40);
      x.quadraticCurveTo(10, WY + 180, 20, WY + 296);
      x.quadraticCurveTo(40, WY + 420, 90, WY + 530); x.lineTo(-60, WY + 530); x.closePath(); x.fill();
      x.fillStyle = "#7a2231"; x.beginPath(); x.moveTo(-20, WY - 40); x.quadraticCurveTo(0, WY + 150, 4, WY + 296); x.quadraticCurveTo(10, WY + 420, 30, WY + 530); x.lineTo(14, WY + 530); x.quadraticCurveTo(-6, WY + 420, -10, WY + 296); x.quadraticCurveTo(-14, WY + 150, -32, WY - 40); x.fill();
      x.restore();
      x.fillStyle = "#d4a94f"; x.fillRect(cx - 50, WY + 290, 100, 14);
    }
    // seat backs, left and right
    for (const s of [-1, 1]) {
      const cx = 960 + s * 760;
      x.fillStyle = "#8e2a3a"; x.beginPath(); x.roundRect(cx - 260, 300, 520, 640, 60); x.fill();
      x.fillStyle = "#a63b4c"; for (let k = 0; k < 3; k++) { x.beginPath(); x.roundRect(cx - 210 + k * 140, 340, 120, 520, 40); x.fill(); }
      x.fillStyle = "#e9d6a8"; x.fillRect(cx - 200, 300, 400, 30);   // lace antimacassar
    }
    // wall lamps (symmetric); lit at dusk as flat pools of light
    for (const s of [-1, 1]) {
      const lx = 960 + s * 520;
      if (dusk > 0) { x.fillStyle = `rgba(255,226,170,${.45 * dusk})`; x.beginPath(); x.moveTo(lx - 20, 330); x.lineTo(lx + 20, 330); x.lineTo(lx + 120, 700); x.lineTo(lx - 120, 700); x.fill(); }
      x.fillStyle = "#d4a94f"; x.fillRect(lx - 4, 330, 8, 60);
      x.fillStyle = mixc("#f6b0b8", "#ffe2b0", dusk); x.beginPath(); x.moveTo(lx - 40, 330); x.lineTo(lx + 40, 330); x.lineTo(lx + 26, 280); x.lineTo(lx - 26, 280); x.fill();
    }
    // the table with its scalloped cloth
    x.fillStyle = "#6b3a2e"; x.fillRect(640, 740, 640, 340);
    x.fillStyle = "#fbf6ee"; x.fillRect(600, 700, 720, 120);
    for (let k = 0; k < 12; k++) { x.beginPath(); x.arc(630 + k * 60, 820, 30, 0, Math.PI); x.fill(); }
    // vase with the season's flower (centre-left), cup (centre-right): the table stays symmetric-ish
    const vx = 830, cy = 700;
    x.fillStyle = "#7fb2b0"; x.beginPath(); x.moveTo(vx - 24, cy); x.quadraticCurveTo(vx - 40, cy - 60, vx - 12, cy - 90); x.lineTo(vx + 12, cy - 90); x.quadraticCurveTo(vx + 40, cy - 60, vx + 24, cy); x.fill();
    x.strokeStyle = "#5c8a4e"; x.lineWidth = 4; x.beginPath(); x.moveTo(vx, cy - 90); x.lineTo(vx, cy - 190); x.stroke();
    const fl = Math.round(sv);
    if (fl === 0) { x.fillStyle = "#e86f8c"; x.beginPath(); x.moveTo(vx - 22, cy - 190); x.lineTo(vx - 14, cy - 230); x.lineTo(vx, cy - 205); x.lineTo(vx + 14, cy - 230); x.lineTo(vx + 22, cy - 190); x.quadraticCurveTo(vx, cy - 170, vx - 22, cy - 190); x.fill(); }   // tulip
    if (fl === 1) { x.fillStyle = "#f2c230"; for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; x.beginPath(); x.ellipse(vx + Math.cos(a) * 26, cy - 205 + Math.sin(a) * 26, 14, 6, a, 0, 7); x.fill(); } x.fillStyle = "#6b4130"; x.beginPath(); x.arc(vx, cy - 205, 16, 0, 7); x.fill(); }   // sunflower
    if (fl === 2) { x.fillStyle = "#d9692e"; for (const [dx, dy] of [[-26, -200], [22, -215], [0, -235]]) { x.beginPath(); for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2, r = k % 2 ? 9 : 22; x.lineTo(vx + dx + Math.cos(a) * r, cy + dy + Math.sin(a) * r); } x.fill(); } }   // maple leaves
    if (fl === 3) { x.strokeStyle = "#3f6b4a"; x.lineWidth = 3; for (let k = 0; k < 8; k++) { const yy = cy - 120 - k * 12; x.beginPath(); x.moveTo(vx, yy); x.lineTo(vx - 26 + k * 2, yy + 14); x.moveTo(vx, yy); x.lineTo(vx + 26 - k * 2, yy + 14); x.stroke(); } x.fillStyle = "#c0392b"; x.beginPath(); x.arc(vx + 10, cy - 150, 7, 0, 7); x.arc(vx - 8, cy - 170, 6, 0, 7); x.fill(); }   // pine sprig + berries
    // book appears in autumn (passed in the tunnel)
    if (sv > 1.5) { x.fillStyle = "#3d5a80"; x.fillRect(1180, cy - 34, 110, 30); x.fillStyle = "#e9d6a8"; x.fillRect(1180, cy - 30, 110, 4); }
    // cup + saucer + coffee level + steam
    const ccx = 1070;
    x.fillStyle = "#ffffff"; x.beginPath(); x.ellipse(ccx, cy - 4, 70, 14, 0, 0, 7); x.fill();
    x.fillStyle = "#ffffff"; x.beginPath(); x.moveTo(ccx - 46, cy - 70); x.lineTo(ccx + 46, cy - 70); x.quadraticCurveTo(ccx + 44, cy - 10, ccx, cy - 10); x.quadraticCurveTo(ccx - 44, cy - 10, ccx - 46, cy - 70); x.fill();
    x.strokeStyle = "#ffffff"; x.lineWidth = 9; x.beginPath(); x.arc(ccx + 52, cy - 46, 16, -1.2, 1.4); x.stroke();
    x.strokeStyle = "#c06b78"; x.lineWidth = 3; x.beginPath(); x.moveTo(ccx - 44, cy - 58); x.lineTo(ccx + 44, cy - 58); x.stroke();
    const level = [1, .7, .4, 1][fl];
    x.fillStyle = "#6b3f2a"; x.beginPath(); x.ellipse(ccx, cy - 70 + (1 - level) * 14, 44, 8 * level + 2, 0, 0, 7); x.fill();
    const steam = [1, .5, .7, 1.3][fl];
    x.strokeStyle = `rgba(255,255,255,${.75})`; x.lineWidth = 4; x.lineCap = "round";
    for (let k = 0; k < 3; k++) { x.beginPath(); for (let j = 0; j <= 16; j++) { const yy = cy - 86 - j * 8 * steam, xx = ccx - 18 + k * 18 + Math.sin(j * .55 + t * 2.2 + k * 2) * (4 + j * .7); if (j === 0) x.moveTo(xx, yy); else x.lineTo(xx, yy); } x.globalAlpha = .7; x.stroke(); x.globalAlpha = 1; }
    // carpet
    x.fillStyle = "#7a2f3d"; x.fillRect(-100, 1000, W + 200, 200);
    x.fillStyle = "#c06b78"; for (let k = 0; k < 30; k++) { x.beginPath(); x.moveTo(k * 70, 1040); x.lineTo(k * 70 + 35, 1020); x.lineTo(k * 70 + 70, 1040); x.lineTo(k * 70 + 35, 1060); x.fill(); }
    // the whole carriage sways gently with the track
    // season caption: a small plaque under the window, like a hotel sign
    x.setTransform(1, 0, 0, 1, 0, 0);
    const names = ["Spring", "Summer", "Autumn", "Winter"], nm = names[fl];
    x.fillStyle = "#e9d6a8"; x.fillRect(880, 1020, 160, 44); x.fillStyle = "#8e2a3a"; x.font = "italic 500 30px PF"; x.textAlign = "center"; x.fillText(nm, 960, 1052); x.textAlign = "left";
  },
  sound(A) {
    const m = A.midi;
    // the track: ta-dum every .9 s, a low rumble under everything
    for (let t0 = .2; t0 < 30; t0 += .9) { A.nz(t0, .07, "bandpass", 900, .12); A.nz(t0 + .16, .07, "bandpass", 700, .1); }
    { const b = A.ctx.createBufferSource(); b.buffer = A.noise; b.loop = true; const f = A.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 180; const g = A.ctx.createGain(); g.gain.value = .25; g.gain.setValueAtTime(.25, 13.8); g.gain.linearRampToValueAtTime(.55, 14.2); g.gain.setValueAtTime(.55, 15.6); g.gain.linearRampToValueAtTime(.25, 16.2); b.connect(f).connect(g).connect(A.out); b.start(0); b.stop(30); }
    A.whoosh(6.4, 2, .1); A.whoosh(13.7, .8, .2); A.whoosh(15.6, .8, .2);
    // a quiet music box line, changing chord per season
    const ch = [[67, 71, 74], [69, 72, 76], [64, 67, 71], [62, 66, 69]];
    for (let s = 0; s < 4; s++) { A.pad(s * 7.5, ch[s].map((n) => m(n - 12)), 7.7, .025); for (let k = 0; k < 10; k++) A.tone(s * 7.5 + .3 + k * .72, m(ch[s][k % 3] + 12), 1.2, "sine", .035); }
    // season sounds: birds, cicadas, wind, chimes
    for (let k = 0; k < 8; k++) { const t0 = .6 + k * .8; A.tone(t0, 3200 + (k % 3) * 400, .08, "sine", .03); A.tone(t0 + .1, 3800, .06, "sine", .025); }
    for (let k = 0; k < 6; k++) A.nz(8 + k * 1.1, .6, "bandpass", 6000, .03, 8);
    A.whoosh(16.5, 2.5, .08); A.whoosh(19.5, 2.5, .08);
    for (let k = 0; k < 7; k++) A.tone(23 + k * .9, m(84 + [0, 3, 7, 10][k % 4]), 1.5, "sine", .03);
  },
});
</script></body></html>

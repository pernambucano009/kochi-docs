<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #117 Chuseok, pixel art on a strict 320×180 grid (scaled ×6). 15 s, 120 BPM.
// Concept: "One full moon, filled like a plate of songpyeon." Navy night, moon cream, persimmon + black/white.
// 0–2 the harvest moon rises ring by ring · 2–4 추석 / CHUSEOK drops in, a glyph per beat · 4–6 moon → half moon → songpyeon on pine needles (morph)
// 6–8 the plate extrudes into an isometric hometown house (2D→3D) · 8–10 UI: the trip home, a road meter filling day by day
// 10–12 ganggangsullae — a ring of dancers circling under the moon · 12–14 strongest: wishes land one per beat on the full moon
// 14–15 end title → the small rising moon of frame one.
const PW = 320, PH = 180, SC = 6, B = .5;
const NAVY = "#14183a", MOON = "#f6e7b8", PERS = "#f07d3a", INK = "#0a0a0a", WHITE = "#ffffff";
M.reel({
  W: 1920, H: 1080, DUR: 15, bg: NAVY,
  fonts: { PX: "Silkscreen_400.woff2" },
  init(M) {
    const c = M.canvas(1920, 1080); const big = c.getContext("2d"); big.imageSmoothingEnabled = false;
    const lo = document.createElement("canvas"); lo.width = PW; lo.height = PH; const x = lo.getContext("2d");
    return { big, lo, x };
  },
  seek(t, P, M) {
    const { x, big, lo } = P, { seg, lerp, expo, expoIO, spring, clamp } = M;
    const beat = Math.floor(t / B), bt = t - beat * B, pulse = 1 - spring(bt, 16);
    const I = Math.round;
    x.fillStyle = NAVY; x.fillRect(0, 0, PW, PH);
    // stars on the grid
    for (let i = 0; i < 40; i++) { const sx = I(M.hash(i) * PW), sy = I(M.hash(i + 9) * 110); if ((Math.floor(t * 4) + i) % 9) { x.fillStyle = i % 5 ? "#5a6390" : WHITE; x.fillRect(sx, sy, 1, 1); } }
    const disc = (cx, cy, r, col) => { x.fillStyle = col; for (let yy = -r; yy <= r; yy++) { const w = Math.floor(Math.sqrt(r * r - yy * yy)); x.fillRect(I(cx - w), I(cy + yy), w * 2 + 1, 1); } };
    const txt = (s, px, X, Y, col, al = "center", font = "PX") => { x.font = `${px}px ${font}`; x.fillStyle = col; x.textAlign = al; x.textBaseline = "middle"; x.fillText(s, I(X), I(Y)); };
    const ground = () => { x.fillStyle = "#0e1230"; x.fillRect(0, 150, PW, 30); x.fillStyle = "#22284f"; for (let i = 0; i < PW; i += 8) x.fillRect(i, 150 + (i / 8 % 2), 6, 1); };
    // ---------- 0–2: the moon rises in pixel rings, one ring per beat
    if (t < 2.1) { ground(); const r = clamp(4 + beat * 7 + I(expo(bt / .3) * 7), 4, 30); disc(160, lerp(140, 70, expo(seg(t, 0, 2))), r, MOON); }
    // ---------- 2–4: 추석 / CHUSEOK, one glyph per beat
    if (t >= 2 && t < 4.2) {
      disc(250, 46, 22, MOON); ground();
      const ko = ["추", "석"]; ko.forEach((g, i) => { const k = expo(seg(t, 2 + i * B, 2.25 + i * B)); if (k > 0) txt(g, 44, 100 + i * 52, lerp(-20, 74, k), MOON, "center", "'WenQuanYi Zen Hei'"); });
      const en = "CHUSEOK"; [...en].forEach((g, i) => { const k = expo(seg(t, 3 + i * .12, 3.2 + i * .12)); if (k > 0) txt(g, 16, 72 + i * 15, lerp(200, 122, k), PERS); });
    }
    // ---------- 4–6: moon → half moon → songpyeon (three colours) resting on pine needles
    if (t >= 4 && t < 6.2) {
      ground();
      const half = expoIO(seg(t, 4.1, 4.5)), cakes = expo(seg(t, 4.7, 5.2));
      // pine needles bed
      x.fillStyle = "#2f5a3a"; for (let i = 0; i < 60; i++) x.fillRect(90 + (i * 7) % 140, 128 + (i % 3), 6, 1);
      // the big moon flattens to a half moon (bottom cut away row by row)
      const cy = lerp(70, 112, half), r = I(lerp(30, 22, half));
      x.fillStyle = MOON; for (let yy = -r; yy <= r; yy++) { if (yy > 0 && yy > r * (1 - half)) continue; const w = Math.floor(Math.sqrt(r * r - yy * yy)); x.fillRect(I(160 - w), I(cy + yy), w * 2 + 1, 1); }
      // then it splits into three half-moon rice cakes (pink, white, green)
      if (cakes > 0) [[-50, "#f2a6b8"], [0, "#f5efe0"], [50, "#9cc98a"]].forEach(([dx, col], i) => { const X = 160 + dx * cakes, Y = 118; x.fillStyle = col; for (let yy = -10; yy <= 0; yy++) { const w = Math.floor(Math.sqrt(100 - yy * yy) * 1.5); x.fillRect(I(X - w), I(Y + yy), w * 2 + 1, 1); } x.fillStyle = "rgba(0,0,0,.25)"; x.fillRect(I(X - 10), Y, 21, 1); });
      if (cakes > .5) txt("SONGPYEON", 12, 160, 160, MOON);
    }
    // ---------- 6–8: 2D→3D — the plate rises into an isometric hometown house, built layer by layer
    if (t >= 6 && t < 8.2) {
      ground();
      const h = expo(seg(t, 6.1, 7.0)), roof = expo(seg(t, 7.0, 7.5));
      const iso = (ix, iy, iz) => [160 + (ix - iy) * 6, 118 + (ix + iy) * 3 - iz];
      const poly = (pts, col) => { x.fillStyle = col; x.beginPath(); pts.forEach(([X, Y], k) => (k ? x.lineTo(I(X), I(Y)) : x.moveTo(I(X), I(Y)))); x.closePath(); x.fill(); };
      const box = (w, d, hh, col1, col2, col3) => {
        const A = iso(0, 0, 0), Bq = iso(w, 0, 0), C = iso(w, d, 0), D = iso(0, d, 0), up = (p) => [p[0], p[1] - hh];
        poly([D, C, up(C), up(D)], col1); poly([Bq, C, up(C), up(Bq)], col2); poly([up(A), up(Bq), up(C), up(D)], col3);
      };
      const HH = I(40 * h); box(12, 10, HH, "#d9c9a3", "#b8a27a", "#efe2c2");
      if (roof > 0) { const lift = 18 * roof, A = iso(-1, -1, HH), Bq = iso(13, -1, HH), C = iso(13, 11, HH), D = iso(-1, 11, HH), R1 = iso(3, 5, HH + lift), R2 = iso(9, 5, HH + lift);
        poly([D, C, R2, R1], "#2b2b3a"); poly([Bq, C, R2], INK); poly([A, Bq, R2, R1], "#3a3a4c"); }
      x.fillStyle = PERS; x.fillRect(I(iso(0, 5, 0)[0]) + 6, I(iso(0, 5, HH * .6)[1]), 4, 6);   // a lit window
      disc(260, 40, 16, MOON);
      txt("HOME", 14, 50, 40, MOON);
    }
    // ---------- 8–10: the trip home — a road meter filling one day per beat
    if (t >= 8 && t < 10.2) {
      x.fillStyle = "#0e1230"; x.fillRect(0, 0, PW, PH);
      txt("ROAD HOME", 14, 160, 26, MOON);
      const days = ["EVE", "DAY", "AFTER"];
      days.forEach((d, i) => { const k = expo(seg(t, 8.2 + i * B, 8.6 + i * B)); const Y = 60 + i * 34; txt(d, 10, 40, Y, WHITE, "left"); x.fillStyle = "#22284f"; x.fillRect(90, Y - 6, 180, 12); x.fillStyle = [PERS, MOON, "#9cc98a"][i]; x.fillRect(90, Y - 6, I(180 * k * [1, .7, .45][i]), 12); });
      // a tiny car drives along the bottom
      const cx = I(lerp(-20, 340, seg(t, 8, 10.2))); x.fillStyle = PERS; x.fillRect(cx, 160, 16, 6); x.fillRect(cx + 3, 156, 9, 4); x.fillStyle = INK; x.fillRect(cx + 2, 166, 3, 2); x.fillRect(cx + 11, 166, 3, 2);
    }
    // ---------- 10–12: ganggangsullae — dancers in a ring, holding hands, under the moon
    if (t >= 10 && t < 12.2) {
      ground(); disc(160, 50, 24, MOON);
      const n = 12, a0 = (t - 10) * 1.6;
      const pts = Array.from({ length: n }, (_, i) => { const a = a0 + i / n * Math.PI * 2; return { X: 160 + Math.cos(a) * 70, Y: 132 + Math.sin(a) * 12, z: Math.sin(a), i }; }).sort((p, q) => p.z - q.z);
      pts.forEach((p) => { const X = I(p.X), Y = I(p.Y); x.fillStyle = p.i % 2 ? "#e66b8a" : "#5f8fd9"; x.fillRect(X - 2, Y - 8, 5, 8); x.fillStyle = "#f2d2b0"; x.fillRect(X - 1, Y - 11, 3, 3); x.fillStyle = INK; x.fillRect(X - 1, Y - 12, 3, 1); x.fillRect(X - 2, Y, 2, 2); x.fillRect(X + 1, Y, 2, 2); });
    }
    // ---------- 12–14: strongest — the full moon fills the frame; a wish lands on each beat
    if (t >= 12 && t < 14.2) {
      const r = I(lerp(24, 70, expo(seg(t, 12, 12.4))) + pulse * 2); disc(160, 90, r, MOON);
      const wishes = ["HEALTH", "HARVEST", "FAMILY", "HOME"], k = clamp(Math.floor((t - 12) / B), 0, 3);
      txt(wishes[k], 20, 160, 90 + I((1 - expo(seg(bt, 0, .2))) * 8), NAVY);
      x.fillStyle = PERS; for (let i = 0; i < 4; i++) if (i <= k) x.fillRect(120 + i * 22, 140, 14, 4);
    }
    // ---------- 14–15: end title → the small rising moon
    if (t >= 14) {
      ground();
      if (t < 14.8) { txt("HAPPY CHUSEOK", 18, 160, 70, MOON); txt("추석 잘 보내세요", 14, 160, 98, PERS, "center", "'WenQuanYi Zen Hei'"); disc(160, 132, 6, MOON); }
      else disc(160, 140, 4, MOON);
    }
    // upscale with no smoothing: every pixel is a 6×6 block
    big.imageSmoothingEnabled = false; big.drawImage(lo, 0, 0, PW * SC, PH * SC);
  },
  sound(A) {
    const m = A.midi;
    // chiptune: square-wave melody in a pentatonic scale, a soft janggu-like drum (low tom + click)
    const pent = [62, 64, 67, 69, 71, 74, 76];
    for (let k = 0; k < 30; k++) { const t0 = k * B; A.tone(t0, 90, .15, "sine", .3); A.click(t0 + B / 2, .06); A.tone(t0, m(pent[(k * 3) % 7]), .2, "square", .04); if (k % 2) A.tone(t0 + .25, m(pent[(k * 5) % 7] + 12), .12, "square", .03); }
    for (const t0 of [2, 4, 6, 8, 10, 12, 14]) A.hit(t0, .3);
    A.pad(12, [50, 57, 62, 66].map(m), 3, .03);
  },
});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #54 Mathematics showreel — concept: "Every proof starts with a point." 20 s, 120 BPM. One typeface (Instrument Serif),
// paper, ink, red, blue. point → line → a²+b²=c² (type) → squares rearrange & a circle unrolls into π (morph)
// → square → cube → tesseract (2D→3D) → the unit circle draws a sine wave (data) → golden rectangles + Fibonacci spiral, one per beat (strongest)
// → "Q.E.D." → the point again.
const B = .5, PAPER = "#f4f1ea", INK = "#16161a", RED = "#e0442f", BLUE = "#2b59c3";
M.reel({
  W: 1920, H: 1080, DUR: 20, bg: PAPER,
  fonts: { IS: "Instrument_Serif.ttf", ISI: ["Instrument_Serif_ital_1.ttf", "400", "italic"] },
  init(M) { const c = M.canvas(1920, 1080); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, expo, expoIn, expoIO, spring, clamp } = M;
    const beat = Math.floor(t / B), bt = t - beat * B, pulse = 1 - spring(bt, 16);
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = PAPER; x.fillRect(0, 0, 1920, 1080);
    // faint graph-paper grid, always there (the camera language: everything sits on this grid)
    const z = 1 + .03 * ((t % 4) / 4); x.translate(960, 540); x.scale(z, z); x.translate(-960, -540);
    x.strokeStyle = "rgba(22,22,26,.06)"; x.lineWidth = 1; for (let i = -2; i < 34; i++) { x.beginPath(); x.moveTo(i * 60, -100); x.lineTo(i * 60, 1200); x.stroke(); } for (let j = -2; j < 20; j++) { x.beginPath(); x.moveTo(-100, j * 60); x.lineTo(2100, j * 60); x.stroke(); }
    const T = (s, px, X, Y, col, it = false, al = "center") => { x.font = `${it ? "italic " : ""}400 ${px}px ${it ? "ISI" : "IS"}`; x.fillStyle = col; x.textAlign = al; x.textBaseline = "middle"; x.fillText(s, X, Y); };
    const dot = (X, Y, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill(); };
    x.lineCap = "round"; x.lineJoin = "round";
    // ---------- 0–2 hook: a point; it stretches into a line; the line pivots into a right triangle's legs
    if (t < 2.3) {
      if (t < .5) { dot(960, 540, 10 + 4 * pulse, INK); T("·", 1, 0, 0, INK); }
      else {
        const L = expo(seg(t, .5, .9)) * 600, leg = expo(seg(t, 1, 1.4)), hyp = expo(seg(t, 1.5, 1.9));
        x.strokeStyle = INK; x.lineWidth = 8;
        x.beginPath(); x.moveTo(660, 700); x.lineTo(660 + L, 700); x.stroke();
        if (leg > 0) { x.beginPath(); x.moveTo(1260, 700); x.lineTo(1260, 700 - 450 * leg); x.stroke(); }
        if (hyp > 0) { x.strokeStyle = RED; x.beginPath(); x.moveTo(660, 700); x.lineTo(lerp(660, 1260, hyp), lerp(700, 250, hyp)); x.stroke(); }
        T("a", 70, 960, 760, INK, true); if (leg > .5) T("b", 70, 1310, 480, INK, true); if (hyp > .5) T("c", 70, 900, 430, RED, true);
      }
    }
    // ---------- 2–5 kinetic type: a² + b² = c², each symbol lands on a beat; then it collapses into the triangle
    if (t >= 2 && t < 5.2) {
      const parts = [["a", INK], ["²", INK], ["+", INK], ["b", INK], ["²", INK], ["=", INK], ["c", RED], ["²", RED]];
      const xs = [520, 640, 760, 900, 1020, 1150, 1300, 1420];
      parts.forEach(([s, col], i) => {
        const tin = 2 + i * .32, k = expo(seg(t, tin, tin + .25)); if (k <= 0) return;
        const out = expoIO(seg(t, 4.6, 5.1));
        const sup = s === "²";
        T(s, sup ? 140 : 260, lerp(xs[i], 960, out), lerp(sup ? 420 : 540, 540, out) + (1 - k) * 120, col, !sup && s.match(/[abc]/) !== null);
      });
      T("Pythagoras, c. 500 BC", 34, 960, 820, "#77736b", true);
    }
    // ---------- 5–8 morph: the four triangles inside a square rearrange (the classic proof), then a circle unrolls into π
    if (t >= 5 && t < 8.2) {
      const S = 420, cx = 960, cy = 540, a = 160, b = S - a;
      const k = expoIO(seg(t, 5.6, 6.8));   // rearrangement
      // configuration A: the four triangles around a tilted c² square. configuration B: two rectangles leaving a² and b²
      const triA = [[[0, 0], [b, 0], [0, a]], [[b, 0], [S, 0], [S, b]], [[S, b], [S, S], [a, S]], [[a, S], [0, S], [0, a]]];
      const triB = [[[0, 0], [b, 0], [0, a]].map(([X, Y]) => [X + a, Y + 0]), [[0, 0], [b, a], [0, a]].map(([X, Y]) => [X + a, Y]), [[0, 0], [a, 0], [a, b]].map(([X, Y]) => [X, Y + a]), [[0, 0], [0, b], [a, b]].map(([X, Y]) => [X, Y + a])];
      const ox = cx - S / 2, oy = cy - S / 2;
      const unroll = expoIO(seg(t, 7.0, 8.0));
      if (unroll < 1) {
        x.globalAlpha = 1 - unroll;
        x.fillStyle = "rgba(43,89,195,.12)"; x.fillRect(ox, oy, S, S);
        triA.forEach((tri, i) => { x.fillStyle = i % 2 ? BLUE : INK; x.beginPath(); tri.forEach((p, j) => { const q = triB[i][j]; const X = ox + lerp(p[0], q[0], k), Y = oy + lerp(p[1], q[1], k); j ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.closePath(); x.fill(); });
        if (k < .3) T("c²", 80, cx, cy, RED, true); else if (k > .8) { T("a²", 54, ox + a / 2, oy + a / 2, RED, true); T("b²", 80, ox + a + b / 2, oy + a + b / 2, RED, true); }
        x.globalAlpha = 1;
      }
      if (t > 7) {
        // a unit circle rolls one turn along the line: its circumference unrolls to π·d
        const r = 120, roll = unroll, cxr = 640 + roll * Math.PI * 2 * r * .5;
        x.strokeStyle = INK; x.lineWidth = 4; x.beginPath(); x.moveTo(400, 760); x.lineTo(1600, 760); x.stroke();
        x.strokeStyle = RED; x.lineWidth = 10; x.beginPath(); x.moveTo(640, 760); x.lineTo(cxr, 760); x.stroke();
        x.beginPath(); x.arc(cxr, 760 - r, r, Math.PI / 2, Math.PI / 2 + Math.PI * 2 * (1 - roll * .5)); x.stroke();
        x.strokeStyle = INK; x.lineWidth = 4; x.beginPath(); x.arc(cxr, 760 - r, r, 0, 7); x.stroke();
        if (roll > .9) T("π", 160, 1300, 560, RED, true);
      }
    }
    // ---------- 8–11 2D → 3D: a square, extruded into a cube, then the cube's shadow-twin becomes a tesseract
    if (t >= 8 && t < 11.2) {
      const ang = (t - 8) * .9, depth = expo(seg(t, 8.1, 8.7)), tess = expoIO(seg(t, 9.4, 10.2));
      const pts4 = [];
      for (let i = 0; i < 16; i++) pts4.push([i & 1 ? 1 : -1, i & 2 ? 1 : -1, i & 4 ? 1 : -1, i & 8 ? 1 : -1]);
      const proj = (p) => {
        let [X, Y, Z, Wd] = p; Z *= depth; Wd *= tess;
        // rotate in XW and XZ planes
        const a1 = ang * .7, a2 = ang;
        [X, Wd] = [X * Math.cos(a1) - Wd * Math.sin(a1), X * Math.sin(a1) + Wd * Math.cos(a1)];
        [X, Z] = [X * Math.cos(a2) - Z * Math.sin(a2), X * Math.sin(a2) + Z * Math.cos(a2)];
        const f4 = 3 / (3 - Wd), X3 = X * f4, Y3 = Y * f4, Z3 = Z * f4;
        const f3 = 6 / (6 - Z3 * .6);
        return [960 + X3 * 150 * f3, 540 + (Y3 * .92 - Z3 * .22) * 150 * f3];
      };
      const P2 = pts4.map(proj);
      for (let i = 0; i < 16; i++) for (let k = 0; k < 4; k++) { const j = i ^ (1 << k); if (j < i) continue; if (k === 3 && tess <= 0) continue; if (k === 2 && depth <= 0) continue; x.strokeStyle = k === 3 ? RED : k === 2 ? BLUE : INK; x.lineWidth = 5; x.beginPath(); x.moveTo(...P2[i]); x.lineTo(...P2[j]); x.stroke(); }
      P2.forEach((p) => dot(p[0], p[1], 7, INK));
      T(tess > .5 ? "tesseract" : depth > .5 ? "cube" : "square", 44, 960, 930, "#77736b", true);
    }
    // ---------- 11–14 data: the unit circle draws sin θ across a plotted axis, values ticking on each beat
    if (t >= 11 && t < 14.2) {
      const th = (t - 11) * 2.2, cxu = 420, cyu = 540, r = 170;
      x.strokeStyle = INK; x.lineWidth = 3; x.beginPath(); x.arc(cxu, cyu, r, 0, 7); x.stroke();
      x.beginPath(); x.moveTo(700, cyu); x.lineTo(1780, cyu); x.stroke();
      const px = cxu + Math.cos(th) * r, py = cyu - Math.sin(th) * r;
      x.strokeStyle = BLUE; x.lineWidth = 4; x.beginPath(); x.moveTo(cxu, cyu); x.lineTo(px, py); x.stroke();
      x.setLineDash([8, 10]); x.strokeStyle = "rgba(22,22,26,.4)"; x.beginPath(); x.moveTo(px, py); x.lineTo(700 + th * 150, py); x.stroke(); x.setLineDash([]);
      x.strokeStyle = RED; x.lineWidth = 7; x.beginPath();
      for (let s = 0; s <= th; s += .02) { const X = 700 + s * 150, Y = cyu - Math.sin(s) * r; s ? x.lineTo(X, Y) : x.moveTo(X, Y); } x.stroke();
      dot(px, py, 10, BLUE); dot(700 + th * 150, py, 10, RED);
      T(`sin θ = ${Math.sin(th).toFixed(2)}`, 56, 1500, 220, INK, true);
      const out = expoIO(seg(t, 13.7, 14.2)); if (out > 0) { x.fillStyle = PAPER; x.fillRect(0, 0, 1920 * out, 1080); }
    }
    // ---------- 14–18 strongest: golden rectangles, one square per beat, Fibonacci numbers inside, the spiral drawn through them
    if (t >= 14 && t < 18.3) {
      const F = [1, 1, 2, 3, 5, 8, 13, 21];
      const u = 18;   // unit size
      let rects = [], bx = 0, by = 0, w = 0, h = 0;
      F.forEach((f, i) => {
        const s = f * u; let rx, ry;
        if (i === 0) { rx = 0; ry = 0; w = s; h = s; }
        else { const d = i % 4; if (d === 1) { rx = bx + w; ry = by; w += s; } else if (d === 2) { rx = bx; ry = by + h; h += s; } else if (d === 3) { rx = bx - s; ry = by; bx -= s; w += s; } else { rx = bx; ry = by - s; by -= s; h += s; } }
        rects.push([rx, ry, s, i]);
      });
      const n = clamp(Math.floor((t - 14) / B) + 1, 1, 8);
      const grow = 1 + .08 * pulse;
      const vis = rects.slice(0, n), x0 = Math.min(...vis.map((r) => r[0])), y0 = Math.min(...vis.map((r) => r[1])), x1 = Math.max(...vis.map((r) => r[0] + r[2])), y1 = Math.max(...vis.map((r) => r[1] + r[2]));
      const ccx = (x0 + x1) / 2, ccy = (y0 + y1) / 2, fit = Math.min(1300 / (x1 - x0), 820 / (y1 - y0), 14) * grow;
      x.save(); x.translate(960, 540); x.scale(fit, fit); x.translate(-ccx, -ccy);
      rects.slice(0, n).forEach(([rx, ry, s, i]) => {
        const k = expo(seg(t, 14 + i * B, 14 + i * B + .3));
        x.fillStyle = i === n - 1 ? "rgba(224,68,47,.16)" : i % 2 ? "rgba(43,89,195,.08)" : "rgba(22,22,26,.04)"; x.fillRect(rx, ry, s, s);
        x.strokeStyle = INK; x.lineWidth = 2 / fit * 2; x.strokeRect(rx, ry, s * k, s * k);
        x.font = `400 ${s * .35}px IS`; x.fillStyle = INK; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(F[i] + "", rx + s / 2, ry + s / 2);
        // quarter arc of the spiral in this square
        const d = i % 4, corner = [[rx + s, ry + s], [rx, ry + s], [rx, ry], [rx + s, ry]][d === 0 ? 0 : d];
        const a0 = [Math.PI, Math.PI * 1.5, 0, Math.PI * .5][d];
        x.strokeStyle = RED; x.lineWidth = 6 / fit * 2; x.beginPath(); x.arc(corner[0], corner[1], s, a0, a0 + Math.PI / 2 * k); x.stroke();
      });
      x.restore();
      T(`φ ≈ ${(n > 1 ? F[n - 1] / F[n - 2] : 1).toFixed(3)}`, 60, 1700, 120, RED, true);
    }
    // ---------- 18–20 end title, then the point
    if (t >= 18) {
      const a = expo(seg(t, 18.1, 18.5)), o = expoIn(seg(t, 19.3, 19.7));
      x.globalAlpha = a * (1 - o); T("Q.E.D.", 220, 960, 520, INK, true); T("a showreel in proofs", 40, 960, 680, "#77736b", true); x.globalAlpha = 1;
      if (t > 19.7) dot(960, 540, 10, INK);
    }
  },
  sound(A) {
    const m = A.midi;
    for (let k = 0; k < 40; k++) { const t0 = k * B; A.kick(t0, .7); A.hat(t0 + B / 2, .06); }
    for (const t0 of [2, 5, 8, 11, 14, 18]) A.hit(t0, .4);
    for (let i = 0; i < 8; i++) A.pluck(2 + i * .32, m(67 + [0, 12, 5, 4, 12, 7, 9, 21][i]), .08, .25);
    A.whoosh(5.6, 1.2, .12);
    for (let k = 0; k < 6; k++) A.tone(11 + k * .5, m(60 + Math.round(Math.sin(k) * 5) + 7), .3, "sine", .06);
    A.riser(12.5, 14, .25);
    [1, 1, 2, 3, 5, 8, 13, 21].forEach((f, i) => A.pluck(14 + i * B, m(60 + [0, 0, 2, 4, 7, 12, 16, 19][i]), .12, .45));
    A.pad(18, [60, 64, 67, 72].map(m), 2, .04);
  },
});
</script></body></html>

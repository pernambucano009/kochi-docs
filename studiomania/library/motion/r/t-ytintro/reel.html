<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// قالب «مقدمة ونهاية لقناة»: افتتاحية سريعة بأشكال بتتجمع وتعمل لوجو القناة واسمها، بعدها كارت عنوان الحلقة، وفي الآخر شاشة النهاية:
// فيديوهين مقترحين، صورة القناة، وزرار اشتراك بيتضغط والجرس بيرن. 1080×1920، 12 ثانية.
const PR = M.params({
  channel: { label: "اسم القناة", kind: "text", role: "brand", def: "مطبخ سلمى" },
  ep: { label: "عنوان الحلقة", kind: "text", role: "product", def: "كيكة البرتقال في ١٠ دقايق" },
  epno: { label: "رقم الحلقة", kind: "text", def: "الحلقة ٢٤" },
  v1: { label: "الفيديو المقترح ١", kind: "text", def: "أسهل عيش في البيت" },
  v2: { label: "الفيديو المقترح ٢", kind: "text", def: "٥ أكلات للسحور" },
  sub: { label: "زرار الاشتراك", kind: "text", def: "اشترك" },
  c1: { label: "لون القناة", kind: "color", def: "#ff7a1a" },
  c2: { label: "اللون التاني", kind: "color", def: "#2d1b4e" },
});
const W = 1080, H = 1920, DUR = 12;
const loadFont = (fam, file, weight = "400") => { const f = new FontFace(fam, `url(../../fonts/${file})`, { weight }); document.fonts.add(f); return f.load().catch(() => {}); };

M.reel({
  W, H, DUR, bg: PR.c2,
  async init(M) { await Promise.all([loadFont("LZ", "SM-Lalezar.ttf"), loadFont("PB", "TY-PlexArabic-700.ttf", "700"), loadFont("PX", "TY-PlexArabic-400.ttf")]); const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, C, M) {
    const { x } = C, { seg, clamp, cubicIO, springO, expo, hash } = M, io = (k) => cubicIO(clamp(k)), A = PR.c1, B = PR.c2;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = B; x.fillRect(0, 0, W, H);
    const logo = (cx, cy, s, k) => { // لوجو: دايرة + معلقة + بخار
      x.save(); x.translate(cx, cy); x.scale(s, s);
      x.fillStyle = A; x.beginPath(); x.arc(0, 0, 150 * springO(clamp(k / .6), 12, .5), 0, Math.PI * 2); x.fill();
      const k2 = springO(clamp((k - .25) / .6), 12, .5); x.fillStyle = "#fff"; x.save(); x.rotate(-.5 + (1 - k2) * 2); x.beginPath(); x.ellipse(0, -30, 44 * k2, 58 * k2, 0, 0, Math.PI * 2); x.fill(); x.fillRect(-10 * k2, 20, 20 * k2, 110 * k2); x.restore();
      x.strokeStyle = "#fff"; x.lineWidth = 10; x.lineCap = "round"; for (let i = 0; i < 3; i++) { const k3 = clamp((k - .4 - i * .08) / .4); if (k3 <= 0) continue; x.beginPath(); for (let j = 0; j <= 10 * k3; j++) { const u = j / 10; x.lineTo(60 + i * 26 + Math.sin(u * 6 + t * 4) * 8, -60 - u * 120); } x.stroke(); }
      x.restore(); };
    if (t < 3.6) { // ١) الافتتاحية
      // أشكال بتطير وتتجمع
      for (let i = 0; i < 18; i++) { const a = hash(i) * 6.28, r0 = 900 + hash(i + 2) * 400, k = io(seg(t, .1 + i * .02, .9 + i * .02)), r = r0 * (1 - k), cx = 540 + Math.cos(a) * r, cy = 900 + Math.sin(a) * r;
        if (k >= 1) continue; x.fillStyle = i % 2 ? A : "#fff"; x.globalAlpha = 1 - k * .3; x.beginPath(); x.arc(cx, cy, 30 + hash(i + 5) * 40, 0, Math.PI * 2); x.fill(); } x.globalAlpha = 1;
      const fl = Math.max(0, 1 - Math.abs(t - 1.0) / .15); if (fl > 0) { x.fillStyle = `rgba(255,255,255,${fl * .6})`; x.fillRect(0, 0, W, H); }
      logo(540, 860, 1.4, t - .9);
      const nk = io(seg(t, 1.6, 2.2)); x.save(); x.beginPath(); x.rect(0, 1120, W, 220); x.clip(); x.fillStyle = "#fff"; x.font = `${M.fit(PR.channel, "LZ", 900, 170, 70)}px LZ`; x.textAlign = "center"; x.direction = "rtl"; x.fillText(PR.channel, 540, 1290 + (1 - nk) * 220); x.restore();
      x.fillStyle = A; x.fillRect(540 - 200 * io(seg(t, 2.0, 2.5)), 1350, 400 * io(seg(t, 2.0, 2.5)), 12);
      const out = io(seg(t, 3.2, 3.6)); if (out > 0) { x.fillStyle = A; x.beginPath(); x.arc(540, 960, 1300 * out, 0, Math.PI * 2); x.fill(); }
    } else if (t < 7.0) { // ٢) كارت عنوان الحلقة
      x.fillStyle = A; x.fillRect(0, 0, W, H);
      for (let i = 0; i < 9; i++) { x.fillStyle = "rgba(255,255,255,.06)"; x.save(); x.translate(540, 960); x.rotate(i * .7 + t * .2); x.fillRect(-20, -1400, 40, 2800); x.restore(); }
      const ek = springO(clamp((t - 3.7) / .7), 11, .55); x.save(); x.translate(540, 760); x.scale(ek, ek); x.fillStyle = B; x.beginPath(); x.roundRect(-200, -55, 400, 110, 55); x.fill(); x.fillStyle = "#fff"; x.font = "700 52px PB"; x.textAlign = "center"; x.direction = "rtl"; x.fillText(PR.epno, 0, 18); x.restore();
      const words = PR.ep.split(" "); x.font = `${M.fit(PR.ep, "LZ", 900, 140, 60)}px LZ`; x.textAlign = "center"; x.direction = "rtl";
      // لف السطور
      const lines = [[]]; words.forEach((w) => { const cur = lines[lines.length - 1]; if (x.measureText([...cur, w].join(" ")).width > 880 && cur.length) lines.push([w]); else cur.push(w); });
      lines.forEach((ln, li) => { const k = springO(clamp((t - 4.1 - li * .2) / .6), 12, .55); x.save(); x.translate(540, 1000 + li * 160); x.scale(1, k); x.fillStyle = "#fff"; x.fillText(ln.join(" "), 0, 0); x.restore(); });
      logo(540, 1540, .8, t - 4.5);
    } else { // ٣) شاشة النهاية
      x.fillStyle = B; x.fillRect(0, 0, W, H);
      x.fillStyle = "rgba(255,255,255,.04)"; for (let i = 0; i < 30; i++) x.fillRect(0, i * 64 + (t * 30) % 64, W, 2);
      const card = (cy, title, k, seed) => { x.save(); x.translate(540 + (1 - k) * 1100 * (seed ? -1 : 1), cy); x.fillStyle = "#3b2963"; x.beginPath(); x.roundRect(-430, -170, 860, 340, 26); x.fill();
        const g = x.createLinearGradient(-430, -170, 430, 170); g.addColorStop(0, seed ? "#ffb36b" : "#ff8a5c"); g.addColorStop(1, seed ? "#c2410c" : "#7c2d12"); x.fillStyle = g; x.beginPath(); x.roundRect(-410, -150, 400, 300, 18); x.fill();
        x.fillStyle = "rgba(255,255,255,.9)"; x.beginPath(); x.arc(-210, 0, 50, 0, Math.PI * 2); x.fill(); x.fillStyle = seed ? "#c2410c" : "#7c2d12"; x.beginPath(); x.moveTo(-228, -28); x.lineTo(-228, 28); x.lineTo(-180, 0); x.closePath(); x.fill();
        x.fillStyle = "#fff"; x.font = `700 ${M.fit(title, "PB", 360, 46, 26, "700")}px PB`; x.textAlign = "right"; x.direction = "rtl"; x.fillText(title, 400, -40); x.fillStyle = "rgba(255,255,255,.6)"; x.font = "400 30px PX"; x.fillText(PR.channel, 400, 20); x.fillStyle = A; x.fillRect(400 - 160, 60, 160, 8); x.restore(); };
      card(560, PR.v1, io(seg(t, 7.1, 7.7)), 0); card(960, PR.v2, io(seg(t, 7.3, 7.9)), 1);
      x.fillStyle = "#fff"; x.globalAlpha = io(seg(t, 7.0, 7.5)); x.font = "700 56px PB"; x.textAlign = "center"; x.direction = "rtl"; x.fillText("شوف كمان", 540, 330); x.globalAlpha = 1;
      // صورة القناة + اشتراك
      const ak = springO(clamp((t - 8.0) / .6), 11, .5); x.save(); x.translate(540, 1400); x.scale(ak, ak); x.fillStyle = "#fff"; x.beginPath(); x.arc(0, 0, 130, 0, Math.PI * 2); x.fill(); x.restore(); logo(540, 1400, .75 * ak, t - 8.0);
      const press = t > 9.4 && t < 9.6, subd = t > 9.5, sk = springO(clamp((t - 8.6) / .5), 12, .5) * (press ? .92 : 1);
      x.save(); x.translate(540, 1650); x.scale(sk, sk); x.fillStyle = subd ? "#5a4a7a" : "#e3242b"; x.beginPath(); x.roundRect(-230, -60, 460, 120, 60); x.fill(); x.fillStyle = "#fff"; x.font = "700 52px PB"; x.textAlign = "center"; x.direction = "rtl"; x.fillText(subd ? "مشترك" : PR.sub, 30, 18);
      const rg = subd ? Math.sin((t - 9.6) * 30) * .4 * Math.exp(-(t - 9.6) * 3) : 0; x.save(); x.translate(-150, 0); x.rotate(rg); x.beginPath(); x.moveTo(-22, 16); x.quadraticCurveTo(-24, -26, 0, -28); x.quadraticCurveTo(24, -26, 22, 16); x.closePath(); x.fill(); x.beginPath(); x.arc(0, 22, 8, 0, Math.PI * 2); x.fill(); x.restore(); x.restore();
      // مؤشر بيضغط
      const cx = 540 + 400 * (1 - io(seg(t, 8.8, 9.4))), cy = 1700 + 200 * (1 - io(seg(t, 8.8, 9.4))); if (t > 8.8) { x.save(); x.translate(cx, cy); x.scale(press ? .85 : 1, press ? .85 : 1); x.fillStyle = "#fff"; x.strokeStyle = "#111"; x.lineWidth = 4; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 54); x.lineTo(14, 40); x.lineTo(26, 64); x.lineTo(36, 58); x.lineTo(24, 36); x.lineTo(42, 36); x.closePath(); x.fill(); x.stroke(); x.restore(); }
    }
  },
  sound(A) {
    const N = A.midi;
    A.riser(0, .9, .07); A.hit(1.0, .6); A.kick(1.0, 1); [0, .15, .3, .45].forEach((d, i) => A.pluck(1.0 + d, N([72, 76, 79, 84][i]), .1, .8)); A.whoosh(3.2, .5, .1);
    for (let b = 0; b < 16; b++) { const s = 3.6 + b * .5; A.kick(s, .4); A.hat(s + .25, .05); if (b % 2) A.clap(s, .1); A.bass(s, N([41, 41, 44, 46][Math.floor(b / 4) % 4]), .4, .12); }
    A.whoosh(7.0, .5, .08); A.click(9.45, .3); [0, .08, .16].forEach((d) => A.tone(9.6 + d, N(96), .2, "sine", .05)); A.pad(7, [N(53), N(57), N(60), N(64)], 5, .03);
  },
});
</script>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #200 "ONE PHOTON" — 20 s. Concept: follow a single photon from the Sun's core to your eye; the camera never lets go of it.
// Facts (NASA / IAU): light from the core can take up to ~170,000 years to random-walk out; the Sun–Earth mean distance is 149.6 million km;
// sunlight takes about 8 min 20 s to cross it.
// 0–4 kinetic type: the photon ricochets inside the core, each bounce stamps a letter of ONE PHOTON · 4–8 shape morph: its zig-zag path
// becomes the Sun's circle, rays grow, it escapes · 8–12 2D→3D: stars stream past in depth, the Earth grows as a sphere · 12–16 data/UI:
// a distance bar + clock (0 → 149.6M KM, 0:00 → 8:20) · 16–20 end title: the Earth's disc turns into an iris; the photon goes in.
// One typeface (Barlow Condensed 700). Palette: yellow, orange, blue + black/white.
const W = 1920, H = 1080, YEL = "#ffcc33", ORG = "#ff5a1f", BLUE = "#3d7bff";
const CX = 960, CY = 560, RC = 400;
let WALK = [];
M.reel({
  W, H, DUR: 20, bg: "#000",
  fonts: { BC: ["TY-BarlowCond-700.ttf", "700"] },
  init(M) {
    const c = M.canvas(W, H), rnd = M.rng(7);
    let p = [CX, CY]; WALK = [p.slice()];
    for (let i = 0; i < 46; i++) {
      let a, q, tries = 0;
      do { a = rnd() * Math.PI * 2; const L = 70 + rnd() * 80; q = [p[0] + Math.cos(a) * L, p[1] + Math.sin(a) * L]; tries++; } while (Math.hypot(q[0] - CX, q[1] - CY) > RC - 30 && tries < 50);
      // drift outward late in the walk so it ends near the surface (top-right)
      if (i > 34) { const k = (i - 34) / 12; q = [M.lerp(q[0], CX + (RC - 40) * .72, k * .5), M.lerp(q[1], CY - (RC - 40) * .69, k * .5)]; }
      WALK.push(q); p = q;
    }
    return { x: c.getContext("2d") };
  },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, expo, expoIO, springO, hash } = M;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
    const T = (s, X, Y, px, col = "#fff", t0 = 0, t1 = 99, al = "center") => {
      if (t < t0 || t > t1 + .3) return;
      x.font = `700 ${px}px BC`; x.textBaseline = "middle"; x.textAlign = "left"; x.fillStyle = col;
      const ws = [...s].map((c) => (c === " " ? px * .25 : x.measureText(c).width)), tot = ws.reduce((a, b) => a + b, 0);
      let cx = al === "center" ? X - tot / 2 : al === "right" ? X - tot : X;
      x.save(); x.beginPath(); x.rect(0, Y - px * .6, W, px * 1.2); x.clip();
      [...s].forEach((c, i) => { const ki = springO(t - t0 - i * .022, 22, .75), ko = expo(seg(t, t1 + i * .015, t1 + .18 + i * .015)); x.fillText(c, cx, Y + (1 - ki) * px - ko * px); cx += ws[i]; });
      x.restore();
    };
    const dot = (X, Y, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill(); };
    // ======== A · the core (0–4): a random walk; bounces stamp letters
    const STEP = 3.9 / (WALK.length - 1);
    const walkAt = (tt) => { const f = clamp(tt / STEP, 0, WALK.length - 1.0001), i = Math.floor(f), k = f - i; return [lerp(WALK[i][0], WALK[i + 1][0], k), lerp(WALK[i][1], WALK[i + 1][1], k), i]; };
    if (t < 4.2) {
      x.strokeStyle = ORG; x.lineWidth = 6; x.beginPath(); x.arc(CX, CY, RC, 0, 7); x.stroke();
      const [px, py, idx] = walkAt(t);
      x.strokeStyle = "rgba(255,204,51,.5)"; x.lineWidth = 3; x.beginPath(); for (let i = 0; i <= idx; i++) (i ? x.lineTo(...WALK[i]) : x.moveTo(...WALK[i])); x.lineTo(px, py); x.stroke();
      dot(px, py, 12, "#fff");
      // letters: stamped at bounces 2..10, then they fly up into the word
      const LET = "ONEPHOTON", fly = expoIO(seg(t, 2.3, 2.75));
      x.font = "700 150px BC"; x.textAlign = "center"; x.textBaseline = "middle";
      const finalX = (j) => { const w = 78, gap = j >= 3 ? 40 : 0; return CX - (9 * w + 40) / 2 + j * w + w / 2 + gap; };
      [...LET].forEach((c, j) => { const tb = (j + 2) * STEP; if (t < tb) return; const pop = springO(t - tb, 22, .55), [sx, sy] = WALK[j + 2]; x.save(); x.translate(lerp(sx, finalX(j), fly), lerp(sy, 150, fly)); x.scale(pop * lerp(.6, 1, fly), pop * lerp(.6, 1, fly)); x.fillStyle = YEL; x.fillText(c, 0, 0); x.restore(); });
      x.textAlign = "start";
      T("UP TO 170,000 YEARS INSIDE", CX, 990, 84, "#fff", 2.4, 3.95);
    }
    // ======== B · the path becomes the Sun (4–8)
    let sunX = CX, sunY = CY, sunR = RC, phX = 0, phY = 0;
    if (t >= 3.95 && t < 12.5) {
      const mk = expoIO(seg(t, 3.95, 4.6));      // trail → circle
      const away = expoIO(seg(t, 5.6, 7.6));     // the camera follows the photon away: the Sun shrinks to the left
      sunX = lerp(CX, 260, away); sunY = lerp(CY, 640, away); sunR = lerp(RC, 120, away) * (1 - expoIO(seg(t, 8.4, 10)) * .85);
      if (t < 4.6) {
        const NP = 140; x.strokeStyle = YEL; x.lineWidth = lerp(3, 6, mk); x.beginPath();
        for (let i = 0; i < NP; i++) { const u = i / (NP - 1) * (WALK.length - 1), a = Math.floor(Math.min(u, WALK.length - 2)), f = u - a; const wx = lerp(WALK[a][0], WALK[a + 1][0], f), wy = lerp(WALK[a][1], WALK[a + 1][1], f), ang = i / (NP - 1) * Math.PI * 2 - Math.PI / 2; const qx = CX + Math.cos(ang) * RC, qy = CY + Math.sin(ang) * RC; const X = lerp(wx, qx, mk), Y = lerp(wy, qy, mk); i ? x.lineTo(X, Y) : x.moveTo(X, Y); }
        x.stroke();
      } else {
        const fill = expo(seg(t, 4.6, 5.0));
        x.fillStyle = YEL; x.beginPath(); x.arc(sunX, sunY, sunR * fill + .01, 0, 7); x.fill();
        x.strokeStyle = YEL; x.lineWidth = 6; x.beginPath(); x.arc(sunX, sunY, sunR, 0, 7); x.stroke();
        // rays morph out of the rim
        const rk = expoIO(seg(t, 5.0, 5.6)), spin = t * .15;
        x.strokeStyle = ORG; x.lineWidth = 8; x.lineCap = "round";
        for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2 + spin, r0 = sunR + 24, r1 = sunR + 24 + rk * sunR * (i % 2 ? .35 : .6); x.beginPath(); x.moveTo(sunX + Math.cos(a) * r0, sunY + Math.sin(a) * r0); x.lineTo(sunX + Math.cos(a) * r1, sunY + Math.sin(a) * r1); x.stroke(); }
      }
      // the photon escapes the rim (top-right) and the camera locks onto it: it holds screen centre-right
      const esc = expoIO(seg(t, 4.6, 5.6));
      const ex = CX + Math.cos(-.77) * RC, ey = CY + Math.sin(-.77) * RC;
      phX = lerp(ex, 1180, esc); phY = lerp(ey, 520, esc);
      if (t > 7.6) { phX = 1180; phY = 520; }
      if (t < 8.3) { x.strokeStyle = "rgba(255,255,255,.7)"; x.lineWidth = 3; x.beginPath(); x.moveTo(lerp(ex, sunX + (ex - CX) * sunR / RC, away), lerp(ey, sunY + (ey - CY) * sunR / RC, away)); x.lineTo(phX, phY); x.stroke(); }
      if (t < 8.3) dot(phX, phY, 12, "#fff");
      T("FREE.", 1450, 330, 120, "#fff", 5.3, 7.3);
    }
    // ======== C · into depth (8–12) and D · the trip, measured (12–16)
    if (t >= 8.0 && t < 16.2) {
      const dk = expoIO(seg(t, 8.0, 8.8));   // the photon swings to the centre; the view turns to look along its path
      const vx = lerp(1180, CX, dk), vy = lerp(520, CY, dk);
      const speed = t < 12 ? 1 : 1.6;
      for (let i = 0; i < 260; i++) {
        const sx = (hash(i) - .5) * 4000, sy = (hash(i + 99) - .5) * 2400; let z = ((hash(i + 7) * 20 - (t - 8) * 3.2 * speed) % 20 + 20) % 20 + .3;
        const p = 1 / z, X = vx + sx * p * dk, Y = vy + sy * p * dk, X2 = vx + sx / (z + .25) * dk, Y2 = vy + sy / (z + .25) * dk;
        x.strokeStyle = i % 9 ? "rgba(255,255,255,.75)" : YEL; x.lineWidth = Math.min(4, 2 * p + .5); x.beginPath(); x.moveTo(X, Y); x.lineTo(X2, Y2); x.stroke();
      }
      // the Earth: a sphere that grows from a point (hard-edged day/night bands, lit from behind us = from the Sun)
      const ek = expo(seg(t, 9.0, 15.8) ** 2.2) , er = lerp(4, 300, ek);
      const ecx = CX, ecy = CY;
      if (t > 9.0) {
        x.fillStyle = BLUE; x.beginPath(); x.arc(ecx, ecy, er, 0, 7); x.fill();
        x.save(); x.beginPath(); x.arc(ecx, ecy, er, 0, 7); x.clip();
        x.fillStyle = "#1e3f8a"; x.beginPath(); x.arc(ecx + er * .55, ecy + er * .2, er * 1.02, 0, 7); x.fill();
        x.fillStyle = BLUE; x.beginPath(); x.arc(ecx - er * .1, ecy - er * .05, er * .9, 0, 7); x.fill();
        // continents rotate past (simple blobs) — this is the 3D read
        for (let k = 0; k < 6; k++) { const lon = k * 1.05 + t * .6, cz = Math.cos(lon); if (cz < 0) continue; const lx = ecx + Math.sin(lon) * er * .85, ly = ecy + (hash(k) - .5) * er * 1.2; x.fillStyle = "rgba(255,255,255,.85)"; x.beginPath(); x.ellipse(lx, ly, er * .18 * cz, er * .12, 0, 0, 7); x.fill(); }
        x.restore();
      }
      dot(CX, CY - (t > 9 ? er + 40 : 0) * 0, 10, "#fff");
      T("150 MILLION KM", CX, 170, 96, "#fff", 9.2, 11.6);
      // ======== D · HUD
      if (t > 12.0) {
        const k = expo(seg(t, 12.0, 12.4)), prog = clamp((t - 12.2) / 3.4);
        x.globalAlpha = k;
        x.fillStyle = "#333"; x.fillRect(360, 960, 1200, 8); x.fillStyle = YEL; x.fillRect(360, 960, 1200 * prog, 8);
        dot(360 + 1200 * prog, 964, 14, "#fff");
        x.font = "700 54px BC"; x.textAlign = "left"; x.textBaseline = "middle"; x.fillStyle = YEL; x.fillText("SUN", 360, 905);
        x.textAlign = "right"; x.fillStyle = BLUE; x.fillText("EARTH", 1560, 905);
        const sec = Math.round(499 * prog), km = (149.6 * prog).toFixed(1);
        x.textAlign = "center"; x.fillStyle = "#fff"; x.font = "700 130px BC"; x.fillText(`${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`, CX, 150);
        x.font = "700 54px BC"; x.fillStyle = "#bbb"; x.fillText(`${km}M KM`, CX, 245);
        x.globalAlpha = 1; x.textAlign = "start";
      }
    }
    // ======== E · the Earth's disc becomes an iris (16–20)
    if (t >= 15.8) {
      const k = expoIO(seg(t, 15.8, 16.6)), r = lerp(300, 360, k);
      // white of the eye opens around the disc
      const open = expoIO(seg(t, 16.0, 16.7));
      x.fillStyle = "#fff"; x.beginPath(); x.ellipse(CX, CY, lerp(r, 820, open), lerp(r, 420, open), 0, 0, 7); x.fill();
      x.fillStyle = BLUE; x.beginPath(); x.arc(CX, CY, r, 0, 7); x.fill();
      x.strokeStyle = "#1e3f8a"; x.lineWidth = 4; for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2; x.beginPath(); x.moveTo(CX + Math.cos(a) * r * .45, CY + Math.sin(a) * r * .45); x.lineTo(CX + Math.cos(a) * r * .95, CY + Math.sin(a) * r * .95); x.stroke(); }
      // the pupil contracts as the light goes in
      const pin = expoIO(seg(t, 17.0, 17.5)), pr = lerp(r * .55, r * .3, pin);
      x.fillStyle = "#000"; x.beginPath(); x.arc(CX, CY, pr, 0, 7); x.fill();
      const ph = 1 - expo(seg(t, 16.8, 17.1)); if (ph > 0) dot(CX, CY, 10 * ph + .01, "#fff");
      x.fillStyle = "#fff"; x.beginPath(); x.arc(CX - r * .32, CY - r * .32, r * .1, 0, 7); x.fill();
      // the lids close to a black field with the title
      const shut = expoIO(seg(t, 18.0, 18.5));
      if (shut > 0) { x.fillStyle = "#000"; x.fillRect(0, 0, W, CY * shut); x.fillRect(0, H - (H - CY) * shut, W, H); }
      T("AND YOU SAW IT.", CX, CY, 150, YEL, 18.45, 99);
    }
  },
  sound(A) {
    const m = A.midi;
    WALK.forEach((_, i) => { const t0 = i * 3.9 / (WALK.length - 1); A.tone(t0, m(72 + ((i * 5) % 12)), .06, "square", .03); A.click(t0, .05); });
    A.pad(0, [m(41), m(48)], 4.2, .04);
    A.whoosh(2.3, .45, .2); A.hit(2.6, .3);
    A.riser(3.9, 4.6, .2); A.hit(4.6, .5); A.whoosh(4.6, 1, .25);
    [60, 64, 67, 71, 74].forEach((n, i) => A.pluck(5.0 + i * .1, m(n), .12, .4));
    A.pad(4.6, [m(48), m(55), m(64)], 4, .035);
    A.nz(8.0, 8, "bandpass", 1800, .05, .6); A.whoosh(8.0, .9, .2);
    A.groove(128, 8.0, 16, { hg: .05, kg: .7 });
    A.pad(8, [m(45), m(52), m(60), m(64)], 8, .03);
    for (let t0 = 12.2; t0 < 15.6; t0 += .1) A.click(t0, .03);
    A.whoosh(15.8, .8, .25); A.tone(17.0, 900, .3, "sine", .08); A.hit(18.45, .5);
    [48, 55, 60, 64, 67].forEach((n) => A.tone(18.45, m(n), 1.5, "sine", .06));
  },
});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script><script src="../../lib/three.min.js"></script></head><body>
<script>
// #44 Beat-synced falling ball (three.js). The ball drops down a spiral tower of bars; every bounce plays the next note.
// Three worlds, three public-domain tunes (synthesised): Beethoven's Ode to Joy (pale marble keys), Grieg's Mountain King
// (dark crystal cave, speeding up), Beethoven's Für Elise (warm bells). Signature: the last bounce hits a gong, slow push-in.
// Gag: it lands in a teacup. Splash. A tiny "plip". Final wide: the whole tower, every key lit.
const DUR = 20;
const m = (n) => 440 * Math.pow(2, (n - 69) / 12);
// notes: [midi, beat length in seconds]
const ODE = [64, 64, 65, 67, 67, 65, 64, 62, 60, 60, 62, 64, 64, 62, 62].map((n, i) => [n, i === 12 ? .75 : i === 13 ? .25 : .5]);
const KING = [62, 64, 65, 67, 69, 65, 69, 68, 64, 68, 67, 63, 67].map((n, i) => [n - 12, .36 - i * .012]);
const ELISE = [76, 75, 76, 75, 76, 71, 74, 72, 69].map((n) => [n, .3]);
const SEQ = [];
let tt = 1.4;
for (const [world, list] of [[0, ODE], [1, KING], [2, ELISE]]) for (const [n, d] of list) { SEQ.push({ t: tt, n, world }); tt += d; }
const GONG = tt + .25, CUP = GONG + 1.6;
M.reel({
  W: 1920, H: 1080, DUR, bg: "#000",
  init(M) {
    const T = THREE, R = M.rng(3);
    const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1920, 1080); renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.domElement.style.cssText = "position:absolute;left:0;top:0"; M.stage.appendChild(renderer.domElement);
    const scene = new T.Scene(), cam = new T.PerspectiveCamera(40, 1920 / 1080, .1, 200);
    // studio environment (room with soft panels), for reflections
    const env = new T.Scene(); const room = new T.Mesh(new T.BoxGeometry(30, 20, 30), new T.MeshBasicMaterial({ color: 0x404048, side: T.BackSide })); env.add(room);
    [[0, 9.9, 0, 12, 12], [-14.9, 3, 0, 8, 6], [14.9, 5, 4, 6, 8]].forEach(([x, y, z, w, h], i) => { const p = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: 0xffffff })); p.position.set(x, y, z); p.lookAt(0, 0, 0); env.add(p); });
    scene.environment = new T.PMREMGenerator(renderer).fromScene(env, .02).texture;
    scene.fog = new T.Fog(0x101018, 14, 60);
    const key = new T.DirectionalLight(0xfff1e0, 2.2); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0004; key.shadow.normalBias = .03;
    Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: .5, far: 60 }); scene.add(key, key.target);
    const fill = new T.HemisphereLight(0xbfd0ff, 0x302020, .6); scene.add(fill);
    const rim = new T.DirectionalLight(0x9ab8ff, 1.2); scene.add(rim);
    // tower: a central column + one bar per note on a descending spiral
    const worldMat = [
      { bar: 0xece6dc, rough: .25, col: 0x0d0f14, emi: 0xffd9a0 },
      { bar: 0x4a3f7a, rough: .1, col: 0x08060e, emi: 0x8f7bff },
      { bar: 0xc9963c, rough: .2, col: 0x120c06, emi: 0xffc46a },
    ];
    const pts = [];
    let ang = 0, y = 0;
    SEQ.forEach((s, i) => { ang += .62; y -= .55 + (s.world === 1 ? .1 : 0); pts.push({ x: Math.cos(ang) * 3.2, y, z: Math.sin(ang) * 3.2, a: ang }); });
    const column = new T.Mesh(new T.CylinderGeometry(1.4, 1.4, -y + 8, 48), new T.MeshPhysicalMaterial({ color: 0x1b1b22, roughness: .5, clearcoat: .4 })); column.position.y = y / 2; column.receiveShadow = true; scene.add(column);
    const bars = SEQ.map((s, i) => {
      const w = worldMat[s.world], p = pts[i];
      const mat = new T.MeshPhysicalMaterial({ color: w.bar, roughness: w.rough, metalness: s.world === 2 ? .8 : 0, clearcoat: s.world === 0 ? .8 : .3, emissive: w.emi, emissiveIntensity: 0 });
      const geo = s.world === 1 ? new T.CylinderGeometry(.45, .55, .5, 6) : new T.BoxGeometry(1.7, .22, .7);
      const b = new T.Mesh(geo, mat); b.position.set(p.x, p.y - .2, p.z); b.rotation.y = -p.a; b.castShadow = b.receiveShadow = true; scene.add(b);
      // a little support arm to the column
      const arm = new T.Mesh(new T.BoxGeometry(1.8, .08, .12), new T.MeshPhysicalMaterial({ color: 0x2a2a30, roughness: .6, metalness: .6 })); arm.position.set(Math.cos(p.a) * 2.3, p.y - .35, Math.sin(p.a) * 2.3); arm.rotation.y = -p.a; scene.add(arm);
      return { b, mat, p, s };
    });
    // gong + teacup at the bottom
    const last = pts[pts.length - 1];
    const gp = { x: Math.cos(last.a + .62) * 3.4, y: last.y - 1.4, z: Math.sin(last.a + .62) * 3.4, a: last.a + .62 };
    const gong = new T.Group(); gong.position.set(gp.x, gp.y, gp.z); gong.rotation.y = -gp.a + Math.PI / 2; scene.add(gong);
    const disc = new T.Mesh(new T.CylinderGeometry(1.1, 1.1, .08, 64), new T.MeshPhysicalMaterial({ color: 0xc8933a, metalness: 1, roughness: .28, emissive: 0xffb34a, emissiveIntensity: 0 })); disc.rotation.x = Math.PI / 2; disc.castShadow = true; gong.add(disc);
    const boss = new T.Mesh(new T.SphereGeometry(.3, 32, 16), disc.material); boss.scale.z = .4; gong.add(boss);
    const cupP = { x: gp.x * 1.25, y: gp.y - 2.6, z: gp.z * 1.25 };
    const cupG = new T.Group(); cupG.position.set(cupP.x, cupP.y, cupP.z); scene.add(cupG);
    const porcelain = new T.MeshPhysicalMaterial({ color: 0xffffff, roughness: .15, clearcoat: 1 });
    const cupPts = []; for (let i = 0; i <= 20; i++) { const v = i / 20; cupPts.push(new T.Vector2(.55 + .45 * Math.sin(v * Math.PI / 2), v * .9)); }
    const cup = new T.Mesh(new T.LatheGeometry(cupPts, 48), new T.MeshPhysicalMaterial({ color: 0xffffff, roughness: .15, clearcoat: 1, side: T.DoubleSide })); cup.castShadow = true; cupG.add(cup);
    const tea = new T.Mesh(new T.CircleGeometry(.95, 48), new T.MeshPhysicalMaterial({ color: 0x8a4a1a, roughness: .05, transmission: .2 })); tea.rotation.x = -Math.PI / 2; tea.position.y = .72; cupG.add(tea);
    const handle = new T.Mesh(new T.TorusGeometry(.28, .07, 12, 24), porcelain); handle.position.set(1.05, .45, 0); cupG.add(handle);
    const saucer = new T.Mesh(new T.CylinderGeometry(1.5, 1.2, .1, 48), porcelain); saucer.position.y = -.05; saucer.receiveShadow = true; cupG.add(saucer);
    const floor = new T.Mesh(new T.CircleGeometry(30, 64), new T.MeshPhysicalMaterial({ color: 0x15151c, roughness: .35, clearcoat: .5 })); floor.rotation.x = -Math.PI / 2; floor.position.y = cupP.y - .1; floor.receiveShadow = true; scene.add(floor);
    // the ball
    const ball = new T.Mesh(new T.SphereGeometry(.32, 48, 32), new T.MeshPhysicalMaterial({ color: 0xd81e0a, roughness: .22, clearcoat: 1, clearcoatRoughness: .1 })); ball.castShadow = true; scene.add(ball);
    return { T, renderer, scene, cam, key, rim, bars, pts, gong, disc, gp, cupP, tea, ball, worldMat };
  },
  seek(t, P, M) {
    const { T, cam, bars, ball } = P, { seg, lerp, clamp, cubicIO, sine, spring, springO } = M;
    // ---- the ball: a hop between consecutive contact points, landing exactly on each note time
    const contacts = [{ t: 0, x: P.pts[0].x, y: P.pts[0].y + 6, z: P.pts[0].z }].concat(bars.map((b) => ({ t: b.s.t, x: b.p.x, y: b.p.y + .12, z: b.p.z })))
      .concat([{ t: GONG, x: P.gp.x * .78, y: P.gp.y, z: P.gp.z * .78 }, { t: CUP, x: P.cupP.x, y: P.cupP.y + .62, z: P.cupP.z }]);
    let i = contacts.findIndex((c, k) => k < contacts.length - 1 && t >= c.t && t < contacts[k + 1].t);
    let bp;
    if (i < 0) { const c = contacts[contacts.length - 1]; bp = new T.Vector3(c.x, c.y - Math.min(.2, (t - CUP) * .5), c.z); }
    else {
      const a = contacts[i], b = contacts[i + 1], u = (t - a.t) / (b.t - a.t), dur = b.t - a.t;
      const h = i === 0 ? 0 : Math.min(1.4, dur * dur * 4.5);   // ballistic-looking arc for the gap
      bp = new T.Vector3(lerp(a.x, b.x, u), lerp(a.y, b.y, i === 0 ? u * u : u) + h * 4 * u * (1 - u), lerp(a.z, b.z, u));
    }
    ball.position.copy(bp);
    const sinceHit = Math.min(...contacts.filter((c) => c.t <= t).map((c) => t - c.t));
    const sq = Math.exp(-sinceHit * 18) * .35;
    ball.scale.set(1 + sq, 1 - sq, 1 + sq);
    // ---- bars: light up on their beat and dip on a spring
    bars.forEach((b) => { const s = t - b.s.t; const on = s > 0 ? Math.exp(-s * 2.2) : 0; b.mat.emissiveIntensity = on * 4; b.b.position.y = b.p.y - .2 - (s > 0 ? .12 * Math.exp(-s * 7) * Math.cos(s * 22) : 0); });
    // ---- gong swings, glows a little; tea splashes
    const gs = t - GONG;
    P.gong.rotation.x = gs > 0 ? .35 * Math.exp(-gs * 1.5) * Math.sin(gs * 9) : 0;
    P.disc.material.emissiveIntensity = gs > 0 ? 1.4 * Math.exp(-gs * 1.8) : 0;
    const cs = t - CUP;
    P.tea.position.y = .72 + (cs > 0 ? .08 * Math.exp(-cs * 4) * Math.sin(cs * 26) : 0);
    // ---- world colour: background + fog follow the music
    const w = t < SEQ.find((s) => s.world === 1).t ? 0 : t < SEQ.find((s) => s.world === 2).t ? 1 : 2;
    const bgc = [0xe9e4dc, 0x0b0814, 0x1a1208][w];
    P.scene.background = new T.Color(bgc).convertSRGBToLinear();
    P.scene.fog.color.set(bgc).convertSRGBToLinear();
    P.key.position.set(bp.x + 6, bp.y + 10, bp.z + 6); P.key.target.position.copy(bp);
    P.rim.position.set(bp.x - 8, bp.y + 4, bp.z - 8);
    // ---- camera shots (one named move each)
    let pos, look, fov = 40;
    const tw = SEQ.find((s) => s.world === 1).t, te = SEQ.find((s) => s.world === 2).t;
    if (t < 3) { const a = cubicIO(t / 3); pos = new T.Vector3(lerp(14, 9, a), lerp(10, 3, a), lerp(14, 9, a)); look = new T.Vector3(0, lerp(-4, -1, a), 0); fov = 46; }        // establishing crane down
    else if (t < tw) { const a = (t - 3) / (tw - 3); pos = new T.Vector3(Math.cos(.8 + a * 2.4) * 9, bp.y + 2.4, Math.sin(.8 + a * 2.4) * 9); look = new T.Vector3(bp.x * .5, bp.y - .4, bp.z * .5); }   // orbit with the ball
    else if (t < te) { const a = cubicIO((t - tw) / (te - tw)); const r = new T.Vector3(bp.x, 0, bp.z).normalize(); pos = bp.clone().add(r.multiplyScalar(lerp(7, 5, a))).add(new T.Vector3(0, lerp(3, .8, a), 0)); look = new T.Vector3(bp.x * .5, bp.y - .5, bp.z * .5); fov = lerp(44, 36, a); } // dolly down
    else if (t < GONG - .3) { const r = new T.Vector3(bp.x, 0, bp.z).normalize(); const sd = new T.Vector3(-r.z, 0, r.x); pos = bp.clone().add(r.multiplyScalar(4.5)).add(sd.multiplyScalar(1.5)).add(new T.Vector3(0, 1.2, 0)); look = bp.clone(); fov = 38; }   // tracking
    else if (t < CUP + 1.2) { const a = sine(seg(t, GONG - .3, CUP + 1.2)); const g = new T.Vector3(P.gp.x, P.gp.y, P.gp.z); const rr = new T.Vector3(P.gp.x, 0, P.gp.z).normalize(); pos = g.clone().add(rr.multiplyScalar(lerp(7, 5, a))).add(new T.Vector3(0, lerp(.2, -.8, a), 0)); look = g.clone().lerp(new T.Vector3(P.cupP.x, P.cupP.y, P.cupP.z), seg(t, GONG + .3, CUP)); fov = 32; } // signature push-in, rack to the cup
    else { const a = cubicIO(seg(t, CUP + 1.2, DUR)); const c = new T.Vector3(P.cupP.x, P.cupP.y, P.cupP.z); pos = c.clone().add(new T.Vector3(lerp(3, 16, a), lerp(1, 11, a), lerp(3, 16, a))); look = c.clone().lerp(new T.Vector3(0, -4, 0), a); fov = 44; }   // final wide
    // light every key in the final wide (new light)
    if (t > CUP + 1.2) bars.forEach((b) => { b.mat.emissiveIntensity = Math.max(b.mat.emissiveIntensity, 1.2 * seg(t, CUP + 1.4 + (b.s.t / CUP) * 1.5, CUP + 2 + (b.s.t / CUP) * 1.5)); });
    cam.position.copy(pos); cam.fov = fov; cam.updateProjectionMatrix(); cam.lookAt(look);
    P.renderer.render(P.scene, cam);
  },
  sound(A) {
    // marimba / crystal / bell timbres per world, each note exactly at its bounce
    SEQ.forEach((s) => {
      const f = m(s.n);
      if (s.world === 0) { A.tone(s.t, f, .6, "sine", .22); A.tone(s.t, f * 4, .12, "sine", .05); A.click(s.t, .05); }
      if (s.world === 1) { A.tone(s.t, f, .35, "triangle", .16); A.tone(s.t, f * 2, .25, "sine", .06); A.bass(s.t, f / 2, .3, .12); }
      if (s.world === 2) { A.tone(s.t, f, 1.2, "sine", .14); A.tone(s.t, f * 2.76, .8, "sine", .05); A.tone(s.t, f * 5.4, .3, "sine", .02); }
    });
    A.pad(1.4, [48, 55, 64].map(m), SEQ.find((s) => s.world === 1).t - 1.4, .03);
    // the gong, then a tiny "plip" into the tea, then a contented chord
    [55, 82, 110, 131].forEach((f, i) => A.tone(GONG, f * 1.0, 3.2, "sine", .18 / (i + 1)));
    A.nz(GONG, 1.6, "bandpass", 900, .12, 3);
    A.tone(CUP, 1400, .12, "sine", .2); A.tone(CUP + .02, 900, .1, "sine", .1); A.nz(CUP, .25, "highpass", 2500, .08);
    A.pad(CUP + 1.2, [60, 64, 67, 72].map(m), DUR - CUP - 1.2, .035);
  },
});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script><script src="../../lib/three.min.js"></script></head><body>
<script>
// #40 Sunset dogfight over the sea, in a hand-painted animated-film look (three.js, every frame from time).
// Signature shot (13–16 s): above the clouds, the red seaplane banks hard across a huge low sun, a white fighter
// slicing past behind it, lilac cumulus below; "just breathe." appears once, quietly.
// Shots: 0–4 crane up from the water (wide) · 4–7 low dolly over the sea · 7–10 orbit the red plane · 10–13 push up
// through the clouds · 13–16.5 signature · 16.5–20 final wide, the sun now touching the horizon.
const DUR = 20;
M.reel({
  W: 1920, H: 1080, DUR, bg: "#2a1f3d",
  fonts: { PF: ["Playfair_Display_ital_wght_1_500.ttf", "500", "italic"] },
  init(M) {
    const T = THREE, R = M.rng(7);
    const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(1920, 1080);
    renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.domElement.style.cssText = "position:absolute;left:0;top:0";
    M.stage.appendChild(renderer.domElement);
    const scene = new T.Scene();
    const cam = new T.PerspectiveCamera(38, 1920 / 1080, 1, 6000);
    // ---- painted sky dome (sun direction shared with the sea and the light)
    const sunDir = new T.Vector3(0, .12, -1).normalize();
    const skyU = { uSun: { value: sunDir.clone() }, uLow: { value: 0 } };
    const sky = new T.Mesh(new T.SphereGeometry(5000, 48, 24), new T.ShaderMaterial({
      side: T.BackSide, depthWrite: false, uniforms: skyU,
      vertexShader: "varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }",
      fragmentShader: `uniform vec3 uSun; uniform float uLow; varying vec3 vD;
        float h(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5); }
        void main(){
          float y = clamp(vD.y, -.1, 1.);
          vec3 top = mix(vec3(.30,.26,.52), vec3(.20,.16,.38), uLow);
          vec3 mid = mix(vec3(.86,.55,.62), vec3(.78,.42,.52), uLow);
          vec3 hor = mix(vec3(1.0,.72,.42), vec3(1.0,.55,.30), uLow);
          vec3 c = mix(hor, mid, smoothstep(0., .18, y)); c = mix(c, top, smoothstep(.18, .7, y));
          float s = max(dot(normalize(vD), normalize(uSun)), 0.);
          c += vec3(1.,.75,.45) * pow(s, 18.) * .55;            // warm air around the sun
          c = mix(c, vec3(1.,.93,.78), smoothstep(.9975, .9985, s)); // the disc itself
          // painterly streaks: horizontal brush bands
          c += (h(floor(vec2(vD.x*40., vD.y*220.))) - .5) * .025;
          gl_FragColor = vec4(c, 1.);
        }`,
    }));
    scene.add(sky);
    // ---- environment for reflections, from a copy of the sky
    const pm = new T.PMREMGenerator(renderer);
    const envScene = new T.Scene(); envScene.add(sky.clone());
    scene.environment = pm.fromScene(envScene, .04).texture;
    scene.fog = new T.Fog(0xd88a86, 400, 2600);
    // ---- lights: key (the sun), fill (sky), rim (cool, opposite)
    const key = new T.DirectionalLight(0xffc48a, 2.6); key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0004; key.shadow.normalBias = .4;
    const sc = key.shadow.camera; sc.left = -120; sc.right = 120; sc.top = 120; sc.bottom = -120; sc.near = 1; sc.far = 900;
    scene.add(key, key.target);
    scene.add(new T.HemisphereLight(0xb7a6e8, 0x6a3a50, .9));
    const rim = new T.DirectionalLight(0x9fb8ff, .9); rim.position.set(0, 200, 600); scene.add(rim);
    // ---- the sea: stylised waves + a painted reflection road toward the sun
    const seaU = { uT: { value: 0 }, uSun: { value: sunDir.clone() }, uCam: { value: new T.Vector3() }, uLow: { value: 0 } };
    const sea = new T.Mesh(new T.PlaneGeometry(9000, 9000, 1, 1), new T.ShaderMaterial({
      uniforms: seaU, fog: false,
      vertexShader: "varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
      fragmentShader: `uniform float uT; uniform vec3 uSun; uniform vec3 uCam; uniform float uLow; varying vec3 vW;
        float n(vec2 p){ return sin(p.x*.031 + uT*.9)*sin(p.y*.027 - uT*.7) + .5*sin(p.x*.071 - p.y*.053 + uT*1.6); }
        void main(){
          vec3 V = normalize(uCam - vW);
          float e = .6;
          vec3 N = normalize(vec3(-(n(vW.xz + vec2(e,0.)) - n(vW.xz - vec2(e,0.))) * .9, 1., -(n(vW.xz + vec2(0.,e)) - n(vW.xz - vec2(0.,e))) * .9));
          vec3 Rf = reflect(-V, N);
          float s = max(dot(Rf, normalize(uSun)), 0.);
          float dist = length(uCam - vW);
          vec3 deep = mix(vec3(.18,.18,.38), vec3(.14,.12,.30), uLow), lit = vec3(.78,.46,.55);
          float fres = pow(1. - max(V.y, 0.), 4.);
          vec3 c = mix(deep, lit, fres * .85);
          // the road of light: broken into painterly dabs
          float dab = step(.35, fract(sin(dot(floor(vW.xz * vec2(.05, .22)), vec2(12.9, 78.2))) * 43758.5));
          c += vec3(1.,.78,.5) * pow(s, 60.) * (1.4 + dab) ;
          c = mix(c, vec3(.85,.55,.6), smoothstep(800., 3200., dist));   // haze toward the horizon
          gl_FragColor = vec4(c, 1.);
        }`,
    }));
    sea.rotation.x = -Math.PI / 2; scene.add(sea);
    // ---- cumulus: soft clusters of blobs, lilac with warm tops; each blob springs away from a passing plane
    const cloudMat = new T.MeshStandardMaterial({ color: 0xa894cf, roughness: 1, metalness: 0, emissive: 0x2a1d44, emissiveIntensity: .45, envMapIntensity: .4 });
    const clouds = [];
    const blobGeo = new T.IcosahedronGeometry(1, 3);
    // a cloud deck the planes climb through (y 140–160), plus towering cumulus far off on the horizon
    for (let i = 0; i < 60; i++) {
      const far = i >= 44;
      const cx = far ? (R() - .5) * 3000 : (R() - .5) * 1100, cz = far ? -1700 - R() * 900 : -R() * 1400 + 250, cy = far ? 60 + R() * 80 : 140 + R() * 20;
      const g = new T.Group(); g.position.set(cx, cy, cz);
      const n = far ? 10 : 6 + Math.floor(R() * 8), blobs = [];
      if (far) g.scale.set(3.2, 2.4, 3.2);
      for (let k = 0; k < n; k++) {
        const b = new T.Mesh(blobGeo, cloudMat); const s = 14 + R() * 26;
        b.scale.setScalar(s); b.position.set((R() - .5) * 90, (R() - .3) * 26, (R() - .5) * 60); b.userData.home = b.position.clone();
        b.castShadow = false; b.receiveShadow = true; g.add(b); blobs.push(b);
      }
      scene.add(g); clouds.push({ g, blobs });
    }
    // ---- the planes, modelled in code; liveries red / white / green
    const plane = (body, trim) => {
      const g = new T.Group();
      const mBody = new T.MeshPhysicalMaterial({ color: body, roughness: .38, metalness: .05, clearcoat: .6, clearcoatRoughness: .3 });
      const mTrim = new T.MeshPhysicalMaterial({ color: trim, roughness: .5, metalness: .2 });
      const fus = new T.Mesh(new T.CapsuleGeometry(1.3, 9, 8, 16), mBody); fus.rotation.x = Math.PI / 2; g.add(fus);
      const wing = new T.Mesh(new T.BoxGeometry(18, .35, 3.2), mBody); wing.position.set(0, 1.1, -1); g.add(wing);
      const wing2 = new T.Mesh(new T.BoxGeometry(14, .3, 2.6), mTrim); wing2.position.set(0, -1, -.6); g.add(wing2);
      const tail = new T.Mesh(new T.BoxGeometry(6, .25, 1.8), mBody); tail.position.set(0, .4, 5.4); g.add(tail);
      const fin = new T.Mesh(new T.BoxGeometry(.25, 2.6, 1.8), mTrim); fin.position.set(0, 1.6, 5.4); g.add(fin);
      const nose = new T.Mesh(new T.CylinderGeometry(1.2, 1.4, 1.2, 16), mTrim); nose.rotation.x = Math.PI / 2; nose.position.z = -5.9; g.add(nose);
      const prop = new T.Mesh(new T.CircleGeometry(2.6, 24), new T.MeshBasicMaterial({ color: 0x222222, transparent: true, opacity: .18, side: T.DoubleSide })); prop.position.z = -6.6; g.add(prop);
      const pod = (x) => { const p = new T.Mesh(new T.CapsuleGeometry(.6, 5, 6, 12), mTrim); p.rotation.x = Math.PI / 2; p.position.set(x, -2.6, -1); g.add(p); };
      pod(-3.5); pod(3.5);
      g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      scene.add(g);
      return g;
    };
    const red = plane(0xc8322b, 0x3a2f2a), white = plane(0xf1ece2, 0x2f4f7a), green = plane(0x4f7a46, 0xd9c79a);
    // ---- text
    const txt = M.el("div", "", "position:absolute;left:0;top:820px;width:1920px;text-align:center;font:italic 500 46px PF;color:#fff6ea;letter-spacing:.04em;opacity:0;", "just breathe.");
    return { T, renderer, scene, cam, sky, skyU, seaU, sea, key, clouds, red, white, green, txt, sunDir };
  },
  seek(t, P, M) {
    const { T, cam } = P, { seg, lerp, cubicIO, sine, spring, clamp } = M;
    // ---- flight paths (lead + two pursuers), climbing above the cloud deck after 10 s
    const lead = (s) => new T.Vector3(70 * Math.sin(s * .32), 26 + 7 * Math.sin(s * .5) + 170 * cubicIO(seg(s, 9.5, 13.5)), -46 * s);
    const chase = (s, k) => { const p = lead(s - .9 - k * .5); p.x += (k ? -1 : 1) * (14 + 9 * Math.sin(s * .9 + k)); p.y += (k ? 6 : -4) + 4 * Math.cos(s * .7); return p; };
    const place = (obj, f, s) => {
      const p = f(s), q = f(s + .05), q2 = f(s + .1);
      obj.position.copy(p);
      obj.lookAt(q.clone().multiplyScalar(2).sub(p));   // nose forward
      obj.rotateY(Math.PI);
      const turn = ((q2.x - q.x) - (q.x - p.x)) * 18;     // lateral acceleration → bank
      obj.rotateZ(clamp(-turn, -1.1, 1.1));
      obj.children[6].rotation.z = s * 60;                // propeller
    };
    // signature: the red plane banks much harder for a moment (a spring kick)
    const kick = 13.2 < t ? (spring(t - 13.2, 5) - spring(t - 15.2, 5)) : 0;
    place(P.red, lead, t); P.red.rotateZ(-.9 * kick);
    place(P.white, (s) => chase(s, 0), t); place(P.green, (s) => chase(s, 1), t);
    // the sun sinks a little through the film
    const low = sine(seg(t, 0, DUR));
    const sd = new T.Vector3(0, lerp(.12, .035, low), -1).normalize();
    P.skyU.uSun.value.copy(sd); P.skyU.uLow.value = low; P.seaU.uSun.value.copy(sd); P.seaU.uLow.value = low; P.seaU.uT.value = t;
    const L = lead(t);
    P.key.position.copy(L).add(sd.clone().multiplyScalar(500)); P.key.target.position.copy(L); P.key.intensity = lerp(2.6, 2.0, low);
    // ---- camera shots, each with one named move, eased
    let pos, look, fov = 38;
    const S1 = (u) => { const a = cubicIO(u); pos = L.clone().add(new T.Vector3(-160, lerp(4, 70, a), 260)); look = L.clone().add(new T.Vector3(0, 10, -120)); fov = 44; };            // crane up
    const S2 = (u) => { const a = cubicIO(u); pos = L.clone().add(new T.Vector3(lerp(26, 14, a), lerp(-18, -20, a), lerp(40, 26, a))); pos.y = Math.max(pos.y, 4); look = L.clone().add(new T.Vector3(0, 2, -40)); fov = 40; }; // dolly
    const S3 = (u) => { const a = lerp(-.9, 1.3, cubicIO(u)); pos = L.clone().add(new T.Vector3(Math.sin(a) * 34, 6, Math.cos(a) * 34)); look = L.clone(); fov = 36; };                // orbit
    const S4 = (u) => { const a = cubicIO(u); pos = L.clone().add(new T.Vector3(10, lerp(-40, -8, a), lerp(70, 34, a))); look = L.clone().add(new T.Vector3(0, 8, -30)); fov = lerp(42, 34, a); }; // push up through the cloud deck
    const S5 = (u) => { const a = sine(u); pos = L.clone().add(new T.Vector3(lerp(-16, -12, a), lerp(3, 5, a), lerp(50, 40, a))); look = L.clone().add(new T.Vector3(lerp(10, 6, a), 2, -160)); fov = 32; };     // signature: slow push-in, sun behind
    const S6 = (u) => { const a = cubicIO(u); pos = L.clone().add(new T.Vector3(lerp(-50, -260, a), lerp(0, 120, a), lerp(40, 340, a))); look = L.clone().add(new T.Vector3(0, -20, -200)); fov = 40; }; // pull-back wide
    if (t < 4) S1(t / 4); else if (t < 7) S2((t - 4) / 3); else if (t < 10) S3((t - 7) / 3); else if (t < 13) S4((t - 10) / 3); else if (t < 16.5) S5((t - 13) / 3.5); else S6((t - 16.5) / 3.5);
    cam.position.copy(pos); cam.fov = fov; cam.updateProjectionMatrix(); cam.lookAt(look);
    P.sea.position.set(cam.position.x, 0, cam.position.z);
    P.seaU.uCam.value.copy(cam.position);
    P.sky.position.copy(cam.position);
    // ---- clouds react: blobs near any plane are pushed away and spring back (displacement as a function of distance)
    const planes = [P.red.position, P.white.position, P.green.position];
    P.clouds.forEach(({ g, blobs }) => {
      const near = planes.some((p) => Math.abs(p.z - g.position.z) < 160);
      blobs.forEach((b) => {
        b.position.copy(b.userData.home);
        if (!near) return;
        const w = b.getWorldPosition(new T.Vector3());
        planes.forEach((p) => { const d = w.clone().sub(p), l = d.length(); if (l < 60) b.position.add(d.normalize().multiplyScalar((60 - l) * .5)); });
      });
    });
    // ---- the line, once, quietly
    const a = clamp(seg(t, 13.8, 14.8)) * (1 - seg(t, 16.0, 16.6));
    P.txt.style.opacity = a; P.txt.style.transform = `translateY(${(1 - a) * 8}px)`;
    P.renderer.render(P.scene, cam);
  },
  sound(A) {
    const m = A.midi;
    // engines: two detuned saws through a low-pass, swelling as planes pass the camera
    const eng = (f, g0) => { const o = A.ctx.createOscillator(), fl = A.ctx.createBiquadFilter(), g = A.ctx.createGain(); o.type = "sawtooth"; o.frequency.value = f; fl.type = "lowpass"; fl.frequency.value = 500; g.gain.value = g0; o.connect(fl).connect(g).connect(A.out); o.start(0); o.stop(DUR); return g; };
    const g1 = eng(92, .03), g2 = eng(97, .025);
    [[4, .08], [7.5, .06], [10.5, .07], [13.5, .09]].forEach(([t0, v]) => { g1.gain.setValueAtTime(.03, t0 - .8); g1.gain.linearRampToValueAtTime(v, t0); g1.gain.linearRampToValueAtTime(.03, t0 + 1.2); });
    A.whoosh(4, 1, .15); A.whoosh(10.5, 2.2, .2);
    // wind + sea
    { const b = A.ctx.createBufferSource(); b.buffer = A.noise; b.loop = true; const f = A.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 600; const g = A.ctx.createGain(); g.gain.value = .07; b.connect(f).connect(g).connect(A.out); b.start(0); b.stop(DUR); }
    // a gentle waltz on strings + piano, rising to the signature shot
    const chords = [[50, 57, 62, 66], [47, 54, 59, 62], [43, 50, 55, 59], [45, 52, 57, 61]];
    for (let b = 0; b < 10; b++) { const c = chords[b % 4]; A.pad(b * 2, c.map(m), 2.1, .03 + (b >= 6 ? .015 : 0)); for (let k = 0; k < 3; k++) A.pluck(b * 2 + k * .667, m(c[k === 0 ? 0 : k] + 12), k === 0 ? .08 : .05, .6); }
    [74, 76, 78, 81, 79, 78, 76, 74].forEach((n, i) => A.tone(13.3 + i * .42, m(n), .9, "sine", .06));
  },
});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #123 (عنصر: فيلم إطلاق ورقي) Paper-style launch film — any product (the template's {{PRODUCT}}). 15 s, no voice, no footage.
// Paper canvas, marker notes that draw on (Caveat, stroke reveal), a red ball with real bounce physics, huge Anton type,
// hard light/dark switches, a new idea every ~1.8 s, a sound on every hit. No invented results, no numbers.
const G1 = "١ · الفكرة", G2 = "٢ · بيتعلّم براندك", G3 = "٣ · المميزات", G4 = "٤ · الخطوات", G5 = "٥ · النهاية", GC = "الألوان";
const PR = M.params({
  hook: { label: "الجملة الأولى", kind: "text", def: "ONE IDEA.", group: G1, max: 12, hint: "جملة قصيرة جدًا بخط ضخم." },
  hookNote: { label: "ملاحظة بخط اليد تحتها", kind: "text", def: "that's all you bring", group: G1, max: 26, hint: "ملاحظة بخط اليد تُرسم تحتها." },
  word: { label: "الكلمة التي تقفز عليها الكرة", kind: "text", def: "IDEA.", group: G1, max: 10, hint: "تقفز الكرة الحمراء عليها وتطير." },
  l1: { label: "مشهد غامق (سطر ١)", kind: "text", def: "IT LEARNS", group: G2, max: 12 },
  l2: { label: "مشهد غامق (سطر ٢، ملوّن)", kind: "text", def: "YOUR BRAND.", group: G2, max: 14 },
  notes: { label: "٣ ملاحظات بخط اليد", kind: "lines", def: ["your colours", "your voice", "your audience"], group: G2, max: 18, hint: "٣ ملاحظات بخط اليد." },
  cards: { label: "٤ بطاقات (المميزات أو المنتجات)", kind: "lines", def: ["REELS", "ADS", "CAROUSELS", "DUBBING"], group: G3, max: 10, hint: "٤ بطاقات: كلمة واحدة لكل بطاقة." },
  cardsNote: { label: "ملاحظة تحت البطاقات", kind: "text", def: "every format, one place", group: G3, max: 26 },
  b1: { label: "كلمة كبيرة (سطر ١)", kind: "text", def: "ARABIC", group: G3, max: 10 },
  b2: { label: "كلمة كبيرة (سطر ٢، ملوّن)", kind: "text", def: "FIRST.", group: G3, max: 10 },
  bNote: { label: "ملاحظة بجانبها", kind: "text", def: "and English too", group: G3, max: 20 },
  steps: { label: "الخطوات (٥)", kind: "lines", def: ["SCRIPT", "VOICE", "SCENES", "EDIT", "EXPORT"], group: G4, max: 10, hint: "٥ خطوات، كلمة لكل خطوة: تقفز الكرة عليها واحدة تلو الأخرى." },
  slam: { label: "٤ كلمات تضرب (الأخيرة ملوّنة)", kind: "lines", def: ["ALL", "IN", "ONE", "STUDIO."], group: G4, max: 10, hint: "٤ كلمات تضرب على الإيقاع، الأخيرة ملوّنة." },
  logo: { label: "الشعار", kind: "image", role: "logo", def: "", group: G5 },
  name: { label: "اسم العلامة", kind: "text", role: "brand", def: "STUDIOMANIA", group: G5, max: 16 },
  endNote: { label: "ملاحظة في النهاية", kind: "text", role: "cta", def: "start with one idea.", group: G5, max: 28 },
  paper: { label: "الورق", kind: "color", role: "bg", def: "#f5f1e8", group: GC },
  ink: { label: "لون النص", kind: "color", role: "ink", def: "#161616", group: GC },
  red: { label: "لون الكرة", kind: "color", role: "accent", def: "#e8402f", group: GC },
  blue: { label: "لون الملاحظات", kind: "color", role: "accent2", def: "#2f5bff", group: GC },
});
M.meta({
  story: "فيلم إطلاق بأسلوب الورق: أوراق وملاحظات بالقلم العريض تُرسم، وكرة حمراء تقفز بفيزياء حقيقية، وكلام ضخم، وتبديل بين الفاتح والغامق، وفكرة جديدة كل ثانيتين تقريبًا مع صوت عند كل ضربة.",
  scenes: [{ name: G1, t0: 0, t1: 3.6, about: "الجملة الأولى والكورة" }, { name: G2, t0: 3.6, t1: 5.4, about: "مشهد غامق وملاحظات" }, { name: G3, t0: 5.4, t1: 9, about: "الكروت والكلمة الكبيرة" }, { name: G4, t0: 9, t1: 12.6, about: "الخطوات والكلمات اللي بتخبط" }, { name: G5, t0: 12.6, t1: 15, about: "الشعار والاسم" }],
  tips: ["لا أرقام ولا نتائج: الفيلم عن الفكرة.", "كلمة أو كلمتان في كل خانة: الخط ضخم.", "مناسب لإطلاق منتج أو خدمة جديدة."],
});
const PAPER = PR.paper, INK = PR.ink, RED = PR.red, BLUE = PR.blue, CHAR = "#1d1c1a";
const L = (arr, n) => Array.from({ length: n }, (_, i) => arr[i] ?? "");
const G = 3200;   // gravity, px/s²
M.reel({
  W: 1920, H: 1080, DUR: 15, bg: PAPER,
  fonts: { AN: "anton.ttf", CV: ["Caveat_wght_500.ttf", "500"], JO: "Jost.ttf" },
  async init(M) { const c = M.canvas(1920, 1080); return { x: c.getContext("2d"), img: await M.img(PR.logo) }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, expo, expoIn, expoIO, spring, springO, clamp } = M;
    const S = [0, 1.8, 3.6, 5.4, 7.2, 9.0, 10.8, 12.6, 15];
    const sc = S.findIndex((s, i) => t >= s && t < S[i + 1]), lt = t - S[sc];
    const dark = sc === 2 || sc === 4 || sc === 6;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = dark ? CHAR : PAPER; x.fillRect(0, 0, 1920, 1080);
    // paper grain
    if (!dark) for (let i = 0; i < 300; i++) { x.fillStyle = `rgba(120,100,70,${.05 * M.hash(i)})`; x.fillRect(M.hash(i * 3.1) * 1920, M.hash(i * 7.3) * 1080, 2, 2); }
    const fg = dark ? PAPER : INK;
    const big = (s, px, X, Y, col, sx = 1, sy = 1, maxW = 1760) => { s = String(s ?? ""); px = M.fit(s, "AN", maxW, px, 20); x.save(); x.translate(X, Y); x.scale(sx, sy); x.direction = M.isAr(s) ? "rtl" : "ltr"; x.font = `400 ${px}px AN`; x.fillStyle = col; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillText(s, 0, 0); x.direction = "ltr"; x.restore(); };
    // marker note: handwriting revealed left→right like a pen stroke, with a drawn underline
    // العربي بيتكتب من اليمين للشمال (القلم بيمشي في الاتجاه الصح)
    const note = (s, px, X, Y, col, tin, dur = .6, rot = -.04) => { s = String(s ?? ""); const k = clamp((t - tin) / dur); if (k <= 0 || !s) return; x.save(); x.translate(X, Y); x.rotate(rot); x.font = `500 ${px}px CV`; const w = x.measureText(s).width, ar = M.isAr(s); x.beginPath(); if (ar) x.rect(w + 10 - (w + 20) * k, -px, (w + 20) * k, px * 1.6); else x.rect(-10, -px, (w + 20) * k, px * 1.6); x.clip(); x.fillStyle = col; x.direction = ar ? "rtl" : "ltr"; x.textAlign = ar ? "right" : "left"; x.textBaseline = "alphabetic"; x.fillText(s, ar ? w : 0, 0); x.restore(); };
    const scribble = (X, Y, w, col, tin, dur = .4) => { const k = clamp((t - tin) / dur); if (k <= 0) return; x.strokeStyle = col; x.lineWidth = 9; x.lineCap = "round"; x.beginPath(); for (let i = 0; i <= 40 * k; i++) { const u = i / 40; x.lineTo(X + u * w, Y + Math.sin(u * 18) * 5); } x.stroke(); };
    const ball = (X, Y, sq) => { x.save(); x.translate(X, Y); x.scale(1 + sq, 1 - sq); x.fillStyle = RED; x.beginPath(); x.arc(0, 0, 46, 0, 7); x.fill(); x.restore(); };
    // physics helper: a ball dropped from y0 onto floor yF, restitution e; returns {y, sq} at time s
    const bounce = (s, y0, yF, e = .55) => {
      let h = yF - y0, tt = s, v = 0, y = y0, first = Math.sqrt(2 * h / G);
      if (tt < first) return { y: y0 + .5 * G * tt * tt, sq: 0 };
      tt -= first; v = Math.sqrt(2 * G * h) * e;
      for (let k = 0; k < 6; k++) { const dur = 2 * v / G; if (tt < dur) { const yy = yF - (v * tt - .5 * G * tt * tt); const imp = Math.exp(-tt * 30) * .35 * Math.min(1, v / 1200); return { y: yy, sq: imp }; } tt -= dur; v *= e; }
      return { y: yF, sq: 0 };
    };
    // ---------- 0–1.8: "ONE IDEA." + underline
    if (sc === 0) { const k = spring(lt, 14); big(PR.hook, 300, 960, 620, INK, lerp(1.3, 1, k), lerp(.7, 1, k)); scribble(560, 680, 800, RED, .5); note(PR.hookNote, 70, M.isAr(PR.hookNote) ? 1000 : 1180, 820, BLUE, .9); }
    // ---------- 1.8–3.6: the ball drops onto IDEA and squashes it; leaves the floor at 3.2 → dark switch while airborne
    if (sc === 1) {
      const b = bounce(lt, -80, 470); const hit = lt > Math.sqrt(2 * 550 / G);
      const squash = hit ? Math.exp(-(lt - Math.sqrt(2 * 550 / G)) * 7) : 0;
      big(PR.word, 300, 960, 620, INK, 1 + squash * .25, 1 - squash * .35);
      const fly = seg(lt, 1.4, 1.8); const y = lt < 1.4 ? b.y : lerp(470, -200, fly * fly);
      ball(960, y, lt < 1.4 ? b.sq : -.15);
    }
    // ---------- 3.6–5.4 (dark): it learns your brand — marker notes in the accents
    if (sc === 2) {
      big(PR.l1, 210, 960, 420, PAPER); big(PR.l2, 210, 960, 660, RED);
      const NT = L(PR.notes, 3); note(NT[0], 64, 300, 860, BLUE, 3.9); note(NT[1], 64, 820, 900, PAPER, 4.3); note(NT[2], 64, 1300, 860, BLUE, 4.7);
      const b = bounce(lt, -200, 760, .5); ball(1700, b.y, b.sq);
    }
    // ---------- 5.4–7.2 (light): the ball hops across format cards, each one flips up as it lands
    if (sc === 3) {
      const cards = L(PR.cards, 4);
      cards.forEach((c, i) => { const land = .25 + i * .38, k = spring(lt - land, 16); const X = 330 + i * 420; x.save(); x.translate(X, 640); x.scale(1, Math.max(.05, k)); x.fillStyle = i % 2 ? BLUE : INK; x.beginPath(); x.roundRect(-180, -120, 360, 240, 26); x.fill(); x.font = `400 ${M.fit(c, "AN", 320, 70, 20)}px AN`; x.fillStyle = PAPER; x.textAlign = "center"; x.textBaseline = "middle"; x.direction = M.isAr(c) ? "rtl" : "ltr"; x.fillText(c, 0, 0); x.direction = "ltr"; x.restore(); });
      // hop: parabola between card tops
      const seg2 = .38, k = Math.min(3, Math.floor(Math.max(0, lt - .25) / seg2)), u = clamp((lt - .25 - k * seg2) / seg2);
      const X0 = 330 + k * 420, X1 = 330 + Math.min(3, k + 1) * 420; const bx = lt < .25 ? 330 : lerp(X0, X1, u), by = lt < .25 ? lerp(-100, 470, (lt / .25) ** 2) : 470 - Math.sin(u * Math.PI) * 220;
      ball(bx, by, u < .08 ? .2 : 0);
      note(PR.cardsNote, 60, 640, 920, RED, 6.2, .7, .02);
    }
    // ---------- 7.2–9.0 (dark): Arabic first
    if (sc === 4) { const k = springO(lt, 12, .6); big(PR.b1, 280, 960, 520, PAPER, k, k); big(PR.b2, 280, 960, 820, RED, k, k); x.strokeStyle = BLUE; x.lineWidth = 10; const r = clamp((lt - .6) / .5); x.beginPath(); x.ellipse(960, 720, 380, 150, -.05, -1.2, -1.2 + r * 6.6); x.stroke(); note(PR.bNote, 60, 1340, 960, BLUE, 8.0); }
    // ---------- 9.0–10.8 (light): from script to export — the ball rolls along the steps
    if (sc === 5) {
      const steps = L(PR.steps, 5), RS = M.isAr(steps.join(""));
      x.strokeStyle = INK; x.lineWidth = 6; x.beginPath(); x.moveTo(200, 600); x.lineTo(lerp(200, 1720, expo(seg(lt, 0, .5))), 600); x.stroke();
      steps.forEach((s, i) => { const X = 200 + (RS ? 4 - i : i) * 380, k = expo(seg(lt, .2 + i * .2, .4 + i * .2)); x.fillStyle = INK; x.beginPath(); x.arc(X, 600, 18 * k, 0, 7); x.fill(); x.globalAlpha = k; big(s, 90, X, 520, INK, 1, 1, 360); x.globalAlpha = 1; });
      const roll = expoIO(seg(lt, .2, 1.6)); ball(RS ? lerp(1720, 200, roll) : lerp(200, 1720, roll), 554, 0);
    }
    // ---------- 10.8–12.6 (dark): airborne ball, type slams on each hit
    if (sc === 6) {
      const words = L(PR.slam, 4);
      words.forEach((w, i) => { const tin = .1 + i * .35; const k = spring(lt - tin, 22); if (lt < tin) return; big(w, 230, 960, 260 + i * 230, i === 3 ? RED : PAPER, lerp(1.5, 1, k), lerp(1.5, 1, k)); });
      ball(lerp(200, 1720, lt / 1.8), 900 - Math.sin(lt / 1.8 * Math.PI) * 820, 0);
    }
    // ---------- 12.6–15 (light): the logo — the ball lands into the O; sub-hit
    if (sc === 7) {
      // الشعار (صورة) أو الاسم، والكورة بتنزل وتقعد نقطة تحته
      const oy = 500, a = expo(seg(lt, .4, .9)), img = P.img;
      let bottom = oy + 70;
      x.globalAlpha = a;
      if (img) { const k = Math.min(1100 / img.width, 300 / img.height); x.drawImage(img, 960 - img.width * k / 2, oy - img.height * k / 2, img.width * k, img.height * k); bottom = oy + img.height * k / 2; }
      else { const nm = String(PR.name || ""), ar = M.isAr(nm); x.fillStyle = INK; x.textBaseline = "middle"; x.textAlign = "center"; x.direction = ar ? "rtl" : "ltr"; x.font = `${ar ? 800 : 400} ${M.fit(nm, ar ? "AN" : "JO", 1500, 130, 40)}px ${ar ? "AN" : "JO"}`; if (!ar) x.letterSpacing = "32px"; x.fillText(nm, 960, oy + 4); x.letterSpacing = "0px"; x.direction = "ltr"; }
      x.globalAlpha = 1;
      const land = Math.min(1, lt / .45), by = lerp(-120, bottom + 70, land * land), sq = lt > .45 ? .25 * Math.exp(-(lt - .45) * 9) : 0;
      ball(960, by, sq);
      note(PR.endNote, 66, M.isAr(PR.endNote) ? 700 : 820, bottom + 230, BLUE, 13.6, .8, -.02);
    }
  },
  sound(A) {
    const m = A.midi;
    // music in sections: light = piano plucks; dark switches drop the drums in; slam back on type and logo
    const S = [0, 1.8, 3.6, 5.4, 7.2, 9.0, 10.8, 12.6];
    S.forEach((s, i) => { if (i % 2 === 0 && i !== 0) { for (let k = 0; k < 7; k++) { A.kick(s + k * .26, .7); A.hat(s + k * .26 + .13, .07); } } else for (let k = 0; k < 4; k++) A.pluck(s + k * .45, m([64, 67, 71, 74][k] + (i % 3) * 2), .08, .35); });
    A.pop = (t0) => { A.tone(t0, 600, .08, "sine", .15); A.tone(t0, 1200, .05, "sine", .06); };
    A.pop(.0); A.whoosh(.4, .4, .1);
    for (let k = 0; k < 3; k++) A.nz(.5 + k * .3, .25, "bandpass", 3000, .05);   // pen scribble
    A.nz(1.8 + .41, .2, "lowpass", 500, .5); A.tone(1.8 + .41, 80, .3, "sine", .4);   // ball hits IDEA
    A.whoosh(3.2, .4, .15);
    for (let k = 0; k < 4; k++) A.pop(5.4 + .25 + k * .38);
    for (let k = 0; k < 4; k++) A.nz(10.8 + .1 + k * .35, .15, "lowpass", 900, .45);   // type slams
    A.tone(12.6 + .45, 45, 1.2, "sine", .55); A.nz(12.6 + .45, .5, "lowpass", 1200, .3);   // logo sub-hit
    A.pad(12.6, [57, 64, 69, 73].map(m), 2.4, .035);
  },
});
</script></body></html>

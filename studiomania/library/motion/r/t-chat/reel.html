<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// قالب «قصة شات»: موبايل عايم فيه محادثة بين عميل والمتجر؛ الرسايل بتظهر بنطّة، «بيكتب…» قبل كل رد، قلب على رسالة،
// كارت تأكيد الطلب، وفي الآخر الموبايل بيصغر ويظهر سطر الدعوة واسم البراند. 1080×1920، 12 ثانية.
const G1 = "١ · المحادثة", G2 = "٢ · التأكيد والدعوة", GS = "الشكل العام";
const PR = M.params({
  store: { label: "اسم المتجر في الشات", kind: "text", role: "brand", def: "متجر لمسة", group: G1, max: 16, hint: "اسم الحساب زي ما بيظهر في واتساب/إنستجرام." },
  logo: { label: "صورة حساب المتجر", kind: "image", role: "logo", def: "", group: G1, img: { ratio: "1:1", cut: false, tip: "اللوجو مربع (بيتقص دايرة). لو مفيش بيظهر أول حرف من الاسم." } },
  msgs: { label: "الرسايل (سطر لكل رسالة، يبدأ بـ «أنا:» أو «هم:»)", kind: "lines", def: ["أنا: السلام عليكم، الطلب يوصل إمتى؟", "هم: وعليكم السلام! بيوصلك بكرة الصبح", "أنا: بجد؟ والشحن ببلاش؟", "هم: أيوه، شحن مجاني لحد آخر الأسبوع", "أنا: خلاص، هاخد اتنين"], group: G1,
    hint: "٤–٦ رسايل قصيرة. «أنا:» = العميل (يمين) و«هم:» = المتجر. ابدأ بسؤال أو تردد حقيقي من عملائك، وخلّي ردود المتجر بتحل الاعتراض (الوقت، السعر، الشحن). الرسالة الخامسة بياخد قلب." },
  card: { label: "كارت التأكيد", kind: "text", def: "تم تأكيد طلبك", group: G2, max: 18, hint: "النتيجة اللي العميل وصلها (تم الطلب، تم الحجز)." },
  card2: { label: "تحت كارت التأكيد", kind: "text", def: "الشحن بكرة · الدفع عند الاستلام", group: G2, max: 34, hint: "تفاصيل بتطمّن (ميعاد الوصول، طريقة الدفع)." },
  cta: { label: "سطر الدعوة", kind: "text", def: "اطلب برسالة… وإحنا علينا الباقي", group: G2, max: 34, hint: "الدعوة في سطر: إزاي العميل يبدأ (ابعت رسالة، اللينك في البايو)." },
  color: { label: "لون البراند", kind: "color", role: "accent", def: "#7c5cff", group: GS, hint: "فقاعات رسايل العميل والهيدر." },
  bg: { label: "لون الخلفية", kind: "color", def: "#f1ecff", group: GS, hint: "درجة فاتحة جدًا من لون البراند." },
  fHead: { label: "خط الدعوة", kind: "font", def: "lalezar", group: GS },
  fBody: { label: "خط الرسايل", kind: "font", def: "tajawal", group: GS, hint: "خط مقروء زي خطوط التطبيقات (تجوّل، بلكس، الإسكندرية العادي)." },
});
M.meta({
  story: "قصة شات بتبيع: محادثة حقيقية بين عميل متردد والمتجر بترد على اعتراضاته، «بيكتب…» قبل كل رد، قلب على رسالة، كارت تأكيد الطلب، وسطر الدعوة.",
  scenes: [{ name: G1, t0: 0, t1: 7.5, about: "الرسايل ورا بعض (طولها على حسب عددها)" }, { name: G2, t0: 7.5, t1: 12, about: "كارت التأكيد والموبايل بيصغر والدعوة" }],
  tips: ["خد الأسئلة من الكومنتات والرسايل الحقيقية.", "كل رسالة سطر واحد (الشات الطويل بيتقري ببطء).", "خلّي آخر رسالة من العميل قرار شراء."],
});
const W = 1080, H = 1920, DUR = 12;
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const MSGS = PR.msgs.slice(0, 6).map((l) => { const m = String(l).match(/^\s*(أنا|هم)\s*[:：]\s*(.*)$/); return m ? { me: m[1] === "أنا", txt: m[2] } : { me: false, txt: String(l) }; });
// التوقيت: كل رد من المتجر قبله «بيكتب…»
let T = .6; MSGS.forEach((m) => { if (!m.me) { m.typing = [T, T + .8]; T += .8; } m.t = T; T += m.me ? .95 : 1.05; });
const CARD_T = T + .7, TYP_CARD = [T, T + .7], HEART_T = MSGS.length > 4 ? MSGS[4].t + .45 : 99, OUT_T = Math.max(CARD_T + 1.3, 8.4);

M.reel({
  W, H, DUR, bg: PR.bg,
  async init(M) {
    await Promise.all([M.font("TJ", PR.fBody), M.font("LZ", PR.fHead), M.font("CH", PR.fBody)]);
    const col = PR.color;
    const st = M.stage; st.style.fontFamily = "TJ"; st.dir = "rtl";
    // خلفية: لون فاتح + دواير ناعمة بتتحرك
    const blobs = [0, 1, 2].map((i) => M.el("div", "", `position:absolute;left:0;top:0;width:${700 - i * 120}px;height:${700 - i * 120}px;border-radius:50%;background:${col};opacity:${.16 - i * .03};filter:blur(70px);`));
    const ctaWrap = M.el("div", "", "position:absolute;left:0;top:0;width:1080px;text-align:center;");
    const cta = M.el("div", "", `font:${M.fit(PR.cta, "LZ", 920, 96, 50)}px LZ;color:#1d1530;line-height:1.25;padding:0 60px;`, esc(PR.cta), ctaWrap);
    const brand = M.el("div", "", `display:inline-block;margin-top:28px;font:700 46px CH;color:#fff;background:${col};padding:14px 46px 20px;border-radius:60px;`, esc(PR.store), ctaWrap);
    // الموبايل
    const phone = M.el("div", "", "position:absolute;left:150px;top:150px;width:780px;height:1600px;border-radius:96px;background:#111;box-shadow:0 60px 120px rgba(40,20,90,.35),0 0 0 3px #2a2a2a inset;");
    const scr = M.el("div", "", "position:absolute;left:22px;top:22px;right:22px;bottom:22px;border-radius:76px;overflow:hidden;background:#efeae2;", "", phone);
    M.el("div", "", "position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(0,0,0,.08) 2px,transparent 2px);background-size:34px 34px;", "", scr);
    const head = M.el("div", "", `position:absolute;z-index:3;left:0;right:0;top:0;height:200px;background:${col};color:#fff;`, "", scr);
    M.el("div", "", "position:absolute;left:50%;top:22px;width:200px;height:44px;margin-left:-100px;border-radius:30px;background:#111;", "", scr);
    const av = M.el("div", "", `position:absolute;right:44px;top:96px;width:84px;height:84px;border-radius:50%;background:${PR.logo ? `#fff url(${JSON.stringify(PR.logo)}) center/cover` : "#fff"};color:${col};font:700 44px CH;display:flex;align-items:center;justify-content:center;`, PR.logo ? "" : esc([...PR.store][0] || "م"), head);
    M.el("div", "", "position:absolute;right:148px;top:100px;font:700 40px TJ;white-space:nowrap;", esc(PR.store), head);
    const status = M.el("div", "", "position:absolute;right:148px;top:148px;font:400 28px TJ;opacity:.85;white-space:nowrap;", "متصل الآن", head);
    M.el("div", "", "position:absolute;left:44px;top:112px;font:400 46px TJ;", "⋮", head);
    const list = M.el("div", "", "position:absolute;left:0;right:0;top:0;", "", scr);
    const view = { top: 240, bottom: 1556 - 170 };
    const bar = M.el("div", "", "position:absolute;z-index:3;left:0;right:0;bottom:0;height:150px;background:#f6f3ee;display:flex;align-items:center;gap:18px;padding:0 30px 20px;box-sizing:border-box;", "", scr);
    M.el("div", "", "flex:1;height:84px;border-radius:42px;background:#fff;font:400 34px TJ;color:#999;display:flex;align-items:center;padding:0 36px;", "اكتب رسالة", bar);
    M.el("div", "", `width:84px;height:84px;border-radius:50%;background:${col};display:flex;align-items:center;justify-content:center;`, '<svg width="40" height="40" viewBox="0 0 24 24"><path d="M20 12L4 4l3 8-3 8z" fill="#fff" transform="rotate(180 12 12)"/></svg>', bar);
    // الرسايل: الأرقام (ارتفاع ومكان) بتتحسب مرة واحدة، والظهور بيتعمل في seek
    let y = 0; const bubbles = [];
    const mkB = (html, me, extra = "") => { const b = M.el("div", "", `position:absolute;${me ? "right" : "left"}:34px;top:0;max-width:600px;padding:30px 38px 36px;font:500 46px/1.45 TJ;color:#1b1b1b;border-radius:38px;${me ? `border-top-right-radius:10px;background:${col};color:#fff;` : "border-top-left-radius:10px;background:#fff;"}box-shadow:0 3px 0 rgba(0,0,0,.06);transform-origin:${me ? "100%" : "0%"} 0;${extra}`, html, list); return b; };
    MSGS.forEach((m) => { const b = mkB(esc(m.txt) + `<span style="font:400 28px TJ;opacity:.6;margin-inline-start:16px;">${m.me ? "١٠:٤٢ ✓✓" : "١٠:٤٢"}</span>`, m.me); const h = b.offsetHeight; bubbles.push({ b, m, y, h, t: m.t }); y += h + 30; });
    const typing = mkB('<span class="d"></span><span class="d"></span><span class="d"></span>', false, "padding:30px 36px;display:flex;gap:12px;");
    [...typing.children].forEach((d) => (d.style.cssText = "width:18px;height:18px;border-radius:50%;background:#999;display:inline-block;"));
    const card = mkB(`<div style="display:flex;align-items:center;gap:22px;"><div style="width:84px;height:84px;border-radius:50%;background:${col};display:flex;align-items:center;justify-content:center;flex:none;"><svg width="48" height="48" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><b style="font:700 42px TJ;">${esc(PR.card)}</b><div style="font:400 30px TJ;color:#666;margin-top:6px;">${esc(PR.card2)}</div></div></div>`, false, "max-width:640px;");
    const cardY = y, cardH = card.offsetHeight;
    const heart = M.el("div", "", "position:absolute;left:0;top:0;z-index:2;width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;", '<svg width="36" height="36" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3.1 4.5 6.9 4.5c2.2 0 3.6 1.2 5.1 3 1.5-1.8 2.9-3 5.1-3 3.8 0 6 3.9 4.5 7.3C19.5 16.4 12 21 12 21z" fill="#ff3b5c"/></svg>', list);
    return { blobs, phone, list, bubbles, typing, card, cardY, cardH, heart, view, status, ctaWrap, cta, brand, endY: y };
  },
  seek(t, C, M) {
    const { springO, seg, cubic, expo, smooth, X, op } = M;
    C.blobs.forEach((b, i) => X(b, [-100, 520, 80][i] + Math.sin(t * .5 + i * 2) * 120, [200, 900, 1500][i] + Math.cos(t * .4 + i) * 140));
    // الموبايل: عايم وبيتمايل؛ في الآخر بيصغر وينزل تحت
    const out = cubic(seg(t, OUT_T, OUT_T + 1.0)), intro = expo(seg(t, 0, .7));
    const sc = (0.92 + .08 * intro) * (1 - .3 * out), ty = (1 - intro) * 300 + out * 520 + Math.sin(t * 1.3) * 8;
    C.phone.style.transform = `translate(0px,${ty}px) scale(${sc}) rotate(${Math.sin(t * .8) * .6}deg)`;
    op(C.phone, Math.min(1, intro * 1.5));
    // الرسايل
    let shown = 0, curTyping = null;
    C.bubbles.forEach((B) => {
      const k = seg(t, B.t, B.t + .5), s = springO(Math.max(0, t - B.t), 16, .55);
      op(B.b, k > 0 ? 1 : 0); B.b.style.transform = `translateY(${B.y}px) scale(${k > 0 ? .4 + .6 * s : .4})`;
      if (k > 0) shown = B.y + B.h; if (B.m.typing && t >= B.m.typing[0] && t < B.m.typing[1]) curTyping = B.y;
    });
    if (t >= TYP_CARD[0] && t < TYP_CARD[1]) curTyping = C.cardY;
    // «بيكتب…» بالنقط اللي بتتنطط
    op(C.typing, curTyping != null ? 1 : 0);
    if (curTyping != null) { C.typing.style.transform = `translateY(${curTyping}px)`; [...C.typing.children].forEach((d, i) => (d.style.transform = `translateY(${-Math.max(0, Math.sin(t * 9 - i * .9)) * 12}px)`)); shown = Math.max(shown, curTyping + 100); C.status.textContent = "بيكتب…"; } else C.status.textContent = "متصل الآن";
    const ck = seg(t, CARD_T, CARD_T + .5);
    op(C.card, ck > 0 ? 1 : 0); C.card.style.transform = `translateY(${C.cardY}px) scale(${ck > 0 ? .4 + .6 * springO(t - CARD_T, 15, .55) : .4})`;
    if (ck > 0) shown = C.cardY + C.cardH;
    // سكرول تلقائي لما الرسايل تزيد عن الشاشة (ناعم)
    const need = Math.max(0, shown - (C.view.bottom - C.view.top)), prev = C.scroll ?? 0;
    C.scroll = C._lt != null && Math.abs(t - C._lt) < .1 ? prev + (need - prev) * .2 : need; C._lt = t;
    C.list.style.transform = `translateY(${C.view.top - C.scroll}px)`;
    // قلب على رسالة
    const hk = seg(t, HEART_T, HEART_T + .4), hb = C.bubbles[4];
    op(C.heart, hk > 0 ? 1 : 0);
    if (hb) C.heart.style.transform = `translate(${780 - 44 - 34 - hb.b.offsetWidth - 20}px,${hb.y + hb.h - 40}px) scale(${hk > 0 ? springO(t - HEART_T, 18, .4) : 0})`;
    // الدعوة واسم البراند
    const ck2 = expo(seg(t, OUT_T + .3, OUT_T + 1.1)), bk = springO(Math.max(0, t - OUT_T - .9), 14, .5);
    op(C.cta, ck2); C.cta.style.transform = `translateY(${(1 - ck2) * 60}px)`;
    op(C.brand, t > OUT_T + .9 ? 1 : 0); C.brand.style.transform = `scale(${bk})`;
    X(C.ctaWrap, 0, 300);
  },
  sound(A) {
    const N = A.midi;
    // نغمة إرسال/استقبال لكل رسالة + نقر الكيبورد وقت «بيكتب…»
    MSGS.forEach((m) => { if (m.me) { A.tone(m.t, N(84), .12, "sine", .18); A.tone(m.t + .05, N(91), .1, "sine", .12); } else { A.tone(m.t, N(79), .14, "sine", .18); A.tone(m.t + .07, N(74), .12, "sine", .12); } if (m.typing) for (let s = m.typing[0]; s < m.typing[1]; s += .09) A.click(s, .05); });
    for (let s = TYP_CARD[0]; s < TYP_CARD[1]; s += .09) A.click(s, .05);
    A.pluck(CARD_T, N(76), .18, .5); A.pluck(CARD_T + .1, N(83), .18, .7); A.tone(HEART_T, N(96), .15, "sine", .12);
    // بيت خفيف تحت كله
    A.groove(100, .6, 12, { kg: .45, hg: .05 });
    for (let i = 0, t = .6; t < 12; i++, t += .6) A.tone(t, N([45, 45, 41, 43][Math.floor(i / 4) % 4]), .5, "triangle", .08);
    A.whoosh(OUT_T, .6, .2); A.hit(OUT_T + .9, .3);
  },
});
</script>
</body></html>

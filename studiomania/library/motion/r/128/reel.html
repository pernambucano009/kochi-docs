<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #128 Fiery samurai kata — pure canvas. 30 s, 100 BPM (bar 2.4 s). One pose per bar, each landing on the downbeat:
// anticipation (a small counter-move) → a fast strike with a blade smear → a weighted settle → a held pose.
// The figure is a silhouette built on a skeleton (hips, torso, two-bone IK arms to a shared grip, IK legs to planted feet).
// The fire ring flares on every strike; the biggest moment is the leap and landing cut (bars 10–11), then the sheathing hold.
const BPM = 100, BAR = 2.4, GROUND = 870, CX = 960;
// pose: hip [dx, dy] · torso angle · grip [dx, dy] from the neck · sword angle · feet x (left, right) · feet lift
const P = [
  { n: "ready",      hip: [0, -215], tor: -88, grip: [40, 95], sw: -40, fl: -60, fr: 70, lift: 0 },
  { n: "jodan",      hip: [0, -222], tor: -90, grip: [10, -60], sw: -125, fl: -70, fr: 80, lift: 0 },
  { n: "shomen",     hip: [30, -168], tor: -68, grip: [120, 120], sw: 18, fl: -150, fr: 165, lift: 0 },
  { n: "hasso",      hip: [-10, -215], tor: -92, grip: [55, 10], sw: -82, fl: -70, fr: 60, lift: 0 },
  { n: "kesa",       hip: [-45, -172], tor: -112, grip: [-125, 112], sw: 142, fl: -195, fr: 120, lift: 0 },
  { n: "waki",       hip: [0, -190], tor: -84, grip: [-30, 112], sw: 162, fl: -112, fr: 120, lift: 0 },
  { n: "kiriage",    hip: [40, -280], tor: -96, grip: [85, -95], sw: -58, fl: -40, fr: 60, lift: 70 },
  { n: "yoko",       hip: [0, -178], tor: -90, grip: [135, 40], sw: 0, fl: -140, fr: 145, lift: 0 },
  { n: "tsuki",      hip: [60, -162], tor: -58, grip: [205, 62], sw: 4, fl: -175, fr: 215, lift: 0 },
  { n: "leap",       hip: [10, -330], tor: -96, grip: [20, -115], sw: -112, fl: -30, fr: 40, lift: 130 },
  { n: "land cut",   hip: [80, -138], tor: -52, grip: [195, 175], sw: 28, fl: -205, fr: 225, lift: 0 },
  { n: "noto",       hip: [0, -215], tor: -90, grip: [-62, 92], sw: 176, fl: -50, fr: 60, lift: 0 },
];
const LEN = { torso: 150, ua: 88, fa: 82, th: 112, sh: 112, sword: 270 };
const D = Math.PI / 180;
M.reel({
  W: 1920, H: 1080, DUR: 30, bg: "#0e0a0a",
  fonts: { BR: "TY-Anton.ttf" },
  init(M) { const c = M.canvas(1920, 1080); return { x: c.getContext("2d") }; },
  seek(t, S, M) {
    const { x } = S, { seg, lerp, clamp, expo, expoIO, springO, hash, noise1 } = M;
    // ---- pose at time t
    const poseAt = (t) => {
      const lead = .36;   // the move starts this long before the downbeat so the pose LANDS on it
      const i = clamp(Math.floor((t + lead) / BAR), 0, P.length - 1);
      const a = P[Math.max(0, i - 1)], b = P[i], s = t - (i * BAR - lead);
      if (i === 0) return { ...a, k: 1, strikeAge: 99 };
      // anticipation 0–.14 (move 14% the other way), strike .14–.36 (fast), settle .36–.8 (springy, weighted)
      const anti = s < .14 ? -.14 * Math.sin((s / .14) * Math.PI / 2) : s < .36 ? -.14 + 1.14 * expo((s - .14) / .22) : 1;
      const settle = s > .36 ? (springO(s - .36, 16, .55) - 1) * .12 : 0;
      let k = anti + settle;
      const breathe = Math.sin(t * 2.2) * 2;
      const L = (p, q) => p + (q - p) * k;
      const A = (p, q) => { let d = ((q - p + 540) % 360) - 180; return p + d * k; };
      return { hip: [L(a.hip[0], b.hip[0]), L(a.hip[1], b.hip[1]) + breathe * .5], tor: A(a.tor, b.tor), grip: [L(a.grip[0], b.grip[0]), L(a.grip[1], b.grip[1]) + breathe], sw: A(a.sw, b.sw), fl: L(a.fl, b.fl), fr: L(a.fr, b.fr), lift: L(a.lift, b.lift), k, strikeAge: s - .14 };
    };
    const solve = (p) => {
      const hip = [CX + p.hip[0], GROUND + p.hip[1]];
      const neck = [hip[0] + Math.cos(p.tor * D) * LEN.torso, hip[1] + Math.sin(p.tor * D) * LEN.torso];
      const grip = [neck[0] + p.grip[0], neck[1] + p.grip[1]];
      const tip = [grip[0] + Math.cos(p.sw * D) * LEN.sword, grip[1] + Math.sin(p.sw * D) * LEN.sword];
      const pommel = [grip[0] - Math.cos(p.sw * D) * 60, grip[1] - Math.sin(p.sw * D) * 60];
      const sh = [[neck[0] - 18, neck[1] + 8], [neck[0] + 18, neck[1] + 8]];
      const footY = GROUND - p.lift;
      const feet = [[CX + p.fl, footY], [CX + p.fr, footY]];
      return { hip, neck, grip, tip, pommel, sh, feet };
    };
    const ik = (a, b, l1, l2, bend) => { const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.min(l1 + l2 - .5, Math.hypot(dx, dy)); const an = Math.atan2(dy, dx), cb = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)); const k = an + bend * cb; return [a[0] + Math.cos(k) * l1, a[1] + Math.sin(k) * l1]; };
    const p = poseAt(t), J = solve(p);
    // strike energy (drives the fire flare)
    const flare = p.strikeAge > 0 ? Math.exp(-p.strikeAge * 3) : 0;
    const big = t > 9 * BAR && t < 11 * BAR + 1 ? 1.6 : 1;
    // ---- background: dark, warm floor
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = "#0e0a0a"; x.fillRect(0, 0, 1920, 1080);
    x.fillStyle = "#1a1110"; x.fillRect(0, GROUND, 1920, 210);
    // a huge flat sun-disc behind the figure, so the silhouette always reads
    x.fillStyle = "#b8320f"; x.beginPath(); x.arc(CX, 520, 400, 0, 7); x.fill(); x.fillStyle = "#d94a14"; x.beginPath(); x.arc(CX, 520, 330, 0, 7); x.fill();
    // ---- the fire: a ring of flames behind, two braziers; solid tongues, no glow
    const flame = (fx, fy, w, h, seed) => {
      const layers = [["#7a1408", 1], ["#d9380f", .78], ["#ff8a1e", .55], ["#ffd36a", .3]];
      layers.forEach(([col, s]) => { x.fillStyle = col; x.beginPath(); x.moveTo(fx - w * s, fy); for (let k = 0; k <= 12; k++) { const u = k / 12, sway = noise1(seed + t * 3 + u * 2) * w * .5 * u; const hh = h * s * (1 + .25 * noise1(seed * 7 + t * 5)) * (1 - Math.abs(u - .5) * 1.4); x.lineTo(fx - w * s + u * 2 * w * s + sway, fy - Math.max(0, hh)); } x.lineTo(fx + w * s, fy); x.fill(); });
    };
    for (let i = 0; i < 16; i++) { const a = Math.PI + i / 15 * Math.PI, fx = CX + Math.cos(a) * 760, fy = GROUND - 40 + Math.sin(a) * 30; flame(fx, fy, 70, (160 + 140 * flare * big) * (.8 + .4 * hash(i)), i * 13); }
    for (const s of [-1, 1]) { x.fillStyle = "#3a2a24"; x.fillRect(CX + s * 560 - 40, GROUND - 120, 80, 120); flame(CX + s * 560, GROUND - 120, 60, 220 + 160 * flare * big, s * 31); }
    // embers rising (thin, as a function of time)
    for (let i = 0; i < 40; i++) { const life = (t * .4 + hash(i)) % 1, ex = CX + (hash(i + 3) - .5) * 1600 + Math.sin(t + i) * 30, ey = GROUND - life * 700; x.fillStyle = `rgba(255,170,60,${.8 * (1 - life)})`; x.fillRect(ex, ey, 3, 3); }
    // the figure is staged big: scale everything below around the centre of the floor
    x.save(); x.translate(CX, GROUND); x.scale(1.32, 1.32); x.translate(-CX, -GROUND);
    // ---- blade smear: the blade swept over the last ~70 ms
    if (p.strikeAge > -.02 && p.strikeAge < .3) {
      x.fillStyle = "rgba(255,236,210,.28)"; x.beginPath();
      const steps = 8; const pts = [];
      for (let k = 0; k <= steps; k++) { const tt = t - k * .009; const jj = solve(poseAt(tt)); pts.push(jj); }
      x.moveTo(...pts[0].tip); pts.forEach((jj) => x.lineTo(...jj.tip)); for (let k = pts.length - 1; k >= 0; k--) x.lineTo(...pts[k].grip); x.closePath(); x.fill();
    }
    // ---- the samurai silhouette
    const INK = "#050304";
    x.lineCap = "round"; x.lineJoin = "round";
    // legs (IK to the planted feet; knees bend forward)
    const kneeL = ik(J.hip, J.feet[0], LEN.th, LEN.sh, 1), kneeR = ik(J.hip, J.feet[1], LEN.th, LEN.sh, -1);
    // hakama: a wide skirt from the hip over both knees
    x.fillStyle = INK; x.beginPath(); x.moveTo(J.hip[0] - 40, J.hip[1] - 10); x.lineTo(J.hip[0] + 40, J.hip[1] - 10); x.lineTo(kneeR[0] + 40, kneeR[1] + 60); x.lineTo(J.feet[1][0] + 30, J.feet[1][1] - 20); x.lineTo(J.feet[0][0] - 30, J.feet[0][1] - 20); x.lineTo(kneeL[0] - 40, kneeL[1] + 60); x.closePath(); x.fill();
    x.strokeStyle = INK; x.lineWidth = 34; [[kneeL, J.feet[0]], [kneeR, J.feet[1]]].forEach(([k, f]) => { x.beginPath(); x.moveTo(...J.hip); x.lineTo(...k); x.lineTo(...f); x.stroke(); });
    // torso + head + topknot
    x.lineWidth = 64; x.beginPath(); x.moveTo(...J.hip); x.lineTo(...J.neck); x.stroke();
    const hd = [J.neck[0] + Math.cos(p.tor * D) * 44, J.neck[1] + Math.sin(p.tor * D) * 44];
    x.fillStyle = INK; x.beginPath(); x.arc(hd[0], hd[1], 30, 0, 7); x.fill(); x.beginPath(); x.ellipse(hd[0] - 10, hd[1] - 30, 12, 8, -.4, 0, 7); x.fill();
    // sword (scabbard at the left hip)
    x.strokeStyle = "#1a1a1a"; x.lineWidth = 12; x.beginPath(); x.moveTo(J.hip[0] - 10, J.hip[1] - 10); x.lineTo(J.hip[0] - 190, J.hip[1] + 40); x.stroke();
    x.strokeStyle = "#cfd3d6"; x.lineWidth = 7; x.beginPath(); x.moveTo(...J.grip); x.lineTo(...J.tip); x.stroke();
    x.strokeStyle = "#ffffff"; x.lineWidth = 2; x.beginPath(); x.moveTo(...J.grip); x.lineTo(...J.tip); x.stroke();
    x.strokeStyle = "#2b1d14"; x.lineWidth = 12; x.beginPath(); x.moveTo(...J.pommel); x.lineTo(...J.grip); x.stroke();
    x.fillStyle = "#c79a3a"; x.beginPath(); x.arc(J.grip[0], J.grip[1], 9, 0, 7); x.fill();
    // arms (both hands on the grip; elbows bend down and out)
    x.strokeStyle = INK; x.lineWidth = 28;
    J.sh.forEach((s, i) => { const hand = [J.grip[0] + (i ? 12 : -12) * Math.cos(p.sw * D), J.grip[1] + (i ? 12 : -12) * Math.sin(p.sw * D)]; const el = ik(s, hand, LEN.ua, LEN.fa, i ? -1 : 1); x.beginPath(); x.moveTo(...s); x.lineTo(...el); x.lineTo(...hand); x.stroke(); });
    // ground shadow
    x.fillStyle = "rgba(0,0,0,.5)"; x.beginPath(); x.ellipse(J.hip[0], GROUND + 6, 220 - p.lift * .5, 18, 0, 0, 7); x.fill();
    x.restore();
    // a small pose name, bottom-left (the only type)
    const cur = P[clamp(Math.floor((t + .36) / BAR), 0, P.length - 1)].n;
    x.font = "400 34px BR"; x.fillStyle = "#c9a26a"; x.textAlign = "left"; x.fillText(cur.toUpperCase(), 80, 1030);
  },
  sound(A) {
    const m = A.midi;
    // taiko on the downbeat of every bar, a shakuhachi-like breathy tone, a blade swish + a heavy hit on each strike
    for (let b = 0; b < 13; b++) {
      const t0 = b * BAR;
      A.tone(t0, 70, .7, "sine", .5); A.nz(t0, .3, "lowpass", 300, .35);
      A.tone(t0 + 1.2, 90, .4, "sine", .2);
      if (b > 0) { A.whoosh(t0 - .22, .25, .25); A.nz(t0, .08, "highpass", 4000, .2); }
    }
    { const b = A.ctx.createBufferSource(); b.buffer = A.noise; b.loop = true; const f = A.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 400; const g = A.ctx.createGain(); g.gain.value = .08; b.connect(f).connect(g).connect(A.out); b.start(0); b.stop(30); }   // fire roar
    [62, 65, 67, 69, 72, 69, 67, 65].forEach((n, i) => { A.tone(1 + i * 3.4, m(n), 2.2, "sine", .05); A.nz(1 + i * 3.4, .6, "bandpass", m(n) * 2, .02, 4); });
    A.tone(10 * BAR, 50, 1.5, "sine", .6); A.hit(10 * BAR, .7);   // the landing cut
  },
});
</script></body></html>

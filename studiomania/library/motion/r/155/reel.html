<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #155 "timeout 300" — a 5-minute story about time, drawn from this machine's own environment: TERM=linux, the VGA 16-colour console
// palette, DejaVu Sans Mono (the system's monospace). Everything is characters on a 128×36 grid.
// Story: process 4242 has to render a sky full of stars, but it was started under `timeout 300`. WANT: more time to finish.
//  1 (45–90 s)  `sudo nice -n -20` — not in the sudoers file. This incident will be reported.
//  2 (90–140 s) `date -s` the wall clock back an hour — the countdown doesn't care (timeout uses the monotonic clock).
//  3 (140–190 s) fork itself to work faster — the load climbs, the OOM killer takes the copies.
//  TURN (190–232 s) at the bottom of the screen sits /dev/null, a black hole. Seen from outside, a clock falling toward a horizon
//   ticks slower and slower and freezes. So it throws the timer in.
//  END (232–285 s) the countdown crawls and freezes; the sky gets finished. exit 0.
//  GAG (285–300 s) the black hole hiccups the timer back out; it beeps once on the sleeping process, who kill -9s it without waking.
const W = 1920, H = 1080, COLS = 128, ROWS = 36, CW = W / COLS, CH = H / ROWS;
const VGA = { k: "#000000", r: "#aa0000", g: "#00aa00", y: "#aa5500", b: "#0000aa", m: "#aa00aa", c: "#00aaaa", w: "#aaaaaa", K: "#555555", R: "#ff5555", G: "#55ff55", Y: "#ffff55", B: "#5555ff", M: "#ff55ff", C: "#55ffff", W: "#ffffff" };
const SKY = { c0: 4, c1: 123, r0: 3, r1: 22 };
let STARS = [];
// ---------- the console log: [time, text, colour]
const LOG = [];
const say = (t, s, c = "w") => LOG.push([t, s, c]);
const cmd = (t, s, cps = 14) => { LOG.push([t, "$ " + s, "W", cps]); return t + s.length / cps; };
let tt = 2; tt = cmd(tt, "./starfield --render sky.txt &"); say(tt + .3, "[1] 4242", "w"); tt = cmd(tt + .8, "timeout 300 wait 4242"); say(tt + .4, "rendering sky.txt ...", "K");
say(24, "4242: 1 star placed", "K"); say(31, "4242: estimated time to finish: 2,140 s", "Y"); say(33, "4242: time allowed: 300 s", "R");
// attempt 1
cmd(46, "sudo nice -n -20 -p 4242", 10); say(50, "[sudo] password for 4242:", "w"); say(54, "4242 is not in the sudoers file.", "R"); say(55.6, "This incident will be reported.", "R");
// attempt 2
cmd(92, "date", 10); say(93, "Sun Oct 11 10:15:42 UTC 2026", "w"); cmd(98, "sudo date -s '-1 hour'", 10); say(101.5, "Sun Oct 11 09:15:46 UTC 2026", "G");
say(116, "# timeout counts on CLOCK_MONOTONIC.", "K"); say(117.4, "# the wall clock is not the clock that matters.", "K");
// attempt 3
cmd(142, "fork(); fork(); fork(); fork();", 9);
const FORK = [147, 149.5, 151.5, 153]; FORK.forEach((f, i) => say(f, `4242: now ${2 ** (i + 1)} of me`, "C"));
say(166, "load average: 15.92, 9.41, 4.07", "Y"); say(170, "kernel: Out of memory: Killed process 4257", "R");
for (let i = 0; i < 14; i++) say(171 + i * .55, `kernel: Out of memory: Killed process ${4256 - i}`, "R");
// turn
say(196, "4242: 104 s left. 68% of the sky still empty.", "Y");
cmd(214, "ls -l /dev/null", 8); say(216.5, "crw-rw-rw- 1 root root 1, 3 /dev/null", "w");
say(222, "# near a horizon, a falling clock looks slower and slower", "K"); say(223.6, "# to everyone outside. it never quite reaches zero.", "K");
cmd(228, "mv /proc/timer /dev/null", 9);
say(262, "4242: sky.txt complete (2,400 stars)", "G"); say(263, "[1]+  Done   ./starfield --render sky.txt", "G"); say(264, "exit 0", "G");
say(290, "kernel: /dev/null: hic.", "M"); say(293.2, "\x07 BEEP", "Y"); cmd(294.0, "kill -9 %timer", 18); say(295.5, "Killed", "R");
// sky progress (fraction of stars placed)
const prog = (t) => { if (t < 22) return 0; if (t < 140) return .002 + (t - 22) * .00055; if (t < 190) return .067 + Math.max(0, Math.min(1, (t - 147) / 22)) * .3 - Math.max(0, Math.min(1, (t - 170) / 8)) * .05; if (t < 232) return .317; return Math.min(1, .317 + (t - 232) * .022); };
// the countdown, as seen from outside: normal until it's thrown in (228.6 s), then slowing and freezing near the horizon
const left = (t) => { const tt = 228.6; if (t < tt) return 300 - t; const L0 = 300 - tt; return L0 - 9.4 * (1 - Math.exp(-(t - tt) / 5.5)); };
M.reel({
  W, H, DUR: 300, SUB: 1, bg: "#000",
  init(M) {
    const c = M.canvas(W, H), r = M.rng(42);
    for (let i = 0; i < 2400; i++) { const ch = r() < .7 ? "." : r() < .6 ? "*" : r() < .5 ? "+" : "o"; STARS.push([SKY.c0 + Math.floor(r() * (SKY.c1 - SKY.c0)), SKY.r0 + Math.floor(r() * (SKY.r1 - SKY.r0)), ch, r() < .12 ? "Y" : r() < .1 ? "C" : r() < .6 ? "W" : "w"]); }
    return { x: c.getContext("2d") };
  },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, hash } = M;
    // the grid
    const G = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    const put = (c, r, s, col = "w") => { if (r < 0 || r >= ROWS) return; for (let i = 0; i < s.length; i++) { const cc = c + i; if (cc >= 0 && cc < COLS && s[i] !== "\u0000") G[r][cc] = [s[i], col]; } };
    // title bar + countdown
    put(0, 0, " pid 4242 — bash — 128×36".padEnd(COLS, " "), "k");
    for (let i = 0; i < COLS; i++) G[0][i] = [G[0][i] ? G[0][i][0] : " ", "k", "w"];
    const L = left(t), lstr = t < 2 ? "" : `TIME LEFT ${L.toFixed(t > 236 ? 6 : 1)} s`;
    const lcol = L < 70 ? "R" : L < 150 ? "Y" : "G";
    if (lstr && !(t > 228.6 && t < 290)) put(COLS - lstr.length - 2, 0, lstr, lcol);
    // the sky canvas (a box drawn with box characters)
    const boxOn = t > 18;
    if (boxOn) { put(SKY.c0 - 1, SKY.r0 - 1, "┌" + "─".repeat(SKY.c1 - SKY.c0) + "┐", "K"); for (let r = SKY.r0; r < SKY.r1; r++) { put(SKY.c0 - 1, r, "│", "K"); put(SKY.c1, r, "│", "K"); } put(SKY.c0 - 1, SKY.r1, "└" + "─".repeat(SKY.c1 - SKY.c0) + "┘", "K"); put(SKY.c0 + 1, SKY.r0 - 1, " sky.txt ", "w"); }
    const n = Math.floor(prog(t) * STARS.length);
    for (let i = 0; i < n; i++) { const [c, r, ch, col] = STARS[i]; const tw = t > 262 && hash(i + Math.floor(t * 3)) > .97; put(c, r, ch, tw ? "W" : col); }
    // progress bar
    if (boxOn) { const p = prog(t), bw = 50, f = Math.round(p * bw); put(SKY.c0, SKY.r1 + 1, "[" + "█".repeat(f) + "░".repeat(bw - f) + "] " + (p * 100).toFixed(1).padStart(5) + "%", p >= 1 ? "G" : "C"); }
    // ---------- /dev/null: a black hole in the bottom-right corner (appears at the turn, grows)
    const bhK = clamp((t - 200) / 6);
    const BH = [110, 29];
    if (bhK > 0) {
      const R0 = 5.5 * bhK, ring = ["@", "%", "#", "*", "+", "=", "-", ":", "."];
      for (let r = -8; r <= 8; r++) for (let c = -16; c <= 16; c++) {
        const dx = c / 2, dy = r, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx) + t * 1.2 + 6 / (d + .5);
        if (d < R0 * .45) put(BH[0] + c, BH[1] + r, " ", "k");
        else if (d < R0 * 1.35) { const k = (d - R0 * .45) / (R0 * .9), ch = ring[Math.min(8, Math.floor(k * 9 + (Math.sin(a * 3) + 1) * 1.2))]; put(BH[0] + c, BH[1] + r, ch, k < .3 ? "W" : k < .6 ? "Y" : "y"); }
      }
      put(BH[0] - 4, BH[1] + 8, "/dev/null", "K");
    }
    // ---------- the console (bottom-left): last lines up to now, typed commands appear char by char
    const vis = LOG.filter((l) => l[0] <= t);
    const lines = vis.slice(-7);
    lines.forEach((l, i) => { const [t0, s, col, cps] = l; let str = s; if (cps) { const k = Math.floor((t - t0) * cps); str = s.slice(0, Math.min(s.length, 2 + Math.max(0, k))); if (k < s.length && Math.floor(t * 2) % 2 === 0) str += "█"; } const r = ROWS - 8 + i; put(1, r, str.slice(0, 92), col); });
    // log lines that fall into the black hole after the turn (they get stretched toward it)
    // ---------- the process: a little creature made of characters, standing on the row above the console
    const faces = { calm: "(o o)", happy: "(^ ^)", shock: "(O O)", sad: "(; ;)", strain: "(> <)", sleep: "(- -)", dizzy: "(@ @)", look: "(• •)" };
    let cx = 62, mood = "calm", walk = 0, copies = 0, lying = false;
    if (t < 20) { cx = Math.round(lerp(10, 62, clamp((t - 9) / 6))); walk = t > 9 && t < 15; mood = "look"; }
    else if (t < 45) { mood = t > 31 && t < 36 ? "shock" : "strain"; cx = 62 + Math.round(Math.sin(t * .6) * 6); walk = 1; }
    else if (t < 92) { mood = t > 54 ? (t > 60 ? "sad" : "shock") : "look"; cx = 30; }
    else if (t < 142) { mood = t > 101.5 && t < 112 ? "happy" : t >= 112 ? (t < 118 ? "shock" : "sad") : "look"; cx = 30; }
    else if (t < 192) { mood = t < 166 ? "happy" : t < 170 ? "strain" : "shock"; cx = 30; copies = t < 147 ? 0 : t < 170 ? 2 ** (FORK.filter((f) => t >= f).length) - 1 : Math.max(0, 15 - Math.floor((t - 171) / .55) - 1); }
    else if (t < 232) { mood = t < 205 ? "sad" : t < 214 ? "look" : t < 226 ? "calm" : "strain"; cx = t < 214 ? 30 : Math.round(lerp(30, 88, clamp((t - 214) / 10))); walk = t > 214 && t < 224; }
    else if (t < 285) { mood = t > 262 ? "happy" : "calm"; cx = t < 240 ? Math.round(lerp(88, 62, clamp((t - 234) / 6))) : 62; walk = t > 234 && t < 240; lying = t > 272; }
    else { mood = "sleep"; cx = 62; lying = true; }
    const CR = ROWS - 10;   // feet row
    const drawCreature = (c0, mood, walk, col = "G", lie = false) => {
      if (lie) { put(c0 - 1, CR, "~" + (mood === "sleep" ? "(- -)" : faces[mood]) + "==/\\", col); if (mood === "sleep" && Math.floor(t * 1.2) % 2 === 0) put(c0 + 7, CR - 1, "z Z", "w"); return; }
      const step = walk ? Math.floor(t * 6) % 2 : 0;
      put(c0, CR - 2, faces[mood] || faces.calm, col);
      put(c0, CR - 1, " /█\\ ", col);
      put(c0, CR, step ? " / \\ " : " | | ", col);
    };
    drawCreature(cx, mood, walk, "G", lying);
    for (let i = 0; i < copies; i++) { const c = 4 + (i % 8) * 7 + (i >= 8 ? 3 : 0), r = i >= 8 ? -4 : 0; const s = Math.floor(t * 6 + i) % 2; put(c, CR - 2 + r, i % 3 ? "(o o)" : "(^ ^)", "C"); put(c, CR - 1 + r, " /█\\ ", "C"); put(c, CR + r, s ? " / \\ " : " | | ", "C"); }
    // the incident report: an envelope that walks off to the right
    if (t > 56 && t < 70) { const ec = Math.round(lerp(40, 130, (t - 56) / 14)); put(ec, CR - 1, "[✉]", "R"); put(ec, CR, Math.floor(t * 6) % 2 ? "/ \\" : "| |", "R"); }
    // the timer: lifted out of the title bar, thrown, falling and slowing toward the horizon
    if (t > 228.6 && t < 290) {
      const s = t - 228.6, fall = 1 - Math.exp(-s / 5.5), tx = Math.round(lerp(cx + 6, BH[0] - 4, Math.min(1, s / 1.2) * (1 - fall) + fall)), ty = Math.round(lerp(CR - 4, BH[1], Math.min(1, s / 1.2) * .3 + fall * .7));
      const str = L.toFixed(6) + "s"; put(tx - 3, ty, s < 1.2 ? str : str.split("").map((c, i) => (fall > .7 && i > 0 ? c : c)).join(""), "R");
      put(COLS - 30, 0, "TIME LEFT  (at the horizon)", "K");
    }
    if (t >= 290 && t < 296) { const s = t - 290, tx = Math.round(lerp(BH[0], cx + 10, Math.min(1, s / 1.5))), ty = Math.round(lerp(BH[1], CR - 2, Math.min(1, s / 1.5)) - Math.sin(Math.min(1, s / 1.5) * Math.PI) * 6); put(tx, ty, t > 293.2 && t < 294.6 && Math.floor(t * 8) % 2 ? "[BEEP]" : "[62.0]", t > 295.5 ? "K" : "R"); }
    // ---------- paint the grid
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
    x.font = `${Math.round(CH * .78)}px "DejaVu Sans Mono", monospace`; x.textBaseline = "middle"; x.textAlign = "left";
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const g = G[r][c]; if (!g) continue; if (g[2]) { x.fillStyle = VGA[g[2]]; x.fillRect(c * CW, r * CH, CW + .5, CH + .5); } if (g[0] !== " ") { x.fillStyle = VGA[g[1]]; x.fillText(g[0], c * CW + .5, r * CH + CH / 2 + 1); } }
    // the console cursor blinks at the prompt when nothing is typing
    if (Math.floor(t * 2) % 2 === 0) { x.fillStyle = VGA.w; x.fillRect(1 * CW, (ROWS - 1) * CH + 4, CW, CH - 8); }
  },
  sound(A) {
    const m = A.midi;
    // keyboard: one click per typed character
    LOG.forEach(([t0, s, , cps]) => { if (cps) for (let i = 2; i < s.length; i++) A.nz(t0 + (i - 2) / cps, .02, "bandpass", 2600 + (i % 4) * 300, .08, 3); else A.tone(t0, 1760, .03, "square", .015); });
    // the score: a gentle synth arpeggio that tracks the mood
    const arp = (t0, t1, notes, g = .035, step = .25) => { let i = 0; for (let t = t0; t < t1; t += step, i++) A.tone(t, m(notes[i % notes.length]), step * 1.6, "triangle", g); };
    arp(2, 45, [60, 64, 67, 72], .03, .3); arp(45, 92, [57, 60, 64, 69], .028, .35); arp(92, 142, [55, 59, 62, 67], .03, .3);
    arp(142, 170, [62, 66, 69, 74], .035, .15); arp(196, 228, [45, 48, 52, 57], .03, .5);
    arp(232, 285, [60, 64, 67, 71, 74, 79], .03, .2);
    A.pad(0, [m(36), m(43)], 300, .02);
    // story sounds
    A.tone(33, m(48), .6, "square", .05); A.tone(33.4, m(44), .9, "square", .05);   // the bad news
    A.tone(54, 220, .2, "square", .06); A.tone(54.25, 180, .4, "square", .06);
    for (let i = 0; i < 8; i++) A.click(56 + i * .5, .05);   // the envelope walking off
    A.riser(98, 101.5, .1); A.tone(101.5, m(84), .3, "sine", .06); A.tone(116, m(43), 1.4, "triangle", .07);
    FORK.forEach((f, i) => A.tone(f, m(72 + i * 5), .2, "square", .05));
    A.nz(150, 22, "bandpass", 900, .05, .6);   // the fan spinning up
    for (let i = 0; i < 15; i++) A.tone(170 + i * .55, 140, .1, "square", .05);   // OOM kills
    A.tone(200, 40, 85, "sine", .12);   // the black hole's hum
    A.whoosh(228.6, 1.4, .2); for (let i = 0; i < 30; i++) A.tone(229 + i * (1 + i * .2), 1200 * Math.pow(.97, i), .05, "sine", .03);   // the timer's ticks, stretching apart
    [60, 64, 67, 72, 76].forEach((n, i) => A.tone(262 + i * .15, m(n), 3, "sine", .05));
    A.tone(290, 90, .2, "sine", .25); A.tone(293.3, 2000, .15, "square", .05); A.tone(293.6, 2000, .15, "square", .05); A.click(295.5, .2);
  },
});

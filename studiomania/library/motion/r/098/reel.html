<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #98 Five scroll-driven sections, each from a "different studio". Motion is a pure function of scroll position
// (scrubbable both ways); for the video, time drives the scroll — including a scrub back up and down again near the end.
// Each section is 1.5 screens tall: it pins for half a screen while its animation plays (progress 0→1), then scrolls away.
// 1 Editorial (serif, cream): the headline assembles, a column of text and a drop cap.
// 2 Swiss data (red/white grotesque): bars grow, a counter and a horizontal ticker tied to scroll.
// 3 Terminal brutalist (black/lime mono): code types itself line by line, boxes stack.
// 4 Organic (sage, soft serif): a blob morphs and a stem grows leaves; circular text turns with scroll.
// 5 Luxury product (black/gold, thin serif): a bottle turns in 3D with scroll, specs reveal.
const W = 1920, H = 1080, SEC = 1.5 * H, N = 5, MAXS = SEC * N - H;
const DUR = 30;
// time → scroll: settle on each section, then a scrub back and forward at the end
function scrollAt(t, M) {
  // rest on the END of each section's pin (its animation complete); the animation plays while scrolling into it
  const keys = [[0, 0], [.8, 0]];
  for (let i = 0; i < 5; i++) { const last = keys[keys.length - 1][0]; keys.push([last + 3.2, Math.min(MAXS, i * SEC + (SEC - H))], [last + 4.1, Math.min(MAXS, i * SEC + (SEC - H))]); }
  keys.push([23.6, 2 * SEC + (SEC - H) - 200], [25, 2 * SEC + (SEC - H) - 200], [28.4, MAXS], [30, MAXS]);
  for (let i = 0; i < keys.length - 1; i++) { const [a, sa] = keys[i], [b, sb] = keys[i + 1]; if (t <= b) return M.lerp(sa, sb, M.cubicIO(M.seg(t, a, b))); }
  return MAXS;
}
M.reel({
  W, H, DUR, bg: "#000",
  fonts: { SR: "dmserif.ttf", SRI: ["dmserif_i.ttf", "400", "italic"], GR: "archivoblack.ttf", MO: "TY-PlexMono-500.ttf", FR: "Fraunces_ital_wght_1_400.ttf", PF: ["Playfair_Display_ital_wght_1_500.ttf", "500", "italic"], I5: ["inter500.ttf", "500"] },
  init(M) { const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, expo, expoIO, smooth } = M;
    const s = scrollAt(t, M);
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      const top = i * SEC - s;
      let y, p;
      if (top > 0) { y = top; p = 0; } else if (top > -(SEC - H)) { y = 0; p = -top / (SEC - H); } else { y = top + (SEC - H); p = 1; }
      if (y >= H || y <= -H) continue;
      x.save(); x.translate(0, y); x.beginPath(); x.rect(0, 0, W, H); x.clip();
      SECTIONS[i](x, p, M, s);
      x.restore();
    }
    // a thin scroll indicator, the only shared UI
    x.fillStyle = "rgba(255,255,255,.5)"; x.fillRect(W - 14, 0, 4, H); x.fillStyle = "#fff"; x.fillRect(W - 14, (s / MAXS) * (H - 120), 4, 120);
  },
  sound(A) {
    // soft scroll ticks as each section pins, and a tone per section in its own key
    const m = A.midi;
    [1.2, 5.4, 10, 14.6, 19.2].forEach((t0, i) => { A.tone(t0, m(60 + [0, 5, 7, 9, 12][i]), 1.2, "sine", .06); A.click(t0, .08); });
    for (let k = 0; k < 60; k++) A.click(.2 + k * .5, .02);
    A.whoosh(22.6, 1.6, .1); A.whoosh(26.4, 1.8, .1);
  },
});
const SECTIONS = [
  // 1 — editorial
  (x, p, M) => {
    x.fillStyle = "#f3ede1"; x.fillRect(0, 0, W, H);
    const word = "Slow Reading", font = "400 220px SR"; x.font = font;
    let X = 120;
    [...word].forEach((ch, i) => { const k = M.expoIO(M.clamp(p * 1.6 - i * .05)); x.fillStyle = "#1c1814"; x.globalAlpha = k; x.fillText(ch, X, 380 + (1 - k) * 80); X += x.measureText(ch).width; });
    x.globalAlpha = 1;
    x.fillStyle = "#1c1814"; x.fillRect(120, 440, 1680 * M.clamp(p * 2 - .4), 3);
    // drop cap + a column that fills with scroll
    const col = M.clamp(p * 1.4 - .3);
    x.font = "400 200px SR"; x.fillStyle = "#b5442b"; x.globalAlpha = M.expo(M.clamp(p * 3 - 1)); x.fillText("T", 120, 690); x.globalAlpha = 1;
    x.font = "400 30px SRI"; x.fillStyle = "#1c1814";
    const lines = ["he magazine you hold is a promise:", "that someone chose these words slowly,", "set them with care, and left you room", "to think between the lines. Scroll gently;", "nothing here is in a hurry."];
    lines.forEach((l, i) => { const k = M.clamp(col * lines.length - i); x.save(); x.beginPath(); x.rect(240, 540 + i * 46, 900 * k, 46); x.clip(); x.fillText(l, 250, 575 + i * 46); x.restore(); });
    x.fillStyle = "#d9cfbd"; x.fillRect(1250, 520, 550 * M.expoIO(M.clamp(p * 2 - .6)), 420);
    x.font = "500 18px I5"; x.fillStyle = "#6b6157"; x.fillText("ISSUE 12 — AUTUMN", 1250, 970);
  },
  // 2 — swiss data
  (x, p, M) => {
    x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#e3241b"; x.fillRect(0, 0, 40, H);
    x.font = "400 150px GR"; x.fillStyle = "#111"; x.fillText("Numbers.", 120, 220);
    const V = [.3, .55, .45, .8, .65, 1, .9];
    V.forEach((v, i) => { const k = M.expoIO(M.clamp(p * 1.8 - i * .1)); const h = 520 * v * k; x.fillStyle = i === 5 ? "#e3241b" : "#111"; x.fillRect(140 + i * 200, 860 - h, 140, h); x.font = "400 26px GR"; x.fillStyle = "#111"; if (k > .05) x.fillText(Math.round(v * 100 * k) + "", 150 + i * 200, 840 - h); });
    x.font = "400 200px GR"; x.fillStyle = "#e3241b"; x.textAlign = "right"; x.fillText(Math.round(2026 * M.clamp(p * 1.3)) + "", 1840, 520); x.textAlign = "left";
    // ticker moves exactly with the scroll
    x.font = "400 40px GR"; x.fillStyle = "#111"; const tick = "CLARITY · GRID · CONTRAST · ORDER · "; for (let k = 0; k < 4; k++) x.fillText(tick, -p * 1500 + k * 900, 1000);
  },
  // 3 — terminal brutalist
  (x, p, M) => {
    x.fillStyle = "#0b0b0b"; x.fillRect(0, 0, W, H);
    x.font = "500 34px MO"; x.fillStyle = "#c6ff3d";
    const code = ["$ build --scroll", "> compiling sections ............ ok", "> binding motion to position ..... ok", "> timers used: 0", "> frames reversible: yes", "$ deploy"];
    const chars = Math.floor(M.clamp(p * 1.2) * code.join("").length);
    let used = 0; code.forEach((l, i) => { const n = M.clamp(chars - used, 0, l.length); x.fillText(l.slice(0, n), 120, 180 + i * 64); used += l.length; });
    for (let k = 0; k < 6; k++) { const g = M.expoIO(M.clamp(p * 2 - .5 - k * .1)); x.strokeStyle = "#c6ff3d"; x.lineWidth = 4; x.strokeRect(1150 + (k % 2) * 160, 900 - (k + 1) * 110 * g, 300, 100); }
    x.fillStyle = "#c6ff3d"; x.fillRect(120, 600, 900 * p, 12);
    x.font = "500 22px MO"; x.fillText(`progress ${(p * 100).toFixed(1)}%`, 120, 660);
  },
  // 4 — organic
  (x, p, M) => {
    x.fillStyle = "#dfe6d6"; x.fillRect(0, 0, W, H);
    const cx = 640, cy = 540;
    x.fillStyle = "#9db89a"; x.beginPath();
    for (let i = 0; i <= 80; i++) { const a = i / 80 * 6.283, r = 300 + Math.sin(a * 3 + p * 6) * 40 * (1 - p * .5) + Math.cos(a * 5 - p * 4) * 20; i ? x.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : x.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
    x.fill();
    // a stem grows with scroll, leaves unfold at fixed points
    const g = M.clamp(p * 1.3); x.strokeStyle = "#3d5a3a"; x.lineWidth = 8; x.lineCap = "round"; x.beginPath(); x.moveTo(cx, 860); x.quadraticCurveTo(cx - 40, 600, cx + 10, lerpN(860, 300, g)); x.stroke();
    for (let k = 0; k < 4; k++) { const lk = M.expoIO(M.clamp(g * 5 - k - .5)); if (lk <= 0) continue; const ly = 780 - k * 130, s2 = k % 2 ? 1 : -1; x.fillStyle = "#3d5a3a"; x.save(); x.translate(cx - 10, ly); x.rotate(s2 * .7); x.scale(lk, lk); x.beginPath(); x.ellipse(s2 * 60, 0, 60, 22, 0, 0, 7); x.fill(); x.restore(); }
    // circular text turning with scroll
    const txt = "breathe in · grow slow · breathe out · ";
    x.font = "400 30px FR"; x.fillStyle = "#3d5a3a";
    [...txt].forEach((ch, i) => { const a = i / txt.length * 6.283 + p * 3; x.save(); x.translate(cx + Math.cos(a) * 380, cy + Math.sin(a) * 380); x.rotate(a + Math.PI / 2); x.fillText(ch, 0, 0); x.restore(); });
    x.font = "italic 400 110px FR"; x.fillStyle = "#2a3d28"; x.globalAlpha = M.expo(M.clamp(p * 2 - .2)); x.fillText("Grow at your", 1100, 480); x.fillText("own pace.", 1100, 600); x.globalAlpha = 1;
    function lerpN(a, b, k) { return a + (b - a) * k; }
  },
  // 5 — luxury product
  (x, p, M) => {
    x.fillStyle = "#0c0b0a"; x.fillRect(0, 0, W, H);
    const ang = p * Math.PI * 1.2, cx = 760, top = 200, bottom = 900;
    // the bottle: a lathe profile drawn as vertical bands, shaded by the turn
    const prof = (v) => v < .18 ? 60 : v < .28 ? 60 + (v - .18) / .1 * 140 : 200;
    for (let b = 0; b < 40; b++) {
      const a0 = b / 40 * Math.PI * 2 + ang, a1 = (b + 1) / 40 * Math.PI * 2 + ang;
      if (Math.cos((a0 + a1) / 2) < 0) continue;
      const shade = .25 + .75 * Math.pow(Math.max(0, Math.cos((a0 + a1) / 2 - .5)), 2);
      x.fillStyle = `rgb(${Math.round(201 * shade)},${Math.round(160 * shade)},${Math.round(88 * shade)})`;
      x.beginPath();
      for (let k = 0; k <= 20; k++) { const v = k / 20, r = prof(v); x.lineTo(cx + Math.sin(a0) * r, lerpN(top, bottom, v)); }
      for (let k = 20; k >= 0; k--) { const v = k / 20, r = prof(v); x.lineTo(cx + Math.sin(a1) * r, lerpN(top, bottom, v)); }
      x.fill();
    }
    x.fillStyle = "#1c1915"; x.fillRect(cx - 70, top - 70, 140, 80);
    x.font = "italic 500 90px PF"; x.fillStyle = "#d9b46a"; x.globalAlpha = M.expo(M.clamp(p * 2)); x.fillText("Nº 9", 1200, 380); x.globalAlpha = 1;
    const specs = ["50 ml", "amber · cedar · smoke", "made in small batches"];
    specs.forEach((sp, i) => { const k = M.expoIO(M.clamp(p * 2.4 - .5 - i * .25)); x.font = "500 26px I5"; x.fillStyle = "#c9b48a"; x.globalAlpha = k; x.fillText(sp.toUpperCase(), 1200, 500 + i * 70 + (1 - k) * 20); x.globalAlpha = 1; x.fillStyle = "#3a332a"; x.fillRect(1200, 520 + i * 70, 460 * k, 1); });
    function lerpN(a, b, k) { return a + (b - a) * k; }
  },
];
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #197 A marble-run music machine, 45 s. The piece is composed first (C pentatonic, 96 BPM), then every note is given a ball
// whose release time is solved backwards from its hit: drop height → fall time, so each collision lands exactly on its note.
// Voices enter one by one: melody bars (0 s) → bass drum-bars (11 s) → brass bells via a ramp (22 s) → peak in eighths (28–37 s)
// → it resolves on one heavy ball into the big brass bell (42.5 s). Warm wood + brass on a clean background.
const BPM = 96, B = 60 / BPM, G = 2400;
const NOTES = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81];   // the xylophone, left → right
const BARY = 760, RAILY = 150, FALL = Math.sqrt(2 * (BARY - 12 - RAILY) / G);
const barX = (i) => 520 + i * 104;
// ---- the composition
const mel = [], bass = [], bells = [];
const motif = [2, 3, 4, 3, 2, -1, 1, 0];   // indices into NOTES (−1 = rest)
for (let b = 2; b < 66; b++) {
  const ph = Math.floor((b - 2) / 8), k = (b - 2) % 8;
  let n = motif[k]; if (n < 0) continue;
  n = Math.min(9, n + (ph % 4 === 1 ? 1 : ph % 4 === 2 ? 3 : ph % 4 === 3 ? 2 : 0) + (b >= 44 && b < 60 ? 2 : 0));
  mel.push({ t: b * B, i: n });
  if (b >= 44 && b < 60 && k % 2 === 0) mel.push({ t: (b + .5) * B, i: Math.min(9, n + 2) });   // the peak: eighths
}
for (let b = 18; b < 66; b += 2) bass.push({ t: b * B, i: [0, 3, 1, 2][Math.floor((b - 18) / 4) % 4] });
for (let b = 36; b < 66; b += 4) bells.push({ t: b * B, i: [0, 1, 2, 1][((b - 36) / 4) % 4] });
const FINAL = 68 * B;
mel.sort((a, b) => a.t - b.t);
M.reel({
  W: 1920, H: 1080, DUR: 45, bg: "#f4efe6",
  fonts: { I5: ["inter500.ttf", "500"] },
  init(M) { const c = M.canvas(1920, 1080); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { clamp, lerp, hash } = M;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = "#f4efe6"; x.fillRect(0, 0, 1920, 1080);
    const WOOD = "#b9874f", WOOD2 = "#8a5a32", BRASS = "#c9a24a", BRASS2 = "#8e6b22", INK = "#2b231c";
    const ball = (X, Y, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill(); x.fillStyle = "rgba(255,255,255,.45)"; x.beginPath(); x.arc(X - r * .35, Y - r * .35, r * .3, 0, 7); x.fill(); };
    const ring = (since, k = 9) => (since > 0 ? Math.exp(-since * k) : 0);
    // ---- a light wooden backboard with grain, and a field of brass pins (decor)
    x.fillStyle = "#e9dcc4"; x.beginPath(); x.roundRect(60, 50, 1800, 1000, 30); x.fill();
    x.strokeStyle = "rgba(140,100,60,.12)"; x.lineWidth = 2; for (let k = 0; k < 40; k++) { x.beginPath(); x.moveTo(60, 70 + k * 24); for (let px = 60; px <= 1860; px += 60) x.lineTo(px, 70 + k * 24 + Math.sin(px * .01 + k) * 4); x.stroke(); }
    // ---- frame of the machine
    x.fillStyle = WOOD2; x.fillRect(420, RAILY - 30, 1100, 18);   // the release rail
    for (let i = 0; i < 10; i++) { x.fillStyle = BRASS; x.fillRect(barX(i) - 10, RAILY - 16, 20, 14); }   // release gates
    x.fillStyle = WOOD2; x.fillRect(460, BARY + 40, 1020, 26); x.fillRect(480, BARY + 66, 20, 230); x.fillRect(1440, BARY + 66, 20, 230);
    // ---- melody bars: each bar wobbles and warms when struck
    const lastHit = (list, i) => { let v = -99; for (const n of list) if (n.i === i && n.t <= t) v = n.t; return v; };
    for (let i = 0; i < 10; i++) {
      const s = t - lastHit(mel, i), r = ring(s), len = 200 - i * 9;
      x.save(); x.translate(barX(i), BARY + Math.sin(s * 60) * 4 * r);
      x.fillStyle = r > .05 ? `rgb(${Math.round(185 + 50 * r)},${Math.round(135 + 40 * r)},${Math.round(79 + 20 * r)})` : WOOD; x.fillRect(-46, -16, 92, 34 + len * .25);
      x.fillStyle = "rgba(0,0,0,.18)"; x.fillRect(-30, -2, 60, 3); x.restore();
      x.fillStyle = BRASS2; x.beginPath(); x.arc(barX(i) - 26, BARY + 30, 5, 0, 7); x.arc(barX(i) + 26, BARY + 30, 5, 0, 7); x.fill();
    }
    // melody balls: released FALL seconds before their hit, fall, strike, bounce once, roll away to the right trough
    mel.forEach((n) => {
      const s = t - (n.t - FALL); if (s < 0 || s > FALL + 1.4) return;
      const X0 = barX(n.i);
      let X = X0, Y;
      if (s <= FALL) Y = RAILY + .5 * G * s * s;
      else { const u = s - FALL, v = 520; Y = BARY - 12 - (v * u - .5 * G * u * u); X = X0 + u * 260; if (Y > BARY + 30) Y = BARY + 30 + (u - 2 * v / G) * 0; }
      ball(X, Y, 16, "#d24a2a");
    });
    // ---- bass: big wooden balls dropped onto low drum-bars on the left
    for (let i = 0; i < 4; i++) {
      const s = t - lastHit(bass, i), r = ring(s, 6), X = 140 + i * 72;
      x.save(); x.translate(X, BARY + 120 + Math.sin(s * 40) * 6 * r); x.fillStyle = WOOD2; x.fillRect(-30, -20, 60, 140 - i * 18); x.restore();
    }
    bass.forEach((n) => {
      const fall = Math.sqrt(2 * (BARY + 100 - 80) / G), s = t - (n.t - fall);
      if (s < 0 || s > fall + .9) return;
      const X = 140 + n.i * 72; let Y = s <= fall ? 80 + .5 * G * s * s : BARY + 100 - (300 * (s - fall) - .5 * G * (s - fall) ** 2);
      ball(X - (s > fall ? (s - fall) * 120 : 0), Math.min(Y, BARY + 100), 28, "#6b4426");
    });
    if (t > 10.5) { x.fillStyle = WOOD2; x.fillRect(100, 60, 330, 14); }   // the bass hopper appears with its voice
    // ---- bells: balls roll down a brass ramp, leave its end and fly into the hanging bells
    const RAMP = [[1560, 200], [1700, 330]], BELLX = [1620, 1720, 1820], BELLY = 520;
    if (t > 20) { x.strokeStyle = BRASS2; x.lineWidth = 10; x.beginPath(); x.moveTo(...RAMP[0]); x.lineTo(...RAMP[1]); x.stroke(); }
    bells.forEach((n) => {
      const D = .95, s = t - (n.t - D);   // .5 s rolling + .45 s flight
      if (s < 0 || s > D + .6) return;
      let X, Y;
      const tx = BELLX[n.i], ty = BELLY - 30;
      if (s < .5) { const u = (s / .5) ** 2; X = lerp(RAMP[0][0], RAMP[1][0], u); Y = lerp(RAMP[0][1], RAMP[1][1], u) - 10; }
      else if (s < D) { const u = (s - .5) / (D - .5); X = lerp(RAMP[1][0], tx, u); Y = lerp(RAMP[1][1] - 10, ty, u) - Math.sin(u * Math.PI) * 30; }
      else { const u = s - D; X = tx - u * 150; Y = ty + .5 * G * u * u; }
      ball(X, Y, 16, "#5a6e8a");
    });
    BELLX.forEach((bx, i) => { const s = t - lastHit(bells, i), r = ring(s, 2.5), sw = Math.sin(s * 9) * .25 * r; x.save(); x.translate(bx, 420); x.rotate(sw); x.strokeStyle = INK; x.lineWidth = 3; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 60); x.stroke(); x.fillStyle = r > .1 ? "#e3bd5c" : BRASS; x.beginPath(); x.moveTo(-36 + i * 4, 140); x.quadraticCurveTo(-30, 60, 0, 60); x.quadraticCurveTo(30, 60, 36 - i * 4, 140); x.closePath(); x.fill(); x.restore(); });
    // ---- the final heavy ball into the big brass bell (centre, below the bars)
    const fallF = Math.sqrt(2 * (980 - 60) / G), sF = t - (FINAL - fallF);
    const bigR = ring(t - FINAL, 1.2);
    x.save(); x.translate(960, 980); x.rotate(Math.sin((t - FINAL) * 5) * .1 * bigR); x.fillStyle = t > FINAL ? "#e3bd5c" : BRASS; x.beginPath(); x.ellipse(0, 0, 150, 40, 0, Math.PI, 0); x.fill(); x.restore();
    if (sF > 0 && sF < fallF + .4) { const Y = sF <= fallF ? 60 + .5 * G * sF * sF : 940 - 80 * Math.sin(Math.min(1, (sF - fallF) / .4) * Math.PI); ball(960, Math.min(Y, 940), 30, INK); }
    // ---- a quiet score readout: which voices are playing
    x.font = "500 22px I5"; x.fillStyle = "#8a7d6c"; x.textAlign = "left";
    x.fillText(["melody", t > 11 ? "+ bass" : "", t > 22 ? "+ bells" : "", t > 27.5 && t < 37.5 ? "· peak" : "", t > FINAL ? "· resolve" : ""].filter(Boolean).join("  "), 80, 1040);
  },
  sound(A) {
    const f = (n) => 440 * Math.pow(2, (n - 69) / 12);
    mel.forEach((n) => { const fr = f(NOTES[n.i]); A.tone(n.t, fr, .7, "sine", .2); A.tone(n.t, fr * 4, .1, "sine", .05); A.click(n.t, .04); });
    bass.forEach((n) => { const fr = f([36, 43, 40, 41][n.i]); A.tone(n.t, fr, .6, "triangle", .3); A.nz(n.t, .12, "lowpass", 400, .2); });
    bells.forEach((n) => { const fr = f([84, 88, 91][n.i]); A.tone(n.t, fr, 2.2, "sine", .09); A.tone(n.t, fr * 2.76, 1.2, "sine", .03); });
    [36, 48, 55, 60, 64].forEach((n, i) => A.tone(FINAL, f(n), 4, i ? "sine" : "triangle", .12 / (i * .5 + 1)));
    A.nz(FINAL, 1.2, "bandpass", 700, .1, 2);
  },
});
</script></body></html>

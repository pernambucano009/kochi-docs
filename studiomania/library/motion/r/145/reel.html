<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script><script src="../../lib/three.min.js"></script></head><body>
<script>
// #145 Robot-anime combining sequence — 20 s, 1080×1920, three.js, cel shading with inverted-hull outlines.
// A red TRUCK becomes the legs, a blue JET becomes torso, arms and back wings, a yellow CAR becomes chest, shoulders and head.
// Signature shot (12.2–16 s): extreme low angle at the robot's feet, the robot towering against the dusk sky, right fist raised,
// visor ignited, speed lines converging on it.
// Shots (one named move each): 0–3.5 CRANE up as the vehicles race in · 3.5–6.2 DOLLY low along the truck as it stands into legs
// · 6.2–9.2 ORBIT as the jet locks on · 9.2–12.2 PUSH-IN as the car becomes chest + head · 12.2–16 signature (slow push from below)
// · 16–20 final wide CRANE out in a new light (sunrise). Every join clicks with a flash. Every frame is a function of t.
const DUR = 20, W = 1080, H = 1920;
// parts: [name, geometry, color, vehicle, vehicle-local pos, vehicle-local rot, robot pos, robot rot, ts (transform start)]
const RED = 0xd8302c, BLUE = 0x2f5fd0, YEL = 0xf2c230, WHITE = 0xe9ecf2, GREY = 0x3a3f4a;
const P_ = [
  ["hip", ["box", 3.6, 1.2, 2.2], RED, 0, [3.0, 1.7, 0], [0, 0, 0], [0, 6.4, 0], [0, 0, 0], 3.8],
  ["legL", ["box", 1.6, 5, 1.8], RED, 0, [-.6, 1.0, -1.05], [0, 0, Math.PI / 2], [-1.25, 3.3, 0], [0, 0, 0], 4.0],
  ["legR", ["box", 1.6, 5, 1.8], RED, 0, [-.6, 1.0, 1.05], [0, 0, Math.PI / 2], [1.25, 3.3, 0], [0, 0, 0], 4.15],
  ["footL", ["box", 2, .8, 2.6], GREY, 0, [3.6, .45, -1.1], [0, Math.PI / 2, 0], [-1.25, .4, .35], [0, 0, 0], 4.4],
  ["footR", ["box", 2, .8, 2.6], GREY, 0, [3.6, .45, 1.1], [0, Math.PI / 2, 0], [1.25, .4, .35], [0, 0, 0], 4.5],
  ["torso", ["box", 4, 3.4, 2.4], BLUE, 1, [0, 0, 0], [0, 0, 0], [0, 8.7, 0], [0, 0, 0], 6.5],
  ["armL", ["box", 1.2, 3, 1.2], BLUE, 1, [-.6, -1.3, -2.1], [0, 0, Math.PI / 2], [-2.8, 8.5, 0], [0, 0, 0], 6.8],
  ["armR", ["box", 1.2, 3, 1.2], BLUE, 1, [-.6, -1.3, 2.1], [0, 0, Math.PI / 2], [2.8, 8.5, 0], [0, 0, 0], 6.95],
  ["fistL", ["box", 1.4, 1.4, 1.4], WHITE, 1, [-2.6, -1.3, -2.1], [0, 0, 0], [-2.8, 6.4, 0], [0, 0, 0], 7.2],
  ["fistR", ["box", 1.4, 1.4, 1.4], WHITE, 1, [-2.6, -1.3, 2.1], [0, 0, 0], [2.8, 6.4, 0], [0, 0, 0], 7.3],
  ["wingL", ["box", 4, .2, 1.6], WHITE, 1, [0, .2, -3.4], [0, 0, 0], [-2.6, 9.8, -1.7], [0, .3, .55], 7.5],
  ["wingR", ["box", 4, .2, 1.6], WHITE, 1, [0, .2, 3.4], [0, 0, 0], [2.6, 9.8, -1.7], [0, -.3, -.55], 7.6],
  ["thrust", ["cone", .9, 2.4], GREY, 1, [3.2, 0, 0], [0, 0, -Math.PI / 2], [0, 8.6, -1.9], [Math.PI, 0, 0], 7.8],
  ["padL", ["box", 1.9, .8, 1.9], YEL, 2, [1.7, .6, 0], [0, 0, 0], [-2.8, 10.4, 0], [0, 0, .12], 9.5],
  ["padR", ["box", 1.9, .8, 1.9], YEL, 2, [-1.7, .6, 0], [0, 0, 0], [2.8, 10.4, 0], [0, 0, -.12], 9.6],
  ["chest", ["box", 3, 1.8, .6], YEL, 2, [0, 1.0, 0], [-Math.PI / 2, 0, 0], [0, 9.2, 1.35], [0, 0, 0], 9.9],
  ["head", ["box", 1.4, 1.4, 1.4], WHITE, 2, [-.4, 1.95, 0], [0, 0, 0], [0, 11.25, 0], [0, 0, 0], 10.3],
  ["visor", ["box", 1.2, .32, .12], 0x1a2a3a, 2, [.42, 2.0, 0], [0, Math.PI / 2, 0], [0, 11.35, .72], [0, 0, 0], 10.6],
  ["crestL", ["box", .22, 1.1, .22], YEL, 2, [-1.6, 2.1, -.6], [0, 0, 0], [-.36, 12.15, .35], [0, 0, .55], 10.8],
  ["crestR", ["box", .22, 1.1, .22], YEL, 2, [-1.6, 2.1, .6], [0, 0, 0], [.36, 12.15, .35], [0, 0, -.55], 10.9],
];
const DUR_T = .9;
// vehicle origins over time (position + heading)

M.reel({
  W, H, DUR, bg: "#2a2040",
  init(M) {
    const T = THREE; T.ColorManagement.legacyMode = false;
    const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(W, H); renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;

    const skyU = { warm: { value: 0 } };

      vertexShader: "varying vec3 d; void main(){ d = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
      fragmentShader: "uniform float warm; varying vec3 d; void main(){ float y = clamp(d.y,-.1,1.); vec3 hor = mix(vec3(1.,.48,.35), vec3(1.,.78,.45), warm); vec3 mid = mix(vec3(.55,.30,.55), vec3(.55,.70,.95), warm); vec3 top = mix(vec3(.12,.10,.30), vec3(.25,.45,.85), warm); vec3 c = y < .25 ? mix(hor, mid, y/.25) : mix(mid, top, (y-.25)/.75); c = floor(c*10.)/10.; gl_FragColor = vec4(c,1.); }" }));

    scene.fog = new T.Fog(0x5a3a66, 60, 260);
    const key = new T.DirectionalLight(0xffe2c8, 2.2); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0004; key.shadow.normalBias = .03;
    Object.assign(key.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 120 }); scene.add(key, key.target);
    const fill = new T.HemisphereLight(0x9a8cff, 0x3a2a30, .55); scene.add(fill);
    const rim = new T.DirectionalLight(0x8fd8ff, 1.6); rim.position.set(-20, 15, -30); scene.add(rim);
    const flashL = new T.PointLight(0xffffff, 0, 14); scene.add(flashL);
    // ground: asphalt (physical, varied roughness) with road markings; a distant city as silhouettes in fog
    const g = new T.Mesh(new T.PlaneGeometry(800, 800), new T.MeshPhysicalMaterial({ color: 0x2b2a33, roughness: .82, metalness: 0, clearcoat: .15, clearcoatRoughness: .7 }));
    g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
    const lineM = new T.MeshBasicMaterial({ color: 0xd9d2c0 });
    for (let i = -20; i < 20; i++) { const s = new T.Mesh(new T.PlaneGeometry(3, .25), lineM); s.rotation.x = -Math.PI / 2; s.position.set(i * 6, .01, 3.2); scene.add(s); }
    const R = M.rng(11), bm = new T.MeshStandardMaterial({ color: 0x241c34, roughness: 1 });
    for (let i = 0; i < 70; i++) { const b = new T.Mesh(new T.BoxGeometry(6 + R() * 10, 10 + R() * 50, 6 + R() * 10), bm); const a = R() * Math.PI * 2, rr = 90 + R() * 120; b.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr); b.position.y = b.geometry.parameters.height / 2; scene.add(b); }

    const grad = new T.DataTexture(new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]), 3, 1, T.RGBAFormat); grad.minFilter = grad.magFilter = T.NearestFilter; grad.needsUpdate = true;
    const outlineM = new T.MeshBasicMaterial({ color: 0x0b0a12, side: T.BackSide });
    const parts = P_.map(([name, geo, color]) => {
      const G = geo[0] === "box" ? new T.BoxGeometry(geo[1], geo[2], geo[3]) : new T.ConeGeometry(geo[1], geo[2], 16);
      const mat = name === "visor" ? new T.MeshToonMaterial({ color, gradientMap: grad, emissive: 0x33e0ff, emissiveIntensity: 0 }) : new T.MeshToonMaterial({ color, gradientMap: grad });

      const o = new T.Mesh(G, outlineM); o.scale.setScalar(1.06); m.add(o);

      if (geo[0] === "box" && geo[2] > 1) { const st = new T.Mesh(new T.BoxGeometry(geo[1] * 1.01, geo[2] * .12, geo[3] * 1.01), new T.MeshToonMaterial({ color: new T.Color(color).multiplyScalar(.55), gradientMap: grad })); st.position.y = geo[2] * .22; m.add(st); }

    });

    const wheelG = new T.CylinderGeometry(.55, .55, .5, 18), wheelM = new T.MeshToonMaterial({ color: 0x15151a, gradientMap: grad });
    const wheels = [];
    [[0, 3.4, -1.2], [0, 3.4, 1.2], [0, -2.4, -1.2], [0, -2.4, 1.2], [0, -.4, -1.2], [0, -.4, 1.2], [2, 1.2, -1.0], [2, 1.2, 1.0], [2, -1.2, -1.0], [2, -1.2, 1.0]].forEach(([v, lx, lz]) => { const w = new T.Mesh(wheelG, wheelM); w.rotation.x = Math.PI / 2; w.userData = { v, lx, lz }; w.castShadow = true; const o = new T.Mesh(wheelG, outlineM); o.scale.setScalar(1.08); w.add(o); scene.add(w); wheels.push(w); });
    // 2D overlay for speed lines and the lock flashes
    const ov = M.canvas(W, H, "z-index:2");
    return { T, renderer, scene, cam, parts, wheels, key, rim, fill, flashL, skyU, sky, ox: ov.getContext("2d") };
  },
  seek(t, P, M) {
    const { T, cam, parts, ox } = P, { seg, lerp, clamp, expo, expoIO, springO, cubicIO, sine } = M;
    const E = (r) => new T.Quaternion().setFromEuler(new T.Euler(r[0], r[1], r[2]));
    // the final pose: the right arm swings up into a raised fist (13.2 s), driven by a spring
    const raise = clamp(springO(t - 13.2, 9, .5), 0, 1.15) * 2.75;
    const robotPose = (i) => {
      const [name, , , , , , rp, rr] = P_[i];
      let p = rp.slice(), r = rr.slice();
      if (name === "armR" || name === "fistR" || name === "padR") {
        const piv = [2.8, 10.0], rel = [rp[0] - piv[0], rp[1] - piv[1]], a = raise;
        p = [piv[0] + rel[0] * Math.cos(a) - rel[1] * Math.sin(a) + (name !== "padR" ? Math.sin(a) * .0 : 0), piv[1] + rel[0] * Math.sin(a) + rel[1] * Math.cos(a), rp[2]];
        r = [rr[0], rr[1], rr[2] + a];
      }

      return { p: new T.Vector3(...p), q: E(r) };
    };
    const vehPose = (i, tt) => {
      const [, , , vid, lp, lr] = P_[i], v = vehicle(vid, tt);
      const vq = E([v.roll || 0, v.ry, 0]), lpv = new T.Vector3(...lp).applyQuaternion(vq);
      return { p: lpv.add(new T.Vector3(v.p[0], v.p[1] + (v.bob || 0), v.p[2])), q: vq.multiply(E(lr)) };
    };
    const flashes = [];
    parts.forEach((m, i) => {
      const ts = P_[i][8];
      if (t < ts) { const a = vehPose(i, t); m.position.copy(a.p); m.quaternion.copy(a.q); return; }
      const a = vehPose(i, ts), b = robotPose(i), k = springO(t - ts, 8, .58), kr = clamp(expoIO(seg(t, ts, ts + DUR_T * .8)), 0, 1);
      m.position.lerpVectors(a.p, b.p, k); m.position.y += Math.sin(Math.PI * clamp(k)) * 2.2;
      m.quaternion.slerpQuaternions(a.q, b.q, kr);
      const tl = ts + .42; if (t > tl && t < tl + .35) flashes.push([b.p, (t - tl) / .35]);
    });
    P.wheels.forEach((w) => { const { v, lx, lz } = w.userData, vt = v === 0 ? Math.min(t, 3.8) : Math.min(t, 9.5), V = vehicle(v, vt), q = E([0, V.ry, 0]); const p = new T.Vector3(lx, .55, lz).applyQuaternion(q).add(new T.Vector3(...V.p)); const gone = v === 0 ? seg(t, 3.8, 4.4) : seg(t, 9.5, 10.1); w.position.copy(p); w.position.y -= gone * 1.4; w.scale.setScalar(1 - gone * .99); w.quaternion.copy(q).multiply(E([Math.PI / 2, 0, 0])); });
    // visor ignites
    const vis = parts[P_.findIndex((p) => p[0] === "visor")]; vis.material.emissiveIntensity = t > 12.6 ? 2.2 * expo(seg(t, 12.6, 12.9)) : 0;
    // light: dusk → sunrise for the final wide
    const warm = sine(seg(t, 16, 19)); P.skyU.warm.value = warm;
    const sun = new T.Vector3(lerp(18, -14, warm), lerp(14, 9, warm), lerp(12, 22, warm));
    P.key.position.copy(sun); P.key.target.position.set(0, 4, 0); P.key.color.setRGB(1, lerp(.82, .9, warm), lerp(.72, .7, warm)); P.key.intensity = lerp(2.2, 2.8, warm);
    P.fill.intensity = lerp(.55, .8, warm);
    P.flashL.intensity = flashes.length ? 30 * (1 - flashes[0][1]) : 0; if (flashes.length) P.flashL.position.copy(flashes[0][0]);
    // ---------- camera: one named move per shot
    let cp, lk, fov = 40;
    if (t < 3.5) { const a = cubicIO(t / 3.5); cp = [lerp(12, 16, a), lerp(1.6, 7, a), lerp(20, 28, a)]; lk = [lerp(-14, -2, a), lerp(3, 6, a), 0]; fov = 42; }                    // CRANE up
    else if (t < 6.2) { const a = cubicIO((t - 3.5) / 2.7); cp = [lerp(11, 8, a), lerp(1.2, 1.8, a), lerp(16, 13, a)]; lk = [0, lerp(2.2, 4.5, a), 0]; fov = 44; }              // DOLLY low
    else if (t < 9.2) { const a = lerp(.9, 1.45, cubicIO((t - 6.2) / 3)); cp = [Math.cos(a) * 21, 7.5, Math.sin(a) * 21]; lk = [0, 7.5, 0]; fov = 42; }                         // ORBIT
    else if (t < 12.2) { const a = cubicIO((t - 9.2) / 3); cp = [lerp(2.5, 1, a), lerp(9.5, 10.6, a), lerp(19, 12.5, a)]; lk = [0, lerp(9.2, 10.2, a), 0]; fov = 40; }        // PUSH-IN
    else if (t < 16) { const a = sine((t - 12.2) / 3.8); cp = [lerp(4.2, 3.4, a), lerp(.6, .8, a), lerp(14, 12, a)]; lk = [lerp(.6, 1.0, a), lerp(8.2, 8.8, a), 0]; fov = 52; }        // signature: low push
    else { const a = cubicIO((t - 16) / 4); cp = [lerp(-9, -20, a), lerp(2.5, 9, a), lerp(16, 34, a)]; lk = [0, 7, 0]; fov = 40; }                                      // CRANE out, new light

  },
  sound(A) {
    const m = A.midi;
    // engines in: truck rumble, jet whine, car rev

    A.riser(3.0, 6.3, .2); A.nz(3.0, 3.3, "bandpass", 2400, .08, 3);
    A.nz(6.2, 3.0, "bandpass", 700, .12, 2); A.tone(6.2, 140, 3, "sawtooth", .03);
    // each part: a servo whir, then a CLICK as it locks

    A.hit(13.4, .8); [36, 48, 55, 60, 64, 67].forEach((n) => A.tone(13.4, m(n), 3.2, "sawtooth", .04));
    A.groove(140, 13.4, 16, { hg: .06, kg: .8, snare: true, sg: .3 });

  },
});

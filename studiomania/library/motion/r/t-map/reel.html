<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// قالب «خريطة متحركة» (ستايل خرايط Vox): خريطة مدينة مرسومة (نيل، شوارع، جناين)، دبابيس بتنزل على الأحياء، الكاميرا بتدخل على الفرع،
// طريق التوصيل بيترسم لحد العميل والموتوسيكل ماشي عليه، وبعدين تبعد وتنوّر مناطق التغطية واحدة واحدة. الرسومات على ١٢ فريم. 12 ثانية.
const PR = M.params({
  areas: { label: "الأحياء (٥ سطور)", kind: "lines", def: ["الزمالك", "الدقي", "المعادي", "مدينة نصر", "التجمع"] },
  store: { label: "اسم الفرع", kind: "text", def: "الفرع الرئيسي" },
  eta: { label: "وقت التوصيل (دقايق)", kind: "text", def: "24" },
  done: { label: "عند الوصول", kind: "text", def: "اتسلّم" },
  head: { label: "العنوان في الآخر", kind: "text", role: "product", def: "بنوصل لكل حتة" },
  sub: { label: "تحت العنوان", kind: "text", def: "في أقل من ساعة" },
  brand: { label: "اسم البراند", kind: "text", role: "brand", def: "طيارة دليفري" },
  color: { label: "اللون الأساسي", kind: "color", def: "#ff5a1f" },
});
const W = 1080, H = 1920, DUR = 12, MW = 2300, MH = 3900;
const loadFont = (fam, file, weight = "400") => { const f = new FontFace(fam, `url(../../fonts/${file})`, { weight }); document.fonts.add(f); return f.load().catch(() => {}); };
const ar = (s) => String(s).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
const AREAS = [[820, 1180], [700, 1560], [1000, 2500], [1550, 1400], [1750, 2050]];   // أماكن الأحياء على الخريطة
const STORE = [1180, 1650], CUST = [1640, 1300];
const ROUTE = [STORE, [1180, 1540], [1330, 1540], [1330, 1420], [1500, 1420], [1500, 1300], CUST];

M.reel({
  W, H, DUR, bg: "#efe8db",
  async init(M) {
    await Promise.all([loadFont("CH", "SM-Changa.ttf"), loadFont("LZ", "SM-Lalezar.ttf")]);
    const c = M.canvas(W, H); const x = c.getContext("2d");
    const map = document.createElement("canvas"); map.width = MW; map.height = MH; const m = map.getContext("2d"), R = M.rng(5);
    m.fillStyle = "#efe8db"; m.fillRect(0, 0, MW, MH);
    // بلوكات + شوارع (شبكة مايلة شوية)
    m.save(); m.translate(MW / 2, MH / 2); m.rotate(-.06); m.translate(-MW / 2, -MH / 2);
    for (let gy = -200; gy < MH + 200; gy += 120) for (let gx = -200; gx < MW + 200; gx += 120) { m.fillStyle = R() < .1 ? "#cfe3c2" : R() < .5 ? "#e6dfd0" : "#e2dacb"; m.fillRect(gx + 10, gy + 10, 100, 100); }
    m.strokeStyle = "#fbf8f1"; m.lineWidth = 14; for (let g = -200; g < MW + 200; g += 120) { m.beginPath(); m.moveTo(g + 5, -200); m.lineTo(g + 5, MH + 200); m.stroke(); } for (let g = -200; g < MH + 200; g += 120) { m.beginPath(); m.moveTo(-200, g + 5); m.lineTo(MW + 200, g + 5); m.stroke(); }
    m.strokeStyle = "#f6d37a"; m.lineWidth = 26; [[[-200, 1425], [MW + 200, 1425]], [[1325, -200], [1325, MH + 200]], [[-200, 2265], [MW + 200, 2265]]].forEach(([a, b]) => { m.beginPath(); m.moveTo(...a); m.lineTo(...b); m.stroke(); });
    m.restore();
    // جناين
    [[400, 700, 200], [1500, 900, 160], [1200, 2800, 220], [1850, 2600, 140]].forEach(([a, b, r]) => { m.fillStyle = "#bcd9a8"; m.beginPath(); m.ellipse(a, b, r, r * .7, .4, 0, Math.PI * 2); m.fill(); });
    // النيل بيعدّي بالطول، وجزيرة
    m.fillStyle = "#9fd0f0"; m.beginPath(); m.moveTo(560, -50); for (let y = 0; y <= MH + 50; y += 50) m.lineTo(560 + Math.sin(y * .0018) * 260 + Math.sin(y * .005) * 40, y); for (let y = MH + 50; y >= -50; y -= 50) m.lineTo(560 + Math.sin(y * .0018) * 260 + Math.sin(y * .005) * 40 + 150 + Math.sin(y * .003) * 30, y); m.fill();
    m.fillStyle = "#e6dfd0"; m.beginPath(); m.ellipse(760, 1180, 50, 190, .2, 0, Math.PI * 2); m.fill();
    m.strokeStyle = "rgba(255,255,255,.6)"; m.lineWidth = 3; for (let y = 100; y < MH; y += 160) { const xx = 600 + Math.sin(y * .0018) * 260 + Math.sin(y * .005) * 40; m.beginPath(); m.moveTo(xx + 40, y); m.lineTo(xx + 90, y + 6); m.stroke(); }
    // مناطق التغطية (أشكال حوالين كل حي) بتتحسب هنا وتترسم بعدين
    const regions = AREAS.map(([a, b], i) => Array.from({ length: 14 }, (_, k) => { const ang = k / 14 * Math.PI * 2, r = 230 + M.hash(i * 9 + k) * 90; return [a + Math.cos(ang) * r, b + Math.sin(ang) * r * .85]; }));
    const lab = M.el("div", "", "position:absolute;left:0;top:0;width:0;height:0;");
    const labels = PR.areas.slice(0, 5).map((n) => M.el("div", "", "position:absolute;left:0;top:0;transform-origin:50% 100%;white-space:nowrap;font:700 40px CH;color:#1d1d1b;background:#fff;padding:4px 22px 10px;border-radius:30px;box-shadow:0 6px 0 rgba(0,0,0,.12);", "", lab));
    labels.forEach((l, i) => (l.textContent = PR.areas[i] || ""));
    const sLab = M.el("div", "", `position:absolute;left:0;top:0;white-space:nowrap;font:700 38px CH;color:#fff;background:${PR.color};padding:6px 24px 12px;border-radius:30px;`, "", lab); sLab.textContent = PR.store;
    const eta = M.el("div", "", "position:absolute;left:0;top:0;white-space:nowrap;font:700 36px CH;color:#1d1d1b;background:#fff;padding:6px 22px 12px;border-radius:30px;box-shadow:0 6px 0 rgba(0,0,0,.12);", "", lab);
    const card = M.el("div", "", "position:absolute;left:70px;right:70px;top:0;background:#fff;border-radius:48px;padding:50px 60px 56px;box-shadow:0 30px 70px rgba(0,0,0,.18);text-align:center;");
    M.el("div", "", `font:${M.fit(PR.head, "LZ", 860, 130, 60)}px/1.1 LZ;color:#1d1d1b;`, "", card).textContent = PR.head;
    M.el("div", "", `font:700 54px CH;color:${PR.color};margin-top:10px;`, "", card).textContent = PR.sub;
    M.el("div", "", "font:600 36px CH;color:#888;margin-top:22px;", "", card).textContent = PR.brand;
    return { x, map, regions, labels, sLab, eta, card };
  },
  seek(t, C, M) {
    const { x } = C, { seg, smooth, springO, expo, cubic, clamp, X, op } = M;
    const tq = Math.floor(t * 12) / 12;                   // الرسومات على ١٢ فريم (الخريطة نفسها ناعمة)
    const K = [[0, 1150, 1900, .56], [1.6, 1150, 1900, .56], [2.8, 1300, 1500, 1.25], [6.6, 1450, 1440, 1.25], [7.4, 1450, 1440, 1.25], [8.6, 1200, 1900, .56], [12, 1200, 1950, .58]];
    let k = 0; while (k < K.length - 2 && t > K[k + 1][0]) k++;
    const [ta, xa, ya, za] = K[k], [tb, xb, yb, zb] = K[k + 1], u = smooth(seg(t, ta, tb));
    const z = 1 / (1 / za + (1 / zb - 1 / za) * u), cx = xa + (xb - xa) * u, cy = ya + (yb - ya) * u;
    const toS = ([a, b]) => [W / 2 + (a - cx) * z, H / 2 + (b - cy) * z];
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = "#efe8db"; x.fillRect(0, 0, W, H);
    x.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z); x.drawImage(C.map, 0, 0);
    // مناطق التغطية بتنوّر واحدة واحدة (بعد ما الكاميرا تبعد)
    C.regions.forEach((pts, i) => { const rk = seg(tq, 8.0 + i * .25, 8.4 + i * .25); if (rk <= 0) return; x.beginPath(); pts.forEach((p) => x.lineTo(...p)); x.closePath(); x.globalAlpha = .28 * rk; x.fillStyle = PR.color; x.fill(); x.globalAlpha = rk; x.lineWidth = 8 / z; x.strokeStyle = PR.color; x.setLineDash([24 / z, 14 / z]); x.stroke(); x.setLineDash([]); x.globalAlpha = 1; });
    // الطريق: بيترسم على ١٢ فريم من الفرع للعميل
    const rk = seg(tq, 3.2, 6.4); let L = 0; const seglen = ROUTE.slice(1).map((p, i) => { const l = Math.hypot(p[0] - ROUTE[i][0], p[1] - ROUTE[i][1]); L += l; return l; });
    let pos = ROUTE[0];
    if (rk > 0) {
      let lim = L * rk; x.beginPath(); x.moveTo(...ROUTE[0]);
      for (let i = 1; i < ROUTE.length; i++) { const l = seglen[i - 1]; if (lim >= l) { x.lineTo(...ROUTE[i]); lim -= l; pos = ROUTE[i]; } else { const f = lim / l; pos = [ROUTE[i - 1][0] + (ROUTE[i][0] - ROUTE[i - 1][0]) * f, ROUTE[i - 1][1] + (ROUTE[i][1] - ROUTE[i - 1][1]) * f]; x.lineTo(...pos); break; } }
      x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#fff"; x.lineWidth = 34; x.stroke(); x.strokeStyle = PR.color; x.lineWidth = 18; x.stroke();
    }
    // الدبابيس: بتنزل بنطة
    const pin = (p, col, k2, size = 1) => { if (k2 <= 0) return; const [a, b] = p, s = springO(k2 * .6, 16, .45) * size / z * .9; x.save(); x.translate(a, b); x.scale(s, s); x.fillStyle = "rgba(0,0,0,.18)"; x.beginPath(); x.ellipse(0, 4, 26, 9, 0, 0, Math.PI * 2); x.fill(); x.fillStyle = col; x.beginPath(); x.moveTo(0, 0); x.bezierCurveTo(-36, -50, -42, -110, 0, -112); x.bezierCurveTo(42, -110, 36, -50, 0, 0); x.fill(); x.fillStyle = "#fff"; x.beginPath(); x.arc(0, -74, 17, 0, Math.PI * 2); x.fill(); x.restore(); };
    AREAS.forEach((p, i) => pin(p, "#1d1d1b", seg(tq, .4 + i * .22, 1.2 + i * .22)));
    pin(STORE, PR.color, seg(tq, 2.4, 3.0), 1.3); pin(CUST, "#2f9bf0", seg(tq, 3.0, 3.6), 1.3);
    // نبضة الوصول
    const ak = seg(t, 6.4, 7.4); if (ak > 0 && ak < 1) { x.strokeStyle = `rgba(47,155,240,${1 - ak})`; x.lineWidth = 8 / z; x.beginPath(); x.arc(CUST[0], CUST[1] - 40, 40 + ak * 200, 0, Math.PI * 2); x.stroke(); }
    // الموتوسيكل ماشي على الطريق
    if (rk > 0 && t < 7.6) { x.save(); x.translate(pos[0], pos[1]); const s = 1 / z * 1.1; x.scale(s, s); x.fillStyle = "#fff"; x.beginPath(); x.arc(0, 0, 40, 0, Math.PI * 2); x.fill(); x.fillStyle = PR.color; x.beginPath(); x.arc(0, 0, 32, 0, Math.PI * 2); x.fill(); x.fillStyle = "#fff"; x.fillRect(-14, -12, 28, 18); x.beginPath(); x.arc(-12, 10, 6, 0, Math.PI * 2); x.arc(12, 10, 6, 0, Math.PI * 2); x.fill(); x.restore(); }
    // الأسامي (مكانها محسوب من الكاميرا)
    x.setTransform(1, 0, 0, 1, 0, 0);
    C.labels.forEach((l, i) => { const lk = seg(tq, .8 + i * .22, 1.2 + i * .22), [sx, sy] = toS(AREAS[i]); op(l, lk > 0 ? 1 : 0); l.style.transform = `translate(${sx - l.offsetWidth / 2}px,${sy + 20}px) scale(${lk > 0 ? springO(lk * .5, 16, .5) : 0})`; });
    const sk = seg(tq, 2.8, 3.2), [ssx, ssy] = toS(STORE); op(C.sLab, sk > 0 && t < 8 ? 1 : 0); C.sLab.style.transform = `translate(${ssx - C.sLab.offsetWidth / 2}px,${ssy + 26}px) scale(${springO(sk * .5, 16, .5)})`;
    const ek = seg(t, 3.4, 3.8), [csx, csy] = toS(CUST), mins = Math.max(0, Math.round((parseInt(String(PR.eta).replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d))) || 24) * (1 - seg(tq, 3.2, 6.4))));
    op(C.eta, ek > 0 && t < 8 ? 1 : 0); C.eta.textContent = t > 6.4 ? `${PR.done} ✓` : `${ar(mins)} دقيقة`; C.eta.style.transform = `translate(${csx - C.eta.offsetWidth / 2}px,${csy - 200}px) scale(${springO(ek * .5, 16, .5)})`;
    const ck = t > 9.4 ? springO(t - 9.4, 12, .6) : 0; op(C.card, ck > 0 ? 1 : 0); C.card.style.transform = `translateY(${1420 + (1 - ck) * 500}px)`;
  },
  sound(A) {
    const N = A.midi;
    // موسيقى شرح خفيفة + «بلوب» لكل دبوس + صوت رسم الطريق
    for (let i = 0; i < 24; i++) { const t = i * .5; A.pluck(t, N([60, 64, 67, 72][i % 4] + (Math.floor(i / 8) % 2 ? 2 : 0)), .05, .4); if (i % 2 === 0) A.tone(t, N([48, 45, 41, 43][Math.floor(i / 4) % 4]), .9, "triangle", .08); }
    [0, 1, 2, 3, 4].forEach((i) => A.tone(.5 + i * .22, N(72 + i * 2), .12, "sine", .1));
    A.tone(2.45, N(67), .2, "sine", .14); A.tone(3.05, N(79), .2, "sine", .12);
    A.whoosh(1.6, .9, .18); for (let s = 3.2; s < 6.4; s += 1 / 12) A.click(s, .04);
    A.pluck(6.4, N(84), .15, .6); A.pluck(6.55, N(88), .15, .8); A.whoosh(7.4, .9, .18);
    [0, 1, 2, 3, 4].forEach((i) => A.tone(8.0 + i * .25, N(76 + i), .15, "sine", .07)); A.hit(9.4, .3);
  },
});
</script>
</body></html>

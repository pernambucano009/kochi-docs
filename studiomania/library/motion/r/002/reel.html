<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #2 / #94 One shape, never cut — 14 s loop (120 BPM, 7 bars), 1440×1440. Every state is the same element morphing size, radius
// and colour; its content swaps through a short blur; a cursor drives every change. Black & white on warm gray. Last frame = first.
// Button → loader → check → island → player (play/pause) → scrub → volume (stretches past max) → toggle → tabs (liquid indicator)
// → chart (draws, tooltip) → ⌘K (type to filter, enter) → toast → button.
const W = 1440, H = 1440, B = .5, BG = "#ebe9e4", INK = "#111111", WH = "#ffffff", MID = "#8a8780";
// shape keyframes: [t, w, h, radius, fill, content]
const KF = [
  [0, 380, 104, 52, INK, "button"], [1.0, 104, 104, 52, INK, "loader"], [2.0, 104, 104, 52, INK, "check"], [3.0, 440, 76, 38, INK, "island"],
  [4.0, 700, 330, 48, WH, "player"], [6.0, 700, 140, 70, WH, "volume"], [7.5, 220, 120, 60, WH, "toggle"], [8.5, 640, 110, 55, WH, "tabs"],
  [9.5, 700, 470, 40, WH, "chart"], [11.0, 660, 96, 48, WH, "cmdk"], [12.5, 420, 92, 46, INK, "toast"], [13.5, 380, 104, 52, INK, "button"],
];
M.reel({
  W, H, DUR: 14, bg: BG,
  fonts: { I5: ["inter500.ttf", "500"], I6: ["inter600.ttf", "600"] },
  init(M) { const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, expo, expoIO, springO } = M;
    const sp = (s) => springO(s, 15, .8);   // a tiny overshoot at most
    let i = 0; for (let k = 0; k < KF.length; k++) if (t >= KF[k][0]) i = k;
    const a = KF[Math.max(0, i - 1)], b = KF[i], k = i === 0 ? 1 : sp(t - b[0]);
    const mixC = (c1, c2, u) => { const p = (h) => [1, 3, 5].map((j) => parseInt(h.slice(j, j + 2), 16)); const A = p(c1), Bc = p(c2); return `rgb(${A.map((v, j) => Math.round(v + (Bc[j] - v) * clamp(u))).join(",")})`; };
    let w = lerp(a[1], b[1], k), h = lerp(a[2], b[2], k), r = lerp(a[3], b[3], k), fill = mixC(a[4], b[4], k);
    const state = b[5], ls = t - b[0];
    // the volume slider stretches when dragged past max (rubber band), springs back
    let stretch = 0; if (state === "volume") { const over = clamp((t - 6.6) / .5) * (1 - clamp((t - 7.2) / .01)); stretch = t < 7.2 ? 90 * expo(over) : 90 * (1 - sp(t - 7.2)); w += stretch; }
    // camera: zoom so each state fills the frame, eased
    const fitZ = (ww, hh) => Math.min(2.0, 860 / ww, 760 / hh);
    const z = lerp(fitZ(a[1], a[2]), fitZ(b[1], b[2]), i === 0 ? 1 : expoIO(seg(t, b[0], b[0] + .6)));
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = BG; x.fillRect(0, 0, W, H);
    x.translate(W / 2, H / 2); x.scale(z, z);
    // the shape
    x.fillStyle = "rgba(0,0,0,.06)"; x.beginPath(); x.roundRect(-w / 2 + 4 + stretch * .5, -h / 2 + 10, w, h, r); x.fill();
    x.fillStyle = fill; x.beginPath(); x.roundRect(-w / 2 + stretch * .5, -h / 2, w, h, Math.min(r, h / 2, w / 2)); x.fill();
    // content swap: a short blur in
    const blur = clamp(1 - ls / .16) * 8; x.save(); if (blur > .3) x.filter = `blur(${blur}px)`; x.globalAlpha = clamp(ls / .12);
    const fg = state === "toast" || state === "button" || state === "loader" || state === "check" || state === "island" ? WH : INK;
    const T = (s, X, Y, px, col = fg, wt = 600, al = "center") => { x.font = `${wt} ${px}px ${wt >= 600 ? "I6" : "I5"}`; x.fillStyle = col; x.textAlign = al; x.textBaseline = "middle"; x.fillText(s, X, Y); };
    const ico = { play: (X, Y, s, u) => { x.fillStyle = INK; x.beginPath(); if (u < .5) { x.moveTo(X - s * .35, Y - s * .5); x.lineTo(X + s * .5, Y); x.lineTo(X - s * .35, Y + s * .5); } else { x.rect(X - s * .4, Y - s * .5, s * .28, s); x.rect(X + s * .12, Y - s * .5, s * .28, s); } x.fill(); } };
    if (state === "button") T("Get started", 0, 2, 34);
    if (state === "loader") { x.strokeStyle = WH; x.lineWidth = 6; x.lineCap = "round"; const a0 = t * 9; x.beginPath(); x.arc(0, 0, 24, a0, a0 + 4.2); x.stroke(); }
    if (state === "check") { const d = expo(seg(t, 2.05, 2.4)); x.strokeStyle = WH; x.lineWidth = 7; x.lineCap = "round"; x.lineJoin = "round"; x.beginPath(); x.moveTo(-18, 0); const p1 = [-5, 14], p2 = [20, -14]; if (d < .4) x.lineTo(lerp(-18, p1[0], d / .4), lerp(0, p1[1], d / .4)); else { x.lineTo(...p1); x.lineTo(lerp(p1[0], p2[0], (d - .4) / .6), lerp(p1[1], p2[1], (d - .4) / .6)); } x.stroke(); }
    if (state === "island") { x.fillStyle = "#3a3a3a"; x.beginPath(); x.roundRect(-200, -22, 44, 44, 10); x.fill(); for (let j = 0; j < 5; j++) { const hh = 10 + Math.abs(Math.sin(t * 9 + j)) * 22; x.fillStyle = WH; x.fillRect(150 + j * 9, -hh / 2, 5, hh); } T("Now playing", -20, 1, 24, WH, 500); }
    if (state === "player") {
      x.fillStyle = "#d9d6cf"; x.beginPath(); x.roundRect(-320, -130, 170, 170, 20); x.fill();
      T("Midnight Drive", -120, -95, 34, INK, 600, "left"); T("Night Shift", -120, -52, 26, MID, 500, "left");
      const playing = t > 4.5 ? sp(t - 4.5) : 0; x.fillStyle = "#f1efea"; x.beginPath(); x.arc(250, -50, 52, 0, 7); x.fill(); ico.play(250, -50, 40, playing);
      // progress (scrubbed by the cursor 5.0–5.9)
      const prog = t < 5.0 ? .25 + (t - 4.5) * .02 : lerp(.27, .72, expoIO(seg(t, 5.05, 5.85)));
      x.fillStyle = "#dedbd4"; x.beginPath(); x.roundRect(-320, 90, 640, 10, 5); x.fill(); x.fillStyle = INK; x.beginPath(); x.roundRect(-320, 90, 640 * prog, 10, 5); x.fill();
      const kr = t > 5.0 && t < 5.9 ? 16 : 11; x.beginPath(); x.arc(-320 + 640 * prog, 95, kr, 0, 7); x.fill();
      T(`1:${String(Math.floor(prog * 59)).padStart(2, "0")}`, -320, 130, 22, MID, 500, "left"); T("3:41", 320, 130, 22, MID, 500, "right");
    }
    if (state === "volume") {
      const vw = 500 + stretch, vol = t < 6.6 ? lerp(.6, 1, expoIO(seg(t, 6.2, 6.6))) : 1;
      x.fillStyle = INK; x.beginPath(); x.moveTo(-300, -14); x.lineTo(-288, -14); x.lineTo(-272, -28); x.lineTo(-272, 28); x.lineTo(-288, 14); x.lineTo(-300, 14); x.fill();
      x.strokeStyle = INK; x.lineWidth = 4; for (let j = 0; j < 2; j++) { x.beginPath(); x.arc(-266, 0, 14 + j * 10, -.8, .8); x.stroke(); }
      const L = -220; x.fillStyle = "#dedbd4"; x.beginPath(); x.roundRect(L, -6, vw, 12, 6); x.fill(); x.fillStyle = INK; x.beginPath(); x.roundRect(L, -6, vw * vol, 12, 6); x.fill(); x.beginPath(); x.arc(L + vw * vol, 0, 18, 0, 7); x.fill();
    }
    if (state === "toggle") { const on = sp(t - 8.0); x.fillStyle = mixC("#dedbd4", "#111111", on); x.beginPath(); x.roundRect(-80, -40, 160, 80, 40); x.fill(); const kx = lerp(-40, 40, on), sq = 1 + Math.sin(clamp((t - 8.0) / .25) * Math.PI) * .25; x.fillStyle = WH; x.beginPath(); x.ellipse(kx, 0, 32 * sq, 32 / Math.sqrt(sq), 0, 0, 7); x.fill(); }
    if (state === "tabs") {
      const labs = ["Day", "Week", "Month"], tx = (j) => -200 + j * 200;
      const ta = t < 8.75 ? 0 : t < 9.15 ? 1 : 2, tPrev = t < 8.75 ? 0 : t < 9.15 ? 0 : 1, tt0 = t < 9.15 ? 8.75 : 9.15;
      const m = expoIO(seg(t, tt0, tt0 + .3)), stretchT = Math.sin(clamp((t - tt0) / .3) * Math.PI) * 60;   // liquid: it stretches toward the target, then settles
      const cx = lerp(tx(tPrev), tx(ta), m);
      x.fillStyle = INK; x.beginPath(); x.roundRect(cx - 85 - (ta > tPrev ? 0 : stretchT), -36, 170 + stretchT, 72, 36); x.fill();
      labs.forEach((l, j) => T(l, tx(j), 2, 30, Math.abs(cx - tx(j)) < 90 ? WH : INK, 600));
    }
    if (state === "chart") {
      const pts = [.3, .45, .38, .62, .55, .78, .7, .92], d = expo(seg(t, 9.6, 10.3)) * (pts.length - 1);
      T("Revenue", -310, -190, 34, INK, 600, "left"); T("Month", 310, -190, 24, MID, 500, "right");
      x.strokeStyle = "#e4e1da"; x.lineWidth = 2; for (let j = 0; j < 4; j++) { x.beginPath(); x.moveTo(-310, -110 + j * 80); x.lineTo(310, -110 + j * 80); x.stroke(); }
      const px = (j) => -310 + j * (620 / 7), py = (v) => 170 - v * 300;
      x.strokeStyle = INK; x.lineWidth = 6; x.lineJoin = "round"; x.beginPath(); for (let j = 0; j <= d; j++) (j ? x.lineTo(px(j), py(pts[j])) : x.moveTo(px(j), py(pts[j]))); const fj = Math.floor(d); if (fj < 7) x.lineTo(lerp(px(fj), px(fj + 1), d - fj), lerp(py(pts[fj]), py(pts[fj + 1]), d - fj)); x.stroke();
      if (t > 10.35) { const j = 5, k2 = sp(t - 10.35); x.fillStyle = INK; x.beginPath(); x.arc(px(j), py(pts[j]), 10, 0, 7); x.fill(); x.save(); x.translate(px(j), py(pts[j]) - 60); x.scale(k2, k2); x.beginPath(); x.roundRect(-70, -30, 140, 56, 14); x.fill(); T("$12.4k", 0, -2, 26, WH, 600); x.restore(); }
    }
    if (state === "cmdk") {
      const typed = "exp".slice(0, clamp(Math.floor((t - 11.4) / .15) + 1, 0, 3) * (t > 11.4 ? 1 : 0));
      x.fillStyle = "#f1efea"; x.beginPath(); x.roundRect(220, -24, 80, 48, 12); x.fill(); T("⌘K", 260, 1, 24, MID, 600);
      T(typed ? typed : "Search commands…", -290, 1, 30, typed ? INK : MID, 500, "left");
      if (typed && Math.floor(t * 2) % 2 === 0) { x.fillStyle = INK; x.fillRect(-290 + typed.length * 18 + 4, -18, 3, 36); }
      // results drop below the bar (outside the shape: part of the same element's menu)
      const items = ["Export video", "Export frames", "Expand canvas", "Duplicate", "Share"], keep = typed.length >= 3 ? ["Export video", "Export frames", "Expand canvas"] : items;
      const open = expo(seg(t, 11.3, 11.6)) * (1 - expo(seg(t, 12.45, 12.6)));
      if (open > 0) { x.globalAlpha = open; x.fillStyle = WH; x.beginPath(); x.roundRect(-330, 64, 660, 60 + keep.length * 58, 28); x.fill(); keep.forEach((it, j) => { if (j === 0) { x.fillStyle = "#f1efea"; x.beginPath(); x.roundRect(-310, 84 + j * 58, 620, 52, 14); x.fill(); } T(it, -280, 110 + j * 58, 28, INK, 500, "left"); }); x.globalAlpha = 1; }
    }
    if (state === "toast") { x.strokeStyle = WH; x.lineWidth = 5; x.lineCap = "round"; x.beginPath(); x.moveTo(-160, 0); x.lineTo(-148, 12); x.lineTo(-126, -12); x.stroke(); T("Video exported", 30, 1, 30, WH, 500); }
    x.restore();
    // ---------- the cursor (screen space inside the zoomed view): it travels to each click/drag
    const C = [[0, 260, 260], [.4, 60, 10], [.5, 60, 10], [3.6, 220, 120], [4.4, 250, -40], [4.95, -150, 95], [5.85, 140, 95], [6.2, 0, 0], [6.55, 280, 0], [7.2, 380, 0], [7.6, 0, 30], [7.95, 30, 0], [8.65, 0, 10], [9.05, 200, 10], [9.4, 260, 300], [10.3, 130, -10], [11.1, -100, 0], [12.4, -60, 115], [13.2, 300, 200], [14, 260, 260]];
    let ca = C[0]; for (const c of C) if (t >= c[0]) ca = c; const ci = C.indexOf(ca), cb = C[ci + 1] || ca, ck = cb === ca ? 1 : expoIO(seg(t, ca[0], ca[0] + Math.min(.45, cb[0] - ca[0])));
    let cx = lerp(ca[1], cb[1], ck), cy = lerp(ca[2], cb[2], ck);
    if (t > 6.55 && t < 7.2) cx = lerp(280, 380, expoIO(seg(t, 6.55, 7.15)));   // the over-drag
    const clicks = [.5, 4.5, 8.0, 8.75, 9.15, 12.45], down = Math.max(0, ...clicks.map((c) => (t > c - .06 && t < c + .12 ? 1 : 0))) || (t > 5.0 && t < 5.9) || (t > 6.5 && t < 7.2) ? 1 : 0;
    x.save(); x.translate(cx, cy); x.scale((1 - down * .12) / z * 1.4, (1 - down * .12) / z * 1.4); x.fillStyle = INK; x.strokeStyle = WH; x.lineWidth = 2.5; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 40); x.lineTo(10, 30); x.lineTo(18, 47); x.lineTo(25, 44); x.lineTo(17, 27); x.lineTo(31, 27); x.closePath(); x.stroke(); x.fill(); x.restore();
  },
  sound(A) {
    for (let b = 0; b < 28; b++) { A.kick(b * B, b % 4 === 0 ? .6 : .35); A.hat(b * B + B / 2, .04); }
    [.5, 4.5, 8.0, 8.75, 9.15, 12.45].forEach((t0) => { A.click(t0, .2); A.tone(t0, 1500, .04, "sine", .04); });
    KF.forEach(([t0], i) => { if (i) A.tone(t0, 440 * Math.pow(2, ((i * 5) % 12) / 12), .12, "triangle", .06); });
    A.tone(2.05, 1320, .2, "sine", .06); A.tone(2.15, 1760, .3, "sine", .05);
    for (let t0 = 5.05; t0 < 5.85; t0 += .05) A.click(t0, .02);
    A.tone(7.2, 300, .25, "sine", .1); A.tone(12.5, 1046, .3, "sine", .05);
    for (let k = 0; k < 3; k++) A.click(11.4 + k * .15, .08);
    const m = A.midi; [[0, [48, 55, 64]], [4, [45, 52, 60]], [8, [41, 48, 57]], [12, [43, 50, 59]]].forEach(([t0, ch]) => A.pad(t0, ch.map(m), t0 === 12 ? 2 : 4, .025));
  },
});
</script></body></html>

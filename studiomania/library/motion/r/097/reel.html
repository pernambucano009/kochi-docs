<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #97 "BUILD THE FLOOR." — 20 s, 1080×1080, a spoken-word film staged in type. Periodic: render(0) = render(20).
// Roles: WAIT = lintel, WAITING = suspended load on two cables, VOICE = support, ROOM's O = aperture, FLOOR = platform.
const BG = "#102820", PAPER = "#F4E9D5", ACC = "#F2B544", DIM = "rgba(244,233,213,.42)";
M.reel({
  W: 1080, H: 1080, DUR: 20, bg: BG,
  fonts: { SR: "dmserif.ttf", SRI: ["dmserif_i.ttf", "400", "italic"], GR: "archivoblack.ttf", MO: "mono.ttf" },
  init(M) { const c = M.canvas(1080, 1080); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, expo, expoIn, expoIO, spring, clamp, cubicIO, sine } = M;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = BG; x.fillRect(0, 0, 1080, 1080);
    const serif = (s, px, X, Y, col = PAPER, al = "center", it = false) => { x.font = `${it ? "italic " : ""}400 ${px}px ${it ? "SRI" : "SR"}`; x.fillStyle = col; x.textAlign = al; x.textBaseline = "alphabetic"; x.fillText(s, X, Y); };
    const heavy = (s, px, X, Y, col = PAPER, al = "center") => { x.font = `400 ${px}px GR`; x.fillStyle = col; x.textAlign = al; x.textBaseline = "alphabetic"; x.fillText(s, X, Y); };
    const mono = (s, X, Y, al = "left") => { x.font = "400 16px MO"; x.fillStyle = DIM; x.textAlign = al; x.textBaseline = "alphabetic"; x.fillText(s, X, Y); };
    const phrase = (s, px, X, Y, tin, tout, it = false) => { const a = expo(seg(t, tin, tin + .45)) * (1 - expoIn(seg(t, tout, tout + .35))); if (a <= 0) return; x.save(); x.beginPath(); x.rect(0, Y - px * 1.05, 1080, px * 1.4); x.clip(); serif(s, px, X, Y + (1 - a) * px * .9, PAPER, "center", it); x.restore(); };
    // the closing camera move (18–20) tracks under the platform: everything rises, the underside becomes the lintel of frame one
    const track = expoIO(seg(t, 18, 19.6));
    const rise = track * 760;
    x.save(); x.translate(0, -rise);
    // timing marks (monospace, restrained)
    const marks = [[0, "00.00"], [3, "03.00"], [6.5, "06.50"], [10, "10.00"], [12.5, "12.50"], [16, "16.00"]];
    const mk = marks.filter((m) => t >= m[0]).pop(); mono("— " + mk[1], 60, 1020); mono("BUILD THE FLOOR.", 1020, 1020, "right");

    // ---------- 0–3: WAIT is a lintel; the opening beneath it compresses
    const lintelOut = expoIO(seg(t, 3, 3.6));
    if (t < 3.7) {
      const press = cubicIO(seg(t, .3, 2.8));
      const lintelBottom = lerp(430, 492, press) - lintelOut * 520;
      x.save(); x.beginPath(); x.rect(0, 0, 1080, lintelBottom); x.clip();
      heavy("WAIT", 300, 540, lintelBottom - 18, PAPER); x.restore();
      x.fillStyle = PAPER; x.fillRect(80, lintelBottom, 920, 6);
      // the opening, and the sentence living in it
      x.fillStyle = ACC; x.fillRect(80, 640, 920, 10);
      const cy = (lintelBottom + 640) / 2 + 18;
      if (t < 3.2) phrase("We were told to wait.", 54, 540, cy, .25, 2.95);
    }
    // ---------- 3–6.5: phrases of the second line; WAITING lowers on two cables; the baseline bends under it
    const base0 = 760;
    // baseline state over the film: sag (elastic, only on the baseline), left lift, right lift
    const load = t < 3 ? 0 : spring(t - 5.2, 6) * (1 - expoIO(seg(t, 12.5, 13.3)));
    const sag = 70 * load;
    const leftLift = 120 * expoIO(seg(t, 8.0, 8.9)) * (1 - expoIO(seg(t, 12.5, 13.3)));
    const rightLift = 120 * expoIO(seg(t, 10.6, 11.3)) * (1 - expoIO(seg(t, 12.5, 13.3)));
    const BX0 = 120, BX1 = 960;
    const baseY = (u) => base0 - lerp(leftLift, rightLift, u) + sag * Math.sin(u * Math.PI) * (1 - .6 * Math.max(leftLift, rightLift) / 120);
    if (t >= 3 && t < 13.4) {
      phrase("So we learned", 50, 540, 170, 3.0, 6.3); phrase("the weight", 50, 540, 236, 3.7, 6.3); phrase("of waiting.", 50, 540, 302, 4.4, 6.3, true);
      // the baseline
      x.strokeStyle = ACC; x.lineWidth = 8; x.beginPath(); for (let i = 0; i <= 60; i++) { const u = i / 60, X = lerp(BX0, BX1, u), Y = baseY(u); i ? x.lineTo(X, Y) : x.moveTo(X, Y); } x.stroke();
      // WAITING: the suspended load on two fine cables
      const drop = spring(t - 5.0, 7);
      const wy = lerp(-120, baseY(.5) - 40, drop) - (t > 12.5 ? 0 : 0);
      const fade = 1 - expoIO(seg(t, 12.5, 13.2));
      if (t > 5 && fade > 0) {
        x.globalAlpha = fade;
        x.strokeStyle = PAPER; x.lineWidth = 1.5; [340, 740].forEach((cx) => { x.beginPath(); x.moveTo(cx, -200); x.lineTo(cx, wy - 92); x.stroke(); });
        heavy("WAITING", 118, 540, wy, PAPER);
        x.globalAlpha = 1;
      }
    }
    // ---------- 6.5–10: VOICE rises vertically and turns into a support under the left end; ROOM's O opens an aperture
    if (t >= 6.5 && t < 13.4) {
      phrase("Then one voice", 54, 540, 170, 6.5, 9.7); phrase("made room.", 54, 540, 240, 7.3, 9.7);
      const up = expoIO(seg(t, 7.0, 8.0)), rot = expoIO(seg(t, 7.6, 8.4));
      const vx = BX0 + 60, vy = lerp(1240, base0 + 150, up) - leftLift * 0;
      x.save(); x.translate(vx, lerp(vy, base0 - leftLift + 180, rot)); x.rotate(-Math.PI / 2 * (1 - rot * 0)); heavy("VOICE", 92, 0, 0, PAPER); x.restore();
      // ROOM and its aperture
      const rIn = expo(seg(t, 8.6, 9.0)), ap = expoIO(seg(t, 9.1, 10.0));
      if (rIn > 0 && t < 10.2) {
        x.globalAlpha = rIn; heavy("ROOM", 130, 540, 430, PAPER); x.globalAlpha = 1;
        x.font = "400 130px GR"; const w = x.measureText("ROOM").width, oX = 540 - w / 2 + x.measureText("R").width + x.measureText("O").width / 2;
        if (ap > 0) { x.fillStyle = BG; x.beginPath(); x.arc(oX, 385, lerp(22, 1200, ap * ap), 0, 7); x.fill(); x.save(); x.beginPath(); x.arc(oX, 385, lerp(26, 1200, ap * ap), 0, 7); x.clip(); x.fillStyle = "rgba(242,181,68,.06)"; x.fillRect(0, 0, 1080, 1080); x.restore(); }
      }
    }
    // ---------- 10–12.5: "Then another." — a second support levels the structure; a moment of absolute stillness (11.4–11.9)
    if (t >= 10 && t < 13.4) {
      phrase("Then another.", 60, 540, 200, 10.05, 12.3, true);
      const up2 = expoIO(seg(t, 10.2, 11.0));
      x.save(); x.translate(BX1 - 60, lerp(1240, base0 + 180, up2)); x.rotate(-Math.PI / 2); heavy("VOICE", 92, 0, 0, PAPER); x.restore();
      if (t > 11.3 && t < 12.3) { x.strokeStyle = DIM; x.lineWidth = 1; x.setLineDash([4, 8]); x.beginPath(); x.moveTo(60, base0 - 120); x.lineTo(1020, base0 - 120); x.stroke(); x.setLineDash([]); }
    }
    // ---------- 12.5–18: the words assemble into a platform; the declaration settles onto it; then a held stillness with a slight release
    if (t >= 12.5) {
      const asm = (i) => expoIO(seg(t, 12.6 + i * .3, 13.3 + i * .3));
      const relax = t > 16 ? Math.sin((t - 16) * Math.PI) * 3 * (1 - seg(t, 16, 18)) : 0;
      const PY = 760;
      // platform layers built from the earlier words: WAIT (lintel), WAITING (load), VOICE ×2 (supports), FLOOR on top
      const layers = [["WAITING", 78, PY + 170, 1], ["WAIT", 96, PY + 92, 0], ["VOICE  VOICE", 54, PY + 236, 2], ["FLOOR", 130, PY, 3]];
      layers.forEach(([w, px, Y, i]) => { const a = asm(i); if (a <= 0) return; x.save(); x.beginPath(); x.rect(0, Y - px * .9, 1080, px * 1.05); x.clip(); heavy(w, px, 540, Y + (1 - a) * 300 + relax * (i === 3 ? 0 : 1), i === 3 ? ACC : PAPER); x.restore(); });
      x.fillStyle = ACC; x.fillRect(90, PY + 14, 900 * asm(3), 8);
      // the declaration settles onto the platform; "us." shares FLOOR's alignment and scale
      const d1 = expo(seg(t, 14.0, 14.5)), d2 = expo(seg(t, 14.6, 15.1)), d3 = spring(t - 15.2, 9);
      x.save(); x.beginPath(); x.rect(0, 310, 1080, 120); x.clip();
      serif("Now the floor", 70, 540, 400 + (1 - d1) * 120 + relax * .5, PAPER); x.restore();
      x.save(); x.beginPath(); x.rect(0, 420, 1080, 110); x.clip(); serif("belongs to", 70, 540, 490 + (1 - d2) * 120, PAPER); x.restore();
      if (d3 > 0) { const usY = lerp(PY - 400, PY - 150, d3); heavy("US.", 130, 540, usY, PAPER); }
    }
    x.restore();
    // ---------- 18–20: under the platform — its underside fills the frame and becomes the WAIT lintel; the opening is revealed again
    if (t >= 18) {
      const k = expoIO(seg(t, 18.6, 19.8));
      // the platform underside: a paper slab coming down from the top, its lower edge landing where the lintel's edge sits at t=0
      const edge = lerp(1080, 430, k);
      x.fillStyle = BG; x.fillRect(0, 0, 1080, 1080 * k);
      x.save(); x.beginPath(); x.rect(0, 0, 1080, edge); x.clip(); heavy("WAIT", 300, 540, edge - 18, PAPER); x.restore();
      x.fillStyle = PAPER; x.fillRect(80, edge, 920, 6);
      if (k > .98) { x.fillStyle = ACC; x.fillRect(80, 640, 920, 10); mono("— 00.00", 60, 1020); mono("BUILD THE FLOOR.", 1020, 1020, "right"); }
    }
  },
  sound(A) {
    // optional, quiet: a low room tone and soft structural creaks on each structural event
    const m = A.midi;
    A.pad(0, [m(38), m(45)], 20, .025);
    [[5.2, 90], [8.2, 110], [11.0, 120], [13.3, 80], [15.2, 70]].forEach(([t0, f]) => { A.tone(t0, f, .8, "sine", .12); A.nz(t0, .25, "lowpass", 600, .08); });
    A.tone(11.3, m(69), 1.4, "sine", .04);
  },
});
</script></body></html>

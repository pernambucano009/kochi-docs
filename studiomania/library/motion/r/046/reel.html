<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #46 Showreel on our own topic — StudioMania, in its brand (ink, white, red). 24 s, 120 BPM (12 bars).
// Concept: "Everything is a 9:16 frame." One vertical reel frame becomes every scene.
// bar 1 hook · bars 2–3 kinetic type inside frames · 4–5 frame → ring → play (morph) · 6–7 frames stack into a 3D strip
// 8–9 the strip becomes a views dashboard · 10–11 strongest: a wall of frames playing on the beat · 12: end title, back to one frame.
const B = .5, INK = "#111113", WHITE = "#ffffff", RED = "#e8402f", GREY = "#e9e9ec";
const FW = 270, FH = 480;   // the frame
M.reel({
  W: 1920, H: 1080, DUR: 24, bg: WHITE,
  fonts: { JO: "Jost.ttf", J8: ["TY-Outfit-800.ttf", "800"] },
  init(M) { const c = M.canvas(1920, 1080); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, expo, expoIn, expoIO, spring, clamp, smooth, hash } = M;
    const beat = Math.floor(t / B), bt = t - beat * B, pulse = 1 - spring(bt, 16);
    const dark = (t >= 10 && t < 22);
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = dark ? INK : WHITE; x.fillRect(0, 0, 1920, 1080);
    const fg = dark ? WHITE : INK;
    const z = 1 + .035 * ((t % 4) / 4); x.translate(960, 540); x.scale(z, z); x.translate(-960, -540);
    const T = (s, px, X, Y, col, al = "center", fam = "J8") => { x.font = fam === "JO" ? `400 ${px}px JO` : `800 ${px}px J8`; x.fillStyle = col; x.textAlign = al; x.textBaseline = "middle"; x.fillText(s, X, Y); };
    const frame = (cx, cy, s, col, fill = null, r = 28) => { x.save(); x.translate(cx, cy); x.scale(s, s); if (fill) { x.fillStyle = fill; x.beginPath(); x.roundRect(-FW / 2, -FH / 2, FW, FH, r); x.fill(); } x.strokeStyle = col; x.lineWidth = 10 / s; x.beginPath(); x.roundRect(-FW / 2, -FH / 2, FW, FH, r); x.stroke(); x.restore(); };
    // ---------- bar 1 (0–2): hook — an empty frame, the word lands in it on each beat
    if (t < 2) {
      const s = lerp(1.3, 1, expo(seg(t, 0, .4)));
      frame(960, 540, s, INK);
      const w = ["ONE", "FRAME", "IS", "ALL"][beat]; if (t > .05) T(w, 64, 960, 540 + (1 - expo(seg(bt, 0, .2))) * 40, beat === 1 ? RED : INK);
    }
    // ---------- bars 2–3 (2–6): kinetic type — frames slide in from the right, each carrying a word
    if (t >= 2 && t < 6.2) {
      const words = ["IT", "TAKES", "TO", "TELL", "A", "WHOLE", "STORY", "."];
      const scroll = (t - 2) / B;
      words.forEach((w, i) => {
        const cx = 960 + (i - scroll) * (FW + 40) * 1.0 + (1 - expo(seg(t, 2 + i * B - .2, 2 + i * B + .2))) * 600;
        if (cx < -300 || cx > 2300) return;
        const center = Math.abs(cx - 960) < (FW + 40) / 2;
        frame(cx, 540, center ? 1.08 : .9, center ? RED : INK, center ? RED : null);
        T(w, w.length > 4 ? 52 : 70, cx, 540, center ? WHITE : INK);
      });
    }
    // ---------- bars 4–5 (6–10): morph — the frame rounds into a ring, the ring opens into a play button, then back to frames
    if (t >= 6 && t < 10.2) {
      const k = clamp(Math.floor((t - 6) / 1), 0, 3), m = expoIO(seg(t, 6 + k + .55, 6 + k + 1));
      const N = 160;
      const SHAPES = [
        (u) => { const p = u * 4, s = [[-1, -1], [1, -1], [1, 1], [-1, 1]]; const i = Math.floor(p) % 4, f = p - Math.floor(p), a = s[i], b = s[(i + 1) % 4]; return [lerp(a[0], b[0], f) * FW / 2, lerp(a[1], b[1], f) * FH / 2]; },
        (u) => [Math.cos(u * Math.PI * 2 - Math.PI * .75) * 220, Math.sin(u * Math.PI * 2 - Math.PI * .75) * 220],
        (u) => { const p = u * 3, s = [[-.6, -1], [1, 0], [-.6, 1]]; const i = Math.floor(p) % 3, f = p - Math.floor(p), a = s[i], b = s[(i + 1) % 3]; return [lerp(a[0], b[0], f) * 230, lerp(a[1], b[1], f) * 230]; },
        (u) => { const p = u * 4, s = [[-1, -1], [1, -1], [1, 1], [-1, 1]]; const i = Math.floor(p) % 4, f = p - Math.floor(p), a = s[i], b = s[(i + 1) % 4]; return [lerp(a[0], b[0], f) * FW / 2, lerp(a[1], b[1], f) * FH / 2]; },
      ];
      const A = SHAPES[k], Bs = SHAPES[Math.min(3, k + 1)];
      x.beginPath();
      for (let i = 0; i <= N; i++) { const u = i / N, p = A(u), q = Bs(u); const px = 960 + lerp(p[0], q[0], m), py = 540 + lerp(p[1], q[1], m); i ? x.lineTo(px, py) : x.moveTo(px, py); }
      x.closePath();
      const filled = (k === 1 && m > .5) || k === 2;
      x.fillStyle = RED; if (filled) x.fill(); x.strokeStyle = filled ? RED : INK; x.lineWidth = 10; x.lineJoin = "round"; x.stroke();
      T(["FRAME", "RING", "PLAY", "FRAME"][k], 30, 960, 880, INK, "center", "JO");
    }
    // ---------- bars 6–7 (10–14): 2D → 3D — frames stack in depth into a film strip and the strip turns
    if (t >= 10 && t < 14.3) {
      const n = 9, spread = expo(seg(t, 10, 10.8)), turn = expoIO(seg(t, 11.5, 13.2)), out = expoIO(seg(t, 13.6, 14.2));
      const items = [];
      for (let i = 0; i < n; i++) {
        const zz = (i - 4) * 260 * spread, ang = turn * Math.PI * .42;
        const X3 = zz * Math.sin(ang) * 1.6, Z3 = zz * Math.cos(ang) * .8 + 1700;
        const f = 1500 / Z3;
        items.push({ i, X: 960 + X3 * f * (1 - out) + out * ((i - 4) * 220), s: f * lerp(1, .55, out), Z3, sk: Math.sin(ang) * (1 - out) });
      }
      items.sort((a, b) => b.Z3 - a.Z3).forEach((o) => {
        x.save(); x.translate(o.X, 540); x.transform(1 - Math.abs(o.sk) * .55, o.sk * .25, 0, 1, 0, 0);
        x.globalAlpha = clamp(1.4 - Math.abs(o.i - 4) * .12);
        frame(0, 0, o.s, o.i === 4 ? RED : WHITE, o.i === 4 ? RED : INK);
        x.restore();
      });
      x.globalAlpha = 1;
    }
    // ---------- bars 8–9 (14–18): the strip lies down into bars of a views dashboard
    if (t >= 14 && t < 18.2) {
      const V = [.22, .35, .3, .52, .48, .66, .74, .9, 1];
      V.forEach((v, i) => {
        const g = expo(seg(t, 14.1 + i * .25, 14.5 + i * .25));
        const h = lerp(FH * .55, 640 * v, g), w = lerp(FW * .55, 120, g), cx = 960 + (i - 4) * 220 * lerp(1, .78, g);
        x.fillStyle = i === 8 ? RED : WHITE; x.beginPath(); x.roundRect(cx - w / 2, lerp(540 - h / 2, 900 - h, g), w, h, lerp(16, 10, g)); x.fill();
      });
      const views = Math.round(1240000 * expo(seg(t, 14.5, 17.2)));
      T(views.toLocaleString("en-US"), 120, 200, 170, WHITE, "left");
      T("VIEWS THIS MONTH", 30, 206, 250, RED, "left", "JO");
      const out = expoIO(seg(t, 17.6, 18.2));
      if (out > 0) { x.fillStyle = INK; x.fillRect(0, 1080 * (1 - out), 1920, 1080 * out); }
    }
    // ---------- bars 10–11 (18–22): strongest — a wall of frames, each "playing" (a moving bar), flipping colour in waves on every beat
    if (t >= 18 && t < 22.2) {
      const cols = 9, rows = 3, into = expo(seg(t, 18, 18.4)), coll = expoIO(seg(t, 21.5, 22.1));
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const d = (c + r) * .035, w = expoIO(seg(bt, d, d + .2)), on = (beat + (w > .5 ? 1 : 0) + c + r) % 3 === 0;
        const cx = lerp(160 + c * 200, 960, coll), cy = lerp(200 + r * 340, 540, coll), s = .58 * into * (1 + .06 * pulse) * lerp(1, 1.72, coll);
        frame(cx, cy, s, on ? RED : WHITE, on ? RED : null, 26);
        if (!coll) { x.fillStyle = on ? WHITE : RED; const ph = ((t * .8 + c * .13 + r * .07) % 1); x.fillRect(cx - FW * s / 2 + 14, cy + FH * s / 2 - 22, (FW * s - 28) * ph, 6); }
      }
    }
    // ---------- bar 12 (22–24): end title, then one empty frame — frame one
    if (t >= 22) {
      const a = expo(seg(t, 22.1, 22.5)), o = expoIn(seg(t, 23.4, 23.8));
      x.globalAlpha = a * (1 - o);
      const font = "400 110px JO"; x.font = font;
      const sp = 26, wA = M.measure("STUDI", font) + 5 * sp, gap = 90, wB = M.measure("MANIA", font) + 4 * sp, lx = 960 - (wA + gap + wB) / 2;
      x.fillStyle = INK; x.textBaseline = "middle"; x.textAlign = "left";
      let px = lx; for (const ch of "STUDI") { x.fillText(ch, px, 520); px += M.measure(ch, font) + sp; }
      px = lx + wA + gap; for (const ch of "MANIA") { x.fillText(ch, px, 520); px += M.measure(ch, font) + sp; }
      x.strokeStyle = RED; x.lineWidth = 12; x.beginPath(); x.arc(lx + wA + gap / 2 - sp / 2, 520 + 2, 38, 0, 7); x.stroke();
      T("Content & video studio", 34, 960, 640, "#77777d", "center", "JO");
      x.globalAlpha = 1;
      if (t > 23.75) frame(960, 540, lerp(1.3, 1, expo(seg(t, 23.75, 24))), INK);
    }
  },
  sound(A) {
    for (let k = 0; k < 48; k++) { const t0 = k * B; A.kick(t0, .85); A.hat(t0 + B / 2, .08); if (k % 4 === 2) A.clap(t0, .15); }
    for (const t0 of [2, 6, 10, 14, 18, 22]) A.hit(t0, .5);
    for (let k = 0; k < 8; k++) A.whoosh(2 + k * B - .2, .3, .1);
    for (let k = 0; k < 9; k++) A.pluck(14.1 + k * .25, A.midi(57 + [0, 3, 5, 7, 10, 12, 15, 17, 19][k]), .1, .25);
    A.riser(16, 18, .32);
    for (let k = 0; k < 16; k++) A.bass(18 + k * .25, A.midi(33 + (k % 4 === 3 ? 7 : 0)), .2, .22);
    A.pad(22, [57, 61, 64, 69].map(A.midi), 2, .04);
  },
});
</script></body></html>

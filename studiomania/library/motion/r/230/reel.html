<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #230 The lighthouse keeper — 45 s, silent (no words, no text). Sound carries the story.
// Story: on a stormy night the lighthouse lamp dies with a ship heading for the rocks. WANT: give the ship a light.
//  1 (8–14 s) a new bulb: it flares… and pops.   2 (14–22 s) an oil lantern: the wind blows it out; a match too; the wind takes his cap.
//  3 (22–30 s) a mirror to catch the moon: it works for a moment — then the clouds close. He sits down, beaten.
//  TURN (30–36 s) down in the village, a window lights, then lanterns come out one by one and line the rocks. The ship turns away.
//  END (36–41 s) the ship sounds its horn as it passes; the keeper waves.
//  GAG (41–45 s) the lamp behind him snaps back on by itself… then pops again. And his cap drops back onto his head.
// Shots: SHOTS (hard cuts, on action). Every frame is a function of t.
const W = 1920, H = 1080;
const LX = 1500, LTOP = 340, LBASE = 760, HOR = 600;
const SHOTS = [[0, 960, 540, 1], [4, 1495, 300, 6], [6, 960, 540, 1], [8, 1490, 310, 6], [14, 1460, 315, 6.5], [22, 1440, 300, 5], [24.6, 960, 520, 1], [27.6, 1465, 320, 6.5], [30, 1100, 620, 1.4], [36, 1465, 320, 6.5], [37.5, 900, 560, 1.2], [40.5, 1490, 310, 6]];
const shipX = (t) => (t < 33.5 ? M.lerp(200, 900, M.clamp(t / 33.5)) : t < 36 ? 900 : 900 - (t - 36) * 70);
const shipF = (t) => Math.cos(Math.PI * M.smooth(M.seg(t, 33.5, 36)));   // 1 = heading right (toward the rocks), −1 = away
const lampOn = (t) => {
  if (t < 4.6) return 1;
  if (t < 5.2) return [4.7, 4.85, 5.0].some((a) => t > a && t < a + .07) ? 1 : 0;
  if (t > 12.4 && t < 12.7) return 1.4;
  if (t > 42.0 && t < 44.0) return 1.6;
  return 0;
};
const moonOut = (t) => M.seg(t, 23.3, 23.9) * (1 - M.seg(t, 27.0, 27.5));
M.reel({
  W, H, DUR: 45, bg: "#0b1530",
  init(M) { const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, expo, expoIO, springO, hash, noise1 } = M;
    let sh = SHOTS[0]; for (const s of SHOTS) if (t >= s[0]) sh = s;
    const [, cx, cy, z] = sh;
    const flash = [7.0, 7.12, 18.0, 26.2].some((a) => t > a && t < a + .06);
    const warm = seg(t, 30.5, 34);   // the mood warms when the village answers
    const SKY = flash ? "#9fb3d9" : `rgb(${Math.round(lerp(11, 30, warm))},${Math.round(lerp(21, 32, warm))},${Math.round(lerp(48, 62, warm))})`;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = SKY; x.fillRect(0, 0, W, H);
    x.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z);
    const storm = 1 - seg(t, 34, 38) * .7;
    // ---------- moon + clouds
    const mo = moonOut(t);
    x.fillStyle = "#e9e4c8"; x.beginPath(); x.arc(1100, 170, 46, 0, 7); x.fill();
    const cloudGap = mo * 160;
    x.fillStyle = flash ? "#7d8fb8" : "#1a2546";
    [[-1, 1100 + 40 - cloudGap], [1, 1100 - 40 + cloudGap]].forEach(([d, ex]) => { x.beginPath(); for (let i = 0; i < 6; i++) { const bx = ex + d * i * 110 + d * 50, by = 170 + Math.sin(i * 1.7) * 30; x.moveTo(bx + 80, by); x.arc(bx, by, 80 + (i % 3) * 14, 0, 7); } x.fill(); });
    x.fillRect(-500, 0, 3000, 80);
    // ---------- sea (layered bands) + the ship
    const sea = (y0, amp, sp, col, ph) => { x.fillStyle = col; x.beginPath(); x.moveTo(-500, 2000); for (let X = -500; X <= 2500; X += 20) x.lineTo(X, y0 + Math.sin(X * .01 + t * sp + ph) * amp * storm + Math.sin(X * .023 - t * sp * 1.3) * amp * .5 * storm); x.lineTo(2500, 2000); x.fill(); };
    sea(HOR, 6, .8, flash ? "#3c5486" : "#0f1d40", 0);
    // the ship: bobbing, its little cabin light the only warm thing at sea
    { const sx = shipX(t), sc = lerp(.45, 1, clamp((sx - 200) / 700)), sy = HOR + 14 + Math.sin(t * 1.6) * 5 * storm, f = shipF(t), rk = Math.sin(t * 1.3) * .06 * storm;
      x.save(); x.translate(sx, sy); x.rotate(rk); x.scale(sc * (Math.abs(f) < .08 ? .08 * Math.sign(f || 1) : f), sc);
      x.fillStyle = "#050a18"; x.beginPath(); x.moveTo(-90, -10); x.lineTo(90, -10); x.lineTo(70, 18); x.lineTo(-74, 18); x.fill(); x.fillRect(-40, -40, 60, 30); x.fillRect(-6, -110, 6, 70); x.fillRect(30, -70, 16, 30);
      x.fillStyle = "#ffcf6b"; x.fillRect(-30, -32, 12, 10); x.fillRect(0, -32, 12, 10); x.restore(); }
    sea(HOR + 40, 10, 1.1, flash ? "#2e4675" : "#0c1836", 2);
    // ---------- rocks, cliff, village
    x.fillStyle = "#050a14";
    x.beginPath(); x.moveTo(960, 760); [[990, 700], [1030, 720], [1060, 680], [1100, 712], [1140, 690], [1190, 724], [1230, 700], [1260, 760]].forEach((p) => x.lineTo(...p)); x.fill();
    x.beginPath(); x.moveTo(1200, 1200); x.lineTo(1220, 760); x.lineTo(1320, 700); x.lineTo(1440, 690); x.lineTo(1700, 760); x.lineTo(1960, 740); x.lineTo(2200, 1200); x.fill();
    // village windows on the slope (they light one by one at the turn)
    const WIN = [[1260, 742], [1300, 728], [1340, 716], [1380, 712], [1660, 752], [1700, 748], [1745, 756]];
    WIN.forEach(([wx, wy], i) => { x.fillStyle = "#08101e"; x.fillRect(wx - 16, wy - 26, 32, 26); x.beginPath(); x.moveTo(wx - 20, wy - 26); x.lineTo(wx, wy - 40); x.lineTo(wx + 20, wy - 26); x.fill(); if (t > 30.5 + i * .35) { x.fillStyle = "#ffcf6b"; x.fillRect(wx - 5, wy - 18, 10, 9); } });
    // lanterns: carried down the path and lined up along the rocks
    for (let i = 0; i < 8; i++) {
      const t0 = 31.4 + i * .32; if (t < t0) continue;
      const k = expoIO(seg(t, t0, t0 + 2.0)), tx = 980 + i * 36, ty = 690 + Math.sin(i * 1.9) * 10;
      const sxp = lerp(1280 + (i % 3) * 30, tx, k), syp = lerp(730, ty, k) - Math.abs(Math.sin(k * Math.PI * 4)) * 4;
      const sway = t > 36 ? Math.sin(t * 3 + i) * 3 : 0;
      x.fillStyle = "#050a14"; x.fillRect(sxp - 3 + sway * .3, syp, 6, 18); x.beginPath(); x.arc(sxp + sway * .3, syp - 4, 4, 0, 7); x.fill();
      x.fillStyle = "#ffcf6b"; x.fillRect(sxp + 5 + sway, syp - 6, 6, 8);
    }
    // ---------- the lighthouse
    x.fillStyle = "#e8e6df"; x.beginPath(); x.moveTo(LX - 45, LBASE); x.lineTo(LX - 30, LTOP); x.lineTo(LX + 30, LTOP); x.lineTo(LX + 45, LBASE); x.fill();
    x.fillStyle = "#b33a3a"; for (let k = 0; k < 4; k++) { const y0 = LTOP + 40 + k * 100, y1 = y0 + 50, w0 = lerp(30, 45, (y0 - LTOP) / (LBASE - LTOP)), w1 = lerp(30, 45, (y1 - LTOP) / (LBASE - LTOP)); x.beginPath(); x.moveTo(LX - w0, y0); x.lineTo(LX + w0, y0); x.lineTo(LX + w1, y1); x.lineTo(LX - w1, y1); x.fill(); }
    // gallery + lamp room
    x.fillStyle = "#1a1f2c"; x.fillRect(LX - 60, LTOP - 4, 120, 8);
    x.strokeStyle = "#1a1f2c"; x.lineWidth = 2; for (let k = 0; k <= 12; k++) { x.beginPath(); x.moveTo(LX - 60 + k * 10, LTOP - 4); x.lineTo(LX - 60 + k * 10, LTOP - 22); x.stroke(); } x.beginPath(); x.moveTo(LX - 60, LTOP - 22); x.lineTo(LX + 60, LTOP - 22); x.stroke();
    const lo = lampOn(t);
    x.fillStyle = lo ? (lo > 1.2 ? "#fffbe8" : "#ffe9a8") : "#26304a"; x.fillRect(LX - 28, LTOP - 62, 56, 58);
    x.strokeStyle = "#1a1f2c"; x.lineWidth = 3; for (let k = 0; k <= 4; k++) { x.beginPath(); x.moveTo(LX - 28 + k * 14, LTOP - 62); x.lineTo(LX - 28 + k * 14, LTOP - 4); x.stroke(); }
    x.fillStyle = "#1a1f2c"; x.beginPath(); x.moveTo(LX - 34, LTOP - 62); x.quadraticCurveTo(LX, LTOP - 100, LX + 34, LTOP - 62); x.fill(); x.fillRect(LX - 2, LTOP - 108, 4, 14);
    // the bulb
    x.fillStyle = lo ? "#ffffff" : "#56607a"; x.beginPath(); x.arc(LX, LTOP - 36, 9, 0, 7); x.fill(); x.fillStyle = "#1a1f2c"; x.fillRect(LX - 5, LTOP - 28, 10, 10);
    // the beam: a flat wedge sweeping (only while on)
    if (lo) { const a = t * 1.6 * (t < 5 ? 1 : 0) + (t > 42 ? Math.PI : 0); const dir = Math.cos(a) < 0 ? -1 : 1, spread = .07 * Math.abs(Math.cos(a)) + .02; x.fillStyle = `rgba(255,240,190,${.22 * Math.min(1, lo)})`; x.beginPath(); x.moveTo(LX, LTOP - 36); x.lineTo(LX + dir * 2600, LTOP - 36 - 2600 * spread); x.lineTo(LX + dir * 2600, LTOP - 36 + 2600 * spread * 1.4); x.fill(); }
    // ---------- the keeper (feet on the gallery floor). Silhouette: cap, beard, round coat.
    const keeper = (kx, o = {}) => {
      const ky = LTOP - 4 + (o.dy || 0), s = 1, sq = o.sq || 0;
      x.save(); x.translate(kx, ky); x.scale((o.f || 1) * (1 + sq), 1 - sq);
      x.fillStyle = o.lit ? "#0b0d14" : "#121726";
      x.fillRect(-6, -10, 4, 10); x.fillRect(2, -10, 4, 10);   // legs
      x.beginPath(); x.moveTo(-11, -10); x.quadraticCurveTo(-13, -30, -6, -32); x.lineTo(6, -32); x.quadraticCurveTo(13, -30, 11, -10); x.fill();   // coat
      const hy = -38 + (o.droop ? 3 : 0), hx = o.droop ? 3 : 0;
      x.beginPath(); x.arc(hx, hy, 6, 0, 7); x.fill();
      x.fillStyle = "#c9ccd6"; x.beginPath(); x.moveTo(hx + 1, hy + 1); x.lineTo(hx + 8, hy + 2); x.lineTo(hx + 3, hy + 10); x.fill();   // beard
      if (!o.nocap) { x.fillStyle = o.lit ? "#0b0d14" : "#121726"; x.fillRect(hx - 6, hy - 9, 12, 4); x.fillRect(hx - 2, hy - 7, 10, 2); }
      // arms: two angles (radians from straight down), and a held thing
      x.strokeStyle = o.lit ? "#0b0d14" : "#121726"; x.lineWidth = 3.4; x.lineCap = "round";
      const arm = (sx, a) => { const ex = sx + Math.sin(a) * 13, ey = -28 + Math.cos(a) * 13; x.beginPath(); x.moveTo(sx, -28); x.lineTo(ex, ey); x.stroke(); return [ex, ey]; };
      const hA = arm(-7, o.a1 ?? .2), hB = arm(7, o.a2 ?? -.2);
      if (o.hold) o.hold(hB);
      x.restore();
      x.save(); x.translate(kx, ky); x.scale((o.f || 1) * (1 + sq), 1 - sq); x.globalCompositeOperation = "destination-over"; x.restore();
    };
    // keeper's acting
    let kp = null;
    if (t >= 8 && t < 14) {
      const rise = expo(seg(t, 8.0, 8.8));
      const walk = expoIO(seg(t, 9.0, 9.9)), kx = lerp(LX - 30, LX - 14, walk);
      const reach = t > 10.2 && t < 12.4, tw = Math.sin(t * 14) * .3;
      const pop = t > 12.7, jump = pop ? springO(t - 12.7, 14, .35) : 0;
      kp = [kx, { dy: (1 - rise) * 30 - (pop && t < 13.0 ? 8 * Math.sin((t - 12.7) / .3 * Math.PI) : 0), a2: reach ? Math.PI * .85 + tw : t > 12.4 && t < 12.7 ? -.3 : -.2, a1: pop && t < 13.2 ? Math.PI * .7 : .2, sq: pop ? -.2 * Math.exp(-(t - 12.7) * 8) : 0, droop: t > 13.2, f: 1 }];
      // the old bulb, tossed over the shoulder (an arc, follow-through)
      if (t > 11.4 && t < 12.2) { const u = t - 11.4; x.fillStyle = "#56607a"; x.beginPath(); x.arc(kx - u * 60, LTOP - 40 - 60 * u + 200 * u * u, 4, 0, 7); x.fill(); }
      // glass shards on the pop
      if (t > 12.7 && t < 13.4) for (let i = 0; i < 8; i++) { const u = t - 12.7, a = i / 8 * Math.PI * 2; x.fillStyle = "#cfd8ee"; x.fillRect(LX + Math.cos(a) * u * 60, LTOP - 36 + Math.sin(a) * u * 60 + 120 * u * u, 2, 2); }
    }
    if (t >= 14 && t < 22) {
      const out = expoIO(seg(t, 14.2, 15.0)), kx = lerp(LX - 14, LX - 48, out);
      const up = t > 15.5 && t < 20, gust = seg(t, 17.0, 17.4), capOff = t > 20.4;
      kp = [kx, { f: -1, a2: up ? Math.PI * .7 : t > 20 && t < 21 ? Math.PI * .9 : -.2, a1: t > 20 && t < 21 ? -Math.PI * .9 : t > 18.4 && t < 19.6 ? Math.PI * .55 : .2, nocap: capOff, droop: t > 21, hold: (h) => {
        if (t > 14.5 && t < 20) {   // the lantern
          x.fillStyle = "#121726"; x.fillRect(h[0] - 3, h[1], 6, 9);
          if (t < 17.4) { const lean = gust * 6; x.fillStyle = "#ffcf6b"; x.beginPath(); x.moveTo(h[0] - 2, h[1] + 7); x.quadraticCurveTo(h[0] + lean, h[1] + 1, h[0] + lean * 1.4, h[1] + 2 - 4 * (1 - gust)); x.lineTo(h[0] + 2, h[1] + 7); x.fill(); }
          else if (t < 18.4) { x.strokeStyle = "rgba(200,205,215,.6)"; x.lineWidth = 1; x.beginPath(); for (let i = 0; i < 10; i++) x.lineTo(h[0] + i * 1.6 + Math.sin(i + t * 6) * 1.5, h[1] - i * 2.2); x.stroke(); }
        }
      } }];
      // the match: a spark at the other hand, then taken by the wind
      if (t > 18.6 && t < 19.4) { const hx = kx + 7, hy = LTOP - 4 - 28 - 13; x.fillStyle = "#ffcf6b"; x.beginPath(); x.arc(hx, hy, t < 19.2 ? 2.2 : 1.2, 0, 7); x.fill(); }
      // the cap blows away (it comes back in the gag)
      if (t > 20.4) { const u = t - 20.4; x.fillStyle = "#121726"; x.save(); x.translate(kx + u * 160, LTOP - 47 - u * 60); x.rotate(u * 9); x.fillRect(-6, -2, 12, 4); x.restore(); }
    }
    if (t >= 22 && t < 30) {
      const kx = LX - 48, tilt = expoIO(seg(t, 24.0, 24.5)), sit = expoIO(seg(t, 28.8, 29.2));
      kp = [kx, { f: -1, nocap: true, dy: sit * 6, sq: sit * .18, droop: t > 28, a2: t < 28 ? Math.PI * .75 : -.1, a1: t < 28 ? Math.PI * .6 : .1, hold: (h) => { if (t < 28.4) { x.fillStyle = "#cfd8ee"; x.save(); x.translate(h[0] + 4, h[1] - 4); x.rotate(-.6 - tilt * .5); x.beginPath(); x.ellipse(0, 0, 10, 3, 0, 0, 7); x.fill(); x.restore(); } } }];
      // the reflected moonbeam: from the mirror down to the sea, onto the ship
      const beam = mo * tilt * (t < 28 ? 1 : 0);
      if (beam > 0) { const mx = kx - 12, my = LTOP - 48, sx = shipX(t), sy = HOR; x.fillStyle = `rgba(233,228,200,${.3 * beam})`; x.beginPath(); x.moveTo(mx, my); x.lineTo(sx - 120, sy - 30); x.lineTo(sx + 120, sy + 40); x.fill(); }
    }
    if (t >= 30 && t < 36) kp = [LX - 48, { f: -1, nocap: true, dy: 6, sq: .18, droop: t < 33, a1: .1, a2: -.1 }];
    if (t >= 36 && t < 41) { const stand = expo(seg(t, 36, 36.4)); kp = [LX - 48, { f: -1, nocap: true, dy: (1 - stand) * 6, sq: (1 - stand) * .18, a2: t > 36.6 ? Math.PI * .8 + Math.sin(t * 9) * .4 : -.1, a1: .2 }]; }
    if (t >= 41) {
      const look = t > 42.4;   // he turns to the lamp (head first)
      kp = [LX - 24, { f: look ? 1 : -1, nocap: t < 44.4, lit: t > 42 && t < 44, a1: .2, a2: -.2, sq: t > 44.4 ? .15 * Math.exp(-(t - 44.4) * 9) : 0 }];
      if (t > 43.6 && t < 44.4) { const u = (t - 43.6) / .8; x.fillStyle = "#121726"; x.save(); x.translate(LX - 24 + (1 - u) * 30, lerp(LTOP - 140, LTOP - 51, u * u)); x.rotate((1 - u) * 6); x.fillRect(-6, -2, 12, 4); x.restore(); }
    }
    if (kp) { x.save(); x.filter = "drop-shadow(0 0 0 #7f8db0) drop-shadow(1.2px 0 0 #7f8db0) drop-shadow(-1.2px 0 0 #7f8db0) drop-shadow(0 -1.2px 0 #7f8db0)"; keeper(kp[0], kp[1]); x.restore(); }
    // ---------- rain (paper-thin strokes), stopping as the turn arrives
    const rain = storm * (t < 36 ? 1 : .2);
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.strokeStyle = "rgba(170,190,225,.35)"; x.lineWidth = 2;
    for (let i = 0; i < 160 * rain; i++) { const rx = hash(i) * 2200 - 100, ry = ((hash(i + 50) * 1300 + t * 1700) % 1300) - 100; x.beginPath(); x.moveTo(rx, ry); x.lineTo(rx - 14, ry + 36); x.stroke(); }
  },
  sound(A) {
    const m = A.midi;
    // storm bed: wind, rain, waves; it calms after the turn
    A.nz(0, 34, "bandpass", 500, .08, .4); A.nz(0, 36, "highpass", 3000, .05, .6); A.nz(34, 11, "highpass", 3000, .02, .6);
    for (let t0 = 1; t0 < 44; t0 += 3.1) A.nz(t0, 2.4, "lowpass", 350, t0 < 34 ? .2 : .1, .7);
    // lamp hum, flicker, death
    A.tone(0, 120, 4.6, "sawtooth", .02); [4.7, 4.85, 5.0].forEach((t0) => A.click(t0, .15)); A.tone(5.2, 90, .3, "sine", .1);
    [[7.0, .5], [18.0, .4], [26.2, .4]].forEach(([t0, g]) => { A.hit(t0 + .2, g); A.nz(t0 + .2, 1.6, "lowpass", 200, .3); });
    // footsteps on the iron stairs, the hatch
    for (let i = 0; i < 6; i++) A.tone(7.6 + i * .12, 300, .05, "square", .03); A.nz(8.0, .2, "lowpass", 800, .2);
    for (let i = 0; i < 5; i++) A.click(10.4 + i * .16, .1);   // unscrewing
    A.nz(11.9, .15, "bandpass", 3000, .15);   // the old bulb lands somewhere below
    for (let i = 0; i < 4; i++) A.click(11.6 + i * .16, .1);
    A.tone(12.4, 2400, .3, "sine", .06); A.nz(12.7, .25, "highpass", 4000, .35); A.tone(12.7, 1800, .05, "square", .05);   // POP
    A.tone(13.4, m(55), .4, "triangle", .06); A.tone(13.8, m(50), .8, "triangle", .06);   // a sad little two-note
    // lantern, gust, match, cap
    A.nz(17.0, .8, "bandpass", 900, .25, .6); A.nz(18.6, .12, "highpass", 2500, .25); A.nz(19.3, .5, "bandpass", 1000, .2, .6); A.whoosh(20.3, .5, .2);
    // mirror: a glint, the moon motif, then the clouds close
    A.tone(24.2, 2600, .4, "sine", .05); [72, 76, 79].forEach((n, i) => A.tone(24.5 + i * .3, m(n), 1.2, "sine", .04)); A.tone(27.3, m(60), 1.5, "sine", .04);
    A.nz(29.0, .2, "lowpass", 500, .2);   // sitting down
    // the turn: each window, each lantern a warm note; the ship's horn
    for (let i = 0; i < 7; i++) A.pluck(30.5 + i * .35, m([60, 64, 67, 69, 72, 74, 76][i]), .12, .8);
    for (let i = 0; i < 8; i++) A.tone(31.4 + i * .32 + 2, m([67, 69, 72, 74, 76, 79, 81, 84][i]), .3, "triangle", .04);
    A.pad(31, [m(48), m(55), m(64)], 10, .04);
    [36.5, 37.3].forEach((t0, i) => { [55, 62, 67].forEach((n) => A.tone(t0, m(n - 12), i ? 1.2 : .6, "sawtooth", .05)); });
    A.pad(37.5, [m(53), m(60), m(64), m(69)], 3.5, .035);
    // the gag
    A.tone(42.0, 120, 2, "sawtooth", .03); A.click(42.0, .25); A.nz(44.0, .25, "highpass", 4000, .35); A.tone(44.4, 400, .08, "sine", .1);
  },
});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// قالب «على الإيقاع»: مونتاج كلمات سريع متقطّع على البيت (١٢٠ ضربة في الدقيقة): كل ضربة قطع جديد بلون وشكل وتكوين مختلف
// (كلمة ضخمة، كلمة مكررة بحدود، دايرة، كلمة مايلة، تقسيم)، وبعد البناء "الدروب" باسم البراند بيومض مع الكيك. 1080×1920، 12 ثانية.
const K1 = "١ · البناء", K2 = "٢ · الدروب", KS = "الشكل العام";
const PR = M.params({
  words: { label: "الكلمات (كلمة في كل سطر)", kind: "lines", def: ["جاهز؟", "صيف", "جديد", "ألوان", "جريئة", "خفيف", "سريع", "ليك", "انت", "بس"], group: K1,
    hint: "٨–١٢ كلمة، كل كلمة ضربة (نصف ثانية). عند قراءتها متتالية تعبّر عن إحساس المجموعة أو الحملة. كلمة واحدة في كل سطر." },
  brand: { label: "اسم العلامة", kind: "text", role: "brand", def: "موجة", group: K2, max: 10, hint: "يومض مع ضربة الطبل في الذروة." },
  sub: { label: "الجملة الأخيرة", kind: "text", def: "الكولكشن نازل الخميس", group: K2, max: 26, hint: "ما القادم ومتى." },
  c1: { label: "لون ١", kind: "color", role: "accent", def: "#ff2e63", group: KS, hint: "كل ضربة بلون: ٣ ألوان صريحة ومتضادة." },
  c2: { label: "لون ٢", kind: "color", role: "accent2", def: "#08d9d6", group: KS },
  c3: { label: "لون ٣", kind: "color", def: "#fcee21", group: KS },
  fHead: { label: "خط الكلمات", kind: "font", def: "lalezar", group: KS },
  fBody: { label: "خط الجملة الأخيرة", kind: "font", def: "plex", group: KS },
});
M.meta({
  story: "مونتاج كلمات متقطع على الإيقاع: كل ضربة كلمة جديدة بلون وتكوين مختلف، وبعد التمهيد تأتي الذروة باسم العلامة يومض مع الطبلة.",
  scenes: [{ name: K1, t0: 0, t1: 8, about: "كل ضربة كلمة" }, { name: K2, t0: 8, t1: 12, about: "الدروب باسم البراند" }],
  tips: ["أفضل لإعلان مجموعة أو حملة.", "كلمات قصيرة (كلمة واحدة) تُقرأ في نصف ثانية."],
});
const W = 1080, H = 1920, DUR = 12, BT = .5, DROP = 16;
const WD = PR.words.length ? PR.words : ["!"];

M.reel({
  W, H, DUR, bg: "#111",
  async init(M) { await Promise.all([M.font("LZ", PR.fHead), M.font("PB", PR.fBody)]); const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, C, M) {
    const { x } = C, { clamp, hash, expo, springO } = M, b = Math.floor(t / BT), f = (t % BT) / BT, cols = [PR.c1, PR.c2, PR.c3, "#111", "#fff"];
    x.setTransform(1, 0, 0, 1, 0, 0);
    const pk = Math.exp(-f * 6);   // نبضة مع كل ضربة
    const big = (s, size, col, stroke) => { x.font = `${M.fit(s, "LZ", 1000, size, 80)}px LZ`; x.textAlign = "center"; x.textBaseline = "middle"; x.direction = "rtl"; if (stroke) { x.lineWidth = 6; x.strokeStyle = col; x.strokeText(s, 0, 0); } else { x.fillStyle = col; x.fillText(s, 0, 0); } };
    if (b < DROP) {
      const w = WD[b % WD.length], L = b % 6, bg = cols[(b * 2) % 3], fg = b % 2 ? "#111" : "#fff", acc = cols[(b * 2 + 1) % 3];
      x.fillStyle = bg; x.fillRect(0, 0, W, H);
      x.save(); x.translate(540, 960);
      const sc = 1 + .08 * pk;
      if (L === 0) { x.scale(sc, sc); big(w, 420, fg); }
      else if (L === 1) { for (let k = -4; k <= 4; k++) { x.save(); x.translate(0, k * 220 + (f * 220) * (b % 2 ? 1 : -1)); big(w, 230, k === 0 ? fg : acc, k !== 0); x.restore(); } }
      else if (L === 2) { x.fillStyle = acc; x.beginPath(); x.arc(0, 0, 420 * (.85 + .15 * pk), 0, Math.PI * 2); x.fill(); big(w, 300, fg); }
      else if (L === 3) { x.rotate(-.18); x.fillStyle = "#111"; x.fillRect(-900, -170, 1800, 340); x.translate(-60 + f * 120, 0); big(w, 280, acc); }
      else if (L === 4) { x.fillStyle = acc; x.fillRect(-540, 0, 1080, 960); x.save(); x.beginPath(); x.rect(-540, -960, 1080, 960); x.clip(); big(w, 380, fg); x.restore(); x.save(); x.beginPath(); x.rect(-540, 0, 1080, 960); x.clip(); x.translate(f * 60, 0); big(w, 380, bg); x.restore(); }
      else { x.scale(1 + f * .5, 1 + f * .5); big(w, 360, fg); }
      x.restore();
      // شبكة نقط/خطوط صغيرة بتتغير كل ضربة
      x.fillStyle = fg; for (let i = 0; i < 6; i++) { const yy = 120 + i * 18; x.fillRect(60, yy, 80 + hash(b * 7 + i) * 220, 6); }
      x.font = "700 34px PB"; x.textAlign = "left"; x.direction = "ltr"; x.fillText(String(b + 1).padStart(2, "0") + " / " + DROP, 60, H - 70);
    } else {
      // الدروب
      const db = b - DROP, fl = db % 2 === 0, bg = fl ? "#111" : cols[db % 3];
      x.fillStyle = bg; x.fillRect(0, 0, W, H);
      const k = springO(clamp((t - DROP * BT) / .5), 12, .5);
      for (let r = 0; r < 6; r++) { x.strokeStyle = cols[(r + db) % 3]; x.lineWidth = 14; x.globalAlpha = .6; x.beginPath(); x.arc(540, 900, (180 + r * 160 + f * 160) % 1200, 0, Math.PI * 2); x.stroke(); } x.globalAlpha = 1;
      x.save(); x.translate(540, 900); x.scale(k * (1 + .06 * pk), k * (1 + .06 * pk)); x.lineJoin = "round"; x.font = `${M.fit(PR.brand, "LZ", 960, 380, 120)}px LZ`; x.textAlign = "center"; x.textBaseline = "middle"; x.direction = "rtl";
      x.lineWidth = 26; x.strokeStyle = "#111"; x.strokeText(PR.brand, 0, 0); x.fillStyle = fl ? cols[db % 3] : "#fff"; x.fillText(PR.brand, 0, 0); x.restore();
      const sa = clamp((t - (DROP + 2) * BT) / .3); x.globalAlpha = sa; x.fillStyle = fl ? "#fff" : "#111"; x.font = `700 ${M.fit(PR.sub, "PB", 900, 60, 30, "700")}px PB`; x.textAlign = "center"; x.direction = "rtl"; x.fillText(PR.sub, 540, 1300); x.globalAlpha = 1;
    }
    // فلاش أبيض صغير أول كل ضربة
    x.fillStyle = `rgba(255,255,255,${pk * .18})`; x.fillRect(0, 0, W, H);
  },
  sound(A) {
    const N = A.midi, B = .5;
    for (let b = 0; b < 24; b++) { const s = b * B, drop = b >= DROP;
      A.kick(s, drop ? .9 : .6); A.hat(s + B / 2, .06); A.hat(s + B * .75, .03); if (b % 2) A.clap(s, drop ? .2 : .12);
      A.bass(s, N([36, 36, 39, 34][Math.floor(b / 4) % 4]), .45, drop ? .25 : .15);
      A.pluck(s, N([72, 75, 79, 82, 79, 75][b % 6]), .05, .3); }
    A.riser(5.5, 2.5, .08); A.nz(7.8, .2, "highpass", 4000, .1, 1); A.hit(8.0, .7); A.pad(8.0, [N(48), N(51), N(55), N(60)], 4, .04);
  },
});
</script>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// قالب «كرتون قديم» (ستايل التلاتينات): أبيض وأسود، كوباية قهوة بإيدين ورجلين خراطيم وجوانتي أبيض وعيون «فطيرة»،
// كل حاجة بتتنفس على الإيقاع، كروت عناوين قديمة، وخدوش وتراب فيلم. 1080×1920، 12 ثانية، 120 BPM.
const G1 = "١ · الكارت الأول", G2 = "٢ · الكارت التاني", G3 = "٣ · الختام", GS = "الشكل العام";
const PR = M.params({
  title: { label: "العنوان", kind: "text", role: "product", def: "قهوة الصباح", group: G1, max: 14, hint: "كارت عنوان زي أفلام التلاتينات: كلمتين بالكتير." },
  sub: { label: "الكارت التاني", kind: "text", def: "أول رشفة… وتصحصح", group: G2, max: 22, hint: "جملة ظريفة بتكمّل العنوان، بنقط (…) لو فيها وقفة." },
  brand: { label: "اسم البراند", kind: "text", role: "brand", def: "بُن الحارة", group: G3, max: 16 },
  fHead: { label: "خط الكروت", kind: "font", def: "lalezar", group: GS, hint: "خط تقيل للعناوين." },
  fText: { label: "خط الكلام", kind: "font", def: "amiri", group: GS, hint: "خط كلاسيكي بيدّي إحساس الأفلام القديمة." },
});
M.meta({
  story: "كرتون التلاتينات بالأبيض والأسود: كوباية قهوة بإيدين ورجلين خراطيم وجوانتي أبيض بترقص على الإيقاع، كروت عناوين قديمة، وخدوش وتراب فيلم.",
  scenes: [{ name: G1, t0: 0, t1: 7, about: "الكوباية بترقص وكارت العنوان" }, { name: G2, t0: 7, t1: 9.6, about: "الكارت التاني" }, { name: G3, t0: 9.6, t1: 12, about: "كارت البراند" }],
  tips: ["مناسب للقهوة والمشروبات والمحلات اللي ليها روح قديمة.", "الكلام القليل أحسن: الشخصية هي اللي بتتكلم.", "الستايل أبيض وأسود، فمفيش ألوان تختارها."],
});
const W = 1080, H = 1920, DUR = 12, BPM = 120, B = 60 / BPM;
const G = ["#151311", "#3a3632", "#5e5953", "#85807a", "#aaa59e", "#cbc6bf", "#f2efe9"];   // ٦ درجات رمادي + أبيض الشخصيات
const INK = G[0], WHITE = G[6];

M.reel({
  W, H, DUR, bg: "#000",
  async init(M) {
    await Promise.all([M.font("LZ", PR.fHead), M.font("AM", PR.fText)]);
    const c = M.canvas(W, H); const x = c.getContext("2d");
    // الخلفية: بتترسم مرة واحدة (ورق حيطة، كاونتر، أرضية شطرنج) بدرجات رمادي نص
    const bgc = document.createElement("canvas"); bgc.width = W; bgc.height = H; const b = bgc.getContext("2d"), R = M.rng(3);
    b.fillStyle = G[3]; b.fillRect(0, 0, W, H);
    for (let y = 0; y < 1250; y += 90) for (let xx = (y / 90) % 2 ? 45 : 0; xx < W; xx += 90) { b.fillStyle = G[2]; b.save(); b.translate(xx, y); b.rotate(Math.PI / 4); b.fillRect(-9, -9, 18, 18); b.restore(); b.fillStyle = G[4]; b.beginPath(); b.arc(xx + 45, y + 45, 4, 0, Math.PI * 2); b.fill(); }
    for (let i = 0; i < 90; i++) { const cx = R() * W, cy = R() * 1250, r = 60 + R() * 200, g = b.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, `rgba(0,0,0,${R() * .08})`); g.addColorStop(1, "rgba(0,0,0,0)"); b.fillStyle = g; b.fillRect(cx - r, cy - r, r * 2, r * 2); }
    // شباك
    b.fillStyle = G[4]; b.fillRect(110, 260, 300, 380); b.strokeStyle = G[1]; b.lineWidth = 10; b.strokeRect(110, 260, 300, 380); b.beginPath(); b.moveTo(260, 260); b.lineTo(260, 640); b.moveTo(110, 450); b.lineTo(410, 450); b.stroke();
    b.fillStyle = G[5]; b.globalAlpha = .4; b.beginPath(); b.moveTo(130, 280); b.lineTo(240, 280); b.lineTo(140, 430); b.closePath(); b.fill(); b.globalAlpha = 1;
    // أرضية شطرنج بمنظور
    const hz = 1250, rows = 9;
    for (let r = 0; r < rows; r++) {
      const y0 = hz + Math.pow(r / rows, 1.6) * (H - hz), y1 = hz + Math.pow((r + 1) / rows, 1.6) * (H - hz);
      for (let k = -8; k < 9; k++) {
        const s0 = .5 + .5 * r / rows, s1 = .5 + .5 * (r + 1) / rows, tw = 150;
        b.fillStyle = (r + k) % 2 ? G[2] : G[4];
        b.beginPath(); b.moveTo(540 + k * tw * s0, y0); b.lineTo(540 + (k + 1) * tw * s0, y0); b.lineTo(540 + (k + 1) * tw * s1, y1); b.lineTo(540 + k * tw * s1, y1); b.closePath(); b.fill();
      }
    }
    b.fillStyle = G[1]; b.fillRect(0, hz - 14, W, 14);
    // ترابيزة صغيرة الكوباية واقفة عليها
    b.fillStyle = G[2]; b.beginPath(); b.ellipse(540, 1420, 330, 60, 0, 0, Math.PI * 2); b.fill(); b.strokeStyle = INK; b.lineWidth = 6; b.stroke();
    b.fillStyle = G[1]; b.fillRect(515, 1470, 50, 330); b.strokeRect(515, 1470, 50, 330); b.beginPath(); b.ellipse(540, 1810, 140, 26, 0, 0, Math.PI * 2); b.fill(); b.stroke();
    const vg = b.createRadialGradient(540, 900, 300, 540, 960, 1150); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)"); b.fillStyle = vg; b.fillRect(0, 0, W, H);
    return { x, bgc };
  },
  seek(t, C, M) {
    const { x } = C, { seg, clamp, springO, expo, cubic } = M;
    const tq = Math.floor(t * 12) / 12, beats = tq / B;                   // الشخصيات على «اتنين»
    const weave = [Math.sin(t * 3.1) * 1.2 + (Math.floor(t * 30) % 97 === 0 ? 6 : 0), Math.cos(t * 2.3) * 1.2];
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
    x.save(); x.translate(weave[0], weave[1]);
    // الفريم (البوابة) بحواف مدوّرة
    const gate = () => { x.beginPath(); x.roundRect(36, 36, W - 72, H - 72, 34); };
    gate(); x.save(); x.clip();
    // زوم على الشخصية لما الكروت تظهر
    const zin = cubic(seg(t, 0.4, 1.4)) * 0 + 1;
    x.drawImage(C.bgc, 0, 0);
    // التنفس: كل حاجة بتتمط وتتكبس مع كل بيت
    const joy = t > 5.1 && t < 6.4 ? 3 : 1;
    const br = Math.cos(2 * Math.PI * beats) * .055 * joy;
    // قفزة: كبسة (تحضير) ← ثبات ← نطة
    const jt = tq - 4.5; let squash = 0, lift = 0;
    if (jt > 0 && jt < .5) squash = .2 * Math.sin(Math.PI * jt / .5);
    else if (jt >= .5 && jt < 1.3) { const u = (jt - .5) / .8; lift = 340 * Math.sin(Math.PI * u); squash = -.12 * Math.sin(Math.PI * u); }
    else if (jt >= 1.3 && jt < 1.7) squash = .22 * Math.exp(-8 * (jt - 1.3)) * Math.cos(20 * (jt - 1.3));
    const sy = 1 + br - squash, sx = 1 / Math.sqrt(Math.max(.3, sy));
    const FX = 540, FY = 1400 - lift;
    const ow = 7;
    const ln = (pts, w = ow, col = INK) => { x.beginPath(); x.moveTo(pts[0][0], pts[0][1]); if (pts.length === 3) x.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]); else pts.slice(1).forEach((p) => x.lineTo(p[0], p[1])); x.lineCap = "round"; x.lineJoin = "round"; x.lineWidth = w; x.strokeStyle = col; x.stroke(); };
    const shape = (fn, fill) => { fn(); x.fillStyle = fill; x.fill(); x.lineWidth = ow; x.strokeStyle = INK; x.stroke(); };
    const glove = (gx, gy, a, wave) => {
      x.save(); x.translate(gx, gy); x.rotate(a);
      const parts = () => { x.beginPath(); x.ellipse(0, 0, 34, 30, 0, 0, Math.PI * 2); for (let f = 0; f < 3; f++) { const fa = -.9 + f * .55 + wave; x.moveTo(Math.cos(fa) * 30 + 16, Math.sin(fa) * 30); x.ellipse(Math.cos(fa) * 30, Math.sin(fa) * 30, 15, 12, fa, 0, Math.PI * 2); } x.moveTo(-10 + 15, 28); x.ellipse(-10, 28, 15, 11, .8, 0, Math.PI * 2); };
      parts(); x.lineWidth = ow * 2; x.strokeStyle = INK; x.stroke(); parts(); x.fillStyle = WHITE; x.fill();
      x.beginPath(); x.ellipse(-44, 0, 14, 28, 0, 0, Math.PI * 2); x.fillStyle = WHITE; x.fill(); x.lineWidth = ow; x.stroke();
      x.lineWidth = 3; for (let s = -1; s <= 1; s++) { x.beginPath(); x.moveTo(-8, s * 10); x.lineTo(12, s * 10); x.stroke(); }
      x.restore();
    };
    // ظل على الترابيزة
    x.fillStyle = "rgba(0,0,0,.35)"; x.beginPath(); x.ellipse(540, 1418, 150 - lift * .12, 24, 0, 0, Math.PI * 2); x.fill();
    // الرجلين: خراطيم + جزم كبيرة
    const step = Math.sin(Math.PI * beats) > 0 ? 1 : -1, tap = Math.abs(Math.sin(Math.PI * beats)) * 18;
    [[-1, 0], [1, 1]].forEach(([s, k]) => {
      const hipX = FX + s * 60 * sx, hipY = FY - 150 * sy, up = (k ? step > 0 : step < 0) ? tap : 0;
      const fx = FX + s * 95, fy = Math.min(1400, FY + 0) - up;
      ln([[hipX, hipY], [hipX + s * 50, (hipY + fy) / 2], [fx, fy - 20]], 20);
      x.save(); x.translate(fx + s * 28, fy - 8); shape(() => { x.beginPath(); x.ellipse(0, 0, 66, 34, s * -.05, 0, Math.PI * 2); }, INK);
      x.fillStyle = WHITE; x.beginPath(); x.ellipse(s * 30, -12, 14, 7, 0, 0, Math.PI * 2); x.fill(); x.restore();
    });
    // جسم الكوباية (مرسوم من تحت لفوق عشان التمطيط يبقى من عند الرجلين)
    x.save(); x.translate(FX, FY - 120); x.scale(sx, sy);
    const bodyPath = () => { x.beginPath(); x.moveTo(-190, -430); x.lineTo(190, -430); x.bezierCurveTo(185, -200, 170, -60, 120, -10); x.lineTo(-120, -10); x.bezierCurveTo(-170, -60, -185, -200, -190, -430); x.closePath(); };
    // الإيد (ودن الكوباية)
    x.lineWidth = ow + 30; x.strokeStyle = INK; x.beginPath(); x.ellipse(182, -250, 74, 95, 0, -1.3, 1.3); x.stroke(); x.lineWidth = 30; x.strokeStyle = WHITE; x.stroke();
    shape(bodyPath, WHITE);
    // ضلمة على جنب واحد (بلوك رمادي فاتح)
    x.save(); bodyPath(); x.clip(); x.fillStyle = G[5]; x.beginPath(); x.moveTo(110, -440); x.bezierCurveTo(140, -200, 120, -60, 70, 0); x.lineTo(240, 0); x.lineTo(240, -440); x.fill(); x.restore(); bodyPath(); x.lineWidth = ow; x.strokeStyle = INK; x.stroke();
    // القهوة جوه
    shape(() => { x.beginPath(); x.ellipse(0, -430, 190, 42, 0, 0, Math.PI * 2); }, G[1]);
    x.fillStyle = G[2]; x.beginPath(); x.ellipse(-30, -428, 110, 20, 0, 0, Math.PI * 2); x.fill();
    // العيون «فطيرة» + الرمش
    const blink = (beats % 8) > 7.6 ? 1 : 0, look = Math.sin(beats * Math.PI / 4) * 8;
    [-62, 62].forEach((ex) => {
      shape(() => { x.beginPath(); x.ellipse(ex, -290, 46, 62, 0, 0, Math.PI * 2); }, WHITE);
      if (blink) { x.fillStyle = WHITE; ln([[ex - 40, -290], [ex + 40, -290]]); return; }
      x.fillStyle = INK; x.beginPath(); x.moveTo(ex + look, -280); x.ellipse(ex + look, -280, 29, 44, 0, -0.5, Math.PI * 2 - 1.1); x.closePath(); x.fill();
    });
    x.fillStyle = INK; x.beginPath(); x.ellipse(-62, -370, 40, 10, -.2, 0, Math.PI * 2); x.ellipse(62, -370, 40, 10, .2, 0, Math.PI * 2); x.fill();
    // البوق: ابتسامة عادية ← فم مفتوح وقت النطة
    if (lift > 40 || (t > 5.1 && t < 6.4)) { shape(() => { x.beginPath(); x.moveTo(-80, -175); x.quadraticCurveTo(0, -160, 80, -175); x.quadraticCurveTo(60, -80, 0, -78); x.quadraticCurveTo(-60, -80, -80, -175); }, INK); x.fillStyle = G[4]; x.beginPath(); x.ellipse(0, -100, 34, 16, 0, 0, Math.PI * 2); x.fill(); }
    else { ln([[-90, -180], [0, -110], [90, -180]]); ln([[-98, -192], [-84, -170]], 6); ln([[98, -192], [84, -170]], 6); }
    x.restore();
    // الإيدين: خراطيم من غير كوع، بتتمرجح على الإيقاع، والجوانتي الأبيض
    const swing = Math.sin(Math.PI * beats) * .9;
    [[-1, swing], [1, -swing]].forEach(([s, sw]) => {
      const shX = FX + s * 175 * sx, shY = FY - 120 - 260 * sy;
      const up = lift > 40 || (t > 5.1 && t < 6.4);
      const hx = shX + s * (up ? 120 : 150 + 40 * sw), hy = up ? shY - 220 : shY + 120 - 90 * sw;
      ln([[shX, shY], [(shX + hx) / 2 + s * 40, (shY + hy) / 2 + (up ? 0 : 60)], [hx, hy]], 20);
      glove(hx, hy, s > 0 ? (up ? -1.4 : .2 - sw * .4) : (up ? -1.7 + Math.PI : Math.PI - .2 + sw * .4), Math.sin(tq * 9) * .1);
    });
    // البخار: ٣ لفّات بيضا بتتنطط على الإيقاع
    for (let k = 0; k < 3; k++) {
      const by = FY - 120 - 430 * sy - 60, ph = beats * Math.PI + k;
      x.beginPath(); for (let i = 0; i <= 20; i++) { const u = i / 20; x.lineTo(FX - 80 + k * 80 + Math.sin(u * 9 + ph) * 18, by - u * (200 + 30 * Math.sin(ph))); }
      x.lineWidth = 22; x.strokeStyle = INK; x.lineCap = "round"; x.stroke(); x.lineWidth = 12; x.strokeStyle = WHITE; x.stroke();
    }
    // كارت العنوان: الكلمات بتتنطط موجة على الإيقاع، خط أبيض بحدود سودا وضل
    const card = (fn, k) => { if (k <= 0) return; x.save(); fn(k); x.restore(); };
    const tIn = seg(t, 5.0, 5.15), tOut = t > 8.0;
    if (tIn > 0 && !tOut) {
      const words = PR.title.split(/\s+/).filter(Boolean), fs = M.fit(PR.title, "LZ", 900, 230, 90);
      x.font = `${fs}px LZ`; x.direction = "rtl"; x.textBaseline = "alphabetic";
      const ws = words.map((w) => x.measureText(w).width), sp = fs * .25, tot = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
      let rx = 540 + tot / 2;
      words.forEach((w, i) => {
        const hop = Math.max(0, Math.sin(Math.PI * (beats * 2 - i * .5))) * 30, px = rx - ws[i] / 2; rx -= ws[i] + sp;
        x.save(); x.translate(px, 470 - hop); x.textAlign = "center";
        x.lineJoin = "round"; x.fillStyle = INK; x.fillText(w, 12, 14); x.lineWidth = fs * .14; x.strokeStyle = INK; x.strokeText(w, 0, 0); x.fillStyle = WHITE; x.fillText(w, 0, 0); x.restore();
      });
    }
    // كارت قديم: لوح غامق بإطار أبيض مزدوج ونقط في الأركان
    const plate = (txt, y, font, size) => {
      const pw = 860, ph = 210, px = 540 - pw / 2;
      x.fillStyle = "rgba(20,18,16,.94)"; x.beginPath(); x.roundRect(px, y, pw, ph, 18); x.fill();
      x.strokeStyle = WHITE; x.lineWidth = 5; x.strokeRect(px + 18, y + 18, pw - 36, ph - 36); x.lineWidth = 2; x.strokeRect(px + 30, y + 30, pw - 60, ph - 60);
      [[px + 18, y + 18], [px + pw - 18, y + 18], [px + 18, y + ph - 18], [px + pw - 18, y + ph - 18]].forEach(([a, b]) => { x.fillStyle = WHITE; x.beginPath(); x.arc(a, b, 9, 0, Math.PI * 2); x.fill(); x.fillStyle = INK; x.beginPath(); x.arc(a, b, 4, 0, Math.PI * 2); x.fill(); });
      x.fillStyle = WHITE; const wt = font === "AM" ? "700" : ""; x.font = `${wt} ${M.fit(txt, font, 720, size, 30, wt)}px ${font}`.trim(); x.textAlign = "center"; x.direction = "rtl"; x.textBaseline = "middle"; x.fillText(txt, 540, y + ph / 2 + 6);
    };
    if (t >= 7.0 && t < 9.6) plate(PR.sub, 250, "AM", 86);          // بيظهر ويختفي من غير فيد (زي الكروت القديمة)
    if (t >= 9.6) plate(PR.brand, 250, "LZ", 120);
    x.restore();
    // دايرة القفلة (آيرس) في الآخر وفي الأول
    const irisIn = cubic(seg(t, 0, .9)), irisOut = 1 - cubic(seg(t, 11.0, 11.9));
    const ir = Math.min(irisIn, irisOut) * 1300;
    if (ir < 1300) { x.save(); x.fillStyle = "#000"; x.beginPath(); x.rect(0, 0, W, H); x.arc(540, 1050, Math.max(0, ir), 0, Math.PI * 2, true); x.fill("evenodd"); x.restore(); }
    // ضرر الفيلم: رعشة إضاءة، خدوش، تراب، شعرة، وإطار أسود
    const f = Math.floor(t * 30), r = M.rng(f * 13 + 7);
    x.fillStyle = `rgba(255,255,255,${(r() - .5) * .06 + .02})`; x.fillRect(0, 0, W, H);
    for (let i = 0, n = Math.floor(r() * 3); i < n; i++) { const sx2 = r() * W; x.strokeStyle = `rgba(230,225,215,${.25 + r() * .3})`; x.lineWidth = 1 + r() * 1.5; x.beginPath(); x.moveTo(sx2, 0); x.lineTo(sx2 + (r() - .5) * 20, H); x.stroke(); }
    for (let i = 0, n = 3 + Math.floor(r() * 6); i < n; i++) { x.fillStyle = r() < .5 ? "rgba(10,10,10,.8)" : "rgba(240,235,225,.7)"; x.beginPath(); x.arc(r() * W, r() * H, 1 + r() * 4, 0, Math.PI * 2); x.fill(); }
    if (f % 53 < 4) { x.strokeStyle = "rgba(15,15,15,.7)"; x.lineWidth = 2; x.beginPath(); const hx = 200 + (f * 37 % 600); x.moveTo(hx, 300); x.bezierCurveTo(hx + 60, 360, hx - 40, 430, hx + 30, 520); x.stroke(); }
    x.restore();
    x.globalCompositeOperation = "destination-over"; x.fillStyle = "#000"; x.fillRect(0, 0, W, H); x.globalCompositeOperation = "source-over";
    // حبيبات
    const gr = M.rng(f * 7 + 1); for (let i = 0; i < 900; i++) { x.fillStyle = gr() < .5 ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.12)"; x.fillRect(gr() * W, gr() * H, 2, 2); }
  },
  sound(A) {
    const N = A.midi, ctx = A.ctx;
    // جاز قديم: توبا على ١ و٣، كوردات على ٢ و٤، خشبة، ولحن كلارينيت
    const prog = [[48, [60, 64, 67]], [53, [60, 65, 69]], [55, [59, 62, 67]], [48, [60, 64, 67]]];
    for (let i = 0, t = .5; t < 11.5; i++, t += B) {
      const [root, ch] = prog[Math.floor(i / 4) % 4];
      if (i % 2 === 0) A.tone(t, N(root - 12 + (i % 4 ? 7 : 0)), B * .9, "triangle", .32);
      else ch.forEach((n) => A.tone(t, N(n), .16, "square", .035));
      A.nz(t + B / 2, .04, "bandpass", 2400, .12, 4);
    }
    const mel = [72, 74, 76, 79, 76, 74, 72, 67, 69, 72, 74, 76, 74, 72, 74, 72];
    mel.forEach((n, i) => { const t = 1 + i * B * .5 * 1.0 + Math.floor(i / 8) * 2; const o = A.tone(t, N(n), B * .45, "square", .03); });
    // صفارة زحلقة مع النطة + صنج مع العنوان
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.setValueAtTime(400, 4.98); o.frequency.exponentialRampToValueAtTime(1600, 5.3); o.frequency.exponentialRampToValueAtTime(500, 5.75);
    g.gain.setValueAtTime(.0001, 4.98); g.gain.linearRampToValueAtTime(.12, 5.05); g.gain.exponentialRampToValueAtTime(.001, 5.8); o.connect(g).connect(A.out); o.start(4.98); o.stop(5.85);
    A.nz(5.0, 1.4, "highpass", 6000, .18); A.hit(5.8, .4); A.nz(7.0, .05, "bandpass", 1500, .3); A.nz(9.6, .05, "bandpass", 1500, .3);
    A.nz(0, 12, "bandpass", 3000, .015, .3);   // خشخشة الفيلم
  },
});
</script>

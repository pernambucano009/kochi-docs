<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #211 "ONE SECOND, STRETCHED" — 15 s. Concept: a single second, slowed fifteen times, and what the world does inside it.
// Facts: light travels 299,792 km in a second ≈ 7.5 trips around Earth (circumference 40,075 km); Earth moves ~30 km along its orbit
// (29.8 km/s); lightning strikes Earth about 44 times a second (NASA estimate); about 4 babies are born each second (UN, ~130M+/yr).
// 0–3 kinetic type: "1 SECOND" on a clock face; the second hand is frozen · 3–6 shape morph: the clock ring becomes Earth's orbit,
// Earth slides 30 KM · 6–9 2D→3D: the ring becomes a globe; a beam of light wraps it 7.5 times · 9–12 data/UI: three counters fill
// within the same second · 12–15 end title. One typeface (Outfit 800); orange + cyan + black/white. Camera: one slow clockwise roll.
const W = 1920, H = 1080, OR = "#ff6a1a", CY_ = "#34d3ff";
M.reel({
  W, H, DUR: 15, bg: "#000",
  fonts: { UR: ["TY-Outfit-800.ttf", "800"] },
  init(M) { const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, expo, expoIO, springO, hash } = M;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
    const roll = t * .004; x.translate(W / 2, H / 2); x.rotate(roll); x.translate(-W / 2, -H / 2);
    const CX = 960, CYY = 540;
    const T = (s, X, Y, px, col = "#fff", t0 = 0, t1 = 99, al = "center") => {
      if (t < t0 || t > t1 + .3) return;
      x.font = `800 ${px}px UR`; x.textBaseline = "middle"; x.textAlign = "left"; x.fillStyle = col;
      const ws = [...s].map((c) => (c === " " ? px * .26 : x.measureText(c).width)), tot = ws.reduce((a, b) => a + b, 0);
      let cx = al === "center" ? X - tot / 2 : al === "right" ? X - tot : X;
      x.save(); x.beginPath(); x.rect(-500, Y - px * .62, W + 1000, px * 1.24); x.clip();
      [...s].forEach((c, i) => { const ki = springO(t - t0 - i * .025, 22, .75), ko = expo(seg(t, t1 + i * .015, t1 + .2 + i * .015)); x.fillText(c, cx, Y + (1 - ki) * px * 1.05 - ko * px * 1.05); cx += ws[i]; });
      x.restore();
    };
    // the "real" clock inside the film: 1 second = 0 → 15 s
    const real = t / 15;
    // ===== A · the clock (0–3.4)
    const ringR = t < 3.2 ? 380 : lerp(380, 820, expoIO(seg(t, 3.2, 3.9)));
    const ringY = t < 3.2 ? CYY : lerp(CYY, CYY + 700, expoIO(seg(t, 3.2, 3.9)));
    if (t < 6.2) {
      const draw = expo(seg(t, 0, .6));
      x.strokeStyle = "#fff"; x.lineWidth = 8; x.beginPath(); x.arc(CX, ringY, ringR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * draw); x.stroke();
      if (t < 3.4) {
        for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, k = expo(seg(t, .2 + i * .006, .5 + i * .006)), r0 = ringR - (i % 5 ? 18 : 40) * k; x.strokeStyle = i % 5 ? "#555" : "#fff"; x.lineWidth = i % 5 ? 3 : 6; x.beginPath(); x.moveTo(CX + Math.cos(a) * ringR, ringY + Math.sin(a) * ringR); x.lineTo(CX + Math.cos(a) * r0, ringY + Math.sin(a) * r0); x.stroke(); }
        // the second hand: it moves exactly one tick over the whole film (that's the joke: everything else happens inside it)
        const a = -Math.PI / 2 + real * Math.PI * 2 / 60, hk = expo(seg(t, .5, .9));
        x.strokeStyle = OR; x.lineWidth = 6; x.beginPath(); x.moveTo(CX - Math.cos(a) * 60 * hk, CYY - Math.sin(a) * 60 * hk); x.lineTo(CX + Math.cos(a) * 330 * hk, CYY + Math.sin(a) * 330 * hk); x.stroke();
        x.fillStyle = OR; x.beginPath(); x.arc(CX, CYY, 14 * hk, 0, 7); x.fill();
        T("1 SECOND", CX, CYY - 130, 120, "#fff", .7, 3.0);
        T("SLOWED DOWN 15×", CX, CYY + 150, 60, CY_, 1.2, 3.0);
      }
    }
    // ===== B · the ring is Earth's orbit (3.4–6.2): Earth slides 30 km
    if (t >= 3.4 && t < 6.4) {
      const k = expo(seg(t, 3.5, 3.9));
      const a0 = -Math.PI / 2 - .05, a1 = a0 + .1 * expoIO(seg(t, 4.0, 5.6));
      // the Sun sits at the orbit centre, far below the frame; the Earth rides the top of the ring
      const ex = CX + Math.cos(a1) * ringR, ey = ringY + Math.sin(a1) * ringR;
      x.strokeStyle = OR; x.lineWidth = 12; x.beginPath(); x.arc(CX, ringY, ringR, a0, a1); x.stroke();
      const er = 60 * k;
      x.fillStyle = CY_; x.beginPath(); x.arc(ex, ey, er, 0, 7); x.fill();
      x.fillStyle = "#000"; x.beginPath(); x.arc(ex + er * .35, ey + er * .1, er * .95, -.5, 1.9); x.fill();   // night side
      T("EARTH MOVES", CX, 640, 96, "#fff", 4.0, 6.0);
      T("30 KM", CX, 790, 150, OR, 4.3, 6.0);
    }
    // ===== C · 2D → 3D: the Earth swells into a globe; light wraps it 7.5 times (6.2–9.2)
    if (t >= 5.9 && t < 9.4) {
      const g = expoIO(seg(t, 5.9, 6.6)), R = lerp(60, 300, g);
      const gx = lerp(CX + Math.cos(-Math.PI / 2 + .05) * 820, CX, g), gy = lerp(CYY + 700 - 820, CYY, g);
      // the globe: latitude/longitude lines turning in 3D
      const spin = t * .8;
      x.fillStyle = "#04161e"; x.beginPath(); x.arc(gx, gy, R, 0, 7); x.fill();
      x.strokeStyle = "rgba(52,211,255,.55)"; x.lineWidth = 2;
      for (let i = 0; i < 12; i++) { const lon = i / 12 * Math.PI + spin, cx = Math.cos(lon); x.beginPath(); x.ellipse(gx, gy, Math.abs(cx) * R, R, 0, 0, 7); x.stroke(); }
      for (let j = -2; j <= 2; j++) { const lat = j * .5, yy = gy + Math.sin(lat) * R, rr = Math.cos(lat) * R; x.beginPath(); x.ellipse(gx, yy, rr, rr * .18, 0, 0, 7); x.stroke(); }
      x.strokeStyle = CY_; x.lineWidth = 4; x.beginPath(); x.arc(gx, gy, R, 0, 7); x.stroke();
      // the light beam: a tilted orbit traced 7.5 times, front half over the globe, back half behind
      const laps = 7.5 * clamp((t - 6.6) / 2.2), tilt = .32;
      const trail = 1.2;
      for (let s = Math.max(0, laps - trail); s < laps; s += .004) {
        const a = s * Math.PI * 2, px = gx + Math.cos(a) * R * 1.08, py = gy + Math.sin(a) * R * 1.08 * tilt + Math.cos(a) * R * .2, front = Math.sin(a) > 0;
        const fade = 1 - (laps - s) / trail; x.fillStyle = front ? `rgba(255,106,26,${fade})` : `rgba(255,106,26,${fade * .35})`; x.fillRect(px - 3, py - 3, 6, 6);
      }
      const lap = Math.min(7.5, Math.floor(laps * 2) / 2);
      if (t > 6.7) { x.font = "800 150px UR"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = OR; x.fillText(`${lap.toFixed(1)}×`, CX + 620, CYY - 20); }
      T("LIGHT CIRCLES EARTH", CX, 140, 84, "#fff", 6.7, 9.0);
    }
    // ===== D · data / UI: three counters fill within the same second (9.2–12.2)
    if (t >= 9.0 && t < 12.4) {
      const g = expoIO(seg(t, 9.0, 9.6)), prog = clamp((t - 9.6) / 2.2);
      // the globe collapses into the first gauge
      const rows = [["LIGHTNING STRIKES", 44, OR], ["BABIES BORN", 4, CY_], ["YOUR HEARTBEATS", 1, "#fff"]];
      rows.forEach(([lab, n, col], i) => {
        const y = 330 + i * 200, k = expo(seg(t, 9.3 + i * .15, 9.8 + i * .15));
        x.fillStyle = "#222"; x.fillRect(360, y + 40, 1200 * k, 14);
        x.fillStyle = col; x.fillRect(360, y + 40, 1200 * k * prog, 14);
        x.font = "800 56px UR"; x.textAlign = "left"; x.textBaseline = "middle"; x.globalAlpha = k; x.fillStyle = "#fff"; x.fillText(lab, 360, y - 20);
        x.textAlign = "right"; x.fillStyle = col; x.font = "800 96px UR"; x.fillText(String(Math.round(n * prog)), 1560, y - 30); x.globalAlpha = 1;
        // ticks: one per event, landing on the bar as it happens
        for (let e = 0; e < n; e++) { const te = (e + .5) / n; if (prog > te) { const s = (prog - te) * 2.2; x.fillStyle = col; x.fillRect(360 + 1200 * te - 2, y + 40 - 18 * Math.exp(-s * 6), 4, 14 + 18 * Math.exp(-s * 6)); } }
      });
      // the second hand returns as the progress marker
      x.strokeStyle = OR; x.lineWidth = 4; x.beginPath(); x.moveTo(360 + 1200 * prog, 250); x.lineTo(360 + 1200 * prog, 800); x.stroke();
      x.globalAlpha = g; x.font = "800 40px UR"; x.textAlign = "center"; x.fillStyle = "#888"; x.fillText(`${(prog).toFixed(2)} S`, 360 + 1200 * prog, 840); x.globalAlpha = 1;
    }
    // ===== E · end title (12.2–15)
    if (t >= 12.2) {
      const k = expoIO(seg(t, 12.2, 12.7));
      x.strokeStyle = OR; x.lineWidth = 4; const lx = lerp(1560, CX, k); x.beginPath(); x.moveTo(lx, lerp(250, 470, k)); x.lineTo(lx, lerp(800, 610, k)); x.stroke();
      T("THAT WAS", CX, 380, 100, "#fff", 12.5, 99);
      T("ONE SECOND.", CX, 700, 150, OR, 12.75, 99);
      // one real tick at the very end: the second is over
      if (t > 14.2) { const s = t - 14.2; x.fillStyle = "#fff"; x.beginPath(); x.arc(CX, 540, 10 + s * 4, 0, 7); x.fill(); }
    }
  },
  sound(A) {
    const m = A.midi;
    // the slowed second: one long, deep tick stretched across the film; events are fast and bright on top
    A.tone(.0, 60, 1.2, "sine", .3); A.nz(.0, .4, "lowpass", 400, .2);
    A.pad(0, [m(36), m(43), m(50)], 15, .03);
    A.whoosh(3.2, .8, .2); A.riser(4.0, 5.6, .1); A.hit(5.6, .2);
    A.whoosh(5.9, .8, .2); for (let i = 0; i < 15; i++) A.tone(6.6 + i * 2.2 / 15, m(72 + (i % 5) * 2), .08, "square", .03);
    for (let e = 0; e < 44; e++) { const t0 = 9.6 + (e + .5) / 44 * 2.2; A.nz(t0, .06, "highpass", 5000, .05); }
    for (let e = 0; e < 4; e++) A.pluck(9.6 + (e + .5) / 4 * 2.2, m(79), .1, .5);
    A.kick(9.6 + .5 * 2.2, .7); A.kick(9.6 + .5 * 2.2 + .15, .5);   // the heartbeat
    A.hit(12.75, .4); [48, 55, 60, 64].forEach((n) => A.tone(12.75, m(n), 2, "sine", .05));
    A.tone(14.2, 1500, .08, "square", .08); A.click(14.2, .3);   // the real tick
  },
});
</script></body></html>

<script>
// #41 Pelican riding a bicycle — 30 s short.
// Want: the fish in the fisherman's bucket at the end of the pier.
// 1) pushes too hard → wheelie → tips over backwards.  2) rides fast → the pouch fills with wind like a sail → blown to a stop.
// 3) pouch tucked, full speed → front wheel drops into a plank gap → catapulted over the fisherman into the sea.
// Turn: bobbing in the water, sad — a fish leaps straight into the pouch. Ending: rides off into the sunset.
// Gag: a beat of stillness… the front wheel comes off and rolls away on its own; he rides on, on one wheel.
const W = 1920, H = 1080, DECK = 760, WR = 66;
const SH = [0, 3, 7, 12, 17, 21, 26, 30];   // shot boundaries
M.reel({
  W, H, DUR: 30, bg: "#f4c78a",
  init(M) { const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, expo, expoIn, expoIO, spring, springO, cubicIO, sine, smooth } = M;
    const shot = SH.findIndex((s, i) => t >= s && t < SH[i + 1]);
    const lt = t - SH[shot];
    // ---------- mood: colour shifts with the story (gold → cooler on failures → dusk blue → warm sunset)
    const moods = [
      ["#f6cf93", "#f2b27a", "#e58a6a", "#3b6f8f"], ["#f1c08f", "#e7a77f", "#d98b72", "#3d6a8a"], ["#d9c2a4", "#c9a98e", "#b98f7e", "#355f80"],
      ["#c9b9b0", "#b8a3a0", "#9d8a93", "#2f5576"], ["#8fa1c4", "#7c8bb8", "#6b77a6", "#22436a"], ["#f6b47e", "#ef8f6b", "#d76a63", "#2f4f7a"], ["#f7a56f", "#ea7d5f", "#c95a5c", "#2b4672"]];
    const md = moods[Math.min(6, shot)];
    // ---------- camera per shot (x = world centre, z = zoom)
    const CAM = [
      () => [1180, .72],                                   // establishing wide
      () => [560 + lt * 10, 1.15],                         // attempt 1, medium
      () => [lerp(500, 980, cubicIO(seg(lt, 0, 5))), 1.0], // attempt 2, tracking
      () => [lerp(900, 1500, cubicIO(seg(lt, 0, 4.2))), .9],// attempt 3, tracking then hold
      () => [1840, 1.1],                                  // in the water
      () => [lerp(1600, 2300, cubicIO(seg(lt, 1.2, 5))), .95], // riding off
      () => [lerp(2480, 2680, sine(seg(lt, 0, 4))), 1.05],  // the gag
    ];
    const [cx, cz] = CAM[shot]();

    const bands = 6; for (let i = 0; i < bands; i++) { x.fillStyle = mixHex(md[0], md[2], i / (bands - 1)); x.fillRect(0, i * (560 / bands), W, 560 / bands + 1); }
    x.setTransform(cz, 0, 0, cz, W / 2 - cx * cz, H * .62 - DECK * cz * .9);
    const sunY = lerp(300, 470, seg(t, 0, 30));
    x.fillStyle = "#fff1cf"; x.beginPath(); x.arc(2600, sunY, 70, 0, 7); x.fill();
    x.fillStyle = mixHex(md[2], "#6c5a7a", .45); x.beginPath(); x.moveTo(-800, 640); for (let px = -800; px < 4200; px += 80) x.lineTo(px, 610 - Math.abs(Math.sin(px * .0031)) * 70 - Math.sin(px * .011) * 12); x.lineTo(4200, 700); x.lineTo(-800, 700); x.fill();
    x.fillStyle = md[3]; x.fillRect(-800, 690, 5200, 800);
    // sun road on the water
    for (let k = 0; k < 14; k++) { x.fillStyle = `rgba(255,236,190,${.5 - k * .03})`; x.fillRect(2600 - 60 + Math.sin(k * 2.1 + t * 2) * 30, 720 + k * 22, 120 - k * 5, 6); }
    // the pier: deck, posts, the gap that matters (x 1480)
    x.fillStyle = "#7a5238"; x.fillRect(-800, DECK, 4600, 26);
    for (let px = -760; px < 3800; px += 160) { x.fillStyle = "#5e3d2a"; x.fillRect(px, DECK + 26, 18, 300); }
    x.fillStyle = "#8f6447"; for (let px = -800; px < 3800; px += 40) x.fillRect(px, DECK, 2, 26);
    x.fillStyle = md[3]; x.fillRect(1478, DECK, 26, 26);   // the missing plank
    // ---------- the fisherman, at the end of the pier, bucket beside him
    const fx = 1820;
    const fishIn = t < 17.6;   // the fish he's guarding (the one that jumps later is another fish)
    drawFisher(x, fx, DECK, t);
    x.fillStyle = "#c9cdd2"; x.beginPath(); x.moveTo(fx - 120, DECK); x.lineTo(fx - 112, DECK - 54); x.lineTo(fx - 64, DECK - 54); x.lineTo(fx - 56, DECK); x.fill();
    if (fishIn) { x.fillStyle = "#e8a85a"; x.beginPath(); x.ellipse(fx - 88, DECK - 60, 22, 8, -.4, 0, 7); x.fill(); }

    // ---------- the pelican + bicycle state per shot
    let bx = 300, wheelie = 0, speed = 0, crank = 0, pouch = 0, look = 0, crouch = 0, off = null, frontGone = 0, lean = 0, eyeDx = 0;
    const T = t;
    if (shot === 0) { bx = 300; look = expo(seg(lt, .6, 1.1)); eyeDx = look * 6; crouch = .2 * spring(lt - 1.8, 10); }
    if (shot === 1) {
      // anticipation (crouch) → big push → wheelie → hangs → tips back → thump
      crouch = smooth(seg(lt, 0, .6)) * (1 - expo(seg(lt, .8, 1)));
      crank = expo(seg(lt, .8, 1.3)) * 2.6;
      bx = 520 + expo(seg(lt, .8, 1.6)) * 60;
      wheelie = expo(seg(lt, .85, 1.5)) * .45 + expoIn(seg(lt, 2.0, 2.8)) * 1.15;   // hold, then tip past balance
      if (lt > 2.8) wheelie = 1.6 - .05 * Math.exp(-(lt - 2.8) * 8) * Math.sin((lt - 2.8) * 30);
      eyeDx = lt < .8 ? 6 : lt < 2 ? -4 : 0;
    }
    if (shot === 2) {
      // rides fast; the pouch fills like a sail; he's blown to a stop and rolls back a little
      const v = expo(seg(lt, 0, .8)) * 380 * (1 - smooth(seg(lt, 2.2, 3.6)));
      bx = 520 + 380 * lt - 380 * Math.max(0, lt - 2.2) + 380 * (lt > 2.2 ? (lt - 2.2) * (1 - smooth(seg(lt, 2.2, 3.6)) * .5) : 0);
      bx = 520 + integrate((s) => expo(seg(s, 0, .8)) * 380 * (1 - smooth(seg(s, 2.2, 3.4))) - 90 * Math.max(0, Math.sin(Math.PI * seg(s, 3.4, 4.6))), lt);
      crank = lt * 9 * (1 - smooth(seg(lt, 2.2, 3.4)));

      eyeDx = lt > 3.6 ? -5 : 5;
    }
    if (shot === 3) {
      // pouch tucked; full speed; the wheel drops into the gap; he flies over the fisherman into the sea
      const gapAt = 1478 - 220 + 20;   // rear axle x when the front wheel meets the gap
      const runX = 900 + integrate((s) => expo(seg(s, 0, .6)) * 520, lt);
      const hit = 900 + integrate((s) => expo(seg(s, 0, .6)) * 520, 0) <= gapAt ? solveHit(gapAt) : 0;
      const th = hit;
      bx = Math.min(runX, gapAt);
      crank = Math.min(lt, th) * 12;
      crouch = .5;
      if (lt > th) {
        const u = lt - th;
        wheelie = -Math.min(.32, expo(seg(u, 0, .12)) * .32);   // nose dips into the gap
        const fl = seg(u, .05, 1.35);
        off = { x: lerp(gapAt + 120, 2040, fl), y: lerp(DECK - 230, DECK + 230, fl) - Math.sin(fl * Math.PI) * 330, r: fl * 5.4, s: fl };
      }
    }
    if (shot === 4) { off = { water: true }; }
    if (shot === 5) {
      // climbs back (cut on action), rides off happily
      bx = 1560 + integrate((s) => expo(seg(s, 1.2, 1.8)) * 220, lt);
      crank = Math.max(0, lt - 1.2) * 6;
      pouch = .25; eyeDx = 4;
    }
    if (shot === 6) {
      bx = 2300 + 220 * (lt + 5 - 1.2) * .0 + 2420 - 2300 + integrate((s) => 140 * (1 - smooth(seg(s, .6, 1.2))) + 140 * smooth(seg(s, 2.0, 2.6)), lt);
      crank = lt * 4;
      pouch = .25;
      frontGone = seg(lt, 1.4, 4);
      wheelie = smooth(seg(lt, 1.5, 2.0)) * .5;   // on the rear wheel now
      eyeDx = lt > 1.2 && lt < 2.4 ? 7 : -3;     // looks at the wheel, then at us
    }
    // ---------- draw bike + rider (or rider alone)
    if (!(off && off.water)) {
      const rx = bx, ry = DECK - WR;
      x.save();
      x.translate(rx, DECK); x.rotate(-wheelie - lean * 0); x.translate(-rx, -DECK);
      const roll = (shot === 6 ? lt * 2 : 0);
      drawBike(x, rx, ry, crank, frontGone > 0, t);
      if (!off) drawPelican(x, rx, ry, crank, { pouch, crouch, look, eyeDx, lean, t });
      x.restore();
      // the loose front wheel rolling away
      if (frontGone > 0) { const fxw = bx + 220 + frontGone * 900; drawWheel(x, fxw, ry + Math.abs(Math.sin(frontGone * 9)) * -10 * (1 - frontGone), frontGone * 30); }
    }
    if (off && !off.water) {
      x.save(); x.translate(off.x, off.y); x.rotate(off.r); x.translate(-(bx + 120), -(DECK - 200));
      drawPelican(x, bx, DECK - WR, 0, { pouch: 0, crouch: 0, flail: 1, t, eyeDx: 0 });
      x.restore();
      if (off.s >= .98) splash(x, 2040, DECK + 190, t - (SH[3] + 1.35 + 1.4));
    }
    if (off && off.water) {
      // bobbing in the water; a fish leaps — straight into the pouch (gulp)
      const by = DECK + 190 + Math.sin(lt * 3) * 6;
      const leap = seg(lt, 1.6, 2.5);
      const gulp = spring(lt - 2.5, 12);
      drawFloating(x, 1840, by, lt, { sad: lt < 2.5, pouch: lt > 2.5 ? .55 * (1 - .4 * gulp) + .2 : 0, eyeDx: lt > 1.2 && lt < 2.6 ? -6 : 0 });
      if (leap > 0 && leap < 1) { const fxp = lerp(1640, 1905, leap), fyp = DECK + 190 - Math.sin(leap * Math.PI) * 260; x.save(); x.translate(fxp, fyp); x.rotate(-1 + leap * 2); x.fillStyle = "#f0b25e"; x.beginPath(); x.ellipse(0, 0, 26, 10, 0, 0, 7); x.fill(); x.beginPath(); x.moveTo(-24, 0); x.lineTo(-40, -12); x.lineTo(-40, 12); x.fill(); x.restore(); }
      if (lt > 2.5 && lt < 3.4) splash(x, 1640, DECK + 190, lt - 1.6);
    }
    // a single title card at the very end, small
    x.setTransform(1, 0, 0, 1, 0, 0);
  },
  sound(A) {
    const m = A.midi;
    // score: a jaunty bassoon-ish line on triangle waves, changing with the mood
    const line = [[0, 67], [.5, 71], [1, 74], [1.5, 71], [2, 69], [2.5, 72], [3, 76]];
    line.forEach(([d, n]) => A.tone(d, m(n - 12), .4, "triangle", .07));
    // shot 1: crouch creak, push, wheelie hold (held note), crash
    A.tone(3.4, 180, .3, "sawtooth", .04); A.whoosh(3.8, .4, .12); A.tone(4.2, m(72), 1.2, "triangle", .06); A.tone(5.0, m(71), .8, "triangle", .05); A.nz(5.8, .35, "lowpass", 500, .5); A.tone(5.8, 70, .4, "sine", .4);
    for (let k = 0; k < 4; k++) A.click(5.9 + k * .08, .1);
    // shot 2: pedalling ticks, wind filling the pouch (rising filtered noise), a deflating sigh
    for (let k = 0; k < 18; k++) A.click(7 + k * .14, .06);
    { const b = A.ctx.createBufferSource(); b.buffer = A.noise; b.loop = true; const f = A.ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(300, 8.4); f.frequency.linearRampToValueAtTime(1400, 9.8); f.Q.value = 1; const g = A.ctx.createGain(); g.gain.setValueAtTime(.0001, 8.4); g.gain.linearRampToValueAtTime(.2, 9.6); g.gain.linearRampToValueAtTime(.0001, 11.6); b.connect(f).connect(g).connect(A.out); b.start(8.4); b.stop(11.8); }
    A.tone(11, m(60), .8, "triangle", .06); A.tone(11.3, m(56), .9, "triangle", .06);
    // shot 3: fast pedalling, CLUNK, a slide-whistle arc, splash
    for (let k = 0; k < 20; k++) A.click(12 + k * .09, .07);
    A.nz(13.95, .2, "lowpass", 300, .6); A.tone(13.95, 90, .3, "sine", .5);
    { const o = A.ctx.createOscillator(), g = A.ctx.createGain(); o.type = "sine"; o.frequency.setValueAtTime(600, 14.0); o.frequency.exponentialRampToValueAtTime(1400, 14.6); o.frequency.exponentialRampToValueAtTime(300, 15.3); g.gain.setValueAtTime(.08, 14); g.gain.linearRampToValueAtTime(.0001, 15.4); o.connect(g).connect(A.out); o.start(14); o.stop(15.5); }
    A.nz(15.35, .9, "lowpass", 1800, .5); A.nz(15.4, 1.2, "highpass", 3000, .12);
    // shot 4: sad low notes, the fish's leap (pluck), the gulp
    A.tone(17.2, m(55), 1, "triangle", .06); A.tone(17.9, m(53), 1.2, "triangle", .06);
    A.pluck(18.6, m(84), .1, .3); A.pluck(18.8, m(88), .08, .3);
    { const o = A.ctx.createOscillator(), g = A.ctx.createGain(); o.frequency.setValueAtTime(220, 19.5); o.frequency.exponentialRampToValueAtTime(90, 19.75); g.gain.setValueAtTime(.3, 19.5); g.gain.exponentialRampToValueAtTime(.001, 19.8); o.connect(g).connect(A.out); o.start(19.5); o.stop(19.85); }
    // shot 5: the happy theme, full; a bell
    [[21, 67], [21.3, 71], [21.6, 74], [22, 79], [22.5, 78], [23, 76], [23.5, 74], [24, 79]].forEach(([d, n]) => A.pluck(d, m(n), .1, .35));
    A.pad(21, [55, 59, 62, 67].map(m), 5, .035);
    A.tone(23.6, 2100, .6, "sine", .1); A.tone(23.75, 2100, .6, "sine", .1);
    // shot 6: silence beat, a "boing" as the wheel leaves, rolling ticks, a final bell
    A.tone(27.45, 520, .25, "triangle", .1); for (let k = 0; k < 10; k++) A.click(27.6 + k * .2, .04);
    A.tone(29.2, 2100, .5, "sine", .08);
  },
});
// ----- helpers (pure functions of their inputs)
function mixHex(a, b, k) { const h = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)); const A = h(a), B = h(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",")})`; }
function integrate(f, T) { let s = 0, n = Math.max(1, Math.ceil(T * 120)), dt = T / n; for (let i = 0; i < n; i++) s += f((i + .5) * dt) * dt; return s; }
function solveHit(target) { let lo = 0, hi = 5; for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (900 + integrate((s) => (s <= 0 ? 0 : s >= .6 ? 1 : 1 - Math.pow(2, -10 * s / .6)) * 520, mid) < target) lo = mid; else hi = mid; } return lo; }
function drawWheel(x, cx, cy, ang) {
  x.strokeStyle = "#2b2b30"; x.lineWidth = 7; x.beginPath(); x.arc(cx, cy, WR, 0, 7); x.stroke();
  x.lineWidth = 1.6; for (let k = 0; k < 16; k++) { const a = ang + k * Math.PI / 8; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a) * WR, cy + Math.sin(a) * WR); x.stroke(); }
  x.fillStyle = "#2b2b30"; x.beginPath(); x.arc(cx, cy, 6, 0, 7); x.fill();
}
function drawBike(x, rx, ry, crank, noFront, t) {
  const fx = rx + 220, ck = [rx + 95, ry + 8], seat = [rx + 70, ry - 112], bar = [fx - 18, ry - 128];
  const ang = crank * 1.0;
  drawWheel(x, rx, ry, ang * .7);
  if (!noFront) drawWheel(x, fx, ry, ang * .7);
  x.strokeStyle = "#1f6f8b"; x.lineWidth = 9; x.lineCap = "round"; x.lineJoin = "round";
  x.beginPath(); x.moveTo(rx, ry); x.lineTo(...ck); x.lineTo(seat[0] + 6, seat[1] + 14); x.lineTo(rx, ry); x.moveTo(...ck); x.lineTo(fx - 26, ry - 100); x.lineTo(seat[0] + 6, seat[1] + 14); x.stroke();
  if (!noFront) { x.beginPath(); x.moveTo(fx - 26, ry - 100); x.lineTo(fx, ry); x.stroke(); }
  x.beginPath(); x.moveTo(fx - 26, ry - 100); x.lineTo(...bar); x.lineTo(bar[0] + 30, bar[1] - 4); x.stroke();
  x.strokeStyle = "#2b2b30"; x.lineWidth = 5; x.beginPath(); x.moveTo(rx, ry); x.lineTo(...ck); x.stroke();   // chain line
  x.fillStyle = "#3a2b25"; x.beginPath(); x.ellipse(seat[0], seat[1] + 8, 30, 8, 0, 0, 7); x.fill();
  // crank arms
  x.strokeStyle = "#9aa0a8"; x.lineWidth = 6;
  for (const s of [0, Math.PI]) { const a = ang + s; x.beginPath(); x.moveTo(...ck); x.lineTo(ck[0] + Math.cos(a) * 30, ck[1] + Math.sin(a) * 30); x.stroke(); }
}
function ik(hx, hy, fx, fy, l1, l2, bendFwd) {   // two-bone IK, returns the knee
  const dx = fx - hx, dy = fy - hy, d = Math.min(l1 + l2 - .01, Math.hypot(dx, dy));
  const a = Math.atan2(dy, dx), b = Math.acos((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d));
  const k = a - (bendFwd ? b : -b);
  return [hx + Math.cos(k) * l1, hy + Math.sin(k) * l1];
}
function drawPelican(x, rx, ry, crank, o) {
  const ck = [rx + 95, ry + 8], c = o.crouch || 0;
  const hip = [rx + 76 + c * 10, ry - 128 + c * 14];
  const bodyC = [rx + 98 + c * 16, ry - 170 + c * 22];
  const tl = o.t;
  // legs: feet locked to the pedals (far leg first, darker)
  for (const [s, col] of [[Math.PI, "#d98b3a"], [0, "#f29d45"]]) {
    const a = crank + s, foot = [ck[0] + Math.cos(a) * 30, ck[1] + Math.sin(a) * 30];
    const knee = ik(hip[0], hip[1], foot[0], foot[1], 62, 62, true);
    x.strokeStyle = col; x.lineWidth = 9; x.lineCap = "round";
    if (o.flail) { const w = Math.sin(tl * 30 + s) * 30; x.beginPath(); x.moveTo(...hip); x.lineTo(hip[0] - 20 + w, hip[1] + 60); x.lineTo(hip[0] - 50 + w, hip[1] + 100); x.stroke(); continue; }
    x.beginPath(); x.moveTo(...hip); x.lineTo(...knee); x.lineTo(...foot); x.stroke();
    x.fillStyle = col; x.beginPath(); x.ellipse(foot[0] + 8, foot[1], 18, 6, 0, 0, 7); x.fill();
  }
  // body: soft, squashes with the crouch
  x.fillStyle = "#f4f1ea"; x.save(); x.translate(...bodyC); x.rotate(-.35 - (o.lean || 0)); x.scale(1 + c * .08, 1 - c * .1);
  x.beginPath(); x.ellipse(0, 0, 84, 52, 0, 0, 7); x.fill();
  // wing (folded, or flapping when flying)
  x.fillStyle = "#d8d4ca"; x.beginPath();
  const flap = o.flail ? Math.sin(tl * 26) * .9 : 0;
  x.save(); x.rotate(flap); x.ellipse(-10, -6, 70, 30, .15, 0, 7); x.fill(); x.restore();
  x.fillStyle = "#3a3a40"; x.beginPath(); x.ellipse(-60, 6, 26, 14, .3, 0, 7); x.fill();   // dark wingtip feathers
  x.restore();
  // neck (S curve) → head; the head leads the body (eyes first)
  const head = [bodyC[0] + 60 + (o.look || 0) * 6 - c * 8, bodyC[1] - 120 + c * 30];
  x.strokeStyle = "#f4f1ea"; x.lineWidth = 30; x.lineCap = "round";
  x.beginPath(); x.moveTo(bodyC[0] + 50, bodyC[1] - 30); x.bezierCurveTo(bodyC[0] + 100, bodyC[1] - 60, head[0] - 40, head[1] + 40, ...head); x.stroke();
  x.fillStyle = "#f4f1ea"; x.beginPath(); x.arc(head[0], head[1], 30, 0, 7); x.fill();
  x.fillStyle = "#f2d36b"; x.beginPath(); x.arc(head[0] - 12, head[1] - 16, 14, 0, 7); x.fill();   // yellow crown
  // beak + pouch (inflates like a sail)
  const p = o.pouch || 0;
  x.fillStyle = "#f2a64a"; x.beginPath(); x.moveTo(head[0] + 20, head[1] - 6); x.lineTo(head[0] + 170, head[1] + 8); x.lineTo(head[0] + 22, head[1] + 10); x.fill();
  x.fillStyle = "#f0b765"; x.beginPath(); x.moveTo(head[0] + 22, head[1] + 10); x.quadraticCurveTo(head[0] + 80, head[1] + 40 + p * 150, head[0] + 168, head[1] + 10); x.fill();
  // eye
  x.fillStyle = "#fff"; x.beginPath(); x.arc(head[0] + 6, head[1] - 4, 10, 0, 7); x.fill();
  x.fillStyle = "#1a1a1e"; x.beginPath(); x.arc(head[0] + 6 + (o.eyeDx || 0) * .6, head[1] - 4, 5, 0, 7); x.fill();
}
function drawFloating(x, cx, cy, lt, o) {
  x.fillStyle = "#f4f1ea"; x.beginPath(); x.ellipse(cx, cy, 90, 40, 0, Math.PI, 0); x.fill();
  const head = [cx + 50, cy - 120 + (o.sad ? 30 : 0)];
  x.strokeStyle = "#f4f1ea"; x.lineWidth = 28; x.lineCap = "round"; x.beginPath(); x.moveTo(cx + 40, cy - 20); x.quadraticCurveTo(cx + 80, cy - 80, ...head); x.stroke();
  x.fillStyle = "#f4f1ea"; x.beginPath(); x.arc(head[0], head[1], 28, 0, 7); x.fill();
  x.fillStyle = "#f2d36b"; x.beginPath(); x.arc(head[0] - 12, head[1] - 14, 12, 0, 7); x.fill();
  const tilt = o.sad ? .5 : -.05;
  x.save(); x.translate(head[0] + 18, head[1]); x.rotate(tilt);
  x.fillStyle = "#f2a64a"; x.beginPath(); x.moveTo(0, -6); x.lineTo(150, 8); x.lineTo(0, 12); x.fill();
  x.fillStyle = "#f0b765"; x.beginPath(); x.moveTo(0, 12); x.quadraticCurveTo(70, 40 + o.pouch * 150, 148, 10); x.fill();
  x.restore();
  x.fillStyle = "#fff"; x.beginPath(); x.arc(head[0] + 6, head[1] - 4, 9, 0, 7); x.fill();
  x.fillStyle = "#1a1a1e"; x.beginPath(); x.arc(head[0] + 6 + o.eyeDx * .6, head[1] - 4 + (o.sad ? 3 : 0), 4.5, 0, 7); x.fill();
  // ripples
  for (let k = 0; k < 3; k++) { const ph = (lt * .6 + k / 3) % 1; x.strokeStyle = `rgba(255,255,255,${.4 * (1 - ph)})`; x.lineWidth = 3; x.beginPath(); x.ellipse(cx, cy + 4, 100 + ph * 140, 14 + ph * 16, 0, 0, 7); x.stroke(); }
}
function splash(x, cx, cy, u) {
  if (u < 0 || u > 1.2) return;
  x.fillStyle = "rgba(235,245,255,.9)";
  for (let k = 0; k < 12; k++) { const a = -Math.PI / 2 + (k - 5.5) * .17, v = 300 + (k % 3) * 80, px = cx + Math.cos(a) * v * u, py = cy + Math.sin(a) * v * u + 600 * u * u; x.beginPath(); x.arc(px, py, 10 * (1 - u * .6), 0, 7); x.fill(); }
}
function drawFisher(x, fx, deck, t) {
  // seated silhouette with a rod; the line twitches now and then
  x.fillStyle = "#3b2f3a";
  x.beginPath(); x.roundRect(fx - 30, deck - 120, 70, 90, 20); x.fill();
  x.beginPath(); x.arc(fx + 5, deck - 150, 28, 0, 7); x.fill();
  x.fillRect(fx - 40, deck - 172, 90, 12); x.fillRect(fx - 16, deck - 196, 44, 28);   // hat
  x.fillRect(fx - 10, deck - 40, 16, 40); x.fillRect(fx + 20, deck - 40, 16, 40);
  x.strokeStyle = "#3b2f3a"; x.lineWidth = 4; x.beginPath(); x.moveTo(fx + 30, deck - 90); x.lineTo(fx + 220, deck - 260); x.stroke();
  x.strokeStyle = "rgba(60,50,60,.6)"; x.lineWidth = 1.5; x.beginPath(); x.moveTo(fx + 220, deck - 260); x.lineTo(fx + 250 + Math.sin(t * 2) * 4, deck + 60); x.stroke();
}

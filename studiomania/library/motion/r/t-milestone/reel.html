<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// قالب «رقم إنجاز»: آلاف النقط بتتحرك زي نجوم في سما بالليل، بتتجمع وتكوّن الرقم بتاعك، بتلمع، وبعدين تتفرق وتتجمع تاني
// في اسم البراند. 1080×1920، 12 ثانية.
const K1 = "١ · الرقم", K2 = "٢ · اسم البراند", KS = "الشكل العام";
const PR = M.params({
  number: { label: "الرقم", kind: "text", def: "+١٠ آلاف", group: K1, max: 10, hint: "الإنجاز نفسه بالأرقام (+١٠ آلاف، ١ مليون، ٥ سنين). قصير علشان النقط تكتبه واضح." },
  label: { label: "تحت الرقم", kind: "text", def: "عميل وثق فينا", group: K1, max: 22, hint: "الرقم ده عبارة عن إيه (عميل، طلب، متابع)." },
  thanks: { label: "سطر الشكر", kind: "text", def: "شكرًا لكل واحد فيكم", group: K1, max: 26, hint: "الإنجاز بتاعهم هما كمان: اشكرهم." },
  brand: { label: "اسم البراند", kind: "text", role: "brand", def: "نجمة", group: K2, max: 10, hint: "النقط بتكتبه: الأقصر أوضح (كلمة واحدة)." },
  tag: { label: "تحت الاسم", kind: "text", role: "tagline", def: "والجاي أحلى", group: K2, max: 20 },
  accent: { label: "لون اللمعة", kind: "color", role: "accent", def: "#ffc94a", group: KS, hint: "النقط اللي بتلمع على الأسود: لون فاتح (دهبي، سماوي، وردي)." },
  fHead: { label: "خط الرقم والاسم", kind: "font", def: "lalezar", group: KS, hint: "النقط بتتجمع في شكل الخط ده: الخطوط التقيلة بتطلع أوضح." },
  fBody: { label: "خط السطور", kind: "font", def: "changa", group: KS },
});
M.meta({
  story: "احتفال برقم إنجاز: آلاف النقط زي نجوم بالليل بتتجمع وتكتب الرقم بتاعك وتلمع، وبعدين تتفرق وتتجمع تاني في اسم البراند.",
  scenes: [{ name: K1, t0: 0, t1: 6.4, about: "النجوم بتكوّن الرقم والسطور" }, { name: K2, t0: 6.4, t1: 12, about: "النجوم بتكتب اسم البراند" }],
  tips: ["رقم حقيقي ومستدير بيبان أقوى.", "مناسب لعيد ميلاد البراند أو وصول عدد عملاء أو متابعين."],
});
const W = 1080, H = 1920, DUR = 12, N = 5200;
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const G0 = 1.0, G1 = 3.4, S0 = 6.4, S1 = 8.8;

M.reel({
  W, H, DUR, bg: "#060a1c",
  async init(M) {
    await Promise.all([M.font("LZ", PR.fHead), M.font("CH", PR.fBody)]);
    const c = M.canvas(W, H); const x = c.getContext("2d");
    // أهداف النقط: بنرسم الكلام في كانفاس مخفي وناخد نقط عشوائية من جواه
    const sample = (txt, size, cy) => {
      const k = document.createElement("canvas"); k.width = W; k.height = H; const g = k.getContext("2d", { willReadFrequently: true });
      g.fillStyle = "#fff"; g.font = `${M.fit(txt, "LZ", 960, size, 80)}px LZ`; g.textAlign = "center"; g.textBaseline = "middle"; g.direction = "rtl"; g.fillText(txt, W / 2, cy);
      const d = g.getImageData(0, 0, W, H).data, pts = [];
      for (let y = 0; y < H; y += 3) for (let xx = 0; xx < W; xx += 3) if (d[(y * W + xx) * 4 + 3] > 128) pts.push([xx, y]);
      const R = M.rng(txt.length * 7 + 3), out = [];
      for (let i = 0; i < N; i++) { const p = pts[Math.floor(R() * pts.length)] || [W / 2, cy]; out.push([p[0] + (R() - .5) * 2, p[1] + (R() - .5) * 2]); }
      return out;
    };
    const A = sample(PR.number, 440, 900), Bt = sample(PR.brand, 480, 920);
    const R = M.rng(42);
    const P = Array.from({ length: N }, (_, i) => ({ x: R() * W, y: R() * H, vx: (R() - .5) * 30, vy: (R() - .5) * 30, a: A[i], b: Bt[i], s: .8 + R() * 1.8, ph: R() * 6.28, gold: R() < .12, d: 0 }));
    P.forEach((p) => { p.d = Math.hypot(p.a[0] - W / 2, p.a[1] - 900) / 700; p.d2 = Math.hypot(p.b[0] - W / 2, p.b[1] - 920) / 700; });
    const bgStars = Array.from({ length: 220 }, () => [R() * W, R() * H, R() * 1.4 + .3, R() * 6]);
    const lab = M.el("div", "", "position:absolute;left:0;top:0;width:1080px;text-align:center;font:700 64px CH;color:#e8ecff;", esc(PR.label));
    const thx = M.el("div", "", "position:absolute;left:0;top:0;width:1080px;text-align:center;font:400 42px CH;color:#9aa6d8;", esc(PR.thanks));
    const tag = M.el("div", "", `position:absolute;left:0;top:0;width:1080px;text-align:center;font:700 60px CH;color:${PR.accent};`, esc(PR.tag));
    return { x, P, bgStars, lab, thx, tag };
  },
  seek(t, C, M) {
    const { x } = C, { seg, cubicIO, expo, X, op } = M;
    x.setTransform(1, 0, 0, 1, 0, 0);
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#050816"); g.addColorStop(.55, "#0d1438"); g.addColorStop(1, "#1a1446"); x.fillStyle = g; x.fillRect(0, 0, W, H);
    C.bgStars.forEach(([sx, sy, r, ph]) => { x.fillStyle = `rgba(200,210,255,${.25 + .25 * Math.sin(t * 2 + ph)})`; x.fillRect(sx, sy, r, r); });
    // نبضة نور ورا الرقم لما يكمل
    const glow = Math.max(0, Math.min(1, (t - G1) * 2)) * (1 - seg(t, S0, S0 + .4)) + Math.max(0, Math.min(1, (t - S1) * 2)) * .8;
    if (glow > 0) { const rg = x.createRadialGradient(540, 900, 50, 540, 900, 680); rg.addColorStop(0, `rgba(120,140,255,${.22 * glow})`); rg.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = rg; x.fillRect(0, 0, W, H); }
    x.globalCompositeOperation = "lighter";
    const ring = seg(t, G1, G1 + 1.2);
    if (ring > 0 && ring < 1) { x.strokeStyle = `rgba(255,220,140,${.5 * (1 - ring)})`; x.lineWidth = 6 * (1 - ring) + 1; x.beginPath(); x.arc(540, 900, 200 + ring * 700, 0, Math.PI * 2); x.stroke(); }
    C.P.forEach((p, i) => {
      // حركة حرّة (سما) + تجمع للرقم + تفرق + تجمع للاسم
      const fx = p.x + p.vx * t + Math.sin(t * .7 + p.ph) * 20, fy = p.y + p.vy * t + Math.cos(t * .6 + p.ph) * 20;
      const free = [((fx % W) + W) % W, ((fy % H) + H) % H];
      const k1 = cubicIO(seg(t, G0 + p.d * .9, G1 - .3 + p.d * .5)), k2 = cubicIO(seg(t, S0 + .5 + p.d2 * .9, S1 - .2 + p.d2 * .5));
      const burst = Math.sin(Math.PI * seg(t, S0, S0 + 1.2)) * (1 - k2);
      const sw = (1 - k1) * k1 * 160;   // لفّة خفيفة وهي جاية
      let px = free[0] + (p.a[0] - free[0]) * k1 + Math.cos(p.ph + t) * sw, py = free[1] + (p.a[1] - free[1]) * k1 + Math.sin(p.ph + t) * sw;
      if (t > S0) { const ax = p.a[0] + (p.a[0] - 540) * 1.6 * burst + Math.sin(p.ph * 3) * 260 * burst, ay = p.a[1] + (p.a[1] - 900) * 1.6 * burst + Math.cos(p.ph * 2) * 260 * burst; px = ax + (p.b[0] - ax) * k2; py = ay + (p.b[1] - ay) * k2; }
      const settled = (t > G1 && t < S0) || t > S1, tw = settled ? .55 + .45 * Math.sin(t * 5 + p.ph * 7) : .7;
      const sz = p.s * (settled ? 2.2 : 1.3);
      x.fillStyle = p.gold ? `rgba(255,201,74,${tw})` : `rgba(210,222,255,${tw})`;
      x.fillRect(px - sz / 2, py - sz / 2, sz, sz);
      if (settled) { x.globalAlpha = .12; x.fillRect(px - sz * 1.5, py - sz * 1.5, sz * 3, sz * 3); x.globalAlpha = 1; }
    });
    x.globalCompositeOperation = "source-over";
    // الكلام
    const lk = expo(seg(t, G1 + .2, G1 + .8)) * (1 - seg(t, S0, S0 + .3)); op(C.lab, lk); X(C.lab, 0, 1170 + (1 - lk) * 30);
    const tk = expo(seg(t, G1 + .9, G1 + 1.5)) * (1 - seg(t, S0, S0 + .3)); op(C.thx, tk); X(C.thx, 0, 1270 + (1 - tk) * 30);
    const gk = expo(seg(t, S1 + .2, S1 + .8)); op(C.tag, gk); X(C.tag, 0, 1180 + (1 - gk) * 30);
  },
  sound(A) {
    const M2 = A.midi;
    // جو فضائي: باد واسع + نغمات بتلمع + صعود وقت التجمع
    A.pad(0, [M2(45), M2(52), M2(57), M2(64)], 6.5, .03); A.pad(6, [M2(43), M2(50), M2(55), M2(62)], 6, .03);
    for (let i = 0; i < 26; i++) A.tone(.3 + i * .45, M2([76, 79, 83, 86, 88][i % 5] + (i % 3 ? 0 : 12)), .6, "sine", .03);
    A.riser(G0, G1, .18); A.hit(G1, .45); A.pluck(G1, M2(81), .14, 1.5); A.pluck(G1 + .1, M2(88), .1, 1.5);
    A.whoosh(S0, .9, .25); A.riser(S0 + .3, S1, .15); A.hit(S1, .4); A.pluck(S1, M2(84), .14, 1.8);
  },
});
</script>
</body></html>

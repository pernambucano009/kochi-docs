<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #199 How the yellow first-down line works — 90 s. One diagram (world 3840×2160): CAMERA (left) → COMPUTER (centre) ← FIELD MAP
// (bottom) → TV (right). The camera zooms into one part per step, then pulls back to the whole.
// Facts kept general and correct: Sportvision's "1st & Ten" line first aired on ESPN in 1998. Sensors on the camera head/lens report
// pan, tilt and zoom; the field is surveyed into a 3D model; a computer projects the line into each frame; the line is only drawn on
// pixels whose colour matches the grass, so players and officials appear to stand on top of it.
// Storyboard: 0–8 hook · 8–24 the camera's sensors · 24–40 the 3D field map + the line set at the 35 · 40–58 projection: it stays
// glued as the camera pans · 58–78 colour keying at pixel level · 78–90 the whole diagram + takeaway.
const W = 1920, H = 1080;
const TV = { x: 2300, y: 260, w: 1300, h: 731 };
const CAM = { x: 470, y: 1180 }, COMP = { x: 1450, y: 640, w: 520, h: 260 }, MAP = { x: 1350, y: 1350, w: 1250, h: 620 };
const NAVY = "#0f1a2e", INK = "#e9eef6", YEL = "#ffd400", GRN = "#2f8a3b", GRN2 = "#287a33";
const LOSX = 35;   // the first-down line at the 35
// broadcast projection: field X (yards, along), Z (yards, depth from near sideline)
const F = 900, CH = 30, CD = 40, HZ = -100;
const proj = (X, Z, camX) => { const D = CD + Z; return [650 + (X - camX) * F / D, HZ + CH * F / D, F / D]; };
const PLAYERS = [[0, 30, 14, "#c8102e"], [1, 34, 22, "#c8102e"], [2, 38, 18, "#ffffff"], [3, 31, 30, "#ffffff"], [4, 40, 26, "#c8102e"], [5, 28, 20, "#ffffff"]];
function playerPos(i, t) { const p = PLAYERS[i], X = p[1] + Math.sin(t * .7 + i * 1.7) * 4 + (i === 2 ? (t % 12) * .9 - 5 : 0), Z = p[2] + Math.cos(t * .5 + i) * 3; return [X, Z]; }
M.reel({
  W, H, DUR: 90, bg: NAVY,
  fonts: { BC: ["TY-BarlowCond-700.ttf", "700"], I8: ["inter800.ttf", "800"] },
  init(M) {
    const c = M.canvas(W, H);
    const mk = (w, h) => { const k = document.createElement("canvas"); k.width = w; k.height = h; return k; };
    return { x: c.getContext("2d"), bc: mk(1300, 731), lo: mk(130, 73), lo2: mk(130, 73) };
  },
  seek(t, P, M) {
    const { x, bc, lo, lo2 } = P, { seg, lerp, clamp, expo, expoIO, spring, springO, hash } = M;
    // ---------------- the broadcast picture (offscreen), panned by the camera
    const pan = 33 + Math.sin(Math.max(0, t - 47) * .6) * 6 * seg(t, 47, 48) * (1 - seg(t, 57, 58)) + (t < 8 ? Math.sin(t * .5) * 2 : 0);
    const drawBroadcast = (g, s, withLine, lineK = 1) => {
      g.setTransform(s, 0, 0, s, 0, 0);
      g.fillStyle = GRN; g.fillRect(0, 0, 1300, 731);
      for (let X = 0; X <= 100; X += 5) { const a = proj(X, 0, pan), b = proj(X, 53, pan); if (Math.floor(X / 5) % 2) { const c = proj(X + 5, 0, pan), d = proj(X + 5, 53, pan); g.fillStyle = GRN2; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.lineTo(b[0], b[1]); g.fill(); } }
      g.strokeStyle = "#f4f4f4"; g.lineWidth = 4;
      for (let X = 0; X <= 100; X += 5) { const a = proj(X, 0, pan), b = proj(X, 53, pan); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
      g.fillStyle = "#f4f4f4"; g.font = "700 46px BC"; g.textAlign = "center";
      for (let X = 10; X <= 90; X += 10) { const p = proj(X, 9, pan); g.save(); g.translate(p[0], p[1]); g.scale(p[2] / 20, p[2] / 20); g.fillText(String(X <= 50 ? X : 100 - X), 0, 0); g.restore(); }
      // the line: a strip at the 35, drawn only where the pixel is grass (here: drawn before the players, who are not grass)
      if (withLine) { const a = proj(LOSX - .35, 0, pan), b = proj(LOSX + .35, 0, pan), c = proj(LOSX + .35, 53 * lineK, pan), d = proj(LOSX - .35, 53 * lineK, pan); g.fillStyle = YEL; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.fill(); }
      // players, back to front
      const order = PLAYERS.map((p, i) => [i, ...playerPos(i, t)]).sort((u, v) => v[2] - u[2]);
      order.forEach(([i, X, Z]) => { const [px, py, k] = proj(X, Z, pan), s2 = k / 22; g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.ellipse(px, py, 22 * s2, 7 * s2, 0, 0, 7); g.fill(); g.fillStyle = PLAYERS[i][3]; g.fillRect(px - 16 * s2, py - 92 * s2, 32 * s2, 52 * s2); g.fillStyle = "#1a1a1a"; g.fillRect(px - 14 * s2, py - 42 * s2, 11 * s2, 42 * s2); g.fillRect(px + 3 * s2, py - 42 * s2, 11 * s2, 42 * s2); g.fillStyle = PLAYERS[i][3] === "#ffffff" ? "#c8102e" : "#ffffff"; g.beginPath(); g.arc(px, py - 106 * s2, 16 * s2, 0, 7); g.fill(); });
      g.setTransform(1, 0, 0, 1, 0, 0);
    };
    const lineOn = t < 26 || t > 36.5;
    drawBroadcast(bc.getContext("2d"), 1, lineOn, t > 36.5 && t < 50 ? expoIO(seg(t, 50, 51.2)) * 0 + 1 : 1);
    const keyMode = t > 59 && t < 77.5;
    if (keyMode) { drawBroadcast(lo.getContext("2d"), .1, false); drawBroadcast(lo2.getContext("2d"), .1, true); }
    // ---------------- world camera
    const K = [[0, 2950, 625, 1.38], [8, 2950, 625, 1.38], [9.6, 1920, 1080, .5], [10.4, 1920, 1080, .5], [11.6, 520, 1050, 1.25], [23.4, 520, 1050, 1.25], [25, 1920, 1080, .5], [26, 1920, 1080, .5], [27.4, 1975, 1640, 1.25], [39.4, 1975, 1640, 1.25], [41, 1920, 1080, .5], [42, 1920, 1080, .5], [43.4, 2150, 900, .62], [57, 2150, 900, .62], [59.2, 3000, 600, 4.2], [76.4, 3000, 600, 4.2], [78.2, 1920, 1080, .5]];
    let cam = K[K.length - 1].slice(1);
    for (let i = 0; i < K.length - 1; i++) if (t >= K[i][0] && t < K[i + 1][0]) { const k = expoIO(seg(t, K[i][0], K[i + 1][0])); const z0 = K[i][3], z1 = K[i + 1][3], zz = Math.exp(lerp(Math.log(z0), Math.log(z1), k)); cam = [lerp(K[i][1], K[i + 1][1], k), lerp(K[i][2], K[i + 1][2], k), zz]; }
    const [cx, cy, z] = cam;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = NAVY; x.fillRect(0, 0, W, H);
    x.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z);
    // labels sit on the thing they name (world space, sized to stay readable at the zoom they're seen at)
    const L = (s, X, Y, px, col = INK, t0 = 0, t1 = 999, al = "center") => {
      if (t < t0 || t > t1 + .25) return;
      const a = expo(seg(t, t0, t0 + .3)) * (1 - expo(seg(t, t1, t1 + .25)));
      x.globalAlpha = a; x.font = `700 ${px}px BC`; x.textAlign = al; x.textBaseline = "middle"; if (keyMode) { const w = x.measureText(s).width; x.fillStyle = "rgba(15,26,46,.85)"; x.fillRect(X - w / 2 - px * .3, Y - px * .65, w + px * .6, px * 1.3); } x.fillStyle = col; x.fillText(s, X, Y + (1 - a) * px * .3); x.globalAlpha = 1;
    };
    const flow = (pts, t0, col = YEL, speed = 1) => {   // a wire with pulses travelling in the direction the data moves
      x.strokeStyle = "rgba(233,238,246,.35)"; x.lineWidth = 6; x.beginPath(); pts.forEach((p, i) => (i ? x.lineTo(...p) : x.moveTo(...p))); x.stroke();
      if (t < t0) return;
      let len = 0; const segs = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push([len, d, pts[i - 1], pts[i]]); len += d; }
      for (let k = 0; k < 5; k++) { const u = (((t - t0) * 260 * speed + k * len / 5) % len); const s = segs.find((q) => u >= q[0] && u <= q[0] + q[1]); if (!s) continue; const f = (u - s[0]) / s[1]; x.fillStyle = col; x.beginPath(); x.arc(lerp(s[2][0], s[3][0], f), lerp(s[2][1], s[3][1], f), 12, 0, 7); x.fill(); }
    };
    // ---------- wires (drawn first)
    flow([[CAM.x + 120, CAM.y - 90], [1000, CAM.y - 90], [1000, COMP.y + 130], [COMP.x, COMP.y + 130]], 21.5);
    flow([[MAP.x + MAP.w / 2, MAP.y], [MAP.x + MAP.w / 2, COMP.y + COMP.h]], 38.5);
    flow([[COMP.x + COMP.w, COMP.y + 130], [TV.x, COMP.y + 130]], 44);
    // ---------- the camera (side view): tripod, pan/tilt head, body, lens; sensors on head and lens
    const camPan = t > 13 && t < 24 ? Math.sin((t - 13) * 1.4) * .5 : t > 47 && t < 57 ? Math.sin((t - 47) * .6) * .25 : 0;
    const tilt = t > 15.5 && t < 24 ? Math.sin((t - 15.5) * 1.7) * .14 : 0, zoomR = t > 18 && t < 24 ? Math.sin((t - 18) * 2.2) : 0;
    x.strokeStyle = "#8c96a8"; x.lineWidth = 14; x.lineCap = "round";
    [[-160, 330], [0, 340], [160, 330]].forEach(([dx, dy]) => { x.beginPath(); x.moveTo(CAM.x, CAM.y); x.lineTo(CAM.x + dx, CAM.y + dy); x.stroke(); });
    x.fillStyle = "#5b6577"; x.fillRect(CAM.x - 60, CAM.y - 40, 120, 50);   // pan head
    x.save(); x.translate(CAM.x, CAM.y - 60); x.rotate(tilt); x.scale(Math.cos(camPan) * .3 + .7, 1);
    x.fillStyle = "#c9d1de"; x.beginPath(); x.roundRect(-140, -80, 240, 120, 16); x.fill();
    x.fillStyle = "#9aa4b6"; x.fillRect(100, -60, 190, 80); x.fillStyle = "#2b3446"; x.beginPath(); x.ellipse(292, -20, 14, 40, 0, 0, 7); x.fill();
    // zoom ring turns
    for (let i = 0; i < 6; i++) { const u = ((i / 6 + zoomR * .1) % 1 + 1) % 1; x.fillStyle = "#6c768a"; x.fillRect(130 + u * 140, -62, 8, 84); }
    // sensors (little yellow boxes with blinking LEDs)
    const led = (X, Y, t0) => { if (t < t0) return; x.fillStyle = YEL; x.fillRect(X - 14, Y - 10, 28, 20); x.fillStyle = Math.floor(t * 6) % 2 ? "#ff4d4d" : "#7a1d1d"; x.fillRect(X - 4, Y - 4, 8, 8); };
    led(200, -78, 18.2);
    x.restore();
    if (t > 12.6) { x.fillStyle = YEL; x.fillRect(CAM.x - 80, CAM.y - 30, 28, 20); x.fillRect(CAM.x + 52, CAM.y - 30, 28, 20); }
    // pan / tilt / zoom labels with motion arrows in the direction of the motion
    const arc = (X, Y, r, a0, a1, col) => { x.strokeStyle = col; x.lineWidth = 8; x.beginPath(); x.arc(X, Y, r, a0, a1); x.stroke(); const ex = X + Math.cos(a1) * r, ey = Y + Math.sin(a1) * r; x.fillStyle = col; x.beginPath(); x.arc(ex, ey, 12, 0, 7); x.fill(); };
    if (t > 12.6 && t < 24) { const d = Math.cos((t - 13) * 1.4) > 0 ? 1 : -1; x.save(); x.translate(CAM.x, CAM.y + 10); x.scale(1, .3); arc(0, 0, 150, Math.PI * .2, Math.PI * .2 + d * 1.2, YEL); x.restore(); }
    L("PAN", CAM.x, CAM.y + 120, 64, YEL, 13, 23.4);
    if (t > 15.5 && t < 24) arc(CAM.x + 60, CAM.y - 60, 230, -.55, -.55 + (Math.cos((t - 15.5) * 1.7) > 0 ? .4 : -.4), YEL);
    L("TILT", CAM.x + 330, CAM.y - 210, 64, YEL, 15.6, 23.4);
    L("ZOOM", CAM.x + 220, CAM.y + 30, 64, YEL, 18.2, 23.4);
    L("SENSORS REPORT EVERY MOVE", 520, 690, 72, INK, 20.0, 23.3);
    // ---------- the computer
    x.fillStyle = "#1c2a44"; x.beginPath(); x.roundRect(COMP.x, COMP.y, COMP.w, COMP.h, 22); x.fill(); x.strokeStyle = "#3d5278"; x.lineWidth = 6; x.stroke();
    for (let i = 0; i < 8; i++) { x.fillStyle = Math.floor(t * 4 + i * 1.7) % 3 ? "#2e4a7a" : YEL; x.fillRect(COMP.x + 40 + i * 56, COMP.y + 190, 36, 14); }
    x.font = "700 64px BC"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = INK; x.fillText("COMPUTER", COMP.x + COMP.w / 2, COMP.y + 90);
    // ---------- the field map (a surveyed 3D model)
    {
      const gk = expo(seg(t, 27.6, 29.6)), M0 = MAP, pj = (X, Z) => { const d = 1 + Z / 53 * 1.1; return [M0.x + M0.w / 2 + (X - 50) * 11.5 / d, M0.y + M0.h - Z * 9.4 / Math.sqrt(d)]; };
      x.strokeStyle = "rgba(120,200,140,.9)"; x.lineWidth = 3;
      for (let X = 0; X <= 100; X += 10) { const k = t < 27.6 ? 1 : clamp(gk * 11 - X / 10); const a = pj(X, 0), b = pj(X, 53 * k); x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); }
      for (let Z = 0; Z <= 53; Z += 53 / 4) { const a = pj(0, Z), b = pj(100, Z); x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); }
      if (t > 28.4) for (let i = 0; i < 40; i++) { const X = (i % 10) * 11, Z = Math.floor(i / 10) * 17; const p = pj(X, Z); if (t > 28.4 + i * .02) { x.fillStyle = "rgba(120,200,140,.9)"; x.beginPath(); x.arc(p[0], p[1], 5, 0, 7); x.fill(); } }
      L("3D MAP OF THE FIELD", 1975, 1290, 64, INK, 28.6, 33.2);
      // the operator sets the line: it slides along the map and locks at the 35
      const lx = t < 31.5 ? 20 : lerp(20, LOSX, expoIO(seg(t, 31.5, 33.2)));
      if (t > 30.6) { const a = pj(lx, 0), b = pj(lx, 53); x.strokeStyle = YEL; x.lineWidth = 12; x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); L(`1ST DOWN: ${Math.round(lx)}`, a[0], a[1] + 50, 52, YEL, 30.8, 39.2); if (t > 33.2 && t < 33.6) { x.strokeStyle = "#fff"; x.lineWidth = 3; x.beginPath(); x.arc(a[0], a[1], (t - 33.2) * 200, 0, 7); x.stroke(); } }
      // a cursor (the operator's) drags it
      if (t > 31 && t < 34) { const a = pj(lx, 20); x.fillStyle = "#fff"; x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(a[0], a[1] + 40); x.lineTo(a[0] + 12, a[1] + 30); x.lineTo(a[0] + 26, a[1] + 30); x.fill(); }
      L("SET BY AN OPERATOR", 1975, 1290, 64, INK, 33.6, 39.2);
    }
    // ---------- the TV (broadcast picture)
    x.fillStyle = "#05080f"; x.fillRect(TV.x - 24, TV.y - 24, TV.w + 48, TV.h + 48);
    if (keyMode) {
      x.imageSmoothingEnabled = false;
      const scan = clamp((t - 63.5) / 6), sx = TV.x + scan * TV.w;
      x.drawImage(lo, TV.x, TV.y, TV.w, TV.h);
      x.save(); x.beginPath(); x.rect(TV.x, TV.y, sx - TV.x, TV.h); x.clip(); x.drawImage(lo2, TV.x, TV.y, TV.w, TV.h); x.restore();
      x.imageSmoothingEnabled = true;
      // pixel grid lines (visible when zoomed in)
      x.strokeStyle = "rgba(0,0,0,.35)"; x.lineWidth = .6; for (let i = 0; i <= 130; i++) { x.beginPath(); x.moveTo(TV.x + i * 10, TV.y); x.lineTo(TV.x + i * 10, TV.y + TV.h); x.stroke(); } for (let j = 0; j <= 73; j++) { x.beginPath(); x.moveTo(TV.x, TV.y + j * 10.01); x.lineTo(TV.x + TV.w, TV.y + j * 10.01); x.stroke(); }
      if (t > 63.5 && t < 70.5) { x.fillStyle = "#fff"; x.fillRect(sx - 1.5, TV.y, 3, TV.h); }
      L("PIXEL BY PIXEL", 3000, 700, 22, "#fff", 60.2, 63.3);
      L("GRASS? PAINT IT.", 3000, 700, 20, YEL, 64.2, 69.5);
      L("PLAYER? SKIP IT.", 3000, 700, 20, "#fff", 70.2, 76);
    } else x.drawImage(bc, TV.x, TV.y, TV.w, TV.h);
    L("FIRST AIRED IN 1998", TV.x + TV.w - 30, TV.y + TV.h + 70, 56, "#9aa4b6", 80.5, 999, "right");
    // ---------- projection rays (42–58): camera lens → line on the map → the TV image
    if (t > 44.5 && t < 58) {
      const k = expo(seg(t, 44.5, 45.6));
      const lens = [CAM.x + 290, CAM.y - 80];
      const pts = [proj(LOSX, 0, pan), proj(LOSX, 53, pan)].map((p) => [TV.x + p[0], TV.y + p[1]]);
      x.strokeStyle = "rgba(255,212,0,.55)"; x.lineWidth = 5; x.setLineDash([24, 18]); x.lineDashOffset = -t * 120;
      pts.forEach((p) => { x.beginPath(); x.moveTo(...lens); x.lineTo(lerp(lens[0], p[0], k), lerp(lens[1], p[1], k)); x.stroke(); }); x.setLineDash([]);
      L("SAME SPOT, EVERY FRAME", 2950, 1120, 72, YEL, 48, 57.4);
    }
    // ---------------- screen-space type: hook + takeaway (few words, held long)
    x.setTransform(1, 0, 0, 1, 0, 0);
    const S = (s, Y, px, col, t0, t1) => { if (t < t0 || t > t1 + .25) return; const a = expo(seg(t, t0, t0 + .3)) * (1 - expo(seg(t, t1, t1 + .25))); x.globalAlpha = a; x.font = `800 ${px}px I8`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = "rgba(15,26,46,.8)"; const w = x.measureText(s).width; x.fillRect(W / 2 - w / 2 - 30, Y - px * .75, w + 60, px * 1.5); x.fillStyle = col; x.fillText(s, W / 2, Y + (1 - a) * 20); x.globalAlpha = 1; };
    S("WHY IS THE LINE UNDER THE PLAYERS?", 140, 64, "#fff", .6, 7.6);
    S("IT'S DRAWN, NOT PAINTED.", 960, 84, YEL, 82, 90);
  },
  sound(A) {
    const m = A.midi;
    // a soft pulse under each step, a hit as each idea lands
    const steps = [[0, 8], [10.4, 24], [26, 40], [42, 58], [59, 77], [78, 90]];
    steps.forEach(([a, b], i) => { for (let t0 = a + .2; t0 < b - .3; t0 += .75) A.tone(t0, m([45, 48, 43, 50, 47, 48][i]), .5, "triangle", .07); A.pad(a, [m(57), m(64), m(69)].map((f) => f * [1, 1.06, .95, 1.12, 1, 1][i]), b - a, .02); });
    [[13, 72], [15.6, 74], [18.2, 76], [20, 79], [28.6, 72], [33.2, 79], [45.6, 76], [48, 79], [64.2, 81], [70.2, 76], [82, 84]].forEach(([t0, n]) => { A.hit(t0, .2); A.pluck(t0, m(n), .1, .5); });
    [9.6, 25, 41, 59.2, 76.4].forEach((t0) => A.whoosh(t0 - .5, 1.2, .14));
    for (let t0 = 21.5; t0 < 23.4; t0 += .2) A.tone(t0, 1800, .03, "square", .02);
    for (let t0 = 63.5; t0 < 69.5; t0 += .06) A.click(t0, .025);
    A.pad(82, [m(48), m(55), m(64), m(67)], 8, .04);
  },
});
</script></body></html>

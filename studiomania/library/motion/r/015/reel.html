<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #15 Recursion explained in genres — 60 s. Every style is literally nested inside the previous one:
// each scene ends with a little screen that already holds the next scene's first frame, and the camera dives into it.
// That dive is itself recursion (a scene that contains a scene). Hook → 9 explanations → back to the hook (loop).
const W = 1920, H = 1080;
const T0 = 3.6, SD = 6.15;   // hook length, scene length
const start = (i) => (i === 0 ? 0 : T0 + (i - 1) * SD);
const ZOOM = .85;
const OFF = (i) => (i === 0 ? 0 : .9);   // scenes start a little way in, so the little screen already shows something           // dive duration at the end of each scene
let SC = [];
M.reel({
  W, H, DUR: 60, bg: "#000",
  fonts: { SE: "TY-SpecialElite.ttf", FR: "Fraunces_ital_wght_1_400.ttf", PX: "Silkscreen_400.woff2", AN: "anton.ttf", CV: ["Caveat_wght_500.ttf", "500"], I5: ["inter500.ttf", "500"], I8: ["inter800.ttf", "800"], PF: ["Playfair_Display_ital_wght_1_500.ttf", "500", "italic"], VT: "TY-VT323.ttf" },
  init(M) {
    const c = M.canvas(W, H); const x = c.getContext("2d");
    const { clamp, seg, lerp, expo, expoIn, expoIO, spring, springO } = M;
    const type = (s, lt, a, cps = 28) => s.slice(0, Math.max(0, Math.floor((lt - a * .7) * cps * 1.6)));
    const wrapText = (x, s, px, py, lh) => s.split("\n").forEach((l, i) => x.fillText(l, px, py + i * lh));
    // ---------- the scenes. each: dur, R (where the next scene sits), frameAt (local time the screen appears), draw(x, lt, inner)
    SC = [
      { name: "hook", R: [810, 640, 300, 169], frameAt: 1.9,
        draw(x, lt, inner) {
          x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
          x.fillStyle = "#f2f2f2"; x.font = "800 74px I8"; x.textAlign = "center";
          x.fillText(type("To understand recursion,", lt, .1, 30), 960, 420);
          x.fillStyle = "#8a8a8a"; x.fillText(type("first understand recursion.", lt, .95, 30), 960, 520);
          x.textAlign = "left";
          inner(x, this.R, "#f2f2f2", 4, lt - this.frameAt);
        } },
      // 1 — FILM NOIR: the definition
      { name: "noir", R: [1210, 610, 380, 214], frameAt: 4.2,
        draw(x, lt, inner) {
          x.fillStyle = "#151515"; x.fillRect(0, 0, W, H);
          // venetian-blind light sweeping slowly
          x.save(); x.translate(300 + lt * 20, 0); x.rotate(-.35);
          for (let i = 0; i < 9; i++) { x.fillStyle = "rgba(235,232,222,.10)"; x.fillRect(-200, 80 + i * 120, 2400, 52); }
          x.restore();
          // desk + case file
          x.fillStyle = "#0b0b0b"; x.fillRect(0, 860, W, 220);
          x.fillStyle = "#cfc9b8"; x.save(); x.translate(330, 640); x.rotate(-.06); x.fillRect(0, 0, 560, 360); x.fillStyle = "#1a1a1a"; x.font = "34px SE"; x.fillText("CASE FILE: f(n)", 40, 70); x.font = "26px SE"; x.fillText("Suspect calls itself.", 40, 130); x.fillText("Each time: a smaller case.", 40, 170); x.restore();
          x.fillStyle = "#e9e5da"; x.font = "52px SE";
          wrapText(x, type("The case was simple.\nA function... that called itself.", lt, .2, 24), 130, 200, 74);
          x.fillStyle = "#9b968a"; x.font = "36px SE";
          x.fillText(type("Every time it did, the case got a little smaller.", lt, 2.2, 30), 130, 400);
          // the photo on the desk (holds the next scene)
          inner(x, this.R, "#e9e5da", 14, lt - this.frameAt, -.04);
          // grain
          for (let i = 0; i < 260; i++) { const r = M.hash(i + Math.floor(lt * 24) * 977); x.fillStyle = `rgba(255,255,255,${.05 * r})`; x.fillRect(M.hash(i * 3 + lt) * W, M.hash(i * 7 + lt * 3) * H, 2, 2); }
        } },
      // 2 — NATURE DOCUMENTARY: self-similarity (a fern drawn by a recursive function)
      { name: "nature", R: [1280, 120, 480, 270], frameAt: 4.2,
        draw(x, lt, inner) {
          const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#dfe6d3"); g.addColorStop(1, "#b9c7a6"); x.fillStyle = g; x.fillRect(0, 0, W, H);
          const grow = expo(seg(lt, .2, 3.2));
          const fern = (px, py, len, ang, d) => {
            if (d > 5 || len < 6) return;
            const L = len * Math.min(1, grow * 6 - d);
            if (L <= 0) return;
            const ex = px + Math.cos(ang) * L, ey = py + Math.sin(ang) * L;
            x.strokeStyle = `rgb(${46 + d * 10},${92 + d * 14},${48 + d * 6})`; x.lineWidth = Math.max(1, 9 - d * 1.6);
            x.beginPath(); x.moveTo(px, py); x.lineTo(ex, ey); x.stroke();
            for (let k = 1; k <= 5; k++) { const f = k / 6, bx = px + (ex - px) * f, by = py + (ey - py) * f; fern(bx, by, len * .38 * (1 - f * .5), ang - .9, d + 1); fern(bx, by, len * .38 * (1 - f * .5), ang + .9, d + 1); }
            fern(ex, ey, len * .55, ang + Math.sin(lt * .8) * .03, d + 1);
          };
          fern(560, 1000, 420, -Math.PI / 2 - .08, 0);
          // lower third
          x.fillStyle = "rgba(20,30,18,.82)"; x.fillRect(980, 640, 820, 190);
          x.fillStyle = "#f4f1e6"; x.font = "italic 400 56px FR"; x.fillText(type("Observe the fern.", lt, .4, 22), 1020, 712);
          x.font = "400 34px FR"; x.fillText(type("Each leaf is a smaller fern —", lt, 1.5, 32), 1020, 762); x.fillText(type("the same rule, all the way down.", lt, 2.3, 32), 1020, 800);
          x.font = "500 22px I5"; x.fillStyle = "#3f4b35"; x.fillText("REC ● 00:0" + Math.floor(lt), 70, 70);
          inner(x, this.R, "#2a3424", 10, lt - this.frameAt);
        } },
      // 3 — 8-BIT GAME: each call waits for a smaller one (factorial as warp pipes)
      { name: "8bit", R: [1340, 500, 440, 248], frameAt: 4.3,
        draw(x, lt, inner) {
          x.imageSmoothingEnabled = false;
          x.fillStyle = "#5c94fc"; x.fillRect(0, 0, W, H);
          x.fillStyle = "#c84c0c"; for (let i = 0; i < 24; i++) x.fillRect(i * 80, 960, 76, 120);
          const pipes = [4, 3, 2, 1, 0];
          pipes.forEach((n, i) => { const px = 160 + i * 230, ph = 260 - i * 40; x.fillStyle = "#00a800"; x.fillRect(px, 960 - ph, 120, ph); x.fillRect(px - 12, 960 - ph, 144, 40); x.fillStyle = "#000"; x.font = "36px PX"; x.fillText(`f(${n})`, px + 6, 960 - ph - 20); });
          // the player hops from pipe to pipe, one per beat
          const hop = clamp((lt - .6) / .55, 0, 4.99), k = Math.floor(hop), f = hop - k;
          const px = 160 + (k + f) * 230 + 40, py = 960 - (260 - (k + f) * 40) - 64 - Math.sin(f * Math.PI) * 120;
          x.fillStyle = "#d82800"; x.fillRect(px, py, 48, 24); x.fillStyle = "#fca044"; x.fillRect(px + 8, py + 24, 32, 20); x.fillStyle = "#2038ec"; x.fillRect(px, py + 44, 48, 20);
          x.fillStyle = "#fff"; x.font = "44px PX";
          x.fillText("WORLD 1-1   FACTORIAL", 80, 100);
          const back = seg(lt, 3.2, 4.2);
          x.font = "40px PX";
          x.fillText(type("EACH CALL WAITS FOR A SMALLER ONE", lt, .5, 26), 80, 190);
          const prods = ["1", "1 x 1", "2 x 1", "3 x 2", "4 x 6 = 24"];
          if (back > 0) { x.fillStyle = "#fcfc00"; x.fillText("RETURNING: " + prods[Math.min(4, Math.floor(back * 5))], 80, 260); }
          inner(x, this.R, "#000", 12, lt - this.frameAt);
          x.imageSmoothingEnabled = true;
        } },
      // 4 — INFOMERCIAL: the base case
      { name: "info", R: [1150, 380, 560, 315], frameAt: 4.1,
        draw(x, lt, inner) {
          x.fillStyle = "#ffd400"; x.fillRect(0, 0, W, H);
          x.fillStyle = "#e10600"; x.fillRect(0, 820, W, 260);
          x.save(); x.translate(380, 560); x.rotate(-.08);
          // starburst
          const sb = springO(lt - 1.6, 16, .6);
          x.scale(sb, sb);
          x.fillStyle = "#e10600"; x.beginPath(); for (let i = 0; i < 32; i++) { const a = i / 32 * Math.PI * 2, r = i % 2 ? 210 : 260; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); } x.fill();
          x.fillStyle = "#fff"; x.font = "92px AN"; x.textAlign = "center"; x.fillText("BUT", 0, -20); x.fillText("WAIT!", 0, 80); x.textAlign = "left"; x.restore();
          x.fillStyle = "#111"; x.font = "96px AN"; x.fillText(type("TIRED OF LOOPS THAT NEVER END?", lt, .1, 30).toUpperCase(), 80, 150);
          x.fillStyle = "#fff"; x.font = "italic 900 74px I8"; x.fillText(type("Try the BASE CASE!", lt, 2.3, 24), 80, 960);
          x.font = "500 34px I5"; x.fillText(type("Stops when n = 0.  Calls not included.*", lt, 3.1, 40), 80, 1030);
          inner(x, this.R, "#111", 18, lt - this.frameAt);
        } },
      // 5 — STOP-MOTION DOLLS: the call stack opens… and closes
      { name: "dolls", R: [1320, 150, 480, 270], frameAt: 4.3,
        draw(x, lt, inner) {
          x.fillStyle = "#d9c4a0"; x.fillRect(0, 0, W, H);
          for (let i = 0; i < 400; i++) { x.fillStyle = `rgba(120,90,50,${.06 * M.hash(i)})`; x.fillRect(M.hash(i * 3.3) * W, M.hash(i * 5.1) * H, 3, 3); }
          const step = Math.floor(lt * 8) / 8;   // stop-motion: 8 poses a second
          const open = clamp((step - .5) / .5, 0, 4), close = clamp((step - 2.8) / .35, 0, 4);
          const n = Math.max(0, Math.floor(open) - Math.floor(close));
          for (let i = 0; i < 5; i++) {
            const s = 1 - i * .17, px = 380 + i * 240, out = i <= Math.floor(open) && i <= 4 - Math.floor(close);
            if (!out && i > 0) continue;
            x.save(); x.translate(px, 760); x.scale(s, s);
            x.fillStyle = ["#b8322a", "#2a6bb8", "#3d8f4e", "#d39a1f", "#7d3fa0"][i];
            x.beginPath(); x.ellipse(0, -60, 110, 170, 0, 0, Math.PI * 2); x.fill(); x.beginPath(); x.arc(0, -250, 90, 0, Math.PI * 2); x.fill();
            x.fillStyle = "#f6e3c8"; x.beginPath(); x.arc(0, -250, 60, 0, Math.PI * 2); x.fill();
            x.fillStyle = "#222"; x.beginPath(); x.arc(-20, -258, 6, 0, 7); x.arc(20, -258, 6, 0, 7); x.fill();
            x.restore();
          }
          x.fillStyle = "#3a2a18"; x.font = "500 64px CV";
          x.fillText(type("Each call opens a smaller doll…", lt, .2, 26), 120, 140);
          x.fillText(type("the smallest one is the base case.", lt, 1.6, 26), 120, 220);
          x.fillStyle = "#8b2a20"; x.fillText(type("Then they close back up, in reverse.", lt, 2.9, 26), 120, 300);
          inner(x, this.R, "#3a2a18", 10, lt - this.frameAt, .03);
        } },
      // 6 — WEATHER REPORT: the stack builds up, then clears from the top
      { name: "weather", R: [1360, 560, 440, 248], frameAt: 4.2,
        draw(x, lt, inner) {
          x.fillStyle = "#0b3d91"; x.fillRect(0, 0, W, H);
          x.fillStyle = "#1a5bc4"; x.beginPath(); x.moveTo(200, 900); x.bezierCurveTo(300, 400, 800, 300, 1100, 520); x.bezierCurveTo(1300, 680, 1000, 960, 600, 980); x.closePath(); x.fill();
          x.fillStyle = "#fff"; x.font = "800 64px I8"; x.fillText("CALL STACK FORECAST", 80, 120);
          x.font = "500 34px I5"; x.fillText(type("Building to 5 frames by midday, clearing from the top by evening.", lt, .3, 34), 80, 180);
          const up = clamp((lt - .6) / .35, 0, 5), dn = clamp((lt - 2.8) / .3, 0, 5);
          const n = Math.max(0, Math.floor(up) - Math.floor(dn));
          for (let i = 0; i < n; i++) { const cy = 820 - i * 110; x.fillStyle = "#fff"; x.beginPath(); x.roundRect(520, cy, 360, 90, 45); x.fill(); x.fillStyle = "#0b3d91"; x.font = "800 40px I8"; x.fillText(`f(${5 - i})`, 640, cy + 60); }
          x.fillStyle = "#ffcc00"; x.font = "800 120px I8"; x.fillText(n + "", 1000, 700); x.font = "500 30px I5"; x.fillText("FRAMES", 1000, 750);
          inner(x, this.R, "#fff", 8, lt - this.frameAt);
        } },
      // 7 — SILENT MOVIE: no base case → it never stops
      { name: "silent", R: [700, 640, 520, 292], frameAt: 4.2,
        draw(x, lt, inner) {
          const flick = .92 + .08 * M.hash(Math.floor(lt * 18));
          x.fillStyle = `rgb(${Math.round(60 * flick)},${Math.round(48 * flick)},${Math.round(34 * flick)})`; x.fillRect(0, 0, W, H);
          // intertitle
          x.strokeStyle = "#e8dcc0"; x.lineWidth = 4; x.strokeRect(260, 120, 1400, 420); x.strokeRect(280, 140, 1360, 380);
          x.fillStyle = "#efe4c9"; x.font = "italic 500 78px PF"; x.textAlign = "center";
          x.fillText(lt < 2.4 ? "Alas! He forgot the base case…" : "…and so it went, forever.", 960, 310);
          x.font = "italic 500 44px PF"; x.fillText(lt < 2.4 ? "" : "( a stack overflow )", 960, 420);
          x.textAlign = "left";
          // frames piling up endlessly
          const n = Math.floor(Math.max(0, lt - 2.4) * 10);
          for (let i = 0; i < Math.min(n, 30); i++) { x.fillStyle = "rgba(239,228,201,.75)"; x.fillRect(120 + (i * 53) % 1600, 1040 - Math.floor(i / 2) * 22, 70, 18); }
          for (let i = 0; i < 60; i++) { x.fillStyle = "rgba(255,240,210,.12)"; x.fillRect(M.hash(i + Math.floor(lt * 18) * 31) * W, 0, 1.5, H); }
          inner(x, this.R, "#efe4c9", 10, lt - this.frameAt);
        } },
      // 8 — TERMINAL: the actual code and its trace
      { name: "term", R: [1250, 600, 560, 315], frameAt: 4.3,
        draw(x, lt, inner) {
          x.fillStyle = "#050a05"; x.fillRect(0, 0, W, H);
          x.fillStyle = "#39ff6a"; x.font = "56px VT";
          const code = ["def fact(n):", "    if n == 0: return 1      # base case", "    return n * fact(n - 1)   # calls itself", "", ">>> fact(4)"];
          let c = 0; code.forEach((l, i) => { x.fillText(type(l, lt, .1 + c / 40, 40), 100, 140 + i * 64); c += l.length; });
          const tr = ["fact(4)", "  fact(3)", "    fact(2)", "      fact(1)", "        fact(0) -> 1", "      -> 1", "    -> 2", "  -> 6", "-> 24"];
          const shown = Math.floor(clamp((lt - 2.4) / .18, 0, tr.length));
          x.fillStyle = "#1fb34a"; tr.slice(0, shown).forEach((l, i) => x.fillText(l, 100, 500 + i * 52));
          if (Math.floor(lt * 2) % 2) { x.fillStyle = "#39ff6a"; x.fillRect(100 + 0, 500 + shown * 52 - 40, 26, 46); }
          inner(x, this.R, "#39ff6a", 6, lt - this.frameAt);
        } },
      // 9 — SWISS: ties it together — every style was inside the last one
      { name: "swiss", R: [810, 640, 300, 169], frameAt: 4.4,
        draw(x, lt, inner) {
          x.fillStyle = "#f2f0ea"; x.fillRect(0, 0, W, H);
          x.fillStyle = "#e3241b"; x.fillRect(0, 0, 40, H);
          x.fillStyle = "#111"; x.font = "800 84px I8";
          x.fillText(type("Every scene was inside the last one.", lt, .15, 34), 120, 170);
          x.fillStyle = "#e3241b"; x.fillText(type("This video is recursive.", lt, 1.4, 30), 120, 270);
          // the nested thumbnails, each inside the previous
          let r = [120, 360, 900, 506];
          for (let k = 1; k <= 8; k++) {
            const on = expo(seg(lt, .6 + k * .22, 1 + k * .22));
            if (on <= 0 || !SC[k].cache) break;
            x.globalAlpha = 1; x.drawImage(SC[k].cache, r[0], r[1] + (1 - on) * 30, r[2], r[3]);
            const R = SC[k].R, sx = r[2] / W, sy = r[3] / H;
            r = [r[0] + R[0] * sx, r[1] + R[1] * sy, R[2] * sx, R[3] * sy];
          }
          x.fillStyle = "#111"; x.font = "500 34px I5";
          x.fillText(type("A thing defined by a smaller copy of itself —", lt, 2.4, 40), 1100, 560);
          x.fillText(type("plus one case simple enough to stop.", lt, 3.3, 40), 1100, 610);
          inner(x, this.R, "#111", 4, lt - this.frameAt);
        } },
    ];
    // each scene's first frame, cached so the previous scene can hold it in its little screen
    const off = document.createElement("canvas"); off.width = W; off.height = H; const ox = off.getContext("2d");
    for (let i = SC.length - 1; i >= 0; i--) {
      ox.setTransform(1, 0, 0, 1, 0, 0);
      SC[i].draw(ox, OFF(i), () => {});
      const cc = document.createElement("canvas"); cc.width = W; cc.height = H; cc.getContext("2d").drawImage(off, 0, 0);
      SC[i].cache = cc;
    }
    return { x };
  },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, expoIO, expo, spring } = M;
    let i = t < T0 ? 0 : Math.min(SC.length - 1, 1 + Math.floor((t - T0) / SD));
    const dur = i === 0 ? T0 : SD, lt = t - start(i), sc = SC[i];
    const next = SC[(i + 1) % SC.length];
    // the dive: zoom so the little screen fills the frame
    const z = i === SC.length - 1 && t > 58.6 ? expoIO(seg(lt, dur - ZOOM - .05, dur - .05)) : expoIO(seg(lt, dur - ZOOM, dur));
    const [rx, ry, rw, rh] = sc.R;
    const s = lerp(1, W / rw, z), tx = lerp(0, -rx * W / rw, z), ty = lerp(0, -ry * H / rh, z);
    x.setTransform(s, 0, 0, s, tx, ty);
    const inner = (xx, R, border, bw, since, rot = 0) => {
      if (since < 0) return;
      const k = spring(since, 14);
      xx.save();
      const cx = R[0] + R[2] / 2, cy = R[1] + R[3] / 2;
      xx.translate(cx, cy); xx.rotate(rot * (1 - z)); xx.scale(k, k); xx.translate(-cx, -cy);
      xx.fillStyle = border; xx.fillRect(R[0] - bw, R[1] - bw, R[2] + bw * 2, R[3] + bw * 2);
      xx.drawImage(next.cache, R[0], R[1], R[2], R[3]);
      xx.restore();
    };
    sc.draw(x, lt + OFF(i), inner);
    x.setTransform(1, 0, 0, 1, 0, 0);
  },
  sound(A) {
    const st = (i) => (i === 0 ? 0 : T0 + (i - 1) * SD);
    const span = (i) => [st(i), i === 0 ? T0 : st(i) + SD];
    const m = A.midi;
    // hook: a single low drone + ticks
    A.pad(0, [m(38), m(45)], T0, .04); for (let k = 0; k < 7; k++) A.click(.2 + k * .5, .08);
    // stings on every change
    for (let i = 1; i <= 9; i++) { const t0 = st(i); A.whoosh(t0 - .7, .7, .22); A.hit(t0, .4); }
    // 1 noir: walking bass + brushed snare + muted horn
    { const [a, b] = span(1); const bpm = 90, Bt = 60 / bpm; const walk = [40, 43, 45, 46, 47, 45, 43, 42]; for (let k = 0; a + k * Bt < b - .3; k++) { A.bass(a + k * Bt, m(walk[k % 8]), Bt * .9, .22); A.nz(a + k * Bt + Bt / 2, .15, "bandpass", 3000, .05); } A.tone(a + .5, m(63), 1.6, "triangle", .06); A.tone(a + 2.4, m(61), 1.8, "triangle", .06); }
    // 2 nature: strings pad + flute plucks
    { const [a] = span(2); A.pad(a, [m(55), m(59), m(62), m(66)], SD, .035); [0, .8, 1.6, 2.2, 3.2, 4].forEach((d, k) => A.tone(a + d, m([74, 76, 79, 78, 76, 74][k]), .7, "sine", .07)); }
    // 3 8-bit: square-wave arpeggio + noise drums
    { const [a, b] = span(3); for (let k = 0; a + k * .125 < b - .3; k++) { A.tone(a + k * .125, m([60, 64, 67, 72][k % 4] + (Math.floor(k / 16) % 2) * 5), .11, "square", .05); if (k % 4 === 0) A.nz(a + k * .125, .05, "highpass", 3000, .1); } for (let j = 0; j < 5; j++) A.tone(a + .6 + j * .55, m(84), .08, "square", .06); }
    // 4 infomercial: brassy stabs, four on the floor
    { const [a, b] = span(4); A.groove(128, a, b - .2, { snare: true, kg: .7 }); [0, .47, 1.6, 2.3, 3.1].forEach((d) => { [60, 64, 67].forEach((n) => A.tone(a + d, m(n), .25, "sawtooth", .04)); }); }
    // 5 dolls: pizzicato plucks, one per pose
    { const [a, b] = span(5); for (let k = 0; a + k * .25 < b - .3; k++) A.pluck(a + k * .25, m([67, 71, 74, 79, 74, 71][k % 6]), .09, .2); }
    // 6 weather: smooth elevator jazz chords
    { const [a] = span(6); [[50, 53, 57, 60], [55, 59, 62, 65], [48, 52, 55, 59]].forEach((c, k) => A.pad(a + k * 2, c.map(m), 2.1, .03)); for (let k = 0; k < 12; k++) A.hat(a + k * .5 + .25, .05); }
    // 7 silent: ragtime piano (oom-pah)
    { const [a, b] = span(7); for (let k = 0; a + k * .3 < b - .3; k++) { if (k % 2 === 0) A.pluck(a + k * .3, m(43 + (k % 4 ? 7 : 0)), .12, .25); else [55, 59, 62].forEach((n) => A.pluck(a + k * .3, m(n), .05, .2)); A.pluck(a + k * .3 + .15, m([74, 76, 77, 79, 81, 79][k % 6]), .06, .15); } }
    // 8 terminal: drone + key clicks + beeps for each trace line
    { const [a] = span(8); A.pad(a, [m(33), m(40)], SD, .04); for (let k = 0; k < 60; k++) A.click(a + .1 + k * .045, .05); for (let k = 0; k < 9; k++) A.tone(a + 2.4 + k * .18, 1200 - k * 60, .06, "square", .04); }
    // 9 swiss: clean pulse + bright pad, resolving

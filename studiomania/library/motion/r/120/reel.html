<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script><script src="../../lib/three.min.js"></script></head><body>
<script>
// #120 Douglas A-1H Skyraider, a scale model built in code (three.js). Navy grey over white, big radial, four-blade prop,
// panel lines + rivets painted into the textures. It flies a slow orbit; every frame is computed from time.
// Signature shot (11–15 s): low three-quarter front, close on the cowling — the prop disc blurring, the exhaust stubs,
// cylinders visible behind the cowl flaps, sunlight raking across the panel lines.
// Shots: 0–4 establishing wide (slow crane) · 4–7 orbit along the wing · 7–11 dolly in to the cockpit · 11–15 signature
// · 15–20 final wide, the sun lower and warmer (new light), the aircraft banking away.
const DUR = 20;
M.reel({
  W: 1920, H: 1080, DUR, bg: "#9fb4c8",
  init(M) {
    const T = THREE, R = M.rng(5);
    const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1920, 1080); renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = .78;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.domElement.style.cssText = "position:absolute;left:0;top:0"; M.stage.appendChild(renderer.domElement);
    const scene = new T.Scene(), cam = new T.PerspectiveCamera(35, 1920 / 1080, .5, 3000);
    // sky + environment (a simple painted sky dome) and fog for depth
    const skyU = { warm: { value: 0 } };
    const sky = new T.Mesh(new T.SphereGeometry(1500, 32, 16), new T.ShaderMaterial({ side: T.BackSide, depthWrite: false, uniforms: skyU,
      vertexShader: "varying vec3 d; void main(){ d = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
      fragmentShader: "uniform float warm; varying vec3 d; void main(){ float y = clamp(d.y,-.2,1.); vec3 top = mix(vec3(.33,.50,.72), vec3(.30,.36,.58), warm); vec3 hor = mix(vec3(.82,.88,.92), vec3(1.,.74,.52), warm); vec3 c = mix(hor, top, smoothstep(0.,.5,y)); if (y < 0.) c = mix(hor, mix(vec3(.30,.40,.50), vec3(.35,.28,.30), warm), smoothstep(0.,-.15,y)); gl_FragColor = vec4(c,1.); }" }));
    scene.add(sky);
    const envS = new T.Scene(); envS.add(sky.clone()); const pm = new T.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(envS, .02).texture;
    scene.fog = new T.Fog(0xc8d4de, 200, 1400);
    // lights
    const key = new T.DirectionalLight(0xfff4e6, 2.0); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0003; key.shadow.normalBias = .02;
    Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 80 }); scene.add(key, key.target);
    scene.add(new T.HemisphereLight(0xbfd6f0, 0x5a6470, .7));
    const rim = new T.DirectionalLight(0xa9c4ff, 1.1); scene.add(rim);
    // cloud deck far below (soft blobs), for scale
    const cmat = new T.MeshStandardMaterial({ color: 0xd9e0e6, roughness: 1 });
    for (let i = 0; i < 60; i++) { const b = new T.Mesh(new T.SphereGeometry(1, 16, 10), cmat); b.scale.set(30 + R() * 50, 8 + R() * 10, 30 + R() * 40); b.position.set((R() - .5) * 1400, -260 - R() * 20, (R() - .5) * 1400); scene.add(b); }
    // ---------- paint: panel lines + rivets on a two-tone (grey over white) texture
    const paint = (w, h, split, lines) => {
      const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
      x.fillStyle = "#e9ecec"; x.fillRect(0, 0, w, h);
      x.fillStyle = "#8f989d"; if (split < 0) x.fillRect(w * .5, 0, w * .5, h); else x.fillRect(0, 0, w, h * split);
      x.strokeStyle = "rgba(30,34,38,.35)"; x.lineWidth = 2;
      lines.forEach(([a, b, horiz]) => { x.beginPath(); if (horiz) { x.moveTo(0, a * h); x.lineTo(w, a * h); } else { x.moveTo(a * w, 0); x.lineTo(a * w, h); } x.stroke(); });
      x.fillStyle = "rgba(30,34,38,.28)"; lines.forEach(([a, b, horiz]) => { for (let k = 0; k < 80; k++) { const u = k / 80; horiz ? x.fillRect(u * w, a * h + 5, 2, 2) : x.fillRect(a * w + 5, u * h, 2, 2); } });
      const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 8; return t;
    };
    const fusTex = paint(2048, 512, -.5, [[.1, 0, 0], [.22, 0, 0], [.35, 0, 0], [.5, 0, 0], [.62, 0, 0], [.75, 0, 0], [.88, 0, 0], [.3, 0, 1], [.7, 0, 1]]);
    const wingTex = paint(1024, 1024, 1, [[.2, 0, 0], [.4, 0, 0], [.6, 0, 0], [.8, 0, 0], [.33, 0, 1], [.66, 0, 1]]);
    const greyMat = new T.MeshPhysicalMaterial({ map: wingTex, roughness: .55, metalness: .1, clearcoat: .25, clearcoatRoughness: .5 });
    const fusMat = new T.MeshPhysicalMaterial({ map: fusTex, roughness: .5, metalness: .1, clearcoat: .3, clearcoatRoughness: .45 });
    const darkMat = new T.MeshPhysicalMaterial({ color: 0x2b2f33, roughness: .4, metalness: .7 });
    const metal = new T.MeshPhysicalMaterial({ color: 0x8a8c8f, roughness: .3, metalness: 1 });
    const glass = new T.MeshPhysicalMaterial({ color: 0xcfe3f2, roughness: .05, transmission: .85, thickness: .2, ior: 1.45, clearcoat: 1, transparent: true });
    const plane = new T.Group(); scene.add(plane);
    // fuselage: a lathe along the length (nose at -z), the A-1's deep belly
    const prof = [[0, 0], [1.05, .1], [1.12, .9], [1.0, 2.2], [.95, 4.2], [.8, 6.4], [.55, 8.2], [.32, 9.6], [.1, 10.4]];
    const fuse = new T.Mesh(new T.LatheGeometry(prof.map(([r, z]) => new T.Vector2(r, z)), 48), fusMat);
    fuse.rotation.x = Math.PI / 2; fuse.position.z = -2.4; fuse.scale.set(1, 1, 1.18); fuse.castShadow = fuse.receiveShadow = true; plane.add(fuse);
    // cowling ring + cylinders behind it + exhaust stubs
    const cowl = new T.Mesh(new T.CylinderGeometry(1.1, 1.18, 1.6, 48, 1, true), fusMat); cowl.rotation.x = Math.PI / 2; cowl.position.z = -2.2; cowl.castShadow = true; plane.add(cowl);
    const lip = new T.Mesh(new T.TorusGeometry(1.08, .07, 12, 48), darkMat); lip.position.z = -3.0; plane.add(lip);
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; const cyl = new T.Mesh(new T.CylinderGeometry(.16, .16, .55, 12), darkMat); cyl.position.set(Math.cos(a) * .72, Math.sin(a) * .72, -2.75); cyl.rotation.z = a + Math.PI / 2; plane.add(cyl); }
    for (let s of [-1, 1]) for (let i = 0; i < 4; i++) { const ex = new T.Mesh(new T.CylinderGeometry(.07, .09, .3, 10), metal); ex.position.set(s * 1.08, .2 - i * .28, -1.6); ex.rotation.z = Math.PI / 2; plane.add(ex); }
    // spinner + four blades (the prop group spins; at speed a translucent disc blends in)
    const prop = new T.Group(); prop.position.z = -3.25; plane.add(prop);
    const spinner = new T.Mesh(new T.ConeGeometry(.42, .9, 32), metal); spinner.rotation.x = -Math.PI / 2; spinner.position.z = -.35; prop.add(spinner);
    for (let i = 0; i < 4; i++) { const bl = new T.Mesh(new T.BoxGeometry(.24, 2.3, .05), darkMat); bl.position.y = 1.2; const arm = new T.Group(); arm.rotation.z = i * Math.PI / 2; bl.rotation.y = .35; arm.add(bl); const tip = new T.Mesh(new T.BoxGeometry(.24, .18, .052), new T.MeshStandardMaterial({ color: 0xf2c230 })); tip.position.y = 2.3; arm.add(tip); prop.add(arm); }
    const disc = new T.Mesh(new T.CircleGeometry(2.45, 48), new T.MeshBasicMaterial({ color: 0x222222, transparent: true, opacity: .12, side: T.DoubleSide, depthWrite: false })); disc.position.z = -.02; prop.add(disc);
    // wings: straight, thick root, slight dihedral on the outer panels, folding line; drop tanks under
    const wingShape = new T.Shape(); wingShape.moveTo(0, 0); wingShape.lineTo(7.6, .9); wingShape.lineTo(7.6, 2.3); wingShape.lineTo(0, 3.2); wingShape.closePath();
    for (const s of [-1, 1]) {
      const w = new T.Mesh(new T.ExtrudeGeometry(wingShape, { depth: .26, bevelEnabled: true, bevelThickness: .08, bevelSize: .08, bevelSegments: 3 }), greyMat);
      w.rotation.x = Math.PI / 2; w.scale.x = s; w.position.set(s * .6, -.35, -.9); w.rotation.y = s * -.05; w.castShadow = w.receiveShadow = true; plane.add(w);
      const tank = new T.Mesh(new T.CapsuleGeometry(.32, 2.4, 8, 16), fusMat); tank.rotation.x = Math.PI / 2; tank.position.set(s * 2.6, -.95, .2); tank.castShadow = true; plane.add(tank);
      for (let k = 0; k < 3; k++) { const pyl = new T.Mesh(new T.BoxGeometry(.06, .3, .8), darkMat); pyl.position.set(s * (4 + k * 1.1), -.6, .4); plane.add(pyl); }
    }
    // tail: tall fin + rudder, tailplanes
    const fin = new T.Shape(); fin.moveTo(0, 0); fin.lineTo(2.2, 0); fin.lineTo(2.0, 2.4); fin.lineTo(1.2, 2.5); fin.closePath();
    const finM = new T.Mesh(new T.ExtrudeGeometry(fin, { depth: .12, bevelEnabled: true, bevelThickness: .04, bevelSize: .04, bevelSegments: 2 }), greyMat); finM.rotation.y = -Math.PI / 2; finM.position.set(.06, .3, 6.2); finM.castShadow = true; plane.add(finM);
    for (const s of [-1, 1]) { const tp = new T.Mesh(new T.BoxGeometry(2.6, .12, 1.4), greyMat); tp.position.set(s * 1.4, .25, 8.4); tp.castShadow = true; plane.add(tp); }
    // canopy: a long bubble, framed
    const can = new T.Mesh(new T.SphereGeometry(.62, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), glass); can.scale.set(1, .9, 2.6); can.position.set(0, .82, 1.1); plane.add(can);
    for (let k = 0; k < 4; k++) { const fr = new T.Mesh(new T.TorusGeometry(.6, .025, 8, 24, Math.PI), darkMat); fr.position.set(0, .82, -.2 + k * .85); fr.rotation.y = Math.PI / 2; plane.add(fr); }
    const pilot = new T.Mesh(new T.SphereGeometry(.2, 16, 12), new T.MeshStandardMaterial({ color: 0xd6d0bf, roughness: .6 })); pilot.position.set(0, 1.0, 1.2); plane.add(pilot);
    // codes on the fin/fuselage are left out on purpose (no real unit markings)
    return { T, renderer, scene, cam, plane, prop, disc, key, rim, skyU, sky };
  },
  seek(t, P, M) {
    const { T, cam, plane } = P, { seg, lerp, cubicIO, sine, clamp } = M;
    // flight: a slow orbit (radius 260 m) with gentle bank; the propeller spins
    const ang = t * .045 + .3, r = 260;
    const pos = new T.Vector3(Math.cos(ang) * r, 40 + Math.sin(t * .3) * 2, Math.sin(ang) * r);
    plane.position.copy(pos);
    const fwd = new T.Vector3(-Math.sin(ang), 0, Math.cos(ang));
    plane.lookAt(pos.clone().sub(fwd));   // nose points along -fwd? (model nose is -z)
    const bank = lerp(.18, .5, sine(seg(t, 15, 20)));
    plane.rotateZ(-bank); plane.rotateX(Math.sin(t * .5) * .02);
    P.prop.rotation.z = t * 38;
    P.disc.material.opacity = .14;
    // light: midday → lower, warmer sun for the final wide
    const warm = sine(seg(t, 14, 20));
    P.skyU.warm.value = warm;
    const sunDir = new T.Vector3(lerp(.4, .9, warm), lerp(.8, .25, warm), lerp(.3, -.2, warm)).normalize();
    P.key.position.copy(pos).add(sunDir.clone().multiplyScalar(40)); P.key.target.position.copy(pos); P.key.color.setHSL(lerp(.1, .07, warm), lerp(.3, .8, warm), lerp(.95, .7, warm)); P.key.intensity = lerp(2.0, 1.8, warm);
    P.rim.position.copy(pos).add(sunDir.clone().multiplyScalar(-40)).add(new T.Vector3(0, 10, 0));
    // camera in the aircraft's frame
    const toW = (v) => v.clone().applyQuaternion(plane.quaternion).add(pos);
    let cpos, look, fov = 35;
    if (t < 4) { const a = cubicIO(t / 4); cpos = toW(new T.Vector3(lerp(-30, -22, a), lerp(2, 9, a), lerp(10, 26, a))); look = toW(new T.Vector3(0, 0, 1)); fov = 30; }                       // establishing, crane up
    else if (t < 7) { const a = lerp(-2.3, -1.2, cubicIO((t - 4) / 3)); cpos = toW(new T.Vector3(Math.sin(a) * 18, 3, Math.cos(a) * 18)); look = toW(new T.Vector3(0, 0, 0)); fov = 34; }           // orbit along the wing
    else if (t < 11) { const a = cubicIO((t - 7) / 4); cpos = toW(new T.Vector3(lerp(-11, -6, a), lerp(4, 2.6, a), lerp(6, 2.4, a))); look = toW(new T.Vector3(0, .9, 1.1)); fov = lerp(36, 30, a); }   // dolly in to the cockpit
    else if (t < 15) { const a = sine((t - 11) / 4); cpos = toW(new T.Vector3(lerp(-4.2, -3.2, a), lerp(-.9, -.6, a), lerp(-6.2, -5.2, a))); look = toW(new T.Vector3(0, 0, -2.4)); fov = 32; }  // signature: low 3/4 front, cowling
    else { const a = cubicIO((t - 15) / 5); cpos = toW(new T.Vector3(lerp(-6, -60, a), lerp(1, 18, a), lerp(-4, 40, a))); look = toW(new T.Vector3(0, 0, 0)); fov = 34; }                            // final wide, pulling away
    cam.position.copy(cpos); cam.fov = fov; cam.updateProjectionMatrix(); cam.up.set(0, 1, 0); cam.lookAt(look);
    P.sky.position.copy(cam.position);
    P.renderer.render(P.scene, cam);
  },
  sound(A) {
    // the radial: a deep, slightly irregular drone (detuned saws + low-pass), swelling as the camera comes close
    const ctx = A.ctx;
    const eng = (f, g0) => { const o = ctx.createOscillator(), fl = ctx.createBiquadFilter(), g = ctx.createGain(); o.type = "sawtooth"; o.frequency.value = f; fl.type = "lowpass"; fl.frequency.value = 420; g.gain.value = g0; o.connect(fl).connect(g).connect(A.out); o.start(0); o.stop(DUR); return g; };
    const g1 = eng(54, .06), g2 = eng(56.5, .05), g3 = eng(108, .02);
    [[11, .12], [15, .06]].forEach(([t0, v]) => { [g1, g2].forEach((g) => { g.gain.linearRampToValueAtTime(v, t0); }); });
    for (let k = 0; k < 200; k++) A.nz(k * .1, .05, "lowpass", 300, .03);   // the engine's uneven firing
    { const b = ctx.createBufferSource(); b.buffer = A.noise; b.loop = true; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 900; const g = ctx.createGain(); g.gain.value = .04; b.connect(f).connect(g).connect(A.out); b.start(0); b.stop(DUR); }
    A.pad(15, [45, 52, 57, 61].map(A.midi), 5, .03);
  },
});
</script></body></html>

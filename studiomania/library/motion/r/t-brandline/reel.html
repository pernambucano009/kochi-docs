<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// قالب «خط علامتك»: خط نور واحد بلون العلامة بيعمل كل حاجة في لقطة واحدة من غير قطع: بيخبط تحت الاسم، ويبقى خط خانة البحث في الجوال،
// ويملأ زرار الطلب، ويرسم طريق التوصيل في المدينة بالليل، ويلف على الكرتونة ويقعد عليها علامة، ويجري تحت الجملة الأخيرة، ويرجع تحت الاسم.
// كله بيترسم بدالة واحدة (glowLine) عشان الخط يبان هو هو في كل مشهد. 1080×1920، ٢٠ ثانية.
const G1 = "١ · الاسم", G2 = "٢ · البحث والطلب", G3 = "٣ · التوصيل", G4 = "٤ · الختام", GS = "الشكل العام";
const PR = M.params({
  brand: { label: "اسم العلامة", kind: "text", role: "brand", def: "سوقنا", group: G1, max: 16, hint: "يظهر في البداية والنهاية، والخط يجري تحته." },
  logo: { label: "الشعار", kind: "image", role: "logo", def: "", group: G1, img: { ratio: "1:1", cut: true, tip: "رمز الشعار وحده وبلا خلفية: يُطبع على الكرتونة. إن لم يوجد يُطبع أول حرف من الاسم." } },
  query: { label: "ما يُكتب في البحث", kind: "text", def: "سماعات لاسلكية", group: G2, max: 22, hint: "ما يبحث عنه عميلك عادةً، بكلماته هو." },
  sug: { label: "اقتراحات البحث (٣ سطور)", kind: "lines", def: ["سماعات لاسلكية رياضية", "سماعات لاسلكية بعزل الصوت", "سماعات لاسلكية للأطفال"], group: G2, max: 30 },
  product: { label: "اسم المنتج", kind: "text", role: "product", def: "سماعة هدوء برو", group: G2, max: 24 },
  price: { label: "السعر", kind: "text", def: "٣٤٩ ريال", group: G2, max: 14 },
  perk: { label: "ميزة تحت السعر", kind: "text", def: "توصيل مجاني اليوم", group: G2, max: 26 },
  button: { label: "زر الطلب", kind: "text", def: "اطلب الآن", group: G2, max: 14 },
  done: { label: "رسالة بعد الطلب", kind: "text", def: "تم الطلب، شكرًا لك", group: G2, max: 24 },
  img1: { label: "صورة المنتج", kind: "image", role: "product_img1", def: "", group: G2, img: { ratio: "1:1", cut: false, tip: "صورة واضحة للمنتج على خلفية بسيطة." } },
  img2: { label: "صورة منتج ٢ (نتائج البحث)", kind: "image", role: "product_img2", def: "", group: G2, img: { ratio: "1:1", cut: false } },
  img3: { label: "صورة منتج ٣ (نتائج البحث)", kind: "image", role: "product_img3", def: "", group: G2, img: { ratio: "1:1", cut: false } },
  eta: { label: "عنوان التوصيل", kind: "text", def: "يصلك اليوم", group: G3, max: 18 },
  steps: { label: "مراحل الطلب (٤ سطور)", kind: "lines", def: ["تم الطلب", "يُجهَّز", "في الطريق", "وصل"], group: G3, max: 12 },
  notify: { label: "إشعار الوصول", kind: "text", def: "وصل طلبك إلى الباب", group: G3, max: 26 },
  tagline: { label: "الجملة الأخيرة", kind: "text", role: "tagline", def: "كل ما تحبه، حتى بابك", group: G4, max: 26, hint: "وعد العلامة في سطر: الخط يجري تحته ثم يعود تحت الاسم." },
  cta: { label: "الدعوة في النهاية", kind: "text", role: "cta", def: "حمّل التطبيق واطلب الآن", group: G4, max: 28 },
  accent: { label: "لون العلامة (الخط)", kind: "color", role: "accent", def: "#3d7bff", group: GS, hint: "لون الخط الوحيد في الفيديو: لون العلامة الأساسي، ويُفضَّل أن يكون قويًا." },
  bg: { label: "لون الخلفية", kind: "color", role: "dark", def: "#08080a", group: GS, hint: "غامق جدًا لكي يلمع الخط." },
  fHead: { label: "خط العناوين", kind: "font", def: "plex", group: GS },
  fText: { label: "خط النصوص", kind: "font", def: "plex4", group: GS },
});
M.meta({
  story: "خط نور واحد بلون العلامة يحكي رحلة العميل في لقطة واحدة: يظهر تحت الاسم، ثم يصبح خط البحث في الجوال، ويملأ زر الطلب، ويرسم طريق التوصيل في المدينة، ويلتف حول الصندوق عند الباب ويصبح علامة عليه، ثم يجري تحت الجملة الأخيرة ويعود تحت الاسم.",
  scenes: [{ name: "الاسم", t0: 0, t1: 2.0, about: "الخط يصل ويظهر الاسم" }, { name: "البحث", t0: 2.0, t1: 5.6, about: "الكتابة والاقتراحات والنتائج" },
    { name: "الطلب", t0: 5.6, t1: 8.4, about: "صفحة المنتج وزر الطلب" }, { name: "الطريق", t0: 8.4, t1: 11.6, about: "الخط يرسم طريق التوصيل" },
    { name: "الباب", t0: 11.6, t1: 14.6, about: "الصندوق والعلامة والإشعار" }, { name: "الختام", t0: 14.6, t1: 20, about: "الجملة الأخيرة والاسم" }],
  tips: ["مناسب للمتاجر والمطاعم والتطبيقات وأي خدمة توصيل.", "اكتب في البحث ما يكتبه عميلك فعلًا.", "لون العلامة القوي يجعل الخط هو البطل."],
});
const W = 1080, H = 1920, DUR = 20;

M.reel({
  W, H, DUR, bg: "#08080a",
  async init(M) {
    await Promise.all([M.font("PB", PR.fHead), M.font("PX", PR.fText)]);
    const [i1, i2, i3, lg] = await Promise.all([PR.img1, PR.img2, PR.img3, PR.logo].map(M.img));
    const c = M.canvas(W, H);
    return { x: c.getContext("2d"), imgs: [i1, i2, i3], logo: lg };
  },
  seek(t, C, M) {
    const { x } = C, { seg, cubicIO, clamp, springO, expo, lerp, noise1 } = M, io = (k) => cubicIO(clamp(k)), A = PR.accent, BG = PR.bg;
    const T = (s) => String(s || "").trim();
    const st = [0, 1, 2, 3].map((i) => T(PR.steps[i]) || window.PARAM_SCHEMA.steps.def[i]);
    const sg = [0, 1, 2].map((i) => T(PR.sug[i]) || window.PARAM_SCHEMA.sug.def[i]);
    x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.fillStyle = BG; x.fillRect(0, 0, W, H);
    // توهج دافئ بيتنفّس في الخلفية
    { const g = x.createRadialGradient(540 + noise1(t * .3) * 160, 760 + noise1(t * .2 + 9) * 120, 40, 540, 900, 1100); g.addColorStop(0, A + "30"); g.addColorStop(1, "transparent"); x.fillStyle = g; x.fillRect(0, 0, W, H); }
    // 🎥 كاميرا دايمًا بتتحرك شوية + هزة على الخبطات
    const shake = (t0) => { const k = clamp((t - t0) / .35); return k > 0 && k < 1 ? (1 - k) * 14 : 0; };
    const sh = shake(.35) + shake(17.6) * .6;
    const camX = noise1(t * .5) * 10 + (sh ? noise1(t * 60) * sh : 0), camY = noise1(t * .4 + 5) * 10 + (sh ? noise1(t * 60 + 3) * sh : 0);
    x.translate(camX, camY);

    // ✨ الخط: دالة واحدة لكل المشاهد. pts نقط المسار، k من ٠ لـ ١ قد إيه اترسم، cool من ٠ (نور) لـ ١ (حبر مطبوع)
    function glowLine(pts, k, w = 10, cool = 0, from = 0) {
      if (k <= from || pts.length < 2) return null;
      const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
      const a = tot * from, b = tot * clamp(k); let acc = 0, head = pts[0], started = false;
      x.save(); x.lineCap = "round"; x.lineJoin = "round"; x.beginPath();
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i - 1], p1 = pts[i], d = L[i - 1];
        const s0 = clamp((a - acc) / d), s1 = clamp((b - acc) / d);
        if (s1 > s0) {
          const q0 = [lerp(p0[0], p1[0], s0), lerp(p0[1], p1[1], s0)], q1 = [lerp(p0[0], p1[0], s1), lerp(p0[1], p1[1], s1)];
          if (!started) { x.moveTo(...q0); started = true; } x.lineTo(...q1); head = q1;
        }
        acc += d;
      }
      const glow = 1 - cool;
      if (glow > 0) { x.shadowColor = A; x.shadowBlur = 34 * glow; x.strokeStyle = A; x.globalAlpha = .55 * glow; x.lineWidth = w * 2.6; x.stroke(); }
      x.shadowBlur = 16 * glow; x.globalAlpha = 1; x.strokeStyle = A; x.lineWidth = w; x.stroke();
      if (glow > .2) { x.shadowBlur = 0; x.strokeStyle = "rgba(255,255,255," + .65 * glow + ")"; x.lineWidth = w * .3; x.stroke(); }
      if (glow > .1 && k < .999) { x.shadowBlur = 40; x.shadowColor = A; x.fillStyle = "#fff"; x.beginPath(); x.arc(head[0], head[1], w * .9, 0, Math.PI * 2); x.fill(); }
      x.restore();
      return head;
    }
    // قوس الابتسامة تحت كلمة: من اليمين للشمال (عربي) وبيتلوّى لفوق في آخره
    // خط مستقيم تحت الكلمة (من اليمين للشمال) وفي آخره نقطة صغيرة مرفوعة
    const smile = (cx, cy, wd, n = 26) => { const out = []; for (let i = 0; i <= n; i++) { const u = i / n; out.push([cx + wd / 2 - wd * u, cy]); } const e = out[n]; out.push([e[0] - 14, e[1]], [e[0] - 22, e[1] - 22]); return out; };
    const txt = (s, px, py, size, fam = "PB", color = "#fff", align = "center", maxW = 900) => { x.fillStyle = color; x.font = `${fam === "PB" ? 700 : 400} ${M.fit(s, fam, maxW, size, 18, fam === "PB" ? "700" : "")}px ${fam}`; x.textAlign = align; x.direction = "rtl"; x.textBaseline = "alphabetic"; x.fillText(s, px, py); };
    const rr = (px, py, w, h, r) => { x.beginPath(); x.roundRect(px, py, w, h, r); };
    const img = (im, px, py, w, h, r = 24) => { x.save(); rr(px, py, w, h, r); x.clip(); if (im) { const s = Math.max(w / im.width, h / im.height); x.drawImage(im, px + (w - im.width * s) / 2, py + (h - im.height * s) / 2, im.width * s, im.height * s); } else { const g = x.createLinearGradient(px, py, px + w, py + h); g.addColorStop(0, A + "55"); g.addColorStop(1, "#ffffff12"); x.fillStyle = g; x.fillRect(px, py, w, h); x.fillStyle = "rgba(255,255,255,.55)"; x.beginPath(); x.arc(px + w / 2, py + h * .45, Math.min(w, h) * .18, 0, Math.PI * 2); x.fill(); } x.restore(); };

    // ---------- ١) الخبطة: الخط جاي من بعيد ويخبط تحت الاسم ----------
    const brandY = 930, nameW = Math.min(820, Math.max(360, M.measure(PR.brand, "700 150px PB") + 80));
    const heroUnder = smile(540, brandY + 70, nameW);
    if (t < 2.4) {
      const fade = 1 - io(seg(t, 1.9, 2.4));
      x.globalAlpha = fade;
      if (t < .35) { // شعاع داخل من العمق ناحية الكاميرا
        const k = expo(t / .35), z = lerp(.08, 1, k), cx = 540, cy = lerp(700, brandY + 70, k);
        const pts = heroUnder.map(([px, py]) => [cx + (px - 540) * z, cy + (py - brandY - 70) * z]);
        glowLine(pts, 1, 4 + 8 * k);
        for (let s = 0; s < 6; s++) { x.strokeStyle = A; x.globalAlpha = .25 * fade * (1 - k); x.lineWidth = 2; x.beginPath(); x.moveTo(cx + (s - 3) * 30 * z, cy); x.lineTo(cx + (s - 3) * 90, cy - 500 * (1 - k)); x.stroke(); }
        x.globalAlpha = fade;
      } else {
        glowLine(heroUnder, 1, 12);
        // شظايا نور لحظة الخبطة
        const sk = seg(t, .35, .8); if (sk < 1) for (let s = 0; s < 14; s++) { const a = s / 14 * Math.PI * 2, r = 40 + 260 * expo(sk); x.fillStyle = A; x.globalAlpha = (1 - sk) * fade; x.fillRect(540 + Math.cos(a) * r, brandY + 70 + Math.sin(a) * r * .4, 8, 3); }
        x.globalAlpha = fade;
        // الاسم بينكشف من اليمين للشمال مع جري النور تحته
        const rv = io(seg(t, .4, .9)); x.save(); x.beginPath(); x.rect(540 + nameW / 2 - nameW * rv - 20, brandY - 170, nameW * rv + 40, 240); x.clip();
        txt(PR.brand, 540, brandY, 150, "PB", "#fff", "center", 820); x.restore();
      }
      x.globalAlpha = 1;
    }

    // ---------- ٢) البحث: الجوال بيطلع والخط يبقى خط خانة البحث ----------
    const phX = 220, phY = 380, phW = 640, phH = 1300, sx0 = phX + 50, sw = phW - 100, sy = phY + 170;
    const phoneIn = io(seg(t, 2.0, 2.5)), zoomOut = io(seg(t, 7.8, 8.4));
    if (t >= 2.0 && t < 8.6) {
      const z = 1 + zoomOut * 2.6, lift = (1 - phoneIn) * 500;
      x.save(); x.translate(540, 1030); x.scale(z, z); x.translate(-540, -1030 + lift); x.globalAlpha = 1 - zoomOut;
      // الجوال: إطار تيتانيوم وشاشة غامقة
      rr(phX - 14, phY - 14, phW + 28, phH + 28, 92); x.fillStyle = "#3a3c40"; x.fill();
      rr(phX, phY, phW, phH, 80); x.fillStyle = "#0f1111"; x.fill();
      rr(phX + phW / 2 - 70, phY + 26, 140, 38, 19); x.fillStyle = "#000"; x.fill();
      if (t < 5.6) {
        // خانة البحث
        rr(sx0, sy, sw, 92, 24); x.fillStyle = "#212426"; x.fill();
        const typed = [...PR.query].slice(0, Math.floor(clamp((t - 2.6) / .8) * [...PR.query].length)).join("");
        x.save(); x.beginPath(); x.rect(sx0 + 20, sy, sw - 40, 92); x.clip();
        txt(typed || "ابحث…", sx0 + sw - 32, sy + 60, 38, "PX", typed ? "#fff" : "rgba(255,255,255,.4)", "right", sw - 80);
        if (t > 2.6 && t < 3.6 && Math.floor(t * 4) % 2 === 0) { x.fillStyle = A; const tw = M.measure(typed, "400 38px PX"); x.fillRect(sx0 + sw - 34 - tw - 6, sy + 24, 3, 46); }
        x.restore();
        // الخط ينزل من تحت الاسم ويقعد خط تركيز للخانة
        const hk = io(seg(t, 2.1, 2.6));
        glowLine([[sx0 + sw, sy + 92], [sx0, sy + 92]], hk, 6);
        // الاقتراحات
        sg.forEach((s, i) => { const k = io(seg(t, 2.9 + i * .12, 3.3 + i * .12)) * (1 - io(seg(t, 3.5, 3.8))); if (k <= 0) return; x.globalAlpha = k * (1 - zoomOut);
          rr(sx0, sy + 120 + i * 88, sw, 76, 18); x.fillStyle = "#181a1b"; x.fill(); txt(s, sx0 + sw - 30, sy + 170 + i * 88, 32, "PX", "rgba(255,255,255,.85)", "right", sw - 60); });
        x.globalAlpha = 1 - zoomOut;
        // النتائج: ٣ كروت بتطلع من الشاشة وبتتفرد
        for (let i = 2; i >= 0; i--) {
          const k = springO(clamp((t - 3.6 - i * .12) / .8), 11, .62); if (k <= 0) continue;
          const cw = 420, ch = 520, fan = [0, -1, 1][i], cx = 540 + fan * 150 * k, cy = 1150 + Math.abs(fan) * 50 * k + (1 - k) * 300, rot = fan * .12 * k;
          x.save(); x.translate(cx, cy); x.rotate(rot); x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = 40; rr(-cw / 2, -ch / 2, cw, ch, 30); x.fillStyle = "#212426"; x.fill(); x.shadowBlur = 0;
          img(C.imgs[i], -cw / 2 + 24, -ch / 2 + 24, cw - 48, cw - 48, 20);
          txt(i === 0 ? PR.product : sg[i], cw / 2 - 30, ch / 2 - 88, 32, "PB", "#fff", "right", cw - 60);
          x.fillStyle = "#f5b301"; x.font = "28px PX"; x.textAlign = "right"; x.fillText("★★★★★", cw / 2 - 30, ch / 2 - 40);
          if (i === 0) { const tk = io(seg(t, 4.6, 5.3)); glowLine([[cw / 2, -ch / 2 + 30], [cw / 2, ch / 2 - 30], [cw / 2 - 30, ch / 2], [-cw / 2 + 30, ch / 2], [-cw / 2, ch / 2 - 30], [-cw / 2, -ch / 2 + 30], [-cw / 2 + 30, -ch / 2], [cw / 2 - 30, -ch / 2], [cw / 2, -ch / 2 + 30]], tk, 6); }
          x.restore();
        }
      } else {
        // ---------- ٣) صفحة المنتج وزر الطلب ----------
        const pk = io(seg(t, 5.6, 6.0)); x.globalAlpha = pk * (1 - zoomOut);
        img(C.imgs[0], sx0, phY + 120, sw, sw * .85, 28);
        const by = phY + 120 + sw * .85 + 40;
        txt(PR.product, sx0 + sw, by + 50, 46, "PB", "#fff", "right", sw);
        x.fillStyle = "#f5b301"; x.font = "32px PX"; x.textAlign = "right"; x.fillText("★★★★★", sx0 + sw, by + 104);
        txt(PR.price, sx0 + sw, by + 190, 64, "PB", "#fff", "right", sw);
        txt(PR.perk, sx0 + sw, by + 245, 32, "PX", "#7fd18b", "right", sw);
        const bY = by + 300, bH = 110;
        rr(sx0, bY, sw, bH, 55); x.fillStyle = "#2a2d30"; x.fill();
        const fk = io(seg(t, 6.2, 6.8));   // الخط بيملأ الزرار، وراسه المنوّر حافة الملء
        if (fk > 0) { x.save(); rr(sx0, bY, sw, bH, 55); x.clip(); x.fillStyle = A; x.fillRect(sx0 + sw * (1 - fk), bY, sw * fk, bH); x.restore(); glowLine([[sx0 + sw, bY + bH], [sx0, bY + bH]], fk, 6); }
        txt(PR.button, 540, bY + 72, 44, "PB", fk > .5 ? "#111" : "#fff", "center", sw - 60);
        // الضغطة
        const tp = seg(t, 6.85, 7.3); if (tp > 0 && tp < 1) { x.strokeStyle = "#fff"; x.lineWidth = 4; x.globalAlpha = (1 - tp) * (1 - zoomOut); x.beginPath(); x.arc(540, bY + bH / 2, 30 + 180 * tp, 0, Math.PI * 2); x.stroke(); }
        const dn = io(seg(t, 7.0, 7.3)); if (dn > 0) { x.globalAlpha = dn * (1 - zoomOut); rr(sx0, bY + 150, sw, 90, 22); x.fillStyle = "#1d3b24"; x.fill(); txt("✓ " + PR.done, 540, bY + 210, 36, "PB", "#9be3a8", "center", sw - 40); }
        // الخط بيطلع من الزرار وينزل لتحت (الكاميرا هتعدّي جوه الشاشة)
        const out = io(seg(t, 7.5, 8.2)); if (out > 0) { x.globalAlpha = 1; glowLine([[540, bY + bH], [540, bY + bH + 700]], out, 10, 0, Math.max(0, out - .45)); }
      }
      x.restore(); x.globalAlpha = 1;
    }

    // ---------- ٤) الطريق: مدينة بالليل من فوق، والخط بيرسم طريق التوصيل للبيت ----------
    if (t >= 8.2 && t < 12.0) {
      const a = io(seg(t, 8.2, 8.7)) * (1 - io(seg(t, 11.4, 12.0)));
      x.save(); x.globalAlpha = a;
      const tilt = io(seg(t, 8.3, 9.4)), sc = lerp(1.6, 1, tilt);
      x.translate(540, 1000); x.scale(sc, sc * lerp(1, .82, tilt)); x.translate(-540, -1000);
      const bs = 150, gap = 54;   // البلوكات
      for (let r = -2; r < 10; r++) for (let c = -1; c < 7; c++) {
        const bx = 40 + c * (bs + gap) - 60, byy = 260 + r * (bs + gap), hgt = 10 + ((r * 7 + c * 13) % 5) * 9 * tilt;
        x.fillStyle = "#121418"; x.fillRect(bx + hgt * .5, byy - hgt, bs, bs);
        x.fillStyle = "#1b1e24"; x.fillRect(bx, byy, bs, bs);
        for (let w2 = 0; w2 < 3; w2++) if ((r * 3 + c * 5 + w2) % 4 === 0) { x.fillStyle = "#e8c76a55"; x.fillRect(bx + 20 + w2 * 42, byy + 30 + (w2 % 2) * 50, 16, 10); }
      }
      // الطريق في الشوارع (بين البلوكات)، والراس بيوصل للبيت
      const street = (c) => 40 + c * (bs + gap) - 60 - gap / 2, avenue = (r) => 260 + r * (bs + gap) - gap / 2;
      const route = [[street(5), avenue(9)], [street(5), avenue(6)], [street(3), avenue(6)], [street(3), avenue(4)], [street(1), avenue(4)], [street(1), avenue(2)]];
      const rk = io(seg(t, 9.0, 10.8)); const head = glowLine(route, rk, 11) || route[0];
      // البيت: دبوس بلون العلامة
      const pin = springO(clamp((t - 10.6) / .5), 12, .55); const [hx, hy] = route[route.length - 1];

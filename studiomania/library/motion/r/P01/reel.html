<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// Product film (the recipe shared by 82 prompts in the file), applied to StudioMania — 40 s, 120 BPM (20 bars of 2 s).
// Research = the real app in this repo: home screen (CREATE → شورت / ريل من قالب · فيديو من تصوير · مسلسل من حلقات · كاروسيل),
// the 5-step project flow (المشاريع · التقطيع · التوليد · المونتاج · النشر), the montage timeline with a typography layer and the
// free-elements track (✨ عناصر), dubbing with 16 Arabic dialects (backend/dub.py), tagline «استوديو المحتوى والفيديو», button «ابدأ مشروع».
// Through-line object: the red ring — the "O" of the STUDIOMANIA logo. It starts as the CREATE icon, becomes the step marker, the
// timeline playhead, the selected dialect chip, the publish button, and finally drops back into the logo.
// Storyboard (beats @ .5 s): 0–2 hook · 2–10 create · 10–18 five steps · 18–28 montage + typography · 28–34 dubbing · 34–40 publish → logo.
const W = 1920, H = 1080, B = .5;
const INK = "#141416", MUTED = "#85858c", LINE = "#e6e6ea", RED = "#e8402f", BG = "#ffffff", SOFT = "#f4f4f6";
const SC = [0, 2, 10, 18, 28, 34, 40];
M.reel({
  W, H, DUR: 40, bg: BG,
  fonts: { RX: "ReadexPro.ttf", JO: "Jost.ttf" },
  init(M) { const c = M.canvas(W, H); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, clamp, expo, expoIO, springO, sine, hash } = M;
    const sp = (s, w = 16) => springO(s, w, .78);   // small overshoot only
    const sc = SC.findIndex((s, i) => t >= s && t < SC[i + 1]), st = t - SC[sc], sd = SC[sc + 1] - SC[sc];
    // camera: never still — each scene pushes 1.0 → 1.04 and the next starts where it ended (zoom carried by ratio)
    const push = 1 + .04 * sine(st / sd);
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = BG; x.fillRect(0, 0, W, H);
    x.translate(W / 2, H / 2); x.scale(push, push); x.translate(-W / 2, -H / 2);
    const FOC = { 1: [1330, 420, 1.42], 2: [1000, 520, 1.22] }[sc];
    if (FOC) { const k = expoIO(seg(st, 0, .6)) * (sc === 1 ? 1 - expoIO(seg(st, 4.1, 4.6)) : 1), zz = lerp(1, FOC[2], k); x.translate(W / 2, H / 2); x.scale(zz, zz); x.translate(-lerp(W / 2, FOC[0], k), -lerp(H / 2, FOC[1], k)); }
    x.direction = "rtl";
    const T = (s, X, Y, px, col = INK, wt = 500, al = "right", fam = "RX", ls = 0) => { x.font = `${wt} ${px}px ${fam}`; x.fillStyle = col; x.textAlign = al; x.textBaseline = "middle"; if (ls) x.letterSpacing = ls + "px"; x.fillText(s, X, Y); if (ls) x.letterSpacing = "0px"; };
    const reveal = (X, Y, w, h, k, fn) => { x.save(); x.beginPath(); x.rect(X, Y, w, h * clamp(k)); x.clip(); fn(); x.restore(); };
    const ring = (X, Y, r, lw = r * .28, col = RED) => { x.strokeStyle = col; x.lineWidth = lw; x.beginPath(); x.arc(X, Y, r, 0, 7); x.stroke(); };
    const cursor = (X, Y, down = 0) => { x.save(); x.translate(X, Y); x.scale(1 - down * .15, 1 - down * .15); x.fillStyle = INK; x.strokeStyle = "#fff"; x.lineWidth = 3; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 44); x.lineTo(11, 33); x.lineTo(20, 52); x.lineTo(28, 48); x.lineTo(19, 30); x.lineTo(34, 30); x.closePath(); x.stroke(); x.fill(); x.restore(); };
    const path = (keys) => { let a = keys[0]; for (const k of keys) if (t >= k[0]) a = k; const i = keys.indexOf(a), b = keys[i + 1] || a; const k = b === a ? 1 : expoIO(seg(t, a[0], b[0])); return [lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; };
    const clickAt = (times) => Math.max(0, ...times.map((c) => (t > c && t < c + .18 ? 1 - (t - c) / .18 : 0)));
    const logo = (X, Y, px, withO) => { x.direction = "ltr"; x.font = `400 ${px}px JO`; x.letterSpacing = px * .38 + "px"; x.fillStyle = INK; x.textAlign = "left"; x.textBaseline = "middle"; const a = "STUDI", b = "MANIA"; const wa = x.measureText(a).width, wo = px * .78; x.fillText(a, X, Y); x.fillText(b, X + wa + wo + px * .2, Y); x.letterSpacing = "0px"; x.direction = "rtl"; return [X + wa + wo / 2 + px * .02, Y]; };
    let R = null;   // the ring's [x, y, r] this frame
    // ================= HOOK (0–2): the problem in big type; the ring rolls in and interrupts it
    if (sc === 0) {
      const words = ["محتوى", "كل", "يوم؟"];
      let X = 1500; x.font = "700 170px RX";
      words.forEach((w, i) => { const k = sp(t - .15 - i * .25); const ww = x.measureText(w).width; x.save(); x.beginPath(); x.rect(0, 380, W, 240); x.clip(); const knocked = i === 2 && t > 1.45; const dy = knocked ? (t - 1.45) ** 2 * 3000 : 0, rot = knocked ? (t - 1.45) * 2 : 0; x.translate(X - ww / 2, 500 + (1 - Math.min(1, k)) * 200 + dy); x.rotate(-rot); T(w, ww / 2, 0, 170, INK, 700); x.restore(); X -= ww + 50; });
      const rx = lerp(2100, 470, expo(seg(t, 1.0, 1.5))), rot = (2100 - rx) / 60;
      R = [rx, 500, 62]; ring(rx, 500, 62); x.save(); x.translate(rx, 500); x.rotate(rot); x.fillStyle = RED; x.fillRect(-4, -62 - 9, 8, 18); x.restore();
    }
    // ================= CREATE (2–10): the real home column: CREATE / اعمل جديد → four ways to start
    if (sc === 1) {
      const panelX = 1700;
      const k0 = sp(st, 14);
      // the logo (its O is missing — the ring is out working)
      logo(80, 70, 40, false);
      T("CREATE", panelX - 80, 190, 26, RED, 500, "right", "RX", 8);
      T("اعمل جديد", panelX - 80, 238, 54, INK, 600);
      reveal(0, 270, W, 40, expo(seg(st, .3, .7)), () => T("اختار نوع الشغل وكمّل خطوة خطوة.", panelX - 80, 288, 26, MUTED, 300));
      // the ring flies from the hook into the CREATE icon slot
      const ic = [panelX + 10, 214], from = [470, 500];
      const fk = expoIO(seg(st, 0, .5)); R = [lerp(from[0], ic[0], fk), lerp(from[1], ic[1], fk), lerp(62, 34, fk)];
      // the four options unfold one per beat after the click
      const OPTS = [["شورت / ريل من قالب", "REEL"], ["فيديو من تصوير", "FROM FOOTAGE"], ["مسلسل من حلقات", "SERIES"], ["كاروسيل", "CAROUSEL"]];
      const clk = 1.0;
      OPTS.forEach(([ar, en], i) => { const tk = clk + .3 + i * B, k = expo(seg(st, tk, tk + .35)); if (k <= 0) return; const y = 400 + i * 120; reveal(800, y - 50, 1100, 100, k, () => { x.fillStyle = i === 0 && st > 3.2 ? SOFT : BG; x.fillRect(900, y - 46, 900, 92); T(ar, panelX - 80, y, 42, INK, 500); x.direction = "ltr"; T(en, 940, y, 22, MUTED, 400, "left", "RX", 6); x.direction = "rtl"; x.strokeStyle = LINE; x.lineWidth = 2; x.beginPath(); x.moveTo(900, y + 46); x.lineTo(1800, y + 46); x.stroke(); }); });
      // the ring becomes the chosen row's marker, then the key idea lands
      if (st > 3.6) { const k = expoIO(seg(st, 3.6, 4.1)); R = [lerp(ic[0], panelX + 10, k), lerp(ic[1], 400, k), 34]; }
      const cur = path([[0, 1100, 900], [.7, ic[0] - 10, ic[1] + 10], [2.4, 1500, 420], [3.1, 1500, 410]]);
      cursor(cur[0], cur[1], clickAt([SC[1] + clk, SC[1] + 3.2]));
      if (st > 4.4) { const k = sp(st - 4.4); x.save(); x.beginPath(); x.rect(0, 0, 860, H); x.clip(); T("ابدأ من", 780, 560 + (1 - Math.min(1, k)) * 120, 110, INK, 700); T("قالب.", 780, 700 + (1 - Math.min(1, sp(st - 4.65))) * 140, 130, RED, 700); x.restore(); }
    }
    // ================= FIVE STEPS (10–18): the ring is the active step; it steps forward on the beat, the cursor clicks each
    if (sc === 2) {
      const STEPS = ["المشاريع", "التقطيع", "التوليد", "المونتاج", "النشر"];
      const sx = (i) => 1640 - i * 330, y = 430;
      x.strokeStyle = LINE; x.lineWidth = 4; x.beginPath(); x.moveTo(sx(0), y); x.lineTo(sx(0) - (sx(0) - sx(4)) * expo(seg(st, 0, .6)), y); x.stroke();
      const active = clamp(Math.floor((st - .6) / 1.2), 0, 4), mk = expoIO(seg((st - .6) % 1.2, 0, .35));
      STEPS.forEach((s, i) => { const k = sp(st - .1 - i * .12); if (k <= 0) return; x.fillStyle = BG; x.beginPath(); x.arc(sx(i), y, 30 * Math.min(1, k), 0, 7); x.fill(); x.strokeStyle = i <= active ? INK : LINE; x.lineWidth = 4; x.stroke(); T(String(i + 1), sx(i), y + 2, 26, i <= active ? INK : MUTED, 600, "center"); T(s, sx(i), y + 80, 36, i === active ? INK : MUTED, i === active ? 600 : 400, "center"); });
      const from = st < .6 ? null : active === 0 ? [sx(0), y] : [lerp(sx(active - 1), sx(active), mk), y];
      R = st < .6 ? [lerp(1710, sx(0), expoIO(seg(st, 0, .6))), lerp(400, y, expoIO(seg(st, 0, .6))), lerp(34, 44, expoIO(seg(st, 0, .6)))] : [from[0], from[1], 44];
      // a small vector picture of each step, revealed under the active step
      const pic = (i, X, Y) => { x.strokeStyle = INK; x.fillStyle = INK; x.lineWidth = 4;
        if (i === 0) for (let k = 0; k < 6; k++) { x.strokeRect(X - 90 + (k % 3) * 64, Y + Math.floor(k / 3) * 54, 52, 40); }
        if (i === 1) { for (let k = 0; k < 5; k++) x.strokeRect(X - 120 + k * 50, Y + 20, 44, 50); x.strokeStyle = RED; x.beginPath(); x.moveTo(X + 3, Y); x.lineTo(X + 3, Y + 100); x.stroke(); }
        if (i === 2) { x.strokeRect(X - 90, Y, 180, 110); for (let k = 0; k < 6; k++) { const kk = clamp((st - .6 - 2.4) * 3 - k * .3); x.fillStyle = k % 2 ? "#d9d9de" : "#b9b9c0"; x.fillRect(X - 80 + (k % 3) * 56, Y + 10 + Math.floor(k / 3) * 48, 48 * kk, 40); } }
        if (i === 3) { for (let k = 0; k < 3; k++) { x.strokeRect(X - 120, Y + k * 38, 240, 28); } x.fillStyle = RED; x.fillRect(X + 20, Y - 6, 4, 120); }
        if (i === 4) { x.beginPath(); x.moveTo(X - 70, Y + 60); x.lineTo(X + 80, Y); x.lineTo(X + 20, Y + 110); x.lineTo(X, Y + 70); x.closePath(); x.stroke(); } };
      reveal(0, 560, W, 200, expo(seg((st - .6) % 1.2, .05, .4)), () => pic(active, sx(active), 580));
      const cur = path([[0, 1300, 900], [.5, sx(0) - 10, y + 40], [1.8, sx(1) - 10, y + 40], [3.0, sx(2) - 10, y + 40], [4.2, sx(3) - 10, y + 40], [5.4, sx(4) - 10, y + 40]]);
      cursor(cur[0], cur[1], clickAt([10.6, 11.8, 13.0, 14.2, 15.4].map((c) => c)));
      if (st > 6.5) { const k = sp(st - 6.5); T("خطوة بخطوة.", W / 2, 860 + (1 - Math.min(1, k)) * 80, 96, INK, 700, "center"); }
    }
    // ================= MONTAGE (18–28): the ring is the playhead; typography plays in the preview as it passes
    if (sc === 3) {
      const k0 = expoIO(seg(st, 0, .6));
      // preview (top)
      const PV = [560, 70, 800, 450];
      x.fillStyle = "#101014"; x.fillRect(PV[0], PV[1], PV[2], PV[3] * k0);
      // timeline (bottom): ruler, tracks
      const TL = [180, 600, 1560], TR = [["الفيديو", "#c9c9d1"], ["✨ عناصر", "#e9e3f7"], ["التايبوجرافي", "#fde3dc"], ["الموسيقى", "#dfeee7"]];
      TR.forEach(([name, col], i) => { const y = 640 + i * 78, k = expo(seg(st, .3 + i * .12, .7 + i * .12)); reveal(0, y - 4, W, 72, k, () => { T(name, TL[0] + TL[2] + 10 + 150, y + 32, 26, MUTED, 400); x.fillStyle = SOFT; x.fillRect(TL[0], y, TL[2], 64); for (let c = 0; c < 6; c++) { const cx = TL[0] + 20 + c * 260 + (i * 70) % 130, cw = i === 3 ? TL[2] - 40 : 200 + (c % 2) * 30; if (i === 3 && c > 0) break; if (i === 1 && c % 2) continue; x.fillStyle = col; x.fillRect(cx, y + 8, cw, 48); if (i === 3) { x.fillStyle = "#9fcbb5"; for (let w = 0; w < cw; w += 8) { const a = Math.abs(Math.sin(w * .07)) * 18 + 4; x.fillRect(cx + w, y + 32 - a, 4, a * 2); } } } }); });
      // the typography block being dragged to a new time
      const drag = expoIO(seg(st, 4.6, 5.6)), bx = lerp(TL[0] + 820, TL[0] + 300, drag), by = 640 + 2 * 78;
      x.fillStyle = RED; x.globalAlpha = .9; x.fillRect(bx, by + 8, 300, 48); x.globalAlpha = 1; T("اكتب… واتحرك", bx + 290, by + 32, 24, "#fff", 600);
      // playhead = the ring, sliding along the ruler; the preview text animates while it's inside the block
      const ph = TL[0] + TL[2] - (TL[2] - 40) * clamp((st - .8) / 3.6) * (st < 5.6 ? 1 : 0) - (st >= 5.6 ? (TL[2] - 40) * clamp((st - 5.6) / 3.2) : 0);
      const phx = TL[0] + TL[2] - (ph - TL[0]) + TL[0];   // RTL: time runs right → left
      const playX = st < 5.6 ? lerp(TL[0] + TL[2] - 20, TL[0] + 20, clamp((st - .8) / 3.6)) : lerp(TL[0] + TL[2] - 20, TL[0] + 20, clamp((st - 5.6) / 3.6));
      x.strokeStyle = RED; x.lineWidth = 3; x.beginPath(); x.moveTo(playX, 610); x.lineTo(playX, 960); x.stroke();
      R = st < .6 ? [lerp(W / 2, playX, k0), lerp(860, 600, k0), lerp(44, 22, k0)] : [playX, 600, 22];
      const inBlock = playX < bx + 300 && playX > bx;
      if (k0 > .9) { const u = inBlock ? (bx + 300 - playX) / 300 : playX < bx ? 1 : 0; x.save(); x.beginPath(); x.rect(PV[0], PV[1], PV[2], PV[3]); x.clip(); const words = ["اكتب…", "واتحرك"]; words.forEach((w, i) => { const kk = clamp(u * 2.2 - i * .9); if (kk <= 0) return; T(w, PV[0] + PV[2] / 2, PV[1] + 170 + i * 130 + (1 - expo(kk)) * 80, 100, i ? RED : "#fff", 700, "center"); }); x.restore(); }
      const cur = st < 4.4 ? path([[0, 1500, 980], [.6, TL[0] + TL[2] - 20, 610]]) : st < 5.6 ? [lerp(TL[0] + 820 + 150, TL[0] + 450, drag), by + 30] : [playX + 6, 610];
      if (st < 4.4 && st > .8) { cur[0] = playX + 6; cur[1] = 612; }
      cursor(cur[0], cur[1], clickAt([18.8, 22.6]));
      if (st > 7.6) { const k = sp(st - 7.6); x.save(); x.beginPath(); x.rect(0, 0, 540, 560); x.clip(); T("تايبوجرافي", 520, 260 + (1 - Math.min(1, k)) * 100, 72, INK, 700); T("بتتحرك.", 520, 360 + (1 - Math.min(1, sp(st - 7.85))) * 100, 86, RED, 700); x.restore(); }
    }
    // ================= DUBBING (28–34): the ring becomes the selected dialect chip
    if (sc === 4) {
      const D = ["مصري", "سعودي نجدي", "سعودي حجازي", "خليجي عام", "إماراتي", "كويتي", "قطري", "بحريني", "عماني", "شامي", "عراقي", "سوداني", "مغربي", "جزائري", "تونسي", "فصحى"];
      const cols = 4;
      D.forEach((d, i) => { const k = sp(st - .1 - i * .05); if (k <= 0) return; const cx = 1560 - (i % cols) * 300, cy = 260 + Math.floor(i / cols) * 110, sel = i === 0; x.save(); x.translate(cx, cy); x.scale(Math.min(1, k), Math.min(1, k)); x.fillStyle = sel && st > 1.6 ? INK : SOFT; x.beginPath(); x.roundRect(-130, -38, 260, 76, 38); x.fill(); T(d, 0, 2, 32, sel && st > 1.6 ? "#fff" : INK, 500, "center"); x.restore(); });
      R = [lerp(560, 1560 + 96, expoIO(seg(st, 0, .5))), lerp(600, 260, expoIO(seg(st, 0, .5))), 16];
      // the voice: a waveform the ring "speaks" into
      if (st > 2.0) { const k = expo(seg(st, 2.0, 2.6)); x.fillStyle = INK; for (let i = 0; i < 90; i++) { const a = (Math.abs(Math.sin(i * .37 + t * 6)) * .7 + .3) * 70 * k * Math.abs(Math.sin(i * .11)); x.fillRect(1500 - i * 12, 780 - a, 6, a * 2); } }
      const cur = path([[0, 1300, 900], [.9, 1560, 270], [2.4, 1580, 300]]); cursor(cur[0], cur[1], clickAt([29.5]));
      if (st > 3.0) { const k = sp(st - 3.0); T("١٦ لهجة عربية.", W / 2, 960 + (1 - Math.min(1, k)) * 80, 84, INK, 700, "center"); }
    }
    // ================= PUBLISH → LOGO (34–40): the biggest beat is the publish click; the ring drops into the logo's O
    if (sc === 5) {
      const pk = expoIO(seg(st, 0, .5));
      // the publish button (the ring inside it)
      const bx = W / 2, by = 520;
      if (st < 2.4) { const press = clickAt([36.0]); x.save(); x.translate(bx, by); x.scale(1 - press * .06, 1 - press * .06); x.fillStyle = INK; x.beginPath(); x.roundRect(-260, -70, 520, 140, 70); x.fill(); T("النشر", 60, 4, 56, "#fff", 600); x.restore(); }
      const lo = expoIO(seg(st, 2.2, 3.4));
      const O = (() => { x.save(); x.globalAlpha = 0; const o = logo(W / 2 - 520, 470, 110, true); x.restore(); return o; })();
      if (st >= 2.2) logo(W / 2 - 520, 470, 110, true);
      R = st < 2.2 ? [bx - 150, by, 30] : [lerp(bx - 150, O[0], lo), lerp(by, O[1], lo), lerp(30, 42, lo)];
      const cur = path([[0, 1400, 900], [1.4, bx - 120, by + 20], [2.6, bx + 300, 900]]); cursor(cur[0], cur[1], clickAt([36.0]));
      if (st > 3.4) { reveal(0, 600, W, 80, expo(seg(st, 3.4, 3.9)), () => T("استوديو المحتوى والفيديو", W / 2, 640, 48, INK, 400, "center")); }
      if (st > 4.0) { const k = sp(st - 4.0); x.save(); x.translate(W / 2, 780); x.scale(Math.min(1, k), Math.min(1, k)); x.fillStyle = RED; x.beginPath(); x.roundRect(-170, -42, 340, 84, 42); x.fill(); T("ابدأ مشروع", 0, 3, 38, "#fff", 600, "center"); x.restore(); }
    }
    // ---------- the through-line object, drawn last
    if (R && sc > 0) ring(R[0], R[1], R[2]);
  },
  sound(A) {
    const m = A.midi;
    for (let b = 0; b < 80; b++) { const t0 = b * B; A.kick(t0, b % 4 === 0 ? .8 : .5); A.hat(t0 + B / 2, .05); if (b % 4 === 2) A.clap(t0, .12); }
    [2, 10, 18, 28, 34].forEach((t0) => { A.hit(t0, .35); A.whoosh(t0 - .35, .4, .14); });
    const chords = [[48, 55, 64], [45, 52, 60], [41, 48, 57], [43, 50, 59]];
    for (let bar = 0; bar < 20; bar++) A.pad(bar * 2, chords[bar % 4].map(m), 2, .025);
    [3.0, 5.2, 10.6, 11.8, 13.0, 14.2, 15.4, 18.8, 22.6, 29.5, 36.0].forEach((t0) => { A.click(t0, .18); A.tone(t0, 1400, .04, "sine", .04); });
    [3.3, 3.8, 4.3, 4.8].forEach((t0, i) => A.pluck(t0, m(72 + i * 2), .08, .3));
    A.riser(34.5, 36.0, .2); A.hit(36.0, .7); [48, 55, 60, 64, 67].forEach((n) => A.tone(36.0, m(n), 3.6, "sine", .05));
  },
});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #55 (عنصر: بروفايل في ١٥ ثانية) Showreel as a job application — concept: "A CV that animates itself" (a blinking cursor writes every scene).
// 15 s, 120 BPM. Palette: ink, white, lime, cobalt. One typeface (Space Grotesk).
// 0–2 hook: the cursor types "HIRE ME?" · 2–4 kinetic type · 4–6 the cursor morphs through skill marks · 6–8 skill cards in a 3D ring
// 8–10 a skills radar draws itself · 10–12 a project timeline · 12–14 strongest: every skill clicks into a grid, stamp "HIRED"
// 14–15 end title → back to the lone cursor.
const G1 = "١ · السؤال والجملة", G2 = "٢ · المهارات والرقم", G3 = "٣ · الشغل", G4 = "٤ · الختم والاسم", GC = "الألوان";
const PR = M.params({
  hook: { label: "السؤال في البداية", kind: "text", def: "HIRE ME?", group: G1, max: 10, hint: "يكتبه المؤشر في البداية." },
  line: { label: "جملة من ٤ كلمات", kind: "text", def: "I MAKE THINGS MOVE", group: G1, max: 24, hint: "٤ كلمات بالضبط تتحرك." },
  skills: { label: "المهارات أو المميزات (٦، كل واحدة في سطر)", kind: "lines", def: ["TYPE", "3D", "CODE", "SOUND", "UI", "EDIT"], group: G2, max: 14, hint: "٦ مهارات أو مميزات: تدور في دائرة ثلاثية الأبعاد." },
  stat: { label: "الرقم الكبير", kind: "text", def: "85%", group: G2, max: 6 },
  statLabel: { label: "تحت الرقم", kind: "text", def: "average across six skills", group: G2, max: 20 },
  projects: { label: "الأعمال أو الإنجازات (٤)", kind: "lines", def: ["Brand film", "App launch", "Title seq.", "Data story"], group: G3, max: 20, hint: "٤ أعمال أو إنجازات على خط زمني." },
  range: { label: "الفترة", kind: "text", def: "2019 — 2026", group: G3, max: 14 },
  tags: { label: "كلمات الشبكة (حتى ١٢)", kind: "lines", def: ["TYPE", "3D", "CODE", "SOUND", "UI", "EDIT", "DESIGN", "MOTION", "STORY", "COLOR", "RIG", "FX"], group: G4, max: 12, hint: "حتى ١٢ كلمة تُرصّ في شبكة." },
  stamp: { label: "الختم", kind: "text", def: "HIRED.", group: G4, max: 8 },
  name: { label: "الاسم في النهاية", kind: "text", role: "brand", def: "Your Name", group: G4, max: 18 },
  role: { label: "تحت الاسم", kind: "text", role: "tagline", def: "motion designer · available now", group: G4, max: 26 },
  ink: { label: "الخلفية الغامقة", kind: "color", role: "dark", def: "#0f0f12", group: GC },
  lime: { label: "اللون المميز", kind: "color", role: "accent", def: "#c6ff3d", group: GC },
  cob: { label: "اللون الثاني", kind: "color", role: "accent2", def: "#3d5afe", group: GC },
});
M.meta({
  story: "تعريف شخصي في ١٥ ثانية: «سيرة ذاتية تتحرك وحدها». مؤشر يكتب كل مشهد: السؤال، وجملة متحركة، وعلامات المهارات، وبطاقات في دائرة ثلاثية الأبعاد، ورادار المهارات، وخط زمني للعمل، وشبكة وختم، ثم الاسم.",
  scenes: [{ name: G1, t0: 0, t1: 4, about: "السؤال والجملة" }, { name: G2, t0: 4, t1: 10, about: "المهارات والرادار والرقم" }, { name: G3, t0: 10, t1: 12, about: "الخط الزمني للشغل" }, { name: G4, t0: 12, t1: 15, about: "الشبكة والختم والاسم" }],
  tips: ["مناسب للعاملين المستقلين والتقديم على الوظائف وتعريف الفرق.", "كل مهارة كلمة أو كلمتان.", "الختم كلمة واحدة قوية."],
});
const B = .5, INK = PR.ink, WHITE = "#f7f7f5", LIME = PR.lime, COB = PR.cob;
const SK = Array.from({ length: 6 }, (_, i) => PR.skills[i] || PR.skills[i % Math.max(1, PR.skills.length)] || "");
const WORDS = String(PR.line).trim().split(/\s+/);
const LW4 = WORDS.length <= 4 ? WORDS : [WORDS.slice(0, WORDS.length - 3).join(" "), ...WORDS.slice(-3)];
const F = (px) => `500 ${px}px SG`;
M.reel({
  W: 1920, H: 1080, DUR: 15, bg: INK,
  fonts: { SG: ["space500.ttf", "500"] },
  init(M) { const c = M.canvas(1920, 1080); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, expo, expoIn, expoIO, spring, clamp } = M;
    const beat = Math.floor(t / B), bt = t - beat * B, pulse = 1 - spring(bt, 16);
    const light = t >= 8 && t < 12;
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = light ? WHITE : INK; x.fillRect(0, 0, 1920, 1080);
    const fg = light ? INK : WHITE;
    const z = 1 + .03 * ((t % 2) / 2); x.translate(960, 540); x.scale(z, z); x.translate(-960, -540);
    const T = (s, px, X, Y, col, al = "center", maxW = 1800) => { s = String(s ?? ""); px = M.fit(s, "SG", maxW, px, 14, "500"); x.font = F(px); x.fillStyle = col; x.direction = M.isAr(s) ? "rtl" : "ltr"; x.textAlign = al === "left" && M.isAr(s) ? "right" : al; x.textBaseline = "middle"; x.fillText(s, X, Y); x.direction = "ltr"; };
    const cursor = (X, Y, h, col) => { if (Math.floor(t * 2.5) % 2 === 0 || t > 1.9 && t < 14) { x.fillStyle = col; x.fillRect(X, Y - h / 2, h * .12, h); } };
    // ---------- 0–2 hook: typed, one character every ~0.12 s, landing on the beats
    if (t < 2.1) {
      const s = String(PR.hook), ar = M.isAr(s), n = Math.floor(clamp((t - .3) / (1.4 / Math.max(1, s.length)), 0, s.length)), fs = M.fit(s, "SG", 1700, 220, 60, "500");
      x.font = F(fs); const w = x.measureText(s.slice(0, n)).width, full = x.measureText(s).width;
      if (ar) { T(s.slice(0, n), fs, 960 + full / 2, 540, WHITE, "left"); cursor(960 + full / 2 - w - 10 - fs * .12, 540, fs * .9, LIME); }
      else { T(s.slice(0, n), fs, 960 - full / 2, 540, WHITE, "left"); cursor(960 - full / 2 + w + 10, 540, fs * .9, LIME); }
    }
    // ---------- 2–4 kinetic type: "I MAKE THINGS MOVE" — each word does what it says
    if (t >= 2 && t < 4.2) {
      const k = (i) => expo(seg(t, 2 + i * B, 2.3 + i * B));
      // أول ٣ كلمات على سطر واحد (كل كلمة بتدخل بطريقة)، والرابعة كبيرة بتتحرك
      const top = LW4.slice(0, -1), last = LW4[LW4.length - 1] || "", ar = M.isAr(PR.line);
      const fs = M.fit(top.join("   "), "SG", 1500, 150, 40, "500"); x.font = F(fs);
      const ws = top.map((w) => x.measureText(w).width), gap = fs * .5, tot = ws.reduce((a, b) => a + b, 0) + gap * Math.max(0, top.length - 1);
      let cx0 = 960 - tot / 2;
      const cxs = ws.map((w) => { const c = cx0 + w / 2; cx0 += w + gap; return c; });
      if (ar) cxs.reverse();
      top.forEach((w, i) => {
        const X = cxs[i], kk = k(i);
        if (i % 3 === 0) T(w, fs, X, 400 + (1 - kk) * 200, WHITE);
        else if (i % 3 === 1) { T(w, fs, X, 400, kk > 0 ? WHITE : "transparent"); if (kk > 0) { x.fillStyle = INK; x.fillRect(X - ws[i] / 2 - 10, 330, (ws[i] + 20) * (1 - kk), 140); } }
        else { x.save(); x.translate(X, 400); x.rotate((1 - kk) * -1.2); x.scale(kk, kk); T(w, fs, 0, 0, WHITE); x.restore(); }
      });
      const mv = k(top.length); T(last, 260, lerp(ar ? 2320 : -400, 960, mv) + Math.sin(t * 8) * 6 * mv, 680, LIME, "center", 1700);
    }
    // ---------- 4–6 morph: the cursor bar becomes a pen nib → a play triangle → a cube outline → a circle
    if (t >= 4 && t < 6.3) {
      const N = 120, cx = 960, cy = 540;
      const poly = (pts) => { const out = [], L = []; let tot = 0; pts.forEach((a, i) => { const b = pts[(i + 1) % pts.length], d = Math.hypot(b[0] - a[0], b[1] - a[1]); L.push(d); tot += d; }); for (let k = 0; k < N; k++) { let d = k / N * tot, i = 0; while (d > L[i]) { d -= L[i]; i++; } const a = pts[i], b = pts[(i + 1) % pts.length], f = d / L[i]; out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); } return out; };
      const S = [poly([[-12, -200], [12, -200], [12, 200], [-12, 200]]), poly([[0, -220], [140, 40], [0, 220], [-140, 40]]), poly([[-130, -180], [180, 0], [-130, 180]]), poly([[0, -200], [180, -100], [180, 100], [0, 200], [-180, 100], [-180, -100]]), Array.from({ length: N }, (_, i) => [Math.cos(i / N * 6.283 - 1.57) * 190, Math.sin(i / N * 6.283 - 1.57) * 190])];
      const names = ["", SK[0], SK[1], SK[2], SK[3]];
      const k = clamp(Math.floor((t - 4) / B), 0, 3), m = expoIO(seg(t, 4 + k * B + .05, 4 + k * B + .4));
      x.beginPath(); S[k].forEach((p, i) => { const q = S[k + 1][i]; const X = cx + lerp(p[0], q[0], m), Y = cy + lerp(p[1], q[1], m); i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.closePath();
      x.fillStyle = k % 2 ? COB : LIME; x.fill();
      T(names[m > .5 ? k + 1 : k], 54, cx, 860, WHITE);
    }
    // ---------- 6–8 2D→3D: skill cards on a ring that turns one card per beat
    if (t >= 6 && t < 8.2) {
      const cards = SK, n = cards.length;
      const turn = (Math.floor((t - 6) / B) + expoIO(seg(bt, 0, .35))) / n * Math.PI * 2, into = expo(seg(t, 6, 6.4));
      const items = cards.map((c, i) => { const a = i / n * Math.PI * 2 - turn; return { c, i, X: Math.sin(a) * 560 * into, Z: Math.cos(a) }; }).sort((a, b) => a.Z - b.Z);
      items.forEach((o) => { const s = .55 + .45 * (o.Z + 1) / 2, w = 340 * s, h = 440 * s; x.save(); x.translate(960 + o.X, 540); x.transform(Math.max(.15, Math.abs(Math.cos(Math.asin(clamp(o.X / 600, -1, 1))))), 0, 0, 1, 0, 0); x.fillStyle = o.Z > .9 ? LIME : o.i % 2 ? COB : "#24242b"; x.beginPath(); x.roundRect(-w / 2, -h / 2, w, h, 24 * s); x.fill(); T(o.c, 70 * s, 0, 0, o.Z > .9 ? INK : WHITE, "center", w - 30); x.restore(); });
    }
    // ---------- 8–10 data: a radar of skills, one axis per beat
    if (t >= 8 && t < 10.2) {
      const ax = SK, v = [.95, .8, .85, .7, .9, .88], cx = 760, cy = 560, R = 330;
      x.strokeStyle = "rgba(15,15,18,.15)"; x.lineWidth = 2;
      for (let r = 1; r <= 4; r++) { x.beginPath(); ax.forEach((_, i) => { const a = i / 6 * 6.283 - 1.57; const X = cx + Math.cos(a) * R * r / 4, Y = cy + Math.sin(a) * R * r / 4; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.closePath(); x.stroke(); }
      x.beginPath(); ax.forEach((_, i) => { const g = expo(seg(t, 8.1 + i * .25, 8.4 + i * .25)); const a = i / 6 * 6.283 - 1.57; const X = cx + Math.cos(a) * R * v[i] * g, Y = cy + Math.sin(a) * R * v[i] * g; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.closePath();
      x.fillStyle = "rgba(61,90,254,.25)"; x.fill(); x.strokeStyle = COB; x.lineWidth = 6; x.stroke();
      ax.forEach((a2, i) => { const a = i / 6 * 6.283 - 1.57; T(a2, 32, cx + Math.cos(a) * (R + 60), cy + Math.sin(a) * (R + 50), INK, "center", 260); });
      const sv = parseFloat(String(PR.stat).replace(/[^0-9.]/g, "")), sk = expo(seg(t, 8.2, 9.6));
      T(isFinite(sv) ? String(PR.stat).replace(/[0-9.]+/, String(Math.round(sv * sk))) : PR.stat, 180, 1450, 480, INK, "center", 800); T(PR.statLabel, 34, 1450, 600, "#6b6b73", "center", 800);
    }
    // ---------- 10–12 UI: a project timeline scrubs; each beat a project chip snaps on
    if (t >= 10 && t < 12.2) {
      const proj = PR.projects.slice(0, 4);
      x.fillStyle = "#e6e6e3"; x.fillRect(260, 640, 1400, 12);
      const ph = seg(t, 10, 12); x.fillStyle = COB; x.fillRect(260, 640, 1400 * ph, 12);
      x.fillStyle = INK; x.fillRect(260 + 1400 * ph - 3, 560, 6, 170);
      proj.forEach((p, i) => { const g = expo(seg(t, 10 + i * B, 10.3 + i * B)); if (g <= 0) return; const X = 260 + i * 360; x.fillStyle = i % 2 ? COB : INK; x.beginPath(); x.roundRect(X, 440 + (1 - g) * 40, 320, 100, 20); x.fill(); T(p, 36, X + 160, 490 + (1 - g) * 40, WHITE, "center", 290); });
      T(PR.range, 34, 960, 800, "#6b6b73");
    }
    // ---------- 12–14 strongest: every skill clicks into a grid on the beat; a big stamp lands on the downbeat
    if (t >= 12 && t < 14.2) {
      const tags = PR.tags.slice(0, 12);
      tags.forEach((g, i) => { const k = expo(seg(t, 12 + i * .12, 12.25 + i * .12)); const c = i % 4, r = Math.floor(i / 4); const X = 330 + c * 420, Y = 300 + r * 240; x.save(); x.translate(X, Y); x.scale(k * (1 + .05 * pulse), k * (1 + .05 * pulse)); x.fillStyle = (i + beat) % 3 === 0 ? LIME : (i + beat) % 3 === 1 ? COB : "#24242b"; x.beginPath(); x.roundRect(-180, -90, 360, 180, 30); x.fill(); T(g, 56, 0, 0, (i + beat) % 3 === 0 ? INK : WHITE, "center", 320); x.restore(); });
      const st = spring(t - 13, 20);
      if (t > 13) { x.save(); x.translate(960, 540); x.rotate(-.12); x.scale(lerp(2.2, 1, st), lerp(2.2, 1, st)); x.fillStyle = INK; x.fillRect(-420, -130, 840, 260); x.strokeStyle = LIME; x.lineWidth = 18; x.strokeRect(-420, -130, 840, 260); T(PR.stamp, 200, 0, 0, LIME, "center", 780); x.restore(); }
    }
    // ---------- 14–15 end title → the lone cursor
    if (t >= 14) {
      const a = expo(seg(t, 14, 14.25)), o = expoIn(seg(t, 14.55, 14.85));
      x.globalAlpha = a * (1 - o); T(PR.name, 150, 960, 480, WHITE, "center", 1700); T(PR.role, 44, 960, 620, LIME, "center", 1700); x.globalAlpha = 1;
      if (t > 14.85) cursor(960, 540, 200, LIME);
    }
  },
  sound(A) {
    const m = A.midi;
    for (let k = 0; k < 30; k++) { const t0 = k * B; A.kick(t0, .8); A.hat(t0 + B / 2, .08); }
    for (let k = 0; k < 8; k++) A.click(.3 + k * .18, .18);   // typing
    for (const t0 of [2, 4, 6, 8, 10, 12, 14]) A.hit(t0, .4);
    for (let k = 0; k < 4; k++) A.whoosh(4 + k * B, .35, .12);
    for (let k = 0; k < 6; k++) A.pluck(8.1 + k * .25, m(64 + [0, 3, 7, 10, 12, 15][k]), .1, .3);
    A.riser(11, 13, .3); A.nz(13, .3, "lowpass", 800, .6); A.tone(13, 70, .5, "sine", .5);
    A.pad(14, [57, 64, 69].map(m), 1, .04);
  },
});
</script></body></html>

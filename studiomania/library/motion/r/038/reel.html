<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #38 Showreel — concept: "Everything is one sheet of paper." 15 s, 120 BPM.
// 0–4 split-flap words on a folding card · 4–6 the card folds into a crane (shape morph) · 6–8 a cube net folds up (2D→3D)
// 8–10 the cube unfolds into a bar chart · 10–14 an accordion of panels carrying one word (strongest at 12–14) · 14–15 end title, back to a blank sheet.
const B = .5, PAPER = "#f6f4ef", BG = "#d8d4cb", INK = "#141416", RED = "#e63b2e", BLUE = "#2f4bff";
const F = (px) => `900 ${px}px I9`;
M.reel({
  W: 1920, H: 1080, DUR: 15, bg: BG,
  fonts: { I9: ["inter900.ttf", "900"], I5: ["inter500.ttf", "500"] },
  init(M) {
    const scene = M.el("div", "", "position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:2200px;");
    const world = M.el("div", "", "position:absolute;left:960px;top:540px;width:0;height:0;transform-style:preserve-3d;", "", scene);
    const face = (w, h, css = "") => M.el("div", "", `position:absolute;left:${-w / 2}px;top:${-h / 2}px;width:${w}px;height:${h}px;backface-visibility:hidden;display:grid;place-items:center;overflow:hidden;${css}`, "", world);
    // split-flap card: bottom half (static), top half (static), flap (rotates around the middle)
    const CW = 1100, CH = 560;
    const card = M.el("div", "", `position:absolute;left:${-CW / 2}px;top:${-CH / 2}px;width:${CW}px;height:${CH}px;transform-style:preserve-3d;`, "", world);
    const half = (top) => { const h = M.el("div", "", `position:absolute;left:0;top:${top ? 0 : CH / 2}px;width:${CW}px;height:${CH / 2}px;overflow:hidden;background:${PAPER};backface-visibility:hidden;`, "", card); const s = M.el("div", "", `position:absolute;left:0;top:${top ? 0 : -CH / 2}px;width:${CW}px;height:${CH}px;display:grid;place-items:center;font:${F(190)};color:${INK};letter-spacing:-.04em;`, "", h); return { h, s }; };
    const top = half(true), bot = half(false), flapF = half(true), flapB = half(false);
    flapF.h.style.transformOrigin = flapB.h.style.transformOrigin = "50% 100%";
    flapB.h.style.top = "0px"; flapB.s.style.top = `${-CH / 2}px`;
    // svg for morph + chart
    const svg = M.svg("svg", { width: 1920, height: 1080, style: "position:absolute;left:0;top:0" }); M.stage.appendChild(svg);
    const path = M.svg("path", {}, svg), crease = M.svg("path", { fill: "none", stroke: "rgba(0,0,0,.18)", "stroke-width": 3 }, svg);
    const bars = Array.from({ length: 6 }, (_, i) => M.svg("rect", {}, svg));
    const nums = Array.from({ length: 6 }, () => { const e = M.svg("text", { "text-anchor": "middle", style: `font:${F(40)}` }, svg); return e; });
    // cube net (6 faces), CSS 3D
    const S = 300;
    const cube = M.el("div", "", "position:absolute;left:0;top:0;transform-style:preserve-3d;", "", world);
    const cf = Array.from({ length: 6 }, (_, i) => { const f = M.el("div", "", `position:absolute;left:${-S / 2}px;top:${-S / 2}px;width:${S}px;height:${S}px;background:${[PAPER, RED, PAPER, BLUE, PAPER, INK][i]};transform-style:preserve-3d;display:grid;place-items:center;font:${F(90)};color:${i === 5 ? PAPER : INK};outline:2px solid rgba(0,0,0,.08);`, ["", "", "3", "", "D", ""][i], cube); return f; });
    // accordion: 8 panels, each shows a slice of one huge word
    const NP = 8, PW = 1920 / NP;
    const acc = M.el("div", "", "position:absolute;left:0;top:0;transform-style:preserve-3d;", "", world);
    const panels = Array.from({ length: NP }, (_, i) => { const p = M.el("div", "", `position:absolute;left:0;top:${-540}px;width:${PW}px;height:1080px;overflow:hidden;transform-origin:0 50%;backface-visibility:hidden;`, "", acc); const s = M.el("div", "", `position:absolute;left:${-i * PW}px;top:0;width:1920px;height:1080px;display:grid;place-items:center;font:${F(560)};letter-spacing:-.05em;`, "FOLD", p); return { p, s }; });
    const endT = M.el("div", "", `position:absolute;left:0;top:0;width:1920px;height:1080px;display:grid;place-items:center;font:${F(120)};color:${INK};`, "", M.stage);
    const label = M.el("div", "", `position:absolute;left:80px;top:60px;font:500 22px I5;letter-spacing:.2em;color:${INK};`, "", M.stage);
    return { world, card, CW, CH, top, bot, flapF, flapB, svg, path, crease, bars, nums, cube, cf, S, acc, panels, PW, endT, label };
  },
  seek(t, P, M) {
    const { seg, lerp, expo, expoIn, expoIO, spring, clamp } = M;
    const beat = Math.floor(t / B), bt = t - beat * B;
    M.stage.style.background = (t >= 6 && t < 10) ? INK : BG;
    P.label.style.color = (t >= 6 && t < 10) ? PAPER : INK;
    P.label.textContent = t < 4 ? "01 — FLAP" : t < 6 ? "02 — FOLD" : t < 8 ? "03 — DEPTH" : t < 10 ? "04 — DATA" : t < 14 ? "05 — ACCORDION" : "";
    // camera language: one slow dolly-in per scene, slight constant tilt
    const sceneT = t < 4 ? t / 4 : t < 6 ? (t - 4) / 2 : t < 8 ? (t - 6) / 2 : t < 10 ? (t - 8) / 2 : t < 14 ? (t - 10) / 4 : (t - 14);
    const dolly = 1 + .04 * M.sine(sceneT);
    P.world.style.transform = `scale(${dolly}) rotateX(${t >= 6 && t < 8 ? 0 : 4}deg)`;

    // ---------- 0–4: split-flap words, one per beat
    const WORDS = ["", "EVERY", "IDEA", "STARTS", "AS", "ONE", "FLAT", "SHEET."];
    const cardOn = t < 4.6;
    M.show(P.card, cardOn);
    if (cardOn) {
      const k = clamp(beat, 0, 7), cur = WORDS[k], prev = WORDS[Math.max(0, k - 1)];
      const flip = t < 4 ? expoIO(seg(bt, 0, .32)) : 1;
      // static: top shows the new word, bottom shows the old word until the flap lands
      P.top.s.textContent = cur; P.bot.s.textContent = flip >= .5 ? cur : prev;
      P.flapF.s.textContent = prev; P.flapB.s.textContent = cur;
      P.flapF.h.style.transform = `rotateX(${-flip * 180}deg)`;
      P.flapB.h.style.transform = `rotateX(${180 - flip * 180}deg)`;
      P.flapB.h.style.transformOrigin = "50% 100%";
      M.show(P.flapF.h, flip < .5); M.show(P.flapB.h, flip >= .5 && flip < 1);
      if (flip >= .5 && flip < 1) { P.flapB.h.style.top = P.CH / 2 + "px"; P.flapB.h.style.transformOrigin = "50% 0%"; P.flapB.h.style.transform = `rotateX(${(1 - flip) * 180}deg)`; P.flapB.s.style.top = -P.CH / 2 + "px"; }
      // 4.0–4.6: the card shrinks into the square that will fold into a crane
      const sh = expoIO(seg(t, 4, 4.5));
      P.card.style.transform = `scale(${lerp(1, 480 / P.CW, sh)}, ${lerp(1, 480 / P.CH, sh)})`;
      [P.top, P.bot, P.flapF, P.flapB].forEach((o) => { o.s.style.opacity = 1 - sh; o.h.style.background = sh > .9 ? RED : PAPER; });
    }

    // ---------- 4.5–6: square → triangle → kite → crane (same 120 points), one fold per beat
    const morphOn = t >= 4.5 && t < 6.3;
    const morphPts = (name) => {
      const N = 120, poly = (pts) => { const out = [], seg2 = []; let tot = 0; pts.forEach((a, i) => { const b = pts[(i + 1) % pts.length], d = Math.hypot(b[0] - a[0], b[1] - a[1]); seg2.push(d); tot += d; }); for (let k = 0; k < N; k++) { let d = k / N * tot, i = 0; while (d > seg2[i]) { d -= seg2[i]; i++; } const a = pts[i], b = pts[(i + 1) % pts.length], f = d / seg2[i]; out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); } return out; };
      const SH = { square: [[0, -240], [240, -240], [240, 240], [-240, 240], [-240, -240]], tri: [[0, -300], [300, 200], [-300, 200]], kite: [[0, -320], [180, -40], [0, 300], [-180, -40]],
        crane: [[0, -60], [80, -260], [110, -250], [60, -40], [330, -120], [120, 60], [0, 160], [-120, 60], [-330, -120], [-60, -40], [-160, -280], [-130, -290]] };
      return poly(SH[name]);
    };
    M.show(P.path, morphOn); M.show(P.crease, morphOn);
    if (morphOn) {
      const seq = ["square", "tri", "kite", "crane"], k = clamp(Math.floor((t - 4.5) / B), 0, 2), m = expoIO(seg(t, 4.5 + k * B + .1, 4.5 + k * B + .45));
      const A = morphPts(seq[k]), Bp = morphPts(seq[k + 1]);
      const cx = 960, cy = 540;
      const toCube = expoIO(seg(t, 5.9, 6.3));
      const pts = A.map((p, i) => [cx + lerp(p[0], Bp[i][0], m) * (1 - toCube * .4), cy + lerp(p[1], Bp[i][1], m) * (1 - toCube * .4)]);
      P.path.setAttribute("d", "M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join("L") + "Z");
      P.path.setAttribute("fill", RED);
      P.crease.setAttribute("d", `M${cx},${cy - 300}L${cx},${cy + 300}M${cx - 300},${cy}L${cx + 300},${cy}`);
    }

    // ---------- 6–8: a cube net folds up into a cube on the beats, then turns; 8–8.6 it unfolds flat
    const cubeOn = t >= 6 && t < 8.7;
    M.show(P.cube, cubeOn);
    if (cubeOn) {
      const S = P.S;
      const fold = (i) => expoIO(seg(t, 6.15 + i * .25, 6.45 + i * .25)) * (1 - expoIO(seg(t, 8.0, 8.5)));
      // net: centre (0), right (1), left (2), up (3), down (4), down-down (5, attached to 4)
      const a = (i) => 90 * fold(i);
      const tr = [
        ``,
        `translateX(${S / 2}px) rotateY(${a(0)}deg) translateX(${S / 2}px)`,
        `translateX(${-S / 2}px) rotateY(${-a(1)}deg) translateX(${-S / 2}px)`,
        `translateY(${-S / 2}px) rotateX(${-a(2)}deg) translateY(${-S / 2}px)`,
        `translateY(${S / 2}px) rotateX(${a(3)}deg) translateY(${S / 2}px)`,
        `translateY(${S / 2}px) rotateX(${a(3)}deg) translateY(${S}px) rotateX(${a(4)}deg) translateY(${S / 2}px)`,
      ];
      P.cf.forEach((f, i) => { f.style.transform = tr[i]; });
      const turn = expoIO(seg(t, 7.3, 7.9));
      const flat = expoIO(seg(t, 8.0, 8.5));
      P.cube.style.transform = `translateZ(${-S / 2 * (1 - flat)}px) rotateX(${lerp(-22, 0, flat) * fold(0) / Math.max(.001, fold(0)) * (1 - flat) + 0}deg) rotateY(${(30 + turn * 90) * (1 - flat)}deg) translateZ(${S / 2 * fold(4)}px)`;
    }

    // ---------- 8.4–10: the unfolded strip becomes a bar chart; bars rise two per beat
    const chartOn = t >= 8.4 && t < 10.3;
    P.bars.forEach((b) => M.show(b, chartOn)); P.nums.forEach((n) => M.show(n, chartOn));
    if (chartOn) {
      const V = [.32, .5, .41, .68, .82, 1], base = 820;
      const fin = expoIO(seg(t, 9.8, 10.3));
      P.bars.forEach((b, i) => {
        const g = expo(seg(t, 8.5 + Math.floor(i / 2) * B, 8.9 + Math.floor(i / 2) * B));
        const h = lerp(60, 560 * V[i], g), w = 180, xx = 960 - 3 * 220 + i * 220 + 20;
        const X0 = lerp(xx, i * (1920 / 8) , fin), W0 = lerp(w, 1920 / 8, fin), Y0 = lerp(base - h, -540 + 540, fin), H0 = lerp(h, 1080, fin);
        b.setAttribute("x", X0); b.setAttribute("y", Y0); b.setAttribute("width", W0); b.setAttribute("height", H0);
        b.setAttribute("fill", i === 5 ? RED : i % 2 ? BLUE : PAPER);
        P.nums[i].setAttribute("x", xx + 90); P.nums[i].setAttribute("y", base - h - 24); P.nums[i].setAttribute("fill", PAPER);
        P.nums[i].textContent = g > .1 ? Math.round(V[i] * 100 * g) + "" : "";
        P.nums[i].style.opacity = 1 - fin;
      });
    }

    // ---------- 10–14: the accordion. panels fold in/out on every beat; 12–14 it swings harder, colours flip on the beat
    const accOn = t >= 10.2 && t < 14.4;
    M.show(P.acc, accOn);
    if (accOn) {
      const strong = t >= 12;
      const amp = strong ? 62 : 34;
      const pulse = 1 - spring(bt, 14);   // 1 on the beat, settles to 0
      const fold = expo(seg(t, 10.2, 10.6)) * (1 - expoIO(seg(t, 13.6, 14.2)));
      let xCur = -960;
      P.acc.style.transform = strong ? `rotateY(${Math.sin((t - 12) * Math.PI) * 10}deg) scale(${1 + .06 * pulse})` : "";
      const inv = strong && beat % 2 === 1;
      P.panels.forEach((o, i) => {
        const ang = (i % 2 ? -1 : 1) * amp * fold * (.55 + .45 * pulse);
        const w = P.PW * Math.cos(ang * Math.PI / 180);
        o.p.style.transform = `translateX(${xCur}px) rotateY(${ang}deg)`;
        xCur += w;
        o.p.style.background = (i % 2 === 0) !== inv ? PAPER : INK;
        o.s.style.color = (i % 2 === 0) !== inv ? INK : (strong ? RED : PAPER);
      });
      // keep the accordion centred as it compresses
      P.acc.style.left = (960 - xCur) / 2 + "px";
    }

    // ---------- 14–15: end title on the flat sheet, then it lifts off and the blank sheet (frame one) remains
    const endIn = expo(seg(t, 14.1, 14.4)), endOut = expoIn(seg(t, 14.65, 14.95));
    P.endT.innerHTML = t >= 14 ? `<div style="text-align:center;transform:translateY(${(1 - endIn) * 60 - endOut * 80}px);opacity:${endIn * (1 - endOut)}">FOLD.<div style="font:500 30px I5;letter-spacing:.24em;margin-top:18px">A STUDIO OF PAPER MOTION</div></div>` : "";
    // frame one = the blank card on the grey table: show it again at the very end
    if (t >= 14.9) { M.show(P.card, true); P.card.style.transform = ""; [P.top, P.bot].forEach((o) => { o.s.textContent = ""; o.s.style.opacity = 1; o.h.style.background = PAPER; }); M.show(P.flapF.h, false); M.show(P.flapB.h, false); }
  },
  sound(A) {
    const m = A.midi;
    for (let k = 0; k < 30; k++) { const t0 = k * B; A.kick(t0, .8); A.hat(t0 + B / 2, .08); if (t0 < 4) A.nz(t0 + .02, .06, "bandpass", 2500, .25); }   // flap clacks
    for (const t0 of [4, 6, 8, 10, 12, 14]) A.hit(t0, .45);
    for (let k = 0; k < 3; k++) A.whoosh(4.5 + k * B, .35, .12);   // folds
    for (let k = 0; k < 5; k++) A.nz(6.15 + k * .25, .05, "bandpass", 1200, .25);   // cube faces snapping
    for (let k = 0; k < 6; k++) A.pluck(8.5 + Math.floor(k / 2) * B + (k % 2) * .05, m(64 + [0, 3, 5, 7, 10, 12][k]), .1, .3);
    A.riser(10.5, 12, .3);
    for (let k = 0; k < 8; k++) A.bass(12 + k * .25, m(40 + (k % 4 === 3 ? 7 : 0)), .2, .2);
    A.pad(14, [52, 59, 64].map(m), 1, .04);
  },
});
</script></body></html>

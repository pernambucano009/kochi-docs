<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>kochi-flat-clean — template scene</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* ---- kochi-flat-clean template ----
     One working scene: background + one rigged character + floating UI cards + one Arabic line.
     Every frame is a pure function of t (window.seek). Rendered at 12 fps by scripts/render.mjs. */
  html, body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); }
  #stage svg { position: absolute; inset: 0; display: block; }
  .txt { position: absolute; font-family: 'Readex Pro', sans-serif; color: var(--ink); line-height: 1.4; }
  .headline { font-weight: 700; text-align: center; }
  .sub { font-weight: 400; text-align: center; color: var(--ink2); }
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <g id="cam">
      <rect id="bg" />
      <circle id="halo" />
      <g id="dots"></g>
      <ellipse id="floorShadow" />
      <g id="plant"></g>
      <g id="cards"></g>
      <g id="hero"></g>
    </g>
  </svg>
  <div class="txt headline" id="headline" dir="rtl" lang="ar">تمرينك اليوم يبدأ الآن</div>
  <div class="txt sub" id="sub" dir="rtl" lang="ar">خطة مصممة لك من مدربك</div>
</div>

<script src="lib/kochi-motion.js"></script>
<script>
// ===================== PALETTES (measured, see references/style-bible.md) =====================
// Every colour used in the scene comes from THEME. Shadow tones are fixed partners, never computed.
const THEMES = {
  peach: { bg:'#FCE3CA', halo:'#FAF2EE', floor:'#F4CDAE', ink:'#192D48', ink2:'#4E3858',
           skin:'#F99A7E', skinShade:'#D77B68', hair:'#2A2C60',
           top:'#8162E3', topShade:'#421783', pants:'#2A2C60', pantsShade:'#192D48',
           shoe:'#FEFEFE', sole:'#ACA7D8',
           card:'#FEFEFE', cardShade:'#F4CDAE', a1:'#FBA919', a2:'#EE7A86', a3:'#8162E3', leaf:'#4B98AC', leafShade:'#205776', pot:'#EE7A86', dot:'#192D48' },
  blue:  { bg:'#F7F6FE', halo:'#DDECFC', floor:'#BBDEF3', ink:'#192D48', ink2:'#3176A3',
           skin:'#F99A7E', skinShade:'#D77B68', hair:'#192D48',
           top:'#F63F47', topShade:'#C4665E', pants:'#192D48', pantsShade:'#2A2C60',
           shoe:'#FEFEFE', sole:'#87C3E0',
           card:'#FEFEFE', cardShade:'#BBDEF3', a1:'#118EF6', a2:'#FBA919', a3:'#F63F47', leaf:'#3CAC71', leafShade:'#205776', pot:'#118EF6', dot:'#118EF6' },
  teal:  { bg:'#E9F3F8', halo:'#BBDEF3', floor:'#87C3E0', ink:'#192D48', ink2:'#205776',
           skin:'#DC8176', skinShade:'#AA5D5E', hair:'#192D48',
           top:'#FEFEFE', topShade:'#BBDEF3', pants:'#3338F1', pantsShade:'#2A2C60',
           shoe:'#FEFEFE', sole:'#F8CC58',
           card:'#FEFEFE', cardShade:'#87C3E0', a1:'#3338F1', a2:'#F8CC58', a3:'#4B98AC', leaf:'#4B98AC', leafShade:'#205776', pot:'#F8CC58', dot:'#205776' },
};
const C = THEMES[KM.param('theme', 'peach')];
document.documentElement.style.setProperty('--bg', C.bg);
document.documentElement.style.setProperty('--ink', C.ink);
document.documentElement.style.setProperty('--ink2', C.ink2);

const DURATION = 5;
const { width: W, height: H } = KM.mount({
  duration: DURATION, width: 1080, height: 1920,
  fonts: ['700 80px "Readex Pro"', '400 40px "Readex Pro"'],
  render,
});
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// ===================== LAYOUT (9:16 first, adapts to 1:1 and 16:9) =====================
const portrait = H / W > 1.3, landscape = W / H > 1.3;
const stage = KM.$('#stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
KM.set('#svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
// character: 900 units tall at scale 1 (hip at local 0,0). Safe area for 9:16: y 250..1520.
const L = portrait ? { cx: W * 0.5, floorY: 1500, k: 1.0, textY: 290, textW: 900, head: 84, sub: 44 }
        : landscape ? { cx: W * 0.30, floorY: H * 0.90, k: H * 0.78 / 900, textX: W * 0.56, textY: H * 0.34, textW: W * 0.38, head: 76, sub: 40 }
        : { cx: W * 0.5, floorY: H * 0.93, k: H * 0.62 / 900, textY: H * 0.07, textW: W * 0.86, head: 72, sub: 38 };
const hipY = L.floorY - 482 * L.k; // legs ~ 482 units incl. shoes

KM.set('#bg', { x: 0, y: 0, width: W, height: H, fill: C.bg });
KM.set('#halo', { cx: L.cx, cy: hipY - 120 * L.k, r: 520 * L.k, fill: C.halo });
KM.set('#floorShadow', { cx: L.cx, cy: L.floorY + 6, rx: 230 * L.k, ry: 22 * L.k, fill: C.floor });

// text boxes
const hl = KM.$('#headline'), sub = KM.$('#sub');
hl.style.fontSize = L.head + 'px'; sub.style.fontSize = L.sub + 'px';
if (landscape) {
  for (const [e, y] of [[hl, L.textY], [sub, L.textY + L.head * 1.6]]) Object.assign(e.style, { left: L.textX + 'px', width: L.textW + 'px', top: y + 'px', textAlign: 'right' });
} else {
  for (const [e, y] of [[hl, L.textY], [sub, L.textY + L.head * 1.55]]) Object.assign(e.style, { left: (W - L.textW) / 2 + 'px', width: L.textW + 'px', top: y + 'px' });
}

// ===================== DECOR: dots & dashes (seeded) =====================
const rnd = KM.rng(7);
const dotData = Array.from({ length: 9 }, (_, i) => ({ x: rnd() * W, y: (portrait ? 620 : H * 0.15) + rnd() * (portrait ? 700 : H * 0.7), r: 5 + rnd() * 7, dash: i % 3 === 0, rot: rnd() * 180, ph: rnd() }));
const dots = dotData.map((d) => d.dash ? el('rect', { x: -14, y: -4, width: 28, height: 8, rx: 4, fill: C.dot }, KM.$('#dots')) : el('circle', { r: d.r, fill: C.dot }, KM.$('#dots')));

// ===================== PLANT (simple flat leaves, one shade) =====================
const plant = KM.$('#plant');
const potX = portrait ? W * 0.84 : landscape ? W * 0.48 : W * 0.86;
const leaves = [[-40, -150, -28], [10, -175, 6], [45, -140, 32], [-15, -120, -10]].map(([x, y, r], i) =>
  el('path', { d: 'M0 0 C -26 -40 -22 -96 0 -128 C 22 -96 26 -40 0 0 Z', fill: i % 2 ? C.leafShade : C.leaf, 'data-r': r, 'data-x': x, 'data-y': y }, plant));
el('path', { d: 'M-46 -70 L46 -70 L34 0 L-34 0 Z', fill: C.pot }, plant);

// ===================== UI CARDS =====================
// Rounded white cards with a flat offset shadow and one simple icon each.
function icon(kind, g, col) {
  if (kind === 'flame') el('path', { d: 'M0 34 C-26 34 -34 12 -24 -6 C-18 -16 -8 -20 -6 -36 C8 -26 30 -6 26 14 C24 26 14 34 0 34 Z', fill: col }, g);
  if (kind === 'heart') el('path', { d: 'M0 30 C-34 8 -38 -14 -24 -26 C-12 -36 0 -26 0 -16 C0 -26 12 -36 24 -26 C38 -14 34 8 0 30 Z', fill: col }, g);
  if (kind === 'dumbbell') { el('rect', { x: -34, y: -6, width: 68, height: 12, rx: 6, fill: col }, g); for (const s of [-1, 1]) el('rect', { x: s * 30 - 9, y: -24, width: 18, height: 48, rx: 7, fill: col }, g); }
  if (kind === 'check') el('path', { d: 'M-24 2 L-6 20 L26 -16', fill: 'none', stroke: col, 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
}
const cardDefs = portrait
  ? [{ x: W * 0.17, y: 760, s: 1, icon: 'flame', col: C.a1, t: 1.0 }, { x: W * 0.83, y: 690, s: .9, icon: 'heart', col: C.a2, t: 1.25 }, { x: W * 0.18, y: 1080, s: .8, icon: 'dumbbell', col: C.a3, t: 1.5 }]
  : [{ x: L.cx - 330 * L.k, y: hipY - 330 * L.k, s: L.k, icon: 'flame', col: C.a1, t: 1.0 }, { x: L.cx + 320 * L.k, y: hipY - 420 * L.k, s: .9 * L.k, icon: 'heart', col: C.a2, t: 1.25 }, { x: L.cx + 330 * L.k, y: hipY - 40 * L.k, s: .8 * L.k, icon: 'dumbbell', col: C.a3, t: 1.5 }];
const cards = cardDefs.map((d) => {
  const g = el('g', {}, KM.$('#cards'));
  el('rect', { x: -78 + 10, y: -78 + 12, width: 156, height: 156, rx: 34, fill: C.cardShade }, g);
  el('rect', { x: -78, y: -78, width: 156, height: 156, rx: 34, fill: C.card }, g);
  icon(d.icon, el('g', {}, g), d.col);
  return { g, ...d };
});

// ===================== CHARACTER RIG =====================
// Flat-clean proportions: small head (~1/8.5 of height), long legs (~52%), tapered limbs,
// wide-ish trousers, mitten hands, dot eyes. No outlines: every shape is a flat fill.
// Joints are nested <g> so rotating a parent carries its children (forward kinematics).
// Back limbs use the shade colour (the style's single shadow tone). Hip is at local (0,0), 960 units tall.
function seg(parent, x1, y1, x2, y2, w1, w2, fill) {
  // tapered limb with round ends: one flat shape, no stroke
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
  const a1 = [x1 + nx * w1 / 2, y1 + ny * w1 / 2], b1 = [x1 - nx * w1 / 2, y1 - ny * w1 / 2];
  const a2 = [x2 + nx * w2 / 2, y2 + ny * w2 / 2], b2 = [x2 - nx * w2 / 2, y2 - ny * w2 / 2];
  const d = `M${a1} L${a2} A${w2 / 2} ${w2 / 2} 0 0 0 ${b2} L${b1} A${w1 / 2} ${w1 / 2} 0 0 0 ${a1} Z`;
  return el('path', { d, fill }, parent);
}
function buildCharacter(root, c = C) {
  const R = {};
  const g = (name, parent, px = 0, py = 0) => { const n = el('g', {}, parent); R[name] = { g: n, px, py }; return n; };
  const shoe = (parent, x, col, sole) => {
    el('path', { d: `M${x - 26} 452 C${x - 28} 430 ${x + 6} 426 ${x + 14} 440 L${x + 46} 458 C${x + 56} 464 ${x + 52} 476 ${x + 40} 476 L${x - 24} 476 C${x - 30} 476 ${x - 30} 466 ${x - 26} 452 Z`, fill: col }, parent);
    el('rect', { x: x - 30, y: 470, width: 84, height: 12, rx: 6, fill: sole }, parent);
  };
  const body = g('body', root, 0, 0);
  // --- back leg + back arm (shade tone)
  const thighB = g('thighB', body, 24, 0); seg(thighB, 24, 0, 26, 230, 74, 62, c.pantsShade);
  const shinB = g('shinB', thighB, 26, 230); seg(shinB, 26, 230, 24, 430, 62, 56, c.pantsShade);
  el('rect', { x: -6, y: 424, width: 60, height: 26, rx: 10, fill: c.skinShade }, shinB); // ankle
  shoe(shinB, 22, c.shoe, c.sole);
  const uarmB = g('uarmB', body, 62, -268); seg(uarmB, 62, -268, 70, -128, 50, 42, c.topShade);
  const farmB = g('farmB', uarmB, 70, -128); seg(farmB, 70, -128, 74, 6, 30, 24, c.skinShade);
  el('ellipse', { cx: 75, cy: 22, rx: 17, ry: 24, fill: c.skinShade }, farmB);
  // --- pelvis + torso
  el('path', { d: 'M-60 -30 L60 -30 L62 28 C36 40 -36 40 -62 28 Z', fill: c.pants }, body);
  const torso = g('torso', body, 0, -10);
  el('path', { d: 'M-84 -270 C-50 -300 50 -300 84 -270 C80 -200 72 -120 70 -30 C30 -16 -30 -16 -70 -30 C-72 -120 -80 -200 -84 -270 Z', fill: c.top }, torso);
  el('path', { d: 'M70 -30 C30 -16 -30 -16 -70 -30 L-70 -58 C-30 -44 30 -44 70 -58 Z', fill: c.topShade }, torso); // hem band
  el('path', { d: 'M-26 -292 C-16 -264 16 -264 26 -292 Z', fill: c.skinShade }, torso);           // collar opening
  // --- neck + head
  const head = g('head', torso, 0, -290);
  el('path', { d: 'M-17 -306 L17 -306 L15 -280 C8 -272 -8 -272 -15 -280 Z', fill: c.skinShade }, head);
  el('ellipse', { cx: 2, cy: -358, rx: 46, ry: 56, fill: c.skin }, head);
  el('ellipse', { cx: -42, cy: -352, rx: 10, ry: 14, fill: c.skinShade }, head);               // ear
  el('path', { d: 'M-50 -350 C-66 -424 40 -446 56 -378 C52 -396 30 -408 8 -404 C-10 -400 -30 -394 -36 -360 C-40 -350 -44 -344 -50 -350 Z', fill: c.hair }, head);
  const eyes = el('g', {}, head);
  const eyeL = el('ellipse', { cx: 10, cy: -356, rx: 5.5, ry: 7, fill: c.ink }, eyes);
  const eyeR = el('ellipse', { cx: 34, cy: -356, rx: 5.5, ry: 7, fill: c.ink }, eyes);
  el('path', { d: 'M32 -346 C40 -338 40 -332 30 -330', fill: 'none', stroke: c.skinShade, 'stroke-width': 4.5, 'stroke-linecap': 'round' }, head);
  const mouth = el('path', { d: 'M12 -318 C18 -312 28 -312 34 -318', fill: 'none', stroke: c.ink, 'stroke-width': 4.5, 'stroke-linecap': 'round' }, head);
  R.eyes = [eyeL, eyeR]; R.mouth = mouth;
  // --- front leg
  const thighF = g('thighF', body, -24, 0); seg(thighF, -24, 0, -26, 230, 74, 62, c.pants);
  const shinF = g('shinF', thighF, -26, 230); seg(shinF, -26, 230, -24, 430, 62, 56, c.pants);
  el('rect', { x: -54, y: 424, width: 60, height: 26, rx: 10, fill: c.skin }, shinF);
  shoe(shinF, -26, c.shoe, c.sole);
  // --- front arm (drawn over the torso)
  const uarmF = g('uarmF', torso, -64, -268); seg(uarmF, -64, -268, -72, -128, 50, 42, c.top);
  const farmF = g('farmF', uarmF, -72, -128); seg(farmF, -72, -128, -76, 6, 30, 24, c.skin);
  el('ellipse', { cx: -77, cy: 22, rx: 17, ry: 24, fill: c.skin }, farmF);
  return R;
}
// pose: { joint: degrees } ; positive = clockwise. For the front (left-of-screen) arm,
// positive uarmF swings the arm OUT and UP to the left, away from the head.
function pose(R, P) { for (const k in P) { const j = R[k]; if (j && j.g) j.g.setAttribute('transform', `rotate(${P[k].toFixed(3)} ${j.px} ${j.py})`); } }

const heroRoot = el('g', {}, KM.$('#hero'));
const hero = buildCharacter(heroRoot);

// ===================== RENDER (pure function of t) =====================
function render(t) {
  // camera: slow push 1.00 -> 1.05 over the whole scene. At 12 fps keep camera moves slow and eased.
  const z = KM.tween(t, 0, DURATION, 1, 1.05, 'inOutSine');
  KM.$('#cam').setAttribute('transform', `translate(${W / 2} ${H * 0.55}) scale(${z}) translate(${-W / 2} ${-H * 0.55})`);

  // halo grows in with a spring
  const hs = KM.spring(t, 0.0, { stiffness: 120, damping: 14 });
  KM.set('#halo', { r: (520 * L.k * hs).toFixed(2) });

  // character enters: rises from below with overshoot, then idles
  const enter = KM.spring(t, 0.15, { stiffness: 150, damping: 15 });
  const breath = KM.breathe(t, 3.2);
  const yIn = (1 - enter) * 260;
  heroRoot.setAttribute('transform', `translate(${L.cx} ${hipY + yIn}) scale(${L.k})`);
  // wave: anticipation down, big raise, two waves, settle (all timed in 12 fps frames)
  const raise = KM.keys(t, [[0.9, 0], [1.05, -6, 'inOutSine'], [1.45, 135, 'snappy'], [2.9, 135], [3.3, 8, 'inOutCubic']]);
  const wave = (t > 1.45 && t < 2.9) ? Math.sin((t - 1.45) * Math.PI * 2 * 1.4) * 22 : 0;
  pose(hero, {
    body: KM.lerp(-1, 1, breath) * 0.6,
    torso: -1 + breath * 1.2,
    head: KM.wiggle(t, 0.6, 3, 2) + (raise > 60 ? -4 : 0),
    uarmF: 4 + raise,
    farmF: raise > 60 ? 35 + wave : -4,
    uarmB: -6 - breath * 2, farmB: 6,
    thighF: 2, shinF: 0, thighB: -2, shinB: 0,
  });
  const open = KM.blink(t, 3);
  hero.eyes.forEach((e) => e.setAttribute('ry', (6 * Math.max(open, 0.15)).toFixed(2)));
  hero.mouth.setAttribute('d', raise > 60 ? 'M8 -320 C16 -306 30 -306 38 -320' : 'M12 -318 C18 -312 28 -312 34 -318');

  // cards: pop in with spring scale, then float (seeded phases)
  cards.forEach((c, i) => {
    const s = KM.spring(t, c.t, { stiffness: 220, damping: 13 });
    const fy = Math.sin((t * 0.55 + i * 0.37) * Math.PI * 2) * 10;
    const r = KM.wiggle(t, 0.4, 4, 10 + i);
    c.g.setAttribute('transform', `translate(${c.x} ${c.y + fy}) rotate(${r}) scale(${(c.s * s).toFixed(4)})`);
  });

  // dots drift slowly
  dots.forEach((d, i) => {
    const D = dotData[i]; const s = KM.progress(t, 1.6 + i * 0.06, 2.0 + i * 0.06, 'outBack');
    d.setAttribute('transform', `translate(${D.x} ${D.y + Math.sin((t * 0.4 + D.ph) * 6.28) * 14}) rotate(${D.rot}) scale(${s})`);
  });

  // plant sways
  const pg = KM.$('#plant'); pg.setAttribute('transform', `translate(${potX} ${L.floorY}) scale(${L.k * KM.spring(t, 0.5)})`);
  KM.$$('#plant path').forEach((p, i) => { if (!p.dataset.r) return; p.setAttribute('transform', `translate(${p.dataset.x} ${-70 + 0}) rotate(${+p.dataset.r + KM.wiggle(t, 0.5, 4, i)})`); });

  // text: Arabic by WORD, never by letter. Holds long enough to read.
  KM.revealWords(hl, t, 1.7, { stagger: 0.14, dur: 0.5 });
  KM.revealWords(sub, t, 2.5, { stagger: 0.1, dur: 0.45 });
}
</script>
</body>
</html>

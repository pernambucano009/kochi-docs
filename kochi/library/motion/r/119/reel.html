<!doctype html><html><head><meta charset="utf-8"><script src="../../lib/core.js"></script></head><body>
<script>
// #119 (عنصر: من فكرة لنتيجة في ١٠ ثواني) process in 4 steps — was about StudioMania — Arabic content for brands, from an idea to a finished reel.
// 10 s, 120 BPM. Concept: "From an idea to a reel." One typeface (Alexandria, Arabic + Latin); ink, white, red.
// 0–2 a dot becomes the word "فكرة" · 2–4 kinetic: سكريبت ← صوت ← مشاهد ← مونتاج, one per beat · 4–6 play → ring → 9:16 frame (morph)
// 6–8 frames stack into depth (2D→3D) · 8–9.5 a small dashboard: kinds of work, two languages · 9.5–10 end title → the dot.
const PR = M.params({
  start: { label: "الكلمة الأولى", kind: "text", def: "فكرة" },
  from: { label: "كلمة صغيرة فوقها", kind: "text", def: "من" },
  steps: { label: "٤ خطوات", kind: "lines", def: ["سكريبت", "صوت", "مشاهد", "مونتاج"] },
  shapes: { label: "٣ كلمات تحت الأشكال", kind: "lines", def: ["تشغيل", "ستوديومانيا", "ريلز"] },
  stats: { label: "٣ أرقام (الرقم | الكلمة)", kind: "lines", def: ["٨ | أنواع شغل", "٢ | لغة", "١ | استوديو"] },
  name: { label: "الاسم في الآخر", kind: "text", role: "brand", def: "ستوديومانيا" },
  tagline: { label: "تحت الاسم", kind: "text", role: "tagline", def: "من فكرة لريل" },
  ink: { label: "الخلفية", kind: "color", role: "dark", def: "#0f0f11" },
  red: { label: "اللون المميز", kind: "color", role: "accent", def: "#e8402f" },
});
const N4 = (a, n) => Array.from({ length: n }, (_, i) => a[i] ?? "");
const B = .5, INK = PR.ink, WHITE = "#ffffff", RED = PR.red;
M.reel({
  W: 1920, H: 1080, DUR: 10, bg: INK,
  fonts: { AX: ["TY-Alexandria-800.ttf", "800"], AM: ["TY-Alexandria-500.ttf", "500"] },
  init(M) { const c = M.canvas(1920, 1080); return { x: c.getContext("2d") }; },
  seek(t, P, M) {
    const { x } = P, { seg, lerp, expo, expoIn, expoIO, spring, clamp } = M;
    const beat = Math.floor(t / B), bt = t - beat * B, pulse = 1 - spring(bt, 16);
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = INK; x.fillRect(0, 0, 1920, 1080);
    const z = 1 + .03 * (t / 10); x.translate(960, 540); x.scale(z, z); x.translate(-960, -540);
    const T = (s, px, X, Y, col, wt = 800, maxW = 1700) => { s = String(s ?? ""); const fam = wt === 800 ? "AX" : "AM"; px = M.fit(s, fam, maxW, px, 16, String(wt)); x.font = `${wt} ${px}px ${fam}`; x.fillStyle = col; x.textAlign = "center"; x.textBaseline = "middle"; x.direction = M.isAr(s) ? "rtl" : "ltr"; x.fillText(s, X, Y); x.direction = "ltr"; };
    const dot = (r) => { x.fillStyle = RED; x.beginPath(); x.arc(960, 540, r, 0, 7); x.fill(); };
    if (t < 2.1) { if (t < .6) dot(18 + 6 * pulse); else { const k = expo(seg(t, .6, 1.0)); x.save(); x.translate(960, 540); x.scale(lerp(.3, 1, k), lerp(.3, 1, k)); T(PR.start, 260, 0, 0, WHITE); x.restore(); dot(lerp(18, 0, k)); if (t > 1.5) T(PR.from, 70, 960, 340, RED, 500); } }
    if (t >= 2 && t < 4.2) {
      const steps = N4(PR.steps, 4), RTL = M.isAr(steps.join(""));
      steps.forEach((s, i) => { const k = expo(seg(t, 2 + i * B, 2.3 + i * B)); if (k <= 0) return; const X = RTL ? 1590 - i * 420 : 330 + i * 420, last = i === Math.min(3, beat - 4); x.save(); x.beginPath(); x.rect(X - 200, 420, 400, 240); x.clip(); T(s, 96, X, 540 + (1 - k) * 200, last ? RED : WHITE, 800, 380); x.restore(); if (i) { x.fillStyle = "#5a5a60"; x.fillRect(RTL ? X + 196 : X - 224, 546, 28, 6); } });
    }
    if (t >= 4 && t < 6.2) {
      const N = 100, k = clamp(Math.floor((t - 4) / .7), 0, 2), m = expoIO(seg(t, 4 + k * .7 + .1, 4 + k * .7 + .55));
      const S = [
        (u) => { const p = u * 3, v = [[-90, -130], [140, 0], [-90, 130]], i = Math.floor(p) % 3, f = p - Math.floor(p), a = v[i], b = v[(i + 1) % 3]; return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)]; },
        (u) => [Math.cos(u * 6.283 - 2.6) * 150, Math.sin(u * 6.283 - 2.6) * 150],
        (u) => { const p = u * 4, v = [[-120, -213], [120, -213], [120, 213], [-120, 213]], i = Math.floor(p) % 4, f = p - Math.floor(p), a = v[i], b = v[(i + 1) % 4]; return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)]; },
        (u) => { const p = u * 4, v = [[-120, -213], [120, -213], [120, 213], [-120, 213]], i = Math.floor(p) % 4, f = p - Math.floor(p), a = v[i], b = v[(i + 1) % 4]; return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)]; },
      ];
      x.beginPath(); for (let i = 0; i <= N; i++) { const u = i / N, p = S[k](u), q = S[k + 1](u); const X = 960 + lerp(p[0], q[0], m), Y = 540 + lerp(p[1], q[1], m); i ? x.lineTo(X, Y) : x.moveTo(X, Y); } x.closePath();
      if (k === 0 && m < .5) { x.fillStyle = RED; x.fill(); } else { x.strokeStyle = k === 0 || (k === 1 && m < .5) ? RED : WHITE; x.lineWidth = 26; x.lineJoin = "round"; x.stroke(); }
      T(N4(PR.shapes, 3)[m > .5 ? Math.min(2, k + 1) : k], 44, 960, 860, "#8a8a90", 500);
    }
    if (t >= 6 && t < 8.2) {
      const n = 7, sp = expo(seg(t, 6, 6.7)), turn = expoIO(seg(t, 6.8, 8));
      const items = Array.from({ length: n }, (_, i) => { const zz = (i - 3) * 240 * sp, a = turn * .9; return { i, X: zz * Math.sin(a) * 1.3, Z: zz * Math.cos(a) * .8 + 1600 }; }).sort((p, q) => q.Z - p.Z);
      items.forEach((o) => { const f = 1500 / o.Z; x.save(); x.translate(960 + o.X * f, 540); x.scale(f, f); x.strokeStyle = o.i === 3 ? RED : WHITE; x.lineWidth = 12; x.fillStyle = INK; x.beginPath(); x.roundRect(-120, -213, 240, 426, 28); x.fill(); x.stroke(); x.restore(); });
    }
    if (t >= 8 && t < 9.6) {
      const g = (i) => expo(seg(t, 8 + i * .3, 8.3 + i * .3));
      N4(PR.stats, 3).map((l) => String(l).split("|").map((z) => z.trim())).forEach(([n = "", l = ""], i) => { const X = M.isAr(PR.stats.join("")) ? 1500 - i * 540 : 420 + i * 540; x.globalAlpha = g(i); T(n, 220, X, 480, i === 0 ? RED : WHITE, 800, 500); T(l, 54, X, 660, "#8a8a90", 500, 500); x.globalAlpha = 1; });
    }
    if (t >= 9.5) {
      const a = expo(seg(t, 9.5, 9.7)), o = expoIn(seg(t, 9.78, 9.92));
      x.globalAlpha = a * (1 - o); T(PR.name, 170, 960, 500, WHITE); T(PR.tagline, 56, 960, 660, RED, 500); x.globalAlpha = 1;
      if (t > 9.92) dot(18);
    }
  },
  sound(A) {
    const m = A.midi;
    for (let k = 0; k < 20; k++) { A.kick(k * B, .8); A.hat(k * B + B / 2, .07); }
    for (const t0 of [2, 4, 6, 8, 9.5]) A.hit(t0, .35);
    for (let i = 0; i < 4; i++) A.pluck(2 + i * B, m(69 + [0, 3, 7, 10][i]), .12, .3);
    A.pad(9.5, [57, 61, 64, 69].map(m), .5, .05);
  },
});
</script></body></html>

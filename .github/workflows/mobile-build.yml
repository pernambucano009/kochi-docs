# 📱 بناء تطبيق الجوال على Expo (EAS) بزرار من GitHub: Actions ← «Mobile build» ← Run workflow
# محتاج سر واحد في الريبو: EXPO_TOKEN (من expo.dev ← Account settings ← Access tokens).
# - preview + android: ملف APK يتثبّت على أي أندرويد للتجربة (الرابط بيظهر في expo.dev ← Builds)
# - production: النسخة اللي بتترفع على Google Play و App Store (الآيفون محتاج حساب مطوّر Apple متربط على Expo)
name: Mobile build

on:
  # البناء بيبدأ كمان لما ملف studiomania/mobile/build.json يتغيّر على الفرع (فيه المنصة والنوع)،
  # لأن زرار Run workflow بيظهر بس للملفات اللي على الفرع الأساسي
  push:
    paths: ["studiomania/mobile/build.json"]
  workflow_dispatch:
    inputs:
      platform:
        description: "android / ios / all"
        default: android
        required: true
      profile:
        description: "preview (تجربة) / production (المتاجر)"
        default: preview
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studiomania/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studiomania/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - id: req
        run: |
          P="${{ inputs.platform }}"; F="${{ inputs.profile }}"
          if [ -z "$P" ]; then P=$(node -p "require('./build.json').platform"); F=$(node -p "require('./build.json').profile"); fi
          echo "platform=$P" >> "$GITHUB_OUTPUT"; echo "profile=$F" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: eas build --platform ${{ steps.req.outputs.platform }} --profile ${{ steps.req.outputs.profile }} --non-interactive --no-wait

# 📱 بناء تطبيق الجوال على Expo (EAS) بزرار من GitHub: Actions ← «Mobile build» ← Run workflow
# محتاج سر واحد في الريبو: EXPO_TOKEN (من expo.dev ← Account settings ← Access tokens).
# - preview + android: ملف APK يتثبّت على أي أندرويد للتجربة (الرابط بيظهر في expo.dev ← Builds)
# - production: النسخة اللي بتترفع على Google Play و App Store. الآيفون بيتوقّع ويترفع على TestFlight لوحده بمفتاح ASC API
#   (secrets: ASC_KEY_P8 و ASC_KEY_ID و ASC_ISSUER_ID و APPLE_TEAM_ID)
name: Mobile build

on:
  # البناء بيبدأ كمان لما ملف studiomania/mobile/build.json يتغيّر على الفرع (فيه المنصة والنوع)،
  # لأن زرار Run workflow بيظهر بس للملفات اللي على الفرع الأساسي
  push:
    paths: ["studiomania/mobile/build.json"]
  workflow_dispatch:
    inputs:
      platform:
        description: "android / ios / all"
        default: android
        required: true
      profile:
        description: "preview (تجربة) / production (المتاجر)"
        default: preview
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studiomania/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studiomania/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - id: req
        run: |
          P="${{ inputs.platform }}"; F="${{ inputs.profile }}"
          if [ -z "$P" ]; then P=$(node -p "require('./build.json').platform"); F=$(node -p "require('./build.json').profile"); fi
          echo "platform=$P" >> "$GITHUB_OUTPUT"; echo "profile=$F" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx tsc --noEmit
      # 🍏 iOS: مفتاح App Store Connect API (من الـ secrets) بيتكتب في ملف مؤقت جوه المشروع (‏*.p8 متجاهَل في git فمش بيترفع).
      # EAS بيستخدمه يعمل شهادة التوزيع والـ provisioning profile لوحده، ومع production بيرفع البناء على TestFlight (--auto-submit).
      - name: App Store Connect API key (iOS)
        if: steps.req.outputs.platform != 'android'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::ASC_KEY_P8 secret is missing"; exit 1; fi
          echo "$ASC_KEY_P8" > asc-api-key.p8
      - run: |
          EXTRA=""
          if [ "${{ steps.req.outputs.platform }}" = "ios" ] && [ "${{ steps.req.outputs.profile }}" = "production" ]; then EXTRA="--auto-submit"; fi
          eas build --platform ${{ steps.req.outputs.platform }} --profile ${{ steps.req.outputs.profile }} --non-interactive --no-wait $EXTRA
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/studiomania/mobile/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      - if: always()
        run: rm -f asc-api-key.p8

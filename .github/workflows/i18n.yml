# 🔎 فحص اللغة: كل شاشة بالإنجليزي وكل زرار، وأي جملة من غير ترجمة أو فيها عامية بتخلّي العلامة حمرا
name: i18n
on:
  push:
    paths: ["studiomania/frontend/**", "studiomania/backend/**", "studiomania/library/**", "studiomania/tests/i18n/**", ".github/workflows/i18n.yml"]
  workflow_dispatch:
jobs:
  audit:
    # ubuntu-latest بقى 26.04، وأداة المتصفح (Playwright) لسه مابتشتغلش عليه: بنثبّت نسخة مدعومة
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # الشاشات متقسمة ٣ أجزاء بيشتغلوا مع بعض، فالفحص كله بيخلص في حوالي ٢٥ دقيقة بدل ساعة ونص
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3]
    defaults:
      run:
        working-directory: studiomania
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: studiomania/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tests/i18n/audit.js
        env:
          CHUNK: ${{ matrix.chunk }}/3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-report-${{ matrix.chunk }}
          path: studiomania/tests/i18n/report-${{ matrix.chunk }}.json
